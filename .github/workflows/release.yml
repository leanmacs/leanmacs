name: Release

# The rolling nightly (docs/dev-practices/ci.md, "`release`: the nightly"):
# the prerelease tagged `nightly`, holding the run's .dmg as Leanmacs.dmg
# and as Leanmacs-<build-id>.dmg, Leanmacs.dmg.sha256 and build.json, with
# the tag moved to the run's commit; and the download page
# (https://leanmacs.github.io/leanmacs/) for that build. ci.yml calls it
# from main pushes only, after both legs of the gate, the build and the
# secret scan, in a concurrency group that is never cancelled; nothing else
# does.
#
# Two jobs. `publish` prepares the nightly, renders the page from the
# build.json it is about to publish and uploads it as the Pages artifact,
# all with no token, then publishes. `pages` needs it, so it deploys only
# after a publish that succeeded, and runs one GitHub-owned action and no
# code of this repository. The caller's job grants contents: write,
# pages: write and id-token: write, the most either job needs; each job
# names exactly its own.
on:
  workflow_call:
    inputs:
      build-id:
        description: "The run's build ID, YYYYMMDDHHMMSS (UTC): ci.yml's build-id job's output"
        required: true
        type: string
      commit:
        description: "The commit the app was stamped with and the tag moves to, 40 lowercase hex digits: the run's github.sha"
        required: true
        type: string
      ref:
        description: "The commit to check out and build the release tool from: the run's github.sha"
        required: true
        type: string

# Nothing at the top: each job names the scopes it needs.
permissions: {}

jobs:
  publish:
    # macOS, to mount the .dmg and read the published app's Info.plist with
    # hdiutil and plutil, the tools dmg-check trusts. A leg of ci.yml's
    # matrix.
    runs-on: macos-26
    # It downloads one image of about 1.2 GB and uploads it twice
    # (docs/dev-practices/ci.md, "`release`: the nightly").
    timeout-minutes: 60
    # The release's assets and the tag. Only the last step holds the token.
    permissions:
      contents: write
    env:
      # As in ci.yml: mise installs only what the mise-action step names.
      MISE_AUTO_INSTALL: "false"
      # The build the .dmg must be, which `leanmacs-release` checks against
      # the app's stamp and writes into build.json. Inputs reach a step
      # only through env:, never inside run: (zizmor's template-injection).
      LEANMACS_BUILD_ID: ${{ inputs.build-id }}
      LEANMACS_COMMIT: ${{ inputs.commit }}
    steps:
      # The commit the gate passed on. Don't leave the job's token in
      # .git/config: the tag moves through the API, never by git push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # Rust alone: the release tool is crates/editor-release-std's binary,
      # which has no third-party dependency and is built from source here.
      # mise-action's tool cache is saved from main only, by main's own
      # trusted runs, and holds only the pinned toolchain. No other cache.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.11.2
          install: true
          install_args: rust
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      # The .dmg the build job packed and checked, into dist/.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Leanmacs-dmg
          path: dist
      # Builds the release tool and prepares target/nightly with no token:
      # mounts the .dmg, checks that the app's CFBundleVersion and
      # LeanmacsCommit are the run's build ID and commit and that the file
      # name names that build, then writes the two images, the checksum,
      # build.json and the notes (crates/editor-release, `nightly`). A
      # mismatch fails here, before anything is uploaded.
      - name: Prepare the nightly
        run: mise run nightly
        shell: bash
      # The download page, with no token, from target/nightly/build.json:
      # the very file the publish step below re-reads and uploads, so the
      # page names the build this run publishes, and never one a newer run
      # put up (crates/editor-release, `site`). The minimum macOS is
      # mise.toml's MACOSX_DEPLOYMENT_TARGET. Before the publish, so a page
      # that cannot be rendered stops the nightly too.
      - name: Render the download page
        run: mise run site -- target/nightly/build.json target/site
        shell: bash
      # The page as the github-pages artifact, which `pages` deploys. Still
      # no token: an artifact upload needs none.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/site
      # The one step with the token, and the last. It runs the binary the
      # step above built and compiles nothing. It refuses anything but a
      # push to main, re-checks the images' SHA-256, uploads the build-ID
      # copy, Leanmacs.dmg, the checksum and build.json last, moves the tag
      # through the API, sets the notes, and prunes old build-ID copies,
      # stopping at the first failure.
      - name: Publish the nightly
        run: target/debug/leanmacs-release publish target/nightly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

  # Deploys the page `publish` rendered and uploaded, after that publish
  # succeeded (`needs`, and no if:, so it never runs after a failure). The
  # one job with pages: write and id-token: write, which deploy-pages needs;
  # it checks out nothing and runs no code of this repository. The
  # github-pages environment lets only main deploy
  # (infra/github/pages.tf). Its own group, never cancelled in progress, as
  # deploy-pages recommends; ci.yml's nightly-release group already keeps
  # one run's deploy finished before the next run's publish starts.
  pages:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      # The common rule's: this job runs no mise.
      MISE_AUTO_INSTALL: "false"
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
