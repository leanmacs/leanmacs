# Dependency rules, checked by `mise run deny` (AGENTS.md, "Test behaviour,
# never text"). Add one `deny` entry per workspace edge as crates appear:
#   { crate = "<name>", wrappers = ["<the crates allowed to depend on it>"], reason = "<why>" }
#
# A third-party library kept behind a port (AGENTS.md, "Prefer an existing
# library, behind a port") gets an entry whose only wrapper is its adapter
# crate, so no other crate can name its types.
#
# Each entry below was seen to bite once by hand. For winit and for ropey:
# with the library added to `editor-ffi`'s dependencies, `cargo deny check
# bans` fails. For the two workspace crates of the window, which no other
# crate can yet depend on without a cycle: with a wrapper taken out of the
# entry, it fails on the edge that wrapper allowed. For `editor-text`: with
# it added to `editor-platform-winit`'s dependencies, it fails. For the
# wrapper `editor-fs-std` of `editor-text`'s entry (2026-11-13): with it
# taken out, it fails on the adapter's edge. For `tempfile`: with it added
# to `editor-text`'s dev-dependencies, it fails as banned; a wrapper that is
# a dev-dependency edge is matched like any other.
#
# The file port's adapter, `editor-fs-std`, has no entry of its own until a
# crate depends on it: an entry whose wrapper matches no edge fails under
# `-D unused-wrapper`. Until then it is kept out of `editor-text`'s tests by
# that crate's `clippy.toml`, which refuses the adapter's constructor.
#
# One rule has no entry: "no crate depends on `editor-ffi`", the one crate
# that knows about Lean. No entry for it passes the gate. With
# `wrappers = ["editor-ffi"]` the wrapper matches nothing and
# `-D unused-wrapper` rejects it; with no wrappers the entry is a plain ban
# and fires on the workspace member itself. It is kept by review, and tracked
# as the rdm task `deny-editor-ffi-leaf-rule`.

[graph]
all-features = false
no-default-features = false

[bans]
multiple-versions = "allow"
deny = [
  { crate = "winit", wrappers = ["editor-platform-winit"], reason = "winit stays behind the window port: only its adapter crate may name its types" },
  { crate = "editor-platform-winit", wrappers = ["editor-ffi"], reason = "the window adapter is linked only by the crate that wires the library together; everything else reaches a window through the port" },
  { crate = "editor-platform", wrappers = ["editor-ffi", "editor-platform-winit"], reason = "the window port has two users today, its adapter and the crate that runs it onto the event queue; a third is a decision, so it is made here" },
  { crate = "ropey", wrappers = ["editor-text"], reason = "the rope stays behind editor-text's own types: only that crate may name the library's" },
  { crate = "editor-text", wrappers = ["editor-ffi", "editor-fs-std"], reason = "text storage has one user, the crate that puts a text behind a handle for Lean, and the file port it defines has one adapter, which implements it; another is a decision, so it is made here" },
  { crate = "tempfile", wrappers = ["editor-fs-std"], reason = "a temporary directory is for a test that touches real files, which only the file port's adapter has; editor-text's tests run on the fake and make no file" },
]
