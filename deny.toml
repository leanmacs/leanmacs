# Dependency rules, checked by `mise run deny` (AGENTS.md, "Test behaviour,
# never text"). Add one `deny` entry per workspace edge as crates appear:
#   { crate = "<name>", wrappers = ["<the crates allowed to depend on it>"], reason = "<why>" }
#
# A third-party library kept behind a port (AGENTS.md, "Prefer an existing
# library, behind a port") gets an entry whose only wrapper is its adapter
# crate, so no other crate can name its types.
#
# Each entry below was seen to bite once by hand. For winit and for ropey:
# with the library added to `editor-ffi`'s dependencies, `cargo deny check
# bans` fails. For the two workspace crates of the window, which no other
# crate can yet depend on without a cycle: with a wrapper taken out of the
# entry, it fails on the edge that wrapper allowed. For `editor-text`: with
# it added to `editor-platform-winit`'s dependencies, it fails. For the
# wrapper `editor-fs-std` of `editor-text`'s entry (2026-11-13): with it
# taken out, it fails on the adapter's edge. For the wrapper `editor-layout`
# of that entry (2026-11-13): with it taken out, it fails on layout's edge
# ("crate 'editor-text = 0.1.0' is explicitly banned"). For `tempfile`: with it added
# to `editor-text`'s dev-dependencies, it fails as banned; a wrapper that is
# a dev-dependency edge is matched like any other.
#
# The file port's adapter, `editor-fs-std`, got its entry in the commit in
# which `editor-ffi` came to depend on it: an entry whose wrapper matches no
# edge fails under `-D unused-wrapper`. Before that it was kept out of
# `editor-text`'s tests by that crate's `clippy.toml` alone, which refuses
# the adapter's constructor; now both hold it. For that entry (2026-11-13):
# with `editor-fs-std` added to `editor-platform-winit`'s dependencies, it
# fails; and with it added to `editor-text`'s dev-dependencies, which Cargo
# allows though it is a cycle, it fails too, so no test of `editor-text` can
# be handed the real file system by a dependency. For the wrapper
# `editor-ffi` of `tempfile`'s entry: with it taken out, it fails on the
# wiring test's edge.
#
# For `editor-layout` (2026-11-13), whose entry came in the commit in which
# `editor-ffi` came to depend on it: with it added to
# `editor-platform-winit`'s dependencies, it fails.
#
# For Parley and its font library (2026-11-13), whose entries came in the
# commit that added their adapter, `editor-shape-parley`: with `parley`
# added to `editor-layout`'s dependencies, it fails ("crate 'parley =
# 0.13.0' is explicitly banned"); with `fontique` added there, it fails
# the same way on `fontique`. `fontique`'s wrappers name two of Parley's
# own crates, which depend on it themselves. For the wrapper
# `editor-shape-parley` of `editor-layout`'s entry: with it taken out, it
# fails on the adapter's edge. That is how "no Parley or fontique type
# outside the adapter" is held: no other crate can depend on either, and
# the adapter's public items name neither.
#
# `editor-shape-parley` itself had no entry while nothing depended on it:
# an entry whose wrapper matches no edge fails under `-D unused-wrapper`.
# Its entry came in the commit in which its first user came to depend on
# it (2026-11-14), as `editor-fs-std`'s did: `editor-render-wgpu`, by a
# dev-dependency, for the fixture frame of real text its two wiring tests
# and its examples lay out. With the entry's wrapper naming another crate,
# it fails ("crate 'editor-shape-parley = 0.1.0' is explicitly banned").
#
# For the renderer (2026-11-13, the display pipeline's phase 4). The
# `Renderer` port's crate, `editor-render`, takes layout's frames, so it is
# a wrapper of `editor-layout`'s entry from the commit that added it: with
# the wrapper not yet there, it fails on the new crate's edge ("crate
# 'editor-layout = 0.1.0' is explicitly banned"). The crate of the port's
# real adapters, `editor-render-wgpu`, is the port's first user, so
# `editor-render`'s entry came in the commit that added it (2026-11-14):
# with the entry's wrapper naming another crate, it fails on the adapters'
# edge ("crate 'editor-render = 0.1.0' is explicitly banned"); and before
# the adapters' crate was a wrapper of `editor-layout`'s entry, it failed
# on that edge too. `editor-render-wgpu` itself has no entry: nothing
# depends on it yet.
#
# For the wrapper `editor-ffi` of `editor-render`'s entry (2026-11-14, the
# display pipeline's phase 5), added in the commit in which `editor-ffi`
# came to start the render thread: with the wrapper not yet there, it fails
# on that edge ("crate 'editor-render = 0.1.0' is explicitly banned").
#
# For the window that draws (2026-11-14, the same phase): `editor-ffi`'s
# example `window` runs the real renderer over the real shaper in a real
# window, so `editor-ffi` came to depend on both, by dev-dependencies, in
# one commit. `editor-render-wgpu` got its first entry then, as
# `editor-fs-std` did when it got its first user: with the entry's wrapper
# naming another crate, it fails ("crate 'editor-render-wgpu = 0.1.0' is
# explicitly banned"). And `editor-ffi` joined the wrappers of
# `editor-shape-parley`'s entry: with the wrapper not yet there, it fails
# on that edge ("crate 'editor-shape-parley = 0.1.0' is explicitly
# banned"). Neither was linked into the library Lean links then.
#
# For the library Lean links (2026-11-15, the display pipeline's phase 6):
# `editor-ffi` came to depend on `editor-shape-parley` as a normal
# dependency, for the display its window mode lays out in the machine's
# fonts, and that entry's reason was rewritten. With the entry's wrapper
# naming another crate, it fails on that edge ("crate
# 'editor-shape-parley = 0.1.0' is explicitly banned"). In the same phase
# `editor-ffi` came to depend on `editor-render-wgpu` as a normal
# dependency, for the headless mode's render session and the window, and
# that entry's reason was rewritten: with its wrapper naming another crate,
# it fails ("crate 'editor-render-wgpu = 0.1.0' is explicitly banned").
#
# For the libraries behind the `Renderer` port, each with
# `editor-render-wgpu` its one wrapper, each added in the commit that
# added its edge. `etagere` (2026-11-14): with the entry's wrapper naming
# another crate, it fails ("crate 'etagere = 0.3.0' is explicitly
# banned"). `swash` (2026-11-14): the same way ("crate 'swash = 0.2.10'
# is explicitly banned"). `png` (2026-11-14), a dev-dependency: the same
# way ("crate 'png = 0.18.1' is explicitly banned"). It became a normal
# dependency of `editor-render-wgpu` in the theming roadmap's phase 3
# (2026-11-16), for the shipped themes' pictures `editor-ffi` reads and
# writes for Lean's `ffi-test`, and its reason was rewritten; its one
# wrapper is unchanged, and the library Lean links holds it since. In the
# same phase the reasons of `editor-shape-parley`'s and
# `editor-render-wgpu`'s entries were rewritten for `editor-ffi`'s new
# uses of each, a display over one font file and its picture, with their
# wrappers unchanged. `wgpu` and
# `pollster` (2026-11-14): the same way ("crate 'wgpu = 30.0.2' is
# explicitly banned", "crate 'pollster = 1.0.1' is explicitly banned").
# wgpu's own crates (`wgpu-core`, `wgpu-hal`, `wgpu-types`, `naga`) have
# no entry: they are reached only through `wgpu`, and an entry for each
# would name wgpu's internals here.
#
# For the clipboard (2026-11-14, the display pipeline's phase 5), whose
# entries came in the commit that added its adapter,
# `editor-platform-arboard`. The clipboard port is in `editor-platform`,
# so the adapter is a wrapper of that crate's entry: with the wrapper not
# yet there, it fails on the adapter's edge ("crate 'editor-platform =
# 0.1.0' is explicitly banned"). `arboard`: with the entry's wrapper
# naming another crate, it fails ("crate 'arboard = 3.7.0' is explicitly
# banned"). `editor-platform-arboard` itself had no entry while nothing
# depended on it. Its entry came in the commit in which `editor-ffi` came
# to depend on it (2026-11-15, the display pipeline's phase 6), for the
# clipboard Lean's window mode opens: with the entry's wrapper naming
# another crate, it fails ("crate 'editor-platform-arboard = 0.1.0' is
# explicitly banned").
#
# For `raw-window-handle` (2026-11-14), whose entry came in the commit in
# which an adapter first named its types: `editor-platform-winit` turns
# the handles winit gives into the port's `NativeWindow`, through winit's
# re-export. The entry's wrappers are the third-party crates that depend
# on it in the resolved graph (winit, its back-end crates and `ndk`, and
# wgpu's four), so that no crate of the workspace can: with it added to
# `editor-platform-winit`'s dependencies, it fails ("crate
# 'raw-window-handle = 0.6.2' is explicitly banned").
#
# For winit 0.31 (2026-11-15, the macOS app's phase 3), whose pin moved to
# `=0.31.0-beta.4`. winit is now a facade over `winit-core` and one crate
# per back end, and those nine came to depend on `raw-window-handle`
# themselves, so they joined that entry's wrappers in the commit that moved
# the pin. With the pin moved and the nine not yet there, it fails ("crate
# 'raw-window-handle = 0.6.2' is explicitly banned"). With `winit` added
# to `editor-ffi`'s dependencies, it still fails on winit ("crate 'winit =
# 0.31.0-beta.4' is explicitly banned"): the `winit` entry is unchanged.
#
# For the wrapper `editor-render-wgpu` of `editor-platform`'s entry
# (2026-11-14), added in the commit in which the renderer came to make a
# surface on a window, which it is handed as the port's `NativeWindow`:
# with the wrapper not yet there, it fails on that edge ("crate
# 'editor-platform = 0.1.0' is explicitly banned").
#
# For fuzzy matching (2026-11-14, the command loop's phase 14), whose
# entries came in the commit that added the Scorer port's adapter,
# `editor-fuzzy-nucleo`. `nucleo-matcher`: with it added to
# `editor-fuzzy`'s dependencies, it fails ("crate 'nucleo-matcher = 0.3.1'
# is explicitly banned"). `editor-fuzzy`, the port's crate, which had no
# entry while nothing depended on it: with the entry's wrapper naming
# another crate, it fails on the adapter's edge ("crate 'editor-fuzzy =
# 0.1.0' is explicitly banned"). `editor-fuzzy-nucleo` itself got its
# entry in the commit in which `editor-ffi` came to depend on it, for the
# one C function that ranks candidates: with the entry's wrapper naming
# another crate, it fails ("crate 'editor-fuzzy-nucleo = 0.1.0' is
# explicitly banned"). `editor-ffi` joined the wrappers of `editor-fuzzy`'s
# entry in that commit: with the wrapper not yet there, it fails on that
# edge ("crate 'editor-fuzzy = 0.1.0' is explicitly banned").
#
# For processes (2026-11-15, the process service's phase 1), whose entries
# came in the commit that added the Processes port's adapter,
# `editor-process-std`. `editor-process`, the port's crate: with the
# entry's wrapper naming another crate, it fails on the adapter's edge
# ("crate 'editor-process = 0.1.0' is explicitly banned"). The wrapper
# `editor-process-std` of `tempfile`'s entry, for the adapter's contract
# test: with it taken out, it fails on that edge ("crate 'tempfile =
# 3.27.0' is explicitly banned"). `editor-process-std` itself had no entry
# while nothing depended on it. Its entry came in the commit in which
# `editor-ffi` came to depend on it, for the process's process service:
# with the entry's wrapper naming another crate, it fails ("crate
# 'editor-process-std = 0.1.0' is explicitly banned"); and in that commit
# `editor-ffi` joined the wrappers of `editor-process`'s entry: with the
# wrapper not yet there, it fails on that edge ("crate 'editor-process =
# 0.1.0' is explicitly banned"). `libc` and `rustix`, the adapter's system
# calls, have none: many third-party crates in the graph depend on each,
# so an entry would list their internals, as `raw-window-handle`'s does,
# and no port type names either.
#
# For watching (2026-11-15, the process service's phase 3), whose entries
# came in the commit that added the Watch port's adapter,
# `editor-watch-notify`. `notify`: with it added to `editor-watch`'s
# dependencies, it fails ("crate 'notify = 8.2.2' is explicitly banned").
# `notify-types`, notify's own crate, whose one wrapper is notify, as
# `fontique`'s are Parley's own crates: with it added to
# `editor-watch-notify`'s dependencies, it fails ("crate 'notify-types =
# 2.3.1' is explicitly banned"). `editor-watch`, the port's crate: with the
# entry's wrapper naming another crate, it fails on the adapter's edge
# ("crate 'editor-watch = 0.1.0' is explicitly banned"). The wrapper
# `editor-watch-notify` of `tempfile`'s entry, for the adapter's contract
# test: with it taken out, it fails on that edge ("crate 'tempfile =
# 3.27.0' is explicitly banned"). `editor-watch-notify` itself had no entry
# while nothing depended on it. Its entry came in the commit in which
# `editor-ffi` came to depend on it, for the process's watch service: with
# the entry's wrapper naming another crate, it fails ("crate
# 'editor-watch-notify = 0.1.0' is explicitly banned"); and in that commit
# `editor-ffi` joined the wrappers of `editor-watch`'s entry: with the
# wrapper not yet there, it fails on that edge ("crate 'editor-watch =
# 0.1.0' is explicitly banned"). `inotify`, `mio` and
# `objc2-core-services` have none: they are reached only through notify,
# as wgpu's internals are.
#
# For the objc2 crates (2026-11-15, the macOS app's phase 5), whose
# entries came in the commit in which `editor-platform-winit` came to name
# AppKit, for the application delegate that receives the files the system
# asks the app to open. Since the theming roadmap's phase 6 (2026-11-16) the
# adapter names AppKit and Foundation for a second thing as well, the
# window's corner clearance (src/corner.rs: `NSView`, `NSViewLayoutRegion`
# and `NSEdgeInsets`); that added features to the pins and no crate, and
# the wrappers are unchanged. Each entry's wrappers are that adapter and the
# third-party crates that depend on the crate in the resolved graph
# (`cargo tree --target all -i <crate> -e normal,build,dev --depth 1`), so
# that no other crate of the workspace can. With `objc2-app-kit`,
# `objc2-foundation` and `objc2` added to `editor-ffi`'s dependencies, it
# fails on each ("crate 'objc2-app-kit = 0.3.2' is explicitly banned",
# and the same for `objc2-foundation = 0.3.2` and `objc2 = 0.6.5`).
#
# For search (2026-11-16, the daily-driver floor's phase 3), whose entries
# came in the commit that added the search engine port's adapter,
# `editor-search-regex`. `regex-cursor`: with it added to
# `editor-search`'s dependencies, it fails ("crate 'regex-cursor = 0.1.5'
# is explicitly banned"). `regex-syntax`, whose tree the adapter builds:
# with it added to `editor-search`'s dependencies, it fails the same way
# ("crate 'regex-syntax = 0.8.11' is explicitly banned"); its wrappers
# beside the adapter are the third-party crates that depend on it in the
# resolved graph (`cargo tree --target all -i regex-syntax -e
# normal,build,dev --depth 1`: regex-cursor, regex-automata, and proptest,
# which already did), and with the wrapper `regex-cursor` taken out it
# fails on that edge. `regex-automata`, whose engines regex-cursor forks,
# with regex-cursor its one wrapper, as `notify-types`'s is notify: with
# it added to `editor-search-regex`'s dependencies, it fails ("crate
# 'regex-automata = 0.4.18' is explicitly banned"). `editor-search`, the
# port's crate, which had no entry while nothing depended on it: with the
# entry's wrapper naming another crate, it fails on the adapter's edge
# ("crate 'editor-search = 0.1.0' is explicitly banned"). The adapter
# itself had no entry while nothing depended on it. Its entry came in the
# commit in which `editor-ffi` came to depend on it, for the two C
# functions that search a snapshot: with the entry's wrapper naming
# another crate, it fails ("crate 'editor-search-regex = 0.1.0' is
# explicitly banned"); and in that commit `editor-ffi` joined the wrappers
# of `editor-search`'s entry: with the wrapper not yet there, it fails on
# that edge ("crate 'editor-search = 0.1.0' is explicitly banned").
#
# For the diff of a reload (2026-11-16, the daily-driver floor's phase 5),
# whose entries came in the commit that added the line diff port's adapter,
# `editor-diff-imara`, and the diff service of `editor-ffi`. `imara-diff`:
# with it added to `editor-diff`'s dependencies, it fails ("crate
# 'imara-diff = 0.2.0' is explicitly banned"). `editor-diff`: with
# `editor-ffi` taken out of its wrappers, it fails on that edge.
# `editor-diff-imara`: with its wrapper naming another crate, it fails.
# `hashbrown` and `foldhash`, which imara-diff brings, have none: many
# crates of the graph depend on hashbrown.
#
# `aho-corasick`,
# `memchr` and `log`, which the libraries bring, have none: they are
# reached only through them, or many crates of the graph depend on them.
#
# One rule has no entry: "no crate depends on `editor-ffi`", the one crate
# that knows about Lean. No entry for it passes the gate. With
# `wrappers = ["editor-ffi"]` the wrapper matches nothing and
# `-D unused-wrapper` rejects it; with no wrappers the entry is a plain ban
# and fires on the workspace member itself. It is kept by review, and tracked
# as the rdm task `deny-editor-ffi-leaf-rule`.

[graph]
all-features = false
no-default-features = false

[bans]
multiple-versions = "allow"
