# globset compile an ignore file's globs to regexes, so they joined the
# wrappers of `regex-automata`'s and `regex-syntax`'s entries: with either
# taken out, it fails on that edge. Still no crate of the workspace makes
# a pattern string in the library's syntax. `editor-grep`: with the entry's
# wrapper naming another crate, it fails on the adapter's edge. The
# adapter's dev-dependency on `editor-search`, for the engine's fake in
# its ignore test, and on `tempfile` made it a wrapper of both entries:
# with it taken out of either, it fails on that edge. `walkdir`, `bstr`,
# `same-file`, `encoding_rs`, `encoding_rs_io`, `memmap2` and the
# `crossbeam` crates have none: they are reached only through the
# libraries, as wgpu's internals are. The adapter itself had no entry while
# nothing depended on it. Licences: `ignore` and the `grep-*` crates are
# Unlicense OR MIT, and `encoding_rs` adds BSD-3-Clause for its data; the
# gate checks no licence, so whether they are acceptable is the owner's to
# confirm. The adapter's own entry came in the commit in which `editor-ffi`
# came to depend on it, for the process's grep service: with the entry's
# wrapper naming another crate, it fails ("crate 'editor-grep-ripgrep =
# 0.1.0' is explicitly banned"); and in that commit `editor-ffi` joined the
# wrappers of `editor-grep`'s entry: with the wrapper not yet there, it
# fails on that edge ("crate 'editor-grep = 0.1.0' is explicitly banned").
#
# For the diff of a reload (2026-11-16, the daily-driver floor's phase 5),
# whose entries came in the commit that added the line diff port's adapter,
# `editor-diff-imara`, and the diff service of `editor-ffi`. `imara-diff`:
