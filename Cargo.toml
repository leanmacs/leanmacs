# The Rust library, linked into the Lean executable that Lake builds in
# `lean/` (README.md, "Building"). Every crate is ordinary Rust, built and
# tested with Cargo alone; only `editor-ffi` and the crates of packages,
# through their C functions, know about Lean.
[workspace]
# The crates of the editor, then the crate of each package that holds Rust
# (docs/design/packages.md, "Rust in a package"): a package's crate is a
# member so that the root lock holds its versions, which the crate the
# package-set build generates is built against, and so that the gate's
# fmt, clippy, doc, test and cargo-deny cover it. Only the fixture set's
# packages hold Rust yet. A glob that matches nothing fails to load, so a
# default package (`packages/`) that comes to hold a crate adds
# `"packages/*/rust"` here. The crates of `tests/rust-bans/` are not
# members: their edges are the ones the bans refuse.
members = ["crates/*", "tests/packages/*/rust"]
# A vendored crate (vendor/README.md) is a path dependency, not a member: its
# dev-dependencies never enter the lock (the Lean grammar's `tree-sitter 0.25`
# would conflict with the pinned library's `links`), and the gate's clippy, doc
# and test leave third-party code alone. `cargo fmt --all` still reads its
# Rust, which is upstream's and passes as is.
exclude = ["vendor"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"

# The lint levels every member takes (`[lints] workspace = true` in its
# manifest; .agents/rules/structure.md, "Clippy's bans"), so they hold for
# every run of clippy: the gate's, the pre-commit hook's over one crate, an
# editor's. The bans themselves are the root `clippy.toml`'s, which says
# where a site may opt out: `disallowed_methods` and `disallowed_types`
# are errors whether or not warnings are, and an opt-out is an
# `#[expect(..., reason = "...")]` at its site, since an outer `#[allow]`
# and a mark without a reason are errors too. An `#[expect]` that no longer
# covers a call is unfulfilled, which `-D warnings` fails.
[workspace.lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
