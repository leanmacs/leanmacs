# The Rust library, linked into the Lean executable that Lake builds in
# `lean/` (README.md, "Building"). Every crate is ordinary Rust, built and
# tested with Cargo alone; only `editor-ffi` knows about Lean.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
