[package]
name = "editor-package-library-libloading"
version = "0.1.0"
description = "The library port's real adapter: a package's native library opened with the platform's loader, through libloading, and never unloaded"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# The port this crate implements, and its contract, which
# `tests/contract.rs` runs on real files.
editor-package-library = { path = "../editor-package-library" }
# Opening a package's library and finding its init: the `dlopen` and
# `dlsym` wrapper the syntax adapter already opens native grammars with
# (`editor-syntax-treesitter`'s `src/native.rs`, whose manifest says why
# this library and this version). ISC, compatible with GPL-3.0-or-later,
# used unmodified. Its types stay in `src/lib.rs` and never cross the port,
# and `deny.toml` lets no other crate of the workspace but those two depend
# on it.
#
# Pinned exactly to 0.8.9, the copy the resolved graph already builds
# (2026-11-26), so it adds nothing to the graph.
libloading = { version = "=0.8.9" }

[dev-dependencies]
# The fixture grammar library, built for tests alone: the contract test
# opens it as a library, finds a symbol it exports and misses one it does
# not, and reads its source as a file that is no library.
editor-syntax-fixture-ini = { path = "../editor-syntax-fixture-ini" }

[lints]
workspace = true
