[package]
name = "editor-fuzzy"
version = "0.1.0"
description = "Fuzzy matching: the Scorer and Searcher ports, with their fakes and their contracts, the rule that orders the candidates a pattern matches and the rule that picks the span a pattern is located at"
edition.workspace = true
license.workspace = true
publish = false

# No dependency and no dev-dependency: the ports name no matching library,
# and the rules are tested on scorers and searchers written in its tests.
# The library that scores is behind the scorer port, in
# `editor-fuzzy-nucleo`; the one that searches with errors allowed is
# behind the searcher port, in `editor-fuzzy-triple-accel`.
[dependencies]

[lints]
workspace = true
