# What no line of `editor-fuzzy` may name, its tests included: a real file,
# the machine's clock, or either port's real adapter. The crate decides the
# order of a ranking (`src/lib.rs`) and which span a located pattern is
# answered at (`src/locate.rs`), over the `Scorer` and `Searcher` ports it
# defines. Its tests, the rules', the fakes' and the contracts', run on the
# published fakes, `InOrder` and `locate::Scan`, and on scorers and
# searchers written in them, with every text built in code.
#
# Clippy reads the first `clippy.toml` it finds from a package's manifest
# directory upwards, and the workspace root's (`/clippy.toml`) is read only
# by a crate with none of its own. So this file governs
# every target of this crate and no other. `disallowed_methods` and
# `disallowed_types` are on by default at `warn`, and `mise run lint`
# denies warnings, so a line that names one of these fails the gate.
#
# The adapters' entries name crates this one does not depend on. Clippy
# takes a path into a crate that is not in the build without a warning, and
# the entry is then idle; each is here so that a dev-dependency on an
# adapter, which Cargo allows though it is a cycle, cannot hand a test of
# this crate a real matching library. `deny.toml` closes that route too.
#
# Seen to bite once by hand, on 2026-11-19: with a test added to
# `src/locate.rs` that calls `std::time::Instant::now()`,
# `std::fs::read("/nonexistent")` and `Path::new("/").exists()` and names
# `std::fs::File`, `cargo clippy -p editor-fuzzy --all-targets -- -D
# warnings` (what `mise run lint` runs, for this crate) fails with "use of
# a disallowed method `std::time::Instant::now`", "`std::fs::read`",
# "`std::path::Path::exists`" and "use of a disallowed type
# `std::fs::File`". With the test taken out it passes.
#
# What this does not hold is what `crates/editor-text/clippy.toml` says of
# its own list: it is a list of names. A call through `libc`, which this
# crate does not depend on, is a reviewer's to look for.

disallowed-methods = [
  # BEGIN wait-bans: the root `clippy.toml` owns this block and says why;
  # each `crates/*/clippy.toml` holds a copy that `tools/wait-bans.sh`
  # writes from it. Edit it in the root only.
  #
  # The timed waits: a test's bound is an `editor_wait::HangGuard` or
  # `editor_wait::RealTime`, and its wait goes through `editor-wait`.
  { path = "std::thread::sleep", reason = "a test's sleep is `editor_wait::RealTime::sleep`, which names the timing under test; real-clock code says why at an `#[expect]`" },
  { path = "std::thread::sleep_ms", reason = "a test's sleep is `editor_wait::RealTime::sleep`, which names the timing under test" },
  { path = "std::thread::park_timeout", reason = "wait on the event itself, bounded by an `editor_wait::HangGuard`, not on a timed park" },
  { path = "std::thread::park_timeout_ms", reason = "wait on the event itself, bounded by an `editor_wait::HangGuard`, not on a timed park" },
  { path = "std::thread::yield_now", reason = "a yield hopes for a schedule: wait on the event itself (`editor_wait`)" },
  { path = "std::sync::mpsc::Receiver::recv_timeout", reason = "a bounded receive is `editor_wait::recv`, whose bound is an `editor_wait::HangGuard` naming the event" },
  { path = "std::sync::Condvar::wait_timeout", reason = "a bounded Condvar wait is `editor_wait::wait_while`, whose bound is an `editor_wait::HangGuard` naming the event" },
  { path = "std::sync::Condvar::wait_timeout_ms", reason = "a bounded Condvar wait is `editor_wait::wait_while`, whose bound is an `editor_wait::HangGuard` naming the event" },
  { path = "std::sync::Condvar::wait_timeout_while", reason = "a bounded Condvar wait is `editor_wait::wait_while`, whose bound is an `editor_wait::HangGuard` naming the event" },
  { path = "std::thread::JoinHandle::is_finished", reason = "asking whether a thread has ended is a poll: join it, or wait on a channel it drops with `editor_wait::recv`" },
  { path = "std::process::Child::try_wait", reason = "asking whether a child has exited is a poll: wait on its exit, bounded by an `editor_wait::HangGuard`" },
  { path = "std::time::Instant::now", reason = "a deadline is `editor_wait::HangGuard::start` or `deadline`, and a timing measured is an `editor_wait::Stopwatch`; real-clock code says why at an `#[expect]`" },
  # The readouts a test waits on, each a `HangGuard` wait of its owner's
  # that a crate other than its owner can call. `allow-invalid`: a crate
  # that does not reach the owner cannot resolve the path; a wrong one
  # leaves an `#[expect]` at its sites unfulfilled, and the fixture's call
  # unrefused.
  { path = "editor_service::queue::Queue::await_waiting", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_service::service::RecordingCompleter::wait_for", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_platform::scripted::ScriptedPlatform::wait_parked", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_process::service::Service::wait_held", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_platform_winit::probe::await_requests_handled", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_render::render_loop::RenderHandle::wait_resting", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_syntax::session::Session::wait_for", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_syntax::session::Session::wait_exact", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_grep::service::Service::until_held_back", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_ffi::syntax::Syntaxes::settle", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_ffi::syntax::Syntaxes::settle_exact", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  # END wait-bans
  # The clocks of the machine.
  { path = "std::time::Instant::now", reason = "the crate keeps no time: a ranking and a search are never timed" },
  { path = "std::time::SystemTime::now", reason = "the crate keeps no time" },
  # The ports' real adapters.
  { path = "editor_fuzzy_nucleo::NucleoScorer::new", reason = "the crate's tests run on the scorer's fake, `InOrder`, and on scorers written in them; the library is the adapter's own tests' and `editor-ffi`'s wiring test's" },
  { path = "editor_fuzzy_triple_accel::TripleAccel::new", reason = "the crate's tests run on the searcher's fake, `locate::Scan`, and on searchers written in them; the library is the adapter's own tests' and `editor-ffi`'s wiring test's" },
  # Every free function of `std::fs`.
  { path = "std::fs::canonicalize", reason = "the crate reads and writes no file: its tests build their texts in code" },
  { path = "std::fs::copy", reason = "the crate reads and writes no file: its tests build their texts in code" },
  { path = "std::fs::create_dir", reason = "the crate reads and writes no file: its tests build their texts in code" },
  { path = "std::fs::create_dir_all", reason = "the crate reads and writes no file: its tests build their texts in code" },
  { path = "std::fs::exists", reason = "the crate reads and writes no file: its tests build their texts in code" },
  { path = "std::fs::hard_link", reason = "the crate reads and writes no file: its tests build their texts in code" },
  { path = "std::fs::metadata", reason = "the crate reads and writes no file: its tests build their texts in code" },
  { path = "std::fs::read", reason = "the crate reads and writes no file: its tests build their texts in code" },
  { path = "std::fs::read_dir", reason = "the crate reads and writes no file: its tests build their texts in code" },
  { path = "std::fs::read_link", reason = "the crate reads and writes no file: its tests build their texts in code" },
  { path = "std::fs::read_to_string", reason = "the crate reads and writes no file: its tests build their texts in code" },
  { path = "std::fs::remove_dir", reason = "the crate reads and writes no file: its tests build their texts in code" },
  { path = "std::fs::remove_dir_all", reason = "the crate reads and writes no file: its tests build their texts in code" },
  { path = "std::fs::remove_file", reason = "the crate reads and writes no file: its tests build their texts in code" },
  { path = "std::fs::rename", reason = "the crate reads and writes no file: its tests build their texts in code" },
  { path = "std::fs::set_permissions", reason = "the crate reads and writes no file: its tests build their texts in code" },
  { path = "std::fs::symlink_metadata", reason = "the crate reads and writes no file: its tests build their texts in code" },
  { path = "std::fs::write", reason = "the crate reads and writes no file: its tests build their texts in code" },
  # The methods of `Path` that ask the disk.
  { path = "std::path::Path::canonicalize", reason = "the crate asks nothing of the disk" },
  { path = "std::path::Path::exists", reason = "the crate asks nothing of the disk" },
  { path = "std::path::Path::is_dir", reason = "the crate asks nothing of the disk" },
  { path = "std::path::Path::is_file", reason = "the crate asks nothing of the disk" },
  { path = "std::path::Path::is_symlink", reason = "the crate asks nothing of the disk" },
  { path = "std::path::Path::metadata", reason = "the crate asks nothing of the disk" },
  { path = "std::path::Path::read_dir", reason = "the crate asks nothing of the disk" },
  { path = "std::path::Path::read_link", reason = "the crate asks nothing of the disk" },
  { path = "std::path::Path::symlink_metadata", reason = "the crate asks nothing of the disk" },
  { path = "std::path::Path::try_exists", reason = "the crate asks nothing of the disk" },
]

disallowed-types = [
  { path = "std::fs::File", reason = "the crate reads and writes no file: its tests build their texts in code" },
  { path = "std::fs::OpenOptions", reason = "the crate reads and writes no file: its tests build their texts in code" },
]
