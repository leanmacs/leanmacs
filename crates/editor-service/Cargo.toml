[package]
name = "editor-service"
version = "0.1.0"
description = "The conventions every service of the Rust library keeps, published for the crates of packages: registering a service, completing a request on the completion queue through the Completer port, and the plain-data buffers that cross the boundary"
edition.workspace = true
license.workspace = true
publish = false

# This crate is what `editor-ffi` and the crate of every package linked into
# the editor's archive depend on, so it depends on nothing of the editor's
# (docs/design/packages.md, "Rust in a package") but `editor-wait`, the
# typed time bounds, which itself depends on nothing and which it
# re-exports (`editor_service::wait`) so that such a package's crate bounds
# its waits with them and still depends on this crate alone. `deny.toml`
# gives this crate an entry naming the crates linked into the editor's one
# Rust archive that use it; a package whose crate ships as a library of its
# own (the fixture echo's) is left out, and reaches the core through the
# package runtime, written against the package wrapper (`editor-package`)
# instead. `editor-wait`'s entry names the crates of the editor's that use
# it, a package's crate not among them. No dev-dependency.
[dependencies]
editor-wait = { path = "../editor-wait" }

[lints]
workspace = true
