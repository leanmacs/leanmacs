[package]
name = "editor-wait"
version = "0.1.0"
description = "Typed time bounds for the Rust library's tests and readouts: a hang guard naming the event its wait ends on, one run out on purpose naming what is held for good, real time naming the timing under test, and the bounded waits that take them"
edition.workspace = true
license.workspace = true
publish = false

# No dependency and no dev-dependency: the crate wraps std's own bounded
# primitives (a channel's receive, a Condvar's wait, a sleep). The crates of
# the editor that use it are named in `deny.toml`'s entry for it, and a new
# one joins there. A package's crate does not depend on it: it reaches it
# through the one crate of the editor's it depends on, `editor-service`
# (`editor_service::wait`) for a crate linked into the editor's archive, or
# the package wrapper (`editor_package::wait`) for a library of its own
# (docs/design/packages.md, "Rust in a package").
[dependencies]

[lints]
workspace = true
