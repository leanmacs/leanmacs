[package]
name = "editor-syntax-treesitter"
version = "0.1.0"
description = "The syntax port's real adapter, over tree-sitter, with the Rust, JSON, Markdown, Markdown inline, TOML and Lean grammars compiled in"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# The syntax port, its fake and its contract. This crate implements the
# port, and its test `tests/contract.rs` runs the contract on the adapter,
# once for each grammar.
editor-syntax = { path = "../editor-syntax" }
# Text storage: the snapshot a parse reads through its chunks, and the edit
# and point types the port hands an edit in.
editor-text = { path = "../editor-text" }
# The parser, the incremental reparse and the query engine. Kept behind the
# port: no tree-sitter type is public here, and `deny.toml` lets no other
# crate depend on it. Pinned exactly; 0.27.2 was the newest release on
# 2026-11-16. Its licence is MIT, compatible with GPL-3.0-or-later, and it
# is used unmodified. Its build compiles the library's C with `cc`.
#
# Its features. `std`, the default, is on: it is what `#match?`
# predicates' `regex` needs. `wasm` is off and stays off: it brings
# wasmtime, a JIT and hundreds of crates, to load grammars built as
# WebAssembly, and grammars are compiled in here (the crate docs, "How
# grammars are loaded"). `deny.toml` bans `wasmtime` outright.
#
# `streaming-iterator`, which its query cursor iterates with, and
# `tree-sitter-language`, the type a grammar crate hands its language in,
# come in through it and are not dependencies here: the adapter names the
# first through tree-sitter's re-export, and hands the second straight to
# `Language::new`.
#
# Looked at on 2026-11-16 and set aside:
#
# - The `wasm` feature, above.
# - `tree-sitter-loader` 0.x, which finds, builds and loads grammars from a
#   directory at run time, compiling their C with the machine's compiler.
#   Grammars are fixed when the library is built, so a loader buys
#   nothing; `deny.toml` bans it outright.
# - Our own parser: tree-sitter is the incremental parser the grammars
#   exist for, and writing one is out of all proportion.
tree-sitter = { version = "=0.27.2" }
# The grammars, each compiled in: its crate's build compiles the generated
# `parser.c` (and the grammar's `scanner.c`, if it has one) with `cc` when
# Cargo builds this crate, and the objects end up in the static library
# Lean links. Each depends only on `tree-sitter-language`, so they and the
# library are pinned independently. Both MIT, used unmodified; each was the
# newest release on 2026-11-16.
#
# Rust, for the editor's own language and the adapter's contract on real
# code.
tree-sitter-rust = { version = "=0.24.2" }
# JSON, the grammar the Lean model reproduces in pure Lean
# (`lean/Editor/SyntaxTree/Model.lean`), so the Lean contract compares the
# model and the library answer for answer.
tree-sitter-json = { version = "=0.24.8" }
# Markdown, for documents and for the code in their fences, which the
# grammar's own injections query hands to the grammar its info string names
# (`docs/design/rust-library.md`, "Injections, indentation and text
# objects, as built"). It is the tree-sitter-grammars project's grammar, the
# one nvim, Helix and Zed use. MIT, used unmodified; 0.5.4, released on
# 2026-10-24, was the newest release when looked at on crates.io on
# 2026-11-16. Its build compiles the C of its two grammars, block and
# inline, each with its external scanner.
#
# Its one feature, `parser`, is off (the crate has no default features): it
# only turns on an optional dependency on tree-sitter for a
# `MarkdownParser` wrapper the adapter does not use. So its dependencies are
# `tree-sitter-language` and `cc` at build time, both already in the graph.
#
# Both grammars are listed: the block grammar (`LANGUAGE`) as `markdown`,
# and the inline grammar (`INLINE_LANGUAGE`) as `markdown_inline`, the name
# the block grammar's injections query gives each `(inline)` node, so
# inline Markdown is an injected layer. The inline grammar's reparse policy
# is `whole`: its incremental reparses of texts without errors differ from
# a fresh parse (598 of 4,000 reparses of random edits on 2026-11-16, and
# 136 of 6,400 in a second sweep that day), so it fails the contract's
# `GRAMMAR_QUALITY`, and each round parses it from scratch. The block
# grammar's 6,000 reparses all equalled the fresh parse, and it is
# `incremental`.
tree-sitter-md = { version = "=0.5.4", default-features = false }
# TOML, for manifests and settings: `Cargo.toml`, `mise.toml`,
# `lakefile.toml` and `Cargo.lock`. It is the tree-sitter-grammars
# project's grammar, the continuation of ikatyang's original and the same
# project as `tree-sitter-md`; the most used TOML grammar crate. MIT, used
# unmodified; 0.7.0, released on 2024-12-03, was the newest release when
# looked at on crates.io on 2026-11-17, and the repository's last commit is
# its tag (TOML 1.0 is a stable spec). Its build compiles the grammar's
# `parser.c` and its external scanner `scanner.c`. It has no features; its
# one normal dependency is `tree-sitter-language`, and `cc` at build time,
# both already in the graph (its `tree-sitter ^0.24` is a dev-dependency
# only). It ships a highlights query and no other, so TOML has no
# injections, indents or text objects.
#
# Its reparse policy is `incremental`: on 2026-11-17, 4,221 incremental
# reparses of texts without errors, of random edits to the fixtures under
# `tests/syntax/toml/`, all equalled a fresh parse, and the contract
# (`tests/contract.rs`) passes with the policy `incremental`.
#
# Looked at on 2026-11-17 and set aside:
#
# - `tree-sitter-toml` 0.20.0 (2022): a normal dependency on
#   `tree-sitter ^0.20`, and the old `language()` function, so it cannot
#   hand a `LanguageFn` to the pinned tree-sitter.
# - `tree-sitter-toml-updated` 0.20.0: a personal fork with a normal
#   dependency on `tree-sitter >=0.21` and the same old API.
# - `treease-ts-toml` 0.7.2: a third party's republish of the same
#   repository, with no grammar change over 0.7.0 (upstream has no commit
#   after its tag), from a publisher that is not the project.
# - `konomanoasa-tree-sitter-toml` 0.11.2: a personal fork with few users,
#   which pins `cc =1.11.0` exactly and so would move the locked `cc`.
tree-sitter-toml-ng = { version = "=0.7.0" }
# Lean 4, for the editor's own configuration and most of its code. It is
# upstream's grammar, `github.com/Julian/tree-sitter-lean`, the original
# Lean 4 grammar, maintained (commits through November 2026). No crates.io
# crate fits, so upstream's own crate (`tree-sitter-lean` 0.2.0, its Rust
# binding included) is vendored under `vendor/tree-sitter-lean/` at commit
# `0d28e5d6e8c4755f5df7ef9bde3b6ec6f59fae94` (2026-11-01), and named here
# as a path dependency whose `version` makes Cargo check the copy is the one
# pinned (`vendor/README.md` says how to update it). MIT, used unmodified;
# its `LICENSE` is in the copy. Its build compiles the generated `parser.c`
# (49 MB, ABI 15) and its external scanner `scanner.c`. Its one normal
# dependency is `tree-sitter-language`, and `cc` at build time, both already
# in the graph; its `tree-sitter 0.25` is a dev-dependency only, which never
# enters the lock because the workspace excludes `vendor/`.
#
# It ships its highlights query in the same commit as the grammar, so the
# query cannot drift from the node types; that is the one query used. Its
# injections query (doc comments as Markdown) is not used: under it each
# doc comment is a Markdown layer, and its inline layers, parsed whole every
# round, and doc comments already draw as comments
# (`docs/design/rust-library.md`, "Injections, indentation and text
# objects, as built"). Its indents, folds and locals queries are not used.
#
# Its reparse policy is `incremental`: on 2026-11-17, 6,894 incremental
# reparses of texts without errors, of random edits to the fixtures under
# `tests/syntax/lean/` and to the 20 files of `lean/Editor/` that parse
# without errors, all equalled a fresh parse, and the contract
# (`tests/contract.rs`) passes with the policy `incremental`.
#
# Looked at on 2026-11-17 and set aside:
#
# - `tree-sitter-lean4` 0.3.0, the only Lean grammar crate on crates.io: a
#   normal dependency on `tree-sitter ^0.25`, which cannot coexist with the
#   pinned library (both `links = "tree-sitter"`), an exported
#   `tree_sitter::Language` of 0.25 rather than a `LanguageFn`, a build that
#   runs the tree-sitter CLI when `parser.c` is missing, and no queries.
# - Its source, the fork `wvhulle/tree-sitter-lean`, vendored instead: it
#   parses this repository's Lean with fewer errors, but has no licence file
#   to vendor (MIT is only declared), no commits since May 2026, and a Rust
#   binding for tree-sitter 0.25, so we would keep an `unsafe` one of our
#   own.
# - A git dependency on upstream: it would make a fetch from GitHub part of
#   a `--locked` build.
tree-sitter-lean = { path = "../../vendor/tree-sitter-lean", version = "=0.2.0" }

[dev-dependencies]
# The stopwatch the `round` example times a parse with.
editor-wait = { path = "../editor-wait" }

[lints]
workspace = true
