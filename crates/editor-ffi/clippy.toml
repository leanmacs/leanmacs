# What no line of `editor-ffi` may name, its tests included, but for the
# places marked below: a real file, a directory of the machine, a process,
# or the file port's real adapter; and a renderer on a window, the
# machine's fonts and the desktop's clipboard. The file service (`src/files.rs`) reaches
# a file system only through the port `editor_text::fs::Fs`, and its unit
# tests run on the port's published fake.
#
# Clippy reads the first `clippy.toml` it finds from a package's manifest
# directory upwards, so this file governs every target of this crate and no
# other. `disallowed_methods` and `disallowed_types` are on by default at
# `warn`, and `mise run lint` denies warnings.
#
# There are no clock entries of its own, as `editor-text`'s list has: this
# crate holds the real clock (`timers::Monotonic`) and the window's input
# clock. The timed waits' block, which every config holds (the root
# `clippy.toml` says why), bans `Instant::now` here too, and those two
# clocks and the timer thread's park are marked with an `#[expect]`.
#
# Two places are marked, each with `#[expect(clippy::disallowed_methods,
# reason = ..)]`, and they are the whole list of where this crate may reach
# a real file:
#
# - the static `FILES` in `src/files.rs`, the process's file service, which
#   is over the real file system;
# - the head of `tests/files.rs`, the wiring test, which writes and reads a
#   temporary directory it owns with `std::fs`.
#
# Each mark is an `expect` and not an `allow`, so a mark that stops being
# needed is itself an error.
#
# Seen to bite once by hand, on 2026-11-13, twice: with a unit test added to
# `src/files.rs` that builds `Files::new(StdFs::system())`, `mise run lint`
# fails with "use of a disallowed method `editor_fs_std::StdFs::system`";
# and with one that calls `std::fs::write`, with "use of a disallowed method
# `std::fs::write`".
#
# A third place is marked, for another thing no test may do: make a
# renderer on a window. `editor_render_wgpu::WgpuRenderer::on_window` is on
# the list, since it needs a window and a real adapter and the gate has
# neither. It has three callers, each under its own `expect`:
#
# - `window_renderer` in `src/window.rs`, the factory of the process's
#   window, which Lean's window mode runs on the winit platform;
# - `renderer` in the example `examples/window/ledger.rs`: the window that
#   draws, run on demand
#   (`mise run linux-window`, `mise run window-contract`);
# - `check` in the example `examples/layer/main.rs`: the Metal layer of a
#   renderer on the window, read on demand (`mise run window-layer`).
#   `window_renderer` is private and gives a `WindowRenderer`, which has no
#   `layer()`, so the example makes its own.
#
# No test runs the winit platform: the crate's tests of the session and of
# the window run on `editor-render`'s recording renderer, on the scripted
# platforms. Seen to bite once by hand, on 2026-11-14: with the example's
# `expect` taken off, `mise run lint` fails with "use of a disallowed
# method `editor_render_wgpu::WgpuRenderer::on_window`"; and with the entry
# not yet on the list, it failed on the `expect` itself ("this lint
# expectation is unfulfilled"). And again on 2026-11-15, for the window's:
# with its `expect` taken off, `mise run lint` fails with "use of a
# disallowed method `editor_render_wgpu::WgpuRenderer::on_window`". And on
# 2026-11-20, for the layer example's: with its `expect` taken off, clippy
# over the example fails with "use of a disallowed method
# `editor_render_wgpu::WgpuRenderer::on_window`".
#
# A fourth place is marked, for the fonts of the machine:
# `editor_shape_parley::FontSet::system` is on the list, as it is on that
# crate's own, since what it holds differs from machine to machine. It has
# two callers here, each under its own `expect`:
#
# - `editor_ffi_display_new_system` in `src/display.rs`, the process's
#   display, made for Lean's window mode, which lays out in the machine's
#   fonts;
# - `fonts` in `examples/window/scene.rs`, reached only when a run gives
#   `--family <name>` to lay the fixture out in a family of this machine's
#   fonts (`docs/dev-practices/on-demand-checks.md`, "The window to try, on
#   demand").
#
# No test calls either: every test, and every other run of the example,
# `linux-window`'s and `window-contract`'s among them, is on the fixture
# fonts or the fake shaper. Seen to bite once by hand, on 2026-11-14: with
# the example's `expect` taken off, `mise run lint`'s clippy fails with
# "use of a disallowed method `editor_shape_parley::FontSet::system`"; and
# with the entry not yet on the list, it failed on the `expect` itself
# ("this lint expectation is unfulfilled"). And again on 2026-11-15, for
# the display's: with its `expect` taken off, `mise run lint` fails with
# "use of a disallowed method `editor_shape_parley::FontSet::system`".
#
# A fifth place is marked, for the desktop's clipboard:
# `editor_platform_arboard::SystemClipboard::open` is on the list, since
# what it reads and writes is the desktop's, which no test may touch. Its
# one caller here is `editor_ffi_clipboard_system` in `src/clipboard.rs`,
# the process's clipboard, made for Lean's window mode, under its own
# `expect`. Every test is on the port's `MemoryClipboard`
# (`editor_ffi_clipboard_memory`). Seen to bite once by hand, on
# 2026-11-15, twice: with the entry not yet on the list, `mise run lint`
# failed on the `expect` itself ("this lint expectation is unfulfilled");
# and with the `expect` taken off, it fails with "use of a disallowed
# method `editor_platform_arboard::SystemClipboard::open`".
#
# Another place is marked, for the user's font-smoothing preference:
# `editor_raster_coretext::SystemDefaults::new` is on the list, since what
# it reads is this machine's and this user's. Its one caller here is
# `core_text` in `src/window.rs`, under its own `expect`, which the
# process's window and the example `window` both reach on macOS. No test
# calls it: the choice of rasteriser is the pure `window_rasteriser`,
# tested in the gate. Seen to bite once by hand, on 2026-11-20: with the
# `expect` taken off, `mise run lint` fails with "use of a disallowed
# method `editor_raster_coretext::SystemDefaults::new`".
#
# A sixth place is marked, for real processes:
# `editor_process_std::StdProcesses::system` is on the list. Its one caller
# is the static `PROCESSES` in `src/processes.rs`, the process's process
# service, under its own `expect`. The unit tests there run on the port's
# fake, `editor_process::fake::FakeProcesses`. The wiring tests,
# `tests/processes.rs` and `tests/processes_shutdown.rs`, start real
# processes only through the C functions, so neither names the adapter and
# neither has an `expect` for it; `tests/processes_shutdown.rs` has one, on
# the one function that reads the ids its children wrote with
# `std::fs::read_to_string`. `std::process::Command::new` stays on the
# list: this crate itself starts no process. Seen to bite once by hand, on
# 2026-11-15, twice: with the entry not yet on the list, `mise run lint`
# failed on the static's `expect` ("this lint expectation is
# unfulfilled"); and with the `expect` taken off, it fails with "use of a
# disallowed method `editor_process_std::StdProcesses::system`".
#
# A seventh place is marked, for the real watch:
# `editor_watch_notify::NotifyWatch::system` is on the list. Its one caller
# is the static `WATCHES` in `src/watches.rs`, the process's watch service,
# under its own `expect`. The unit tests there run on the port's fake,
# `editor_watch::fake::FakeWatch`. The wiring tests, `tests/watches.rs` and
# `tests/watches_shutdown.rs`, watch real files only through the C
# functions, so neither names the adapter; each has one `expect`, on the
# one function that writes a file of the temporary directory it owns with
# `std::fs`. Seen to bite once by hand, on 2026-11-15, twice: with the
# entry not yet on the list, `mise run lint` failed on the static's
# `expect` ("this lint expectation is unfulfilled"); and with the `expect`
# taken off, it fails with "use of a disallowed method
# `editor_watch_notify::NotifyWatch::system`".
#
# An eighth place is marked, for project search's real files:
# `editor_grep_ripgrep::RipgrepFiles::new` is on the list. Its one caller
# is the static `GREP` in `src/grep.rs`, the process's grep service, under
# its own `expect`. The unit tests there run on the port's fake,
# `editor_grep::fake::FakeFiles`, and Lean's `ffi-test` reaches real files
# only through the C functions. Seen to bite once by hand, on 2026-11-19:
# with a unit test added to `src/grep.rs` that calls the constructor,
# `mise run lint` fails with "use of a disallowed method
# `editor_grep_ripgrep::RipgrepFiles::new`".
#
# A ninth place is marked, for this machine's GPU:
# `editor_render_wgpu::WgpuRenderer::on_this_machine` is on the list, as it
# is on that crate's own, since what it finds differs from machine to
# machine. Its one caller here is `gpu` in the example
# `examples/coretext/main.rs`, the composited sentence against Core Text's,
# run on demand on macOS (`mise run coretext-check`), under its own
# `expect`. No test calls it.
#
# What this does not hold is what `crates/editor-text/clippy.toml` says of
# its own list: it is a list of names.

disallowed-methods = [
  # BEGIN wait-bans: the root `clippy.toml` owns this block and says why;
  # each `crates/*/clippy.toml` holds a copy that `tools/wait-bans.sh`
  # writes from it. Edit it in the root only.
  #
  # The timed waits: a test's bound is an `editor_wait::HangGuard` or
  # `editor_wait::RealTime`, and its wait goes through `editor-wait`.
  { path = "std::thread::sleep", reason = "a test's sleep is `editor_wait::RealTime::sleep`, which names the timing under test; real-clock code says why at an `#[expect]`" },
  { path = "std::thread::sleep_ms", reason = "a test's sleep is `editor_wait::RealTime::sleep`, which names the timing under test" },
  { path = "std::thread::park_timeout", reason = "wait on the event itself, bounded by an `editor_wait::HangGuard`, not on a timed park" },
  { path = "std::thread::park_timeout_ms", reason = "wait on the event itself, bounded by an `editor_wait::HangGuard`, not on a timed park" },
  { path = "std::thread::yield_now", reason = "a yield hopes for a schedule: wait on the event itself (`editor_wait`)" },
  { path = "std::sync::mpsc::Receiver::recv_timeout", reason = "a bounded receive is `editor_wait::recv`, whose bound is an `editor_wait::HangGuard` naming the event" },
  { path = "std::sync::Condvar::wait_timeout", reason = "a bounded Condvar wait is `editor_wait::wait_while`, whose bound is an `editor_wait::HangGuard` naming the event" },
  { path = "std::sync::Condvar::wait_timeout_ms", reason = "a bounded Condvar wait is `editor_wait::wait_while`, whose bound is an `editor_wait::HangGuard` naming the event" },
  { path = "std::sync::Condvar::wait_timeout_while", reason = "a bounded Condvar wait is `editor_wait::wait_while`, whose bound is an `editor_wait::HangGuard` naming the event" },
  { path = "std::thread::JoinHandle::is_finished", reason = "asking whether a thread has ended is a poll: join it, or wait on a channel it drops with `editor_wait::recv`" },
  { path = "std::process::Child::try_wait", reason = "asking whether a child has exited is a poll: wait on its exit, bounded by an `editor_wait::HangGuard`" },
  { path = "std::time::Instant::now", reason = "a deadline is `editor_wait::HangGuard::start` or `deadline`, and a timing measured is an `editor_wait::Stopwatch`; real-clock code says why at an `#[expect]`" },
  # The readouts a test waits on, each a `HangGuard` wait of its owner's
  # that a crate other than its owner can call. `allow-invalid`: a crate
  # that does not reach the owner cannot resolve the path; a wrong one
  # leaves an `#[expect]` at its sites unfulfilled, and the fixture's call
  # unrefused.
  { path = "editor_service::queue::Queue::await_waiting", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_service::service::RecordingCompleter::wait_for", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_platform::scripted::ScriptedPlatform::wait_parked", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_process::service::Service::wait_held", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_platform_winit::probe::await_requests_handled", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_render::render_loop::RenderHandle::wait_resting", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_syntax::session::Session::wait_for", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_syntax::session::Session::wait_exact", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_grep::service::Service::until_held_back", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_ffi::syntax::Syntaxes::settle", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_ffi::syntax::Syntaxes::settle_exact", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  # END wait-bans
  # The readouts only this crate can call, so not in the block: the root
  # `clippy.toml` says why. Each is banned outside its own tests and the C
  # function Lean calls, at an `#[expect]`.
  { path = "editor_ffi::live::Live::await_at_most", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_ffi::events::Feeds::join", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  # The file port's real adapter.
  { path = "editor_fs_std::StdFs::system", reason = "the real file system is made in one place, the process's file service; everything else here takes an `Fs`, and a test hands it `FakeFs`" },
  # The process port's real adapter.
  { path = "editor_process_std::StdProcesses::system", reason = "real processes are started in one place, the process's process service; its unit tests run on `FakeProcesses`, and the wiring tests reach real processes only through the C functions" },
  # The watch port's real adapter.
  { path = "editor_watch_notify::NotifyWatch::system", reason = "real files are watched in one place, the process's watch service; its unit tests run on `FakeWatch`, and the wiring tests reach a real watch only through the C functions" },
  # The files port's real adapter, for project search.
  { path = "editor_grep_ripgrep::RipgrepFiles::new", reason = "real files are searched in one place, the process's grep service; its unit tests run on `FakeFiles`, and the wiring tests reach real files only through the C functions" },
  # The desktop's clipboard: what it holds is the person's.
  { path = "editor_platform_arboard::SystemClipboard::open", reason = "no test reads or writes the desktop's clipboard: the process's clipboard is opened in one place, for Lean's window mode; every test is on `MemoryClipboard`" },
  # A renderer on a window: it needs a window, and a real adapter.
  { path = "editor_render_wgpu::WgpuRenderer::on_window", reason = "no test makes a renderer on a window: the gate opens none; it is done for the process's window, which Lean's window mode runs (`window_renderer`), in the example `window`, and in the example `layer`, which reads its Metal layer" },
  # A renderer on this machine's GPU: what it finds differs from machine to machine.
  { path = "editor_render_wgpu::WgpuRenderer::on_this_machine", reason = "no test asks for this machine's GPU: the example `coretext` does, in one place, run on demand on macOS" },
  # The user's font smoothing: it differs from machine to machine.
  { path = "editor_raster_coretext::SystemDefaults::new", allow-invalid = true, reason = "no test reads this machine's defaults: a window's Core Text rasteriser reads them in one place (`core_text` in `src/window.rs`), on macOS, for the process's window and the example `window`" },
  # The fonts of the machine: they differ from machine to machine.
  { path = "editor_shape_parley::FontSet::system", reason = "no test reads the machine's fonts: the process's display, made for Lean's window mode, does in one place (`editor_ffi_display_new_system`), and the example `window` in one place, when a person asks for a family of them (`--family`); every test is on the fixture fonts or the fake shaper" },
  # Every free function of `std::fs`.
  { path = "std::fs::canonicalize", reason = "files are reached through the `Fs` port" },
  { path = "std::fs::copy", reason = "files are reached through the `Fs` port" },
  { path = "std::fs::create_dir", reason = "files are reached through the `Fs` port; a test builds a `FakeFs`" },
  { path = "std::fs::create_dir_all", reason = "files are reached through the `Fs` port; a test builds a `FakeFs`" },
  { path = "std::fs::exists", reason = "files are reached through the `Fs` port" },
  { path = "std::fs::hard_link", reason = "files are reached through the `Fs` port" },
  { path = "std::fs::metadata", reason = "files are reached through the `Fs` port" },
  { path = "std::fs::read", reason = "files are reached through the `Fs` port" },
  { path = "std::fs::read_dir", reason = "files are reached through the `Fs` port" },
  { path = "std::fs::read_link", reason = "files are reached through the `Fs` port" },
  { path = "std::fs::read_to_string", reason = "files are reached through the `Fs` port" },
  { path = "std::fs::remove_dir", reason = "files are reached through the `Fs` port" },
  { path = "std::fs::remove_dir_all", reason = "files are reached through the `Fs` port" },
  { path = "std::fs::remove_file", reason = "files are reached through the `Fs` port" },
  { path = "std::fs::rename", reason = "files are reached through the `Fs` port" },
  { path = "std::fs::set_permissions", reason = "files are reached through the `Fs` port" },
  { path = "std::fs::symlink_metadata", reason = "files are reached through the `Fs` port" },
  { path = "std::fs::write", reason = "files are reached through the `Fs` port; a test builds a `FakeFs`" },
  # The methods of `Path` that ask the disk.
  { path = "std::path::Path::canonicalize", reason = "the disk is asked through the `Fs` port" },
  { path = "std::path::Path::exists", reason = "the disk is asked through the `Fs` port" },
  { path = "std::path::Path::is_dir", reason = "the disk is asked through the `Fs` port" },
  { path = "std::path::Path::is_file", reason = "the disk is asked through the `Fs` port" },
  { path = "std::path::Path::is_symlink", reason = "the disk is asked through the `Fs` port" },
  { path = "std::path::Path::metadata", reason = "the disk is asked through the `Fs` port" },
  { path = "std::path::Path::read_dir", reason = "the disk is asked through the `Fs` port" },
  { path = "std::path::Path::read_link", reason = "the disk is asked through the `Fs` port" },
  { path = "std::path::Path::symlink_metadata", reason = "the disk is asked through the `Fs` port" },
  { path = "std::path::Path::try_exists", reason = "the disk is asked through the `Fs` port" },
  # The directories of the machine.
  { path = "std::env::current_dir", reason = "the library has no working directory: a path that is not absolute is refused" },
  { path = "std::env::set_current_dir", reason = "the library has no working directory, and a test leaves the process's as it found it" },
  { path = "std::env::temp_dir", reason = "a test that needs real files makes a directory of its own with `tempfile`, and only the wiring test does" },
  # Processes.
  { path = "std::process::Command::new", reason = "the crate starts no process" },
]

disallowed-types = [
  { path = "std::fs::File", reason = "files are reached through the `Fs` port" },
  { path = "std::fs::OpenOptions", reason = "files are reached through the `Fs` port" },
  { path = "std::fs::DirBuilder", reason = "files are reached through the `Fs` port" },
  { path = "std::fs::ReadDir", reason = "files are reached through the `Fs` port" },
  { path = "std::fs::DirEntry", reason = "files are reached through the `Fs` port" },
]
