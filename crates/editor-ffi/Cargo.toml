[package]
name = "editor-ffi"
version = "0.1.0"
description = "The C functions the Lean editor binds to"
edition.workspace = true
license.workspace = true
publish = false

[lib]
# `staticlib` is what Lake links into the Lean executables. `rlib` is only so
# the integration tests under `tests/` can link the crate.
crate-type = ["staticlib", "rlib"]

[dependencies]
# The window port, its fake and its contract.
editor-platform = { path = "../editor-platform" }
# The real window. This is the crate that wires the library together, so it
# is the one that links the adapter.
editor-platform-winit = { path = "../editor-platform-winit" }
# The real clipboard, for the same reason: Lean's window mode opens the
# desktop's clipboard through it (`editor_ffi_clipboard_system`), and
# every test is on the port's memory clipboard. Through it the static
# library Lean links holds arboard. `clippy.toml` marks the one call that
# opens it; `deny.toml` lets no other crate depend on it.
editor-platform-arboard = { path = "../editor-platform-arboard" }
# Text storage: the text behind a document handle, and its snapshots; and
# the file port, with loading and saving over it.
editor-text = { path = "../editor-text" }
# Layout: the display handle lays scenes out and answers the layout
# queries with it, over its published fake shaper for the headless mode
# and the gate, and over the real shaper in a window.
editor-layout = { path = "../editor-layout" }
# The real shaper: the display Lean's window mode makes lays out over it,
# in the machine's fonts (`editor_ffi_display_new_system`); and the display
# tests make over one font file they are given, with no font of the
# machine (`editor_ffi_display_new_font`), which Lean's `ffi-test` draws
# the shipped themes' pictures with. Through it the static library Lean
# links holds Parley. No test here calls the system constructor;
# `clippy.toml` marks its one call of the machine's fonts. `deny.toml`
# lists this crate among its wrappers.
editor-shape-parley = { path = "../editor-shape-parley" }
# The render loop: this is the crate that starts the render thread, turns
# what a window tells whatever draws in it into words left with the loop,
# and lends the loop the clock that stamps input (`src/render.rs`). It
# brings the `Renderer` port and its fakes, and no drawing library.
editor-render = { path = "../editor-render" }
# The renderer's real adapters: the CPU renderer the headless mode's render
# session draws with (`editor_ffi_render_headless_start`), which needs no
# GPU and runs in the gate, and the wgpu renderer a window draws with. The
# CPU renderer also draws a display's picture synchronously, for tests
# (`editor_ffi_display_picture`), and its crate reads and writes a picture
# as a PNG file (`editor_ffi_picture_from_png`,
# `editor_ffi_picture_to_png`), so Lean's `ffi-test` can compare the
# shipped themes' pictures with their reference images. Through it the
# static library Lean links holds wgpu and png. No test here makes a
# renderer on a window; `clippy.toml` forbids its window constructor to
# them. It is also the example `window`'s. `deny.toml` lists this crate
# among its wrappers.
editor-render-wgpu = { path = "../editor-render-wgpu" }
# The real file system, for the process's file service. This is the crate
# that wires the library together, so it is the one that links the adapter;
# `clippy.toml` here keeps the adapter out of everything but that one static
# and the wiring test.
editor-fs-std = { path = "../editor-fs-std" }
# Fuzzy matching: the ranking rule and the locating rule, which the two C
# functions of `src/fuzzy.rs` ask, and the Scorer and Searcher ports they
# ask them over.
editor-fuzzy = { path = "../editor-fuzzy" }
# The real scorer. This is the crate that wires the library together, so
# it is the one that links the adapter: that C function makes one for each
# call. Through it the static library Lean links holds nucleo-matcher,
# which has no system dependency.
editor-fuzzy-nucleo = { path = "../editor-fuzzy-nucleo" }
# The real searcher, for the same reason: the C function that locates a
# pattern makes one for each call. Through it the static library Lean
# links holds triple_accel, which has no system dependency.
editor-fuzzy-triple-accel = { path = "../editor-fuzzy-triple-accel" }
# Syntax trees: the Syntax port, the rule for a query's captures in a
# range, and the session and worker that reparse a document from its edit
# log, which the C functions of `src/syntax.rs` forward to.
editor-syntax = { path = "../editor-syntax" }
# The real syntax: tree-sitter, with its grammars compiled in. This is the
# crate that wires the library together, so it is the one that links the
# adapter: the syntax service parses with it. Through it the static library
# Lean links holds tree-sitter and the grammars' parsers, compiled C with
# no system dependency.
editor-syntax-treesitter = { path = "../editor-syntax-treesitter" }
# Search within a text: the rule of which match is answered, which the two
# C functions of `src/search.rs` ask, and the Engine port it asks it over.
editor-search = { path = "../editor-search" }
# The real engine. This is the crate that wires the library together, so it
# is the one that links the adapter: each of those C functions makes one for
# its call. Through it the static library Lean links holds regex-cursor,
# which has no system dependency.
editor-search-regex = { path = "../editor-search-regex" }
# A line diff of two texts as an edit script: the script a reload applies,
# which the diff service of `src/diffs.rs` makes and
# `editor_ffi_document_apply_script` applies, and the LineDiff port the
# script is made over.
editor-diff = { path = "../editor-diff" }
# The real line diff engine. This is the crate that wires the library
# together, so it is the one that links the adapter: the diff service makes
# one for each request. Through it the static library Lean links holds
# imara-diff, which has no system dependency.
editor-diff-imara = { path = "../editor-diff-imara" }
# The process service: the Processes port, its fake, and the service that
# runs a command to its end, cancels it and shuts down, which the C
# functions of `src/processes.rs` forward to.
editor-process = { path = "../editor-process" }
# The real processes, for the process's process service. This is the crate
# that wires the library together, so it is the one that links the adapter;
# `clippy.toml` here keeps the adapter out of everything but that one
# static. Through it the static library Lean links holds rustix.
editor-process-std = { path = "../editor-process-std" }
# The watch service: the Watch port, its fake and its contract, the
# coalescing rule, and the service that owns every watch, which the C
# functions of `src/watches.rs` forward to.
editor-watch = { path = "../editor-watch" }
# The real watch, for the process's watch service. This is the crate that
# wires the library together, so it is the one that links the adapter;
# `clippy.toml` here keeps the adapter out of everything but that one
# static. Through it the static library Lean links holds notify.
editor-watch-notify = { path = "../editor-watch-notify" }
# The grep service: the Files port, its fake and its contract, the rule of
# a project search, and the service that owns each search, which the C
# functions of `src/grep.rs` forward to.
editor-grep = { path = "../editor-grep" }
# The real files, walked and read with ripgrep's libraries, for the
# process's grep service. This is the crate that wires the library
# together, so it is the one that links the adapter; `clippy.toml` here
# keeps the adapter out of everything but that one static. Through it the
# static library Lean links holds ignore and grep-searcher, which have no
# system dependency.
editor-grep-ripgrep = { path = "../editor-grep-ripgrep" }

[dev-dependencies]
# The temporary directory the wiring test (`tests/files.rs`) owns: the one
# test here that touches real files. Pinned exactly, as in `editor-fs-std`,
# whose manifest says why this library and no other; `deny.toml` lists the
# two crates that may depend on it.
tempfile = { version = "=3.27.0", default-features = false }
# Whether a process is alive, `kill(pid, 0)`, for the process service's
# shutdown test (`tests/processes_shutdown.rs`), which asks the system
# directly and not through the adapter. Pinned exactly, as in
# `editor-process-std`, whose manifest says why this library and not
# `libc`.
rustix = { version = "=1.1.6", default-features = false, features = ["std", "process"] }

# The window that draws is an example, run on demand. What it makes of
# what it saw is tested in the gate all the same: `cargo test` runs the
# example's own unit tests, which read a command line and judge what was
# found of a picture. They open no window and make no renderer: their
# binary links what the example links, and they name none of it.
[[example]]
name = "window"
test = true

# No harness: its `main` must be the process's main thread.
[[test]]
name = "main_thread"
harness = false
