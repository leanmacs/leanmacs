[package]
name = "editor-ffi"
version = "0.1.0"
description = "The C functions the Lean editor binds to"
edition.workspace = true
license.workspace = true
publish = false

[lib]
# `staticlib` is what Lake links into the Lean executables. `rlib` is only so
# the integration tests under `tests/` can link the crate.
crate-type = ["staticlib", "rlib"]

[dependencies]
# The window port, its fake and its contract.
editor-platform = { path = "../editor-platform" }
# The real window. This is the crate that wires the library together, so it
# is the one that links the adapter.
editor-platform-winit = { path = "../editor-platform-winit" }
# Text storage: the text behind a document handle, and its snapshots; and
# the file port, with loading and saving over it.
editor-text = { path = "../editor-text" }
# Layout: the display handle lays scenes out and answers the layout
# queries with it, over its published fake shaper for the headless mode
# and the gate, and over the real shaper in a window.
editor-layout = { path = "../editor-layout" }
# The real shaper: the display Lean's window mode makes lays out over it,
# in the machine's fonts (`editor_ffi_display_new_system`). Through it the
# static library Lean links holds Parley. No test here calls that
# constructor; `clippy.toml` marks its one call of the machine's fonts.
# `deny.toml` lists this crate among its wrappers.
editor-shape-parley = { path = "../editor-shape-parley" }
# The render loop: this is the crate that starts the render thread, turns
# what a window tells whatever draws in it into words left with the loop,
# and lends the loop the clock that stamps input (`src/render.rs`). It
# brings the `Renderer` port and its fakes, and no drawing library.
editor-render = { path = "../editor-render" }
# The renderer's real adapters: the CPU renderer the headless mode's render
# session draws with (`editor_ffi_render_headless_start`), which needs no
# GPU and runs in the gate, and the wgpu renderer a window draws with.
# Through it the static library Lean links holds wgpu. No test here makes
# a renderer on a window; `clippy.toml` forbids its window constructor to
# them. It is also the example `window`'s. `deny.toml` lists this crate
# among its wrappers.
editor-render-wgpu = { path = "../editor-render-wgpu" }
# The real file system, for the process's file service. This is the crate
# that wires the library together, so it is the one that links the adapter;
# `clippy.toml` here keeps the adapter out of everything but that one static
# and the wiring test.
editor-fs-std = { path = "../editor-fs-std" }
# Fuzzy matching: the ranking rule, which the one C function of
# `src/fuzzy.rs` asks, and the Scorer port it asks it over.
editor-fuzzy = { path = "../editor-fuzzy" }
# The real scorer. This is the crate that wires the library together, so
# it is the one that links the adapter: that C function makes one for each
# call. Through it the static library Lean links holds nucleo-matcher,
# which has no system dependency.
editor-fuzzy-nucleo = { path = "../editor-fuzzy-nucleo" }

[dev-dependencies]
# The temporary directory the wiring test (`tests/files.rs`) owns: the one
# test here that touches real files. Pinned exactly, as in `editor-fs-std`,
# whose manifest says why this library and no other; `deny.toml` lists the
# two crates that may depend on it.
tempfile = { version = "=3.27.0", default-features = false }

# The window that draws is an example, run on demand. What it makes of
# what it saw is tested in the gate all the same: `cargo test` runs the
# example's own unit tests, which read a command line and judge what was
# found of a picture. They open no window and make no renderer: their
# binary links what the example links, and they name none of it.
[[example]]
name = "window"
test = true

# No harness: its `main` must be the process's main thread.
[[test]]
name = "main_thread"
harness = false
