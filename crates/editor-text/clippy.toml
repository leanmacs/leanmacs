# What no line of `editor-text` may name, its tests included: a real file, a
# directory of the machine, a process or a clock. The crate reaches a file
# system only through the `Fs` port it defines (`src/fs.rs`), and time
# reaches it only through `Fs::stat`. Its tests run on the published fake,
# `fs::FakeFs`.
#
# Clippy reads the first `clippy.toml` it finds from a package's manifest
# directory upwards, and the workspace root's (`/clippy.toml`) is read only
# by a crate with none of its own. So this file governs
# every target of this crate (the library, its unit tests, `tests/properties`
# and `tests/snapshot_cost.rs`) and no other crate: the port's adapter,
# `editor-fs-std`, calls `std::fs` freely. `disallowed_methods` and
# `disallowed_types` are on by default at `warn`, and `mise run lint` denies
# warnings, so a line that names one of these fails the gate. The lint reads
# the path the compiler resolved, not the text: `use std::fs as f;
# f::read(..)` is caught too.
#
# Seen to bite once by hand, on 2026-11-13: with a test added to
# `src/bytes.rs` that calls `std::fs::read("/nonexistent")`, `mise run lint`
# fails with "error: use of a disallowed method `std::fs::read`" and the
# reason below. With the test taken out it passes.
#
# The last entry names the port's real adapter, a crate this one does not
# depend on. Clippy takes a path into a crate that is not in the build
# without a warning, and the entry is then idle. Seen to bite once by hand,
# on 2026-11-13: with `editor-fs-std` added to this crate's
# dev-dependencies (Cargo allows that cycle) and a test added to
# `tests/snapshot_cost.rs` that calls `editor_fs_std::StdFs::system()`,
# `cargo clippy --workspace --all-targets -- -D warnings` fails with "use of
# a disallowed method `editor_fs_std::StdFs::system`". A unit test in `src/`
# cannot hand the adapter to this crate's code at all: there the adapter
# implements the `Fs` of the crate as its dependency built it, which is
# another type than the `Fs` of the crate under test, and it does not
# compile.
#
# What this does not hold: it is a list of names, so a function `std` gains
# later is not in it, and neither are `std::net`, the free functions of
# `std::os::unix::fs`, `include_bytes!`, or a call through `libc` (which
# this crate does not depend on). Those are a reviewer's to look for.
# `deny.toml` closes the other route: this crate may not depend on a
# library that makes temporary files, nor, once `editor-ffi` links the
# adapter and the entry that allows that edge exists, on the adapter.

disallowed-methods = [
  # BEGIN wait-bans: the root `clippy.toml` owns this block and says why;
  # each `crates/*/clippy.toml` holds a copy that `tools/wait-bans.sh`
  # writes from it. Edit it in the root only.
  #
  # The timed waits: a test's bound is an `editor_wait::HangGuard` or
  # `editor_wait::RealTime`, and its wait goes through `editor-wait`.
  { path = "std::thread::sleep", reason = "a test's sleep is `editor_wait::RealTime::sleep`, which names the timing under test; real-clock code says why at an `#[expect]`" },
  { path = "std::thread::sleep_ms", reason = "a test's sleep is `editor_wait::RealTime::sleep`, which names the timing under test" },
  { path = "std::thread::park_timeout", reason = "wait on the event itself, bounded by an `editor_wait::HangGuard`, not on a timed park" },
  { path = "std::thread::park_timeout_ms", reason = "wait on the event itself, bounded by an `editor_wait::HangGuard`, not on a timed park" },
  { path = "std::thread::yield_now", reason = "a yield hopes for a schedule: wait on the event itself (`editor_wait`)" },
  { path = "std::sync::mpsc::Receiver::recv_timeout", reason = "a bounded receive is `editor_wait::recv`, whose bound is an `editor_wait::HangGuard` naming the event" },
  { path = "std::sync::Condvar::wait_timeout", reason = "a bounded Condvar wait is `editor_wait::wait_while`, whose bound is an `editor_wait::HangGuard` naming the event" },
  { path = "std::sync::Condvar::wait_timeout_ms", reason = "a bounded Condvar wait is `editor_wait::wait_while`, whose bound is an `editor_wait::HangGuard` naming the event" },
  { path = "std::sync::Condvar::wait_timeout_while", reason = "a bounded Condvar wait is `editor_wait::wait_while`, whose bound is an `editor_wait::HangGuard` naming the event" },
  { path = "std::thread::JoinHandle::is_finished", reason = "asking whether a thread has ended is a poll: join it, or wait on a channel it drops with `editor_wait::recv`" },
  { path = "std::process::Child::try_wait", reason = "asking whether a child has exited is a poll: wait on its exit, bounded by an `editor_wait::HangGuard`" },
  { path = "std::time::Instant::now", reason = "a deadline is `editor_wait::HangGuard::start` or `deadline`, and a timing measured is an `editor_wait::Stopwatch`; real-clock code says why at an `#[expect]`" },
  # The readouts a test waits on, each a `HangGuard` wait of its owner's
  # that a crate other than its owner can call. `allow-invalid`: a crate
  # that does not reach the owner cannot resolve the path; a wrong one
  # leaves an `#[expect]` at its sites unfulfilled, and the fixture's call
  # unrefused.
  { path = "editor_service::queue::Queue::await_waiting", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_service::service::RecordingCompleter::wait_for", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_platform::scripted::ScriptedPlatform::wait_parked", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_process::service::Service::wait_held", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_platform_winit::probe::await_requests_handled", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_render::render_loop::RenderHandle::wait_resting", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_syntax::session::Session::wait_for", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_syntax::session::Session::wait_exact", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_grep::service::Service::until_held_back", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_ffi::syntax::Syntaxes::settle", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_ffi::syntax::Syntaxes::settle_exact", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  # END wait-bans
  # Every free function of `std::fs`.
  { path = "std::fs::canonicalize", reason = "files are reached through the `Fs` port (`Fs::resolve`)" },
  { path = "std::fs::copy", reason = "files are reached through the `Fs` port" },
  { path = "std::fs::create_dir", reason = "files are reached through the `Fs` port; a test builds a `FakeFs`" },
  { path = "std::fs::create_dir_all", reason = "files are reached through the `Fs` port; a test builds a `FakeFs`" },
  { path = "std::fs::exists", reason = "files are reached through the `Fs` port (`Fs::stat`)" },
  { path = "std::fs::hard_link", reason = "files are reached through the `Fs` port" },
  { path = "std::fs::metadata", reason = "files are reached through the `Fs` port (`Fs::stat`)" },
  { path = "std::fs::read", reason = "files are reached through the `Fs` port (`Fs::read`)" },
  { path = "std::fs::read_dir", reason = "files are reached through the `Fs` port" },
  { path = "std::fs::read_link", reason = "files are reached through the `Fs` port (`Fs::read_link`)" },
  { path = "std::fs::read_to_string", reason = "files are reached through the `Fs` port (`Fs::read`)" },
  { path = "std::fs::remove_dir", reason = "files are reached through the `Fs` port" },
  { path = "std::fs::remove_dir_all", reason = "files are reached through the `Fs` port" },
  { path = "std::fs::remove_file", reason = "files are reached through the `Fs` port (`Fs::remove`)" },
  { path = "std::fs::rename", reason = "files are reached through the `Fs` port (`Fs::rename`)" },
  { path = "std::fs::set_permissions", reason = "files are reached through the `Fs` port (`Fs::write` takes the permissions)" },
  { path = "std::fs::symlink_metadata", reason = "files are reached through the `Fs` port (`Fs::stat`)" },
  { path = "std::fs::write", reason = "files are reached through the `Fs` port (`Fs::write`)" },
  # The methods of `Path` that ask the disk.
  { path = "std::path::Path::canonicalize", reason = "a path is resolved through the `Fs` port (`Fs::resolve`)" },
  { path = "std::path::Path::exists", reason = "the disk is asked through the `Fs` port (`Fs::stat`)" },
  { path = "std::path::Path::is_dir", reason = "the disk is asked through the `Fs` port (`Fs::stat`)" },
  { path = "std::path::Path::is_file", reason = "the disk is asked through the `Fs` port (`Fs::stat`)" },
  { path = "std::path::Path::is_symlink", reason = "the disk is asked through the `Fs` port" },
  { path = "std::path::Path::metadata", reason = "the disk is asked through the `Fs` port (`Fs::stat`)" },
  { path = "std::path::Path::read_dir", reason = "the disk is asked through the `Fs` port" },
  { path = "std::path::Path::read_link", reason = "a link is read through the `Fs` port (`Fs::read_link`)" },
  { path = "std::path::Path::symlink_metadata", reason = "the disk is asked through the `Fs` port (`Fs::stat`)" },
  { path = "std::path::Path::try_exists", reason = "the disk is asked through the `Fs` port (`Fs::stat`)" },
  # The directories of the machine.
  { path = "std::env::current_dir", reason = "the crate has no working directory: a path that is not absolute is refused" },
  { path = "std::env::set_current_dir", reason = "the crate has no working directory, and a test leaves the process's as it found it" },
  { path = "std::env::temp_dir", reason = "the crate's tests make no real file: they build a `FakeFs`" },
  # Processes.
  { path = "std::process::Command::new", reason = "the crate starts no process" },
  # The clocks.
  { path = "std::time::SystemTime::now", reason = "time reaches the core through `Fs::stat`; the fake's time is the one a test sets" },
  { path = "std::time::Instant::now", reason = "the crate reads no clock; a cost is counted in bytes, never timed" },
  # The port's real adapter, which is another crate. This crate does not
  # depend on it, and Cargo would allow a dev-dependency on it all the same.
  { path = "editor_fs_std::StdFs::system", reason = "the crate's tests run on the fake, `fs::FakeFs`; the real file system is the adapter's own tests' and `editor-ffi`'s wiring test's" },
]

disallowed-types = [
  { path = "std::fs::File", reason = "files are reached through the `Fs` port" },
  { path = "std::fs::OpenOptions", reason = "files are reached through the `Fs` port" },
  { path = "std::fs::DirBuilder", reason = "files are reached through the `Fs` port" },
  { path = "std::fs::ReadDir", reason = "files are reached through the `Fs` port" },
  { path = "std::fs::DirEntry", reason = "files are reached through the `Fs` port" },
]
