# How cbindgen writes the package runtime's C header from
# `crates/editor-package-runtime/src/lib.rs` (`build.rs`). The names are
# namespaced for C, where there are no modules: each type gains `Editor`,
# and each constant `EDITOR_PACKAGE_`. The definitions export no function,
# so every type is listed in `[export] include` to be written at all. The
# C twin of `runtime_has!`, and the C way to export a library's
# declaration, go after the includes, inside the include guard (a trailer
# would land after it). `DECLARATION_SYMBOL` and `DECLARATION_REQUIRED` are
# not written: cbindgen writes no `&str` constant and evaluates no
# `offset_of!`, and a C library needs neither, since the macro names the
# symbol and fills every member.
language = "C"
cpp_compat = true
include_guard = "EDITOR_PACKAGE_RUNTIME_H"
usize_is_size_t = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
documentation = true
autogen_warning = """
/* Generated by cbindgen from crates/editor-package-runtime/src/lib.rs
 * (crates/editor-package-runtime-header): do not edit. The test
 * the_checked_in_header_is_the_one_cbindgen_generates fails when this file
 * differs from what cbindgen generates; its failure says which file to copy
 * over this one. */"""
after_includes = """

/* Whether the runtime at `runtime` has the member `member`: whether its
 * size, read first, covers the member's end. A library asks it before it
 * calls a member past those it requires (the append-only rule). The Rust
 * twin is `editor_package_runtime::runtime_has!`. */
#define EDITOR_PACKAGE_RUNTIME_HAS(runtime, member)                           \\
  ((runtime)->size >= offsetof(EditorPackageRuntime, member) +                \\
                          sizeof(((const EditorPackageRuntime *)0)->member))

/* Exports the library's declaration, `editor_package_declaration`, beside
 * its init: the package's interface version `interface_version`, and the
 * runtime it needs, the end of `last_member`, the last member of the
 * runtime it calls without asking EDITOR_PACKAGE_RUNTIME_HAS first. Written
 * once, at file scope, in the file that defines `editor_package_init`. The
 * Rust twin is `editor_package::package!`'s `interface N;`. */
#ifdef __cplusplus
#define EDITOR_PACKAGE_DECLARATION_LINKAGE extern "C"
#else
#define EDITOR_PACKAGE_DECLARATION_LINKAGE
#endif
#define EDITOR_PACKAGE_DECLARE(interface_version, last_member)                \\
  EDITOR_PACKAGE_DECLARATION_LINKAGE                                          \\
  __attribute__((visibility("default"))) const EditorPackageDeclaration       \\
      editor_package_declaration = {                                          \\
          sizeof(EditorPackageDeclaration),                                   \\
          offsetof(EditorPackageRuntime, last_member) +                       \\
              sizeof(((const EditorPackageRuntime *)0)->last_member),         \\
          (interface_version)}"""

[export]
include = ["PackageRuntime", "PackageRuntimePrivate", "PackageChild", "RawPull", "RawBuffer", "PackageInit", "PackageDeclaration"]

[export.rename]
"PackageRuntime" = "EditorPackageRuntime"
"PackageRuntimePrivate" = "EditorPackageRuntimePrivate"
"PackageChild" = "EditorPackageChild"
"RawPull" = "EditorRawPull"
"RawBuffer" = "EditorRawBuffer"
"PackageInit" = "EditorPackageInit"
"PackageDeclaration" = "EditorPackageDeclaration"
"INIT_LOADED" = "EDITOR_PACKAGE_INIT_LOADED"
"INIT_RUNTIME_TOO_SMALL" = "EDITOR_PACKAGE_INIT_RUNTIME_TOO_SMALL"
"TAKE_OVER_NO_SERVICE" = "EDITOR_PACKAGE_TAKE_OVER_NO_SERVICE"
"TAKE_OVER_NO_SUCH_CHILD" = "EDITOR_PACKAGE_TAKE_OVER_NO_SUCH_CHILD"
"TAKE_OVER_READ_PENDING" = "EDITOR_PACKAGE_TAKE_OVER_READ_PENDING"
"TAKE_OVER_TAKEN" = "EDITOR_PACKAGE_TAKE_OVER_TAKEN"
"FRAMING_LINES" = "EDITOR_PACKAGE_FRAMING_LINES"
"FRAMING_BYTES" = "EDITOR_PACKAGE_FRAMING_BYTES"
"FRAMING_MESSAGES" = "EDITOR_PACKAGE_FRAMING_MESSAGES"
"END_NONE" = "EDITOR_PACKAGE_END_NONE"
"END_EXITED" = "EDITOR_PACKAGE_END_EXITED"
"END_SIGNALLED" = "EDITOR_PACKAGE_END_SIGNALLED"
"END_LINE_TOO_LONG" = "EDITOR_PACKAGE_END_LINE_TOO_LONG"
"END_MESSAGE_TOO_LONG" = "EDITOR_PACKAGE_END_MESSAGE_TOO_LONG"
"END_FAILED" = "EDITOR_PACKAGE_END_FAILED"
"STREAM_OUT" = "EDITOR_PACKAGE_STREAM_OUT"
"STREAM_ERR" = "EDITOR_PACKAGE_STREAM_ERR"
