[package]
name = "editor-render-wgpu"
version = "0.1.0"
description = "The Renderer port's real adapters: a glyph atlas and quads of our own, composited on the CPU or drawn with wgpu"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# The port this crate implements, with its fake, its contract check and
# the row cache every back end keeps its rows through. `deny.toml` lists
# this crate among editor-render's wrappers.
editor-render = { path = "../editor-render" }
# The window port, for one type: `NativeWindow`, a window as the system
# knows it, which the window adapter fills and this crate makes a surface
# from. Nothing else of the port is used: this crate runs no window and
# hears nothing a window says. `deny.toml` lists this crate among
# editor-platform's wrappers.
editor-platform = { path = "../editor-platform" }
# The frame a renderer draws, as plain data. `deny.toml` lists this crate
# among editor-layout's wrappers.
editor-layout = { path = "../editor-layout" }
# Packs glyph images into the pages of the atlas: a shelf allocator that
# gives a rectangle back when its glyph is evicted. Pinned exactly, and
# kept behind one type of this crate (`atlas::Atlas`); `deny.toml` lets no
# other crate depend on it. Checked by reading its manifest and glyphon's
# use of it; first run by this crate's tests.
etagere = "=0.3.0"
# Rasterises a glyph of a font file, by glyph id, at a size, a variation
# and a fraction of a pixel: as a mask, as a subpixel mask with a coverage
# for each colour stripe, or in colour. Pinned exactly, and kept behind
# the private rasteriser trait (`glyphs::Rasterize`); `deny.toml` lets no
# other crate depend on it. It brings a second copy of `skrifa` beside
# Parley's. Checked in a spike on three fixture fonts, on macOS and on
# Linux (`docs/design/rendering-prior-art.md`).
swash = "=0.2.10"
# The GPU, on every platform: the device, the atlas's textures, one
# pipeline of instanced quads and its shader, an offscreen target and its
# read-back. Pinned exactly, with its default features, as winit is; no
# type of it is public here, and `deny.toml` lets no other crate depend
# on it. On Linux it opens Vulkan and EGL at run time, so the build needs
# cargo alone. Checked in a spike on Metal, in the Linux container with
# and without Mesa, and on its no-op back end
# (`docs/design/rendering-prior-art.md`).
wgpu = "=30.0.2"
# Blocks on wgpu's futures: asking for an adapter and a device, taking an
# error scope's answer, and mapping the read-back buffer. Pinned exactly;
# `deny.toml` lets no other crate depend on it.
pollster = "=1.0.1"

[dev-dependencies]
# wgpu's no-op back end, for this crate's own tests and no other build:
# it validates every call and draws nothing, so the gate checks the
# shader, the pipeline and every draw on a machine with no GPU.
wgpu = { version = "=30.0.2", features = ["noop"] }
# Reads the reference image in `tests/reference.rs`, and writes it in the
# example that makes it (`examples/reference.rs`). Pinned exactly; a
# dev-dependency only, so no build of the library links it. `deny.toml`
# lets no other crate depend on it.
png = "=0.18.1"
# The real shaper, for one thing: the fixture frame of real text
# (`tests/common/mod.rs`), which the two tests the port's module docs
# name as wiring lay out, `tests/reference.rs` and `tests/reuse.rs`, and
# which the examples draw. No other test of this crate runs a shaper.
# `deny.toml` lists this crate as its one wrapper.
editor-shape-parley = { path = "../editor-shape-parley" }
