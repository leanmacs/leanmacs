[package]
name = "editor-platform-winit"
version = "0.1.0"
description = "The window port's real adapter, over winit"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
editor-platform = { path = "../editor-platform" }
# Kept behind the port: no winit type is public here, and `deny.toml` lets no
# other crate depend on it. Pinned exactly; 0.31.0-beta.4 (2026-10-24) was
# the newest 0.31 on crates.io on 2026-11-15, and 0.31.0 was not out. Which
# of its features the editor builds is for the display pipeline to decide;
# these are its defaults.
winit = "=0.31.0-beta.4"

[target.'cfg(target_os = "macos")'.dependencies]
# AppKit for two things: the application delegate that receives the files
# the system asks the app to open (src/delegate.rs), and the menu bar the
# editor asks for (src/menu_bar.rs). winit 0.31 registers no delegate and
# leaves this to the application (winit-appkit's crate docs, "Custom
# NSApplicationDelegate"). Pinned exactly, at the versions winit-appkit
# =0.31.0-beta.4 already resolves to, so no crate is added to the graph. The
# features are the bindings the two name. `NSMenu`, `NSMenuItem` and
# `NSEvent` (for `NSEventModifierFlags`) are winit-appkit's already;
# `NSUserDefaults` and `NSUserInterfaceItemIdentification` are the ones it
# does not enable, and each is a module of its crate, not a crate.
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSString", "NSURL", "NSUserDefaults"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSMenu", "NSMenuItem", "NSEvent", "NSUserInterfaceItemIdentification"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# For the contract example alone (examples/contract/terminate.rs and
# menu.rs), which asks the app to terminate as the system does, reads the
# window's title back on the main thread, and performs the menu bar's
# items. Each is already in the resolved graph at this version, through
# winit-appkit, so no crate is added: `dispatch2` for `run_on_main` (its
# `objc2` feature), and the bindings the example names
# (`NSAppleEventDescriptor` and `NSThread`'s `performSelectorOnMainThread:`,
# `NSWindow`'s title, and `NSMenu`'s and `NSMenuItem`'s items).
dispatch2 = { version = "=0.3.1", default-features = false, features = ["std", "objc2"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSThread"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow", "NSMenu", "NSMenuItem"] }
