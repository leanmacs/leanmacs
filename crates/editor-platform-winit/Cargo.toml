[package]
name = "editor-platform-winit"
version = "0.1.0"
description = "The window port's real adapter, over winit"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
editor-platform = { path = "../editor-platform" }
# Kept behind the port: no winit type is public here, and `deny.toml` lets no
# other crate depend on it. Pinned exactly; 0.31.0-beta.4 (2026-10-24) was
# the newest 0.31 on crates.io on 2026-11-15, and 0.31.0 was not out. Which
# of its features the editor builds is for the display pipeline to decide;
# these are its defaults.
winit = "=0.31.0-beta.4"

[target.'cfg(target_os = "macos")'.dependencies]
# AppKit for two things. The first is the application delegate that
# receives the files the system asks the app to open (src/delegate.rs).
# winit 0.31 registers no delegate and leaves this to the application
# (winit-appkit's crate docs, "Custom NSApplicationDelegate"). The second
# is the window's corner clearance, read from its content view's safe-area
# layout region adapted to the corners (src/corner.rs, macOS 26 and later).
# Pinned exactly, at the versions winit-appkit =0.31.0-beta.4 already
# resolves to, so no crate is added to the graph. The features are the
# bindings the two name: `NSUserDefaults` and `NSViewLayoutRegion` are the
# ones winit-appkit does not already enable, and each is a module of its
# crate, not a crate (the `objc2-core-foundation` that `NSViewLayoutRegion`
# enables is in the graph already). `NSView`, and Foundation's `NSGeometry`
# for `NSEdgeInsets`, are enabled by winit-appkit too, and named here for
# the corner's reading.
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSGeometry", "NSString", "NSURL", "NSUserDefaults"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSView", "NSViewLayoutRegion"] }
