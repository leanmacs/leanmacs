# The interface package of the tab commands: the names of the
# commands that open, close, select, rename and move the frame's tabs,
# which the Vim scheme's tab table binds
# (docs/design/extension-points.md, "Three layers"; docs/design/packages.md).
# It declares the keyword `editor-interface`, so a package may import its
# modules, and the layer imports check holds an implementation package to
# importing interface packages and the core alone
# (tools/layer-imports-check.sh). It registers nothing and has no entry
# module, so a set that holds it gains no package from it.
#
# - `TabCommandsApi` is its library: `TabCommandsApi.lean`, the names.
# - `TabCommandsApiTest` holds its fake (`TabCommandsApiTest/Fake.lean`), the contract check every
#   implementation runs (`TabCommandsApiTest/Contract.lean`) and its own tests.
# - `tab-commands-api-test` is its test driver (`lake test`), rooted at
#   `TabCommandsApiTest/Model.lean`.
#
# Every Lean linter is on and a warning fails the build, as in the core,
# and the build's own linters, the wait linters, are loaded as a Lean plugin
# as the core's libraries load them (`plugins`; lean/Lint/Wait.lean).
#
# After changing a `require`, run in lean/:
#   lake -d ../packages/tab-commands-api update --keep-toolchain
# then the same for every set that reaches this package, and commit each
# lake-manifest.json.
name = "tab-commands-api"
keywords = ["editor-interface"]
testDriver = "«tab-commands-api-test»"
defaultTargets = ["TabCommandsApi", "TabCommandsApiTest"]
leanOptions = { linter.all = true, warningAsError = true }
plugins = ["@editor-core/Lint:shared"]

[[require]]
name = "editor-core"
path = "../../lean"

[[lean_lib]]
name = "TabCommandsApi"

[[lean_lib]]
name = "TabCommandsApiTest"
globs = ["TabCommandsApiTest.+"]

[[lean_exe]]
name = "tab-commands-api-test"
root = "TabCommandsApiTest.Model"
