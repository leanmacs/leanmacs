# The interface package of the themes (docs/design/extension-points.md,
# "Three layers"): the contract between the default package `themes`,
# which implements it, and whatever reaches the command that loads a theme
# by name, the default config's `SPC h t` (config/default) among them. It
# declares the name `load-theme` is registered under (`ThemesApi.loadName`),
# as an interface package declares every name another package may reach
# ("Reaches by name"), and registers no behaviour.
#
# It is an interface package: it declares the keyword `editor-interface`
# below, so another package may import its modules, and the three-layer
# rule reads that keyword (.agents/rules/structure.md).
#
# - `ThemesApi` is the package's library: `ThemesApi.lean`, the name.
# - `ThemesApiTest` holds what it publishes for other packages' tests, as
#   the owner of a port publishes its fake and its contract check
#   (AGENTS.md, "Testing with hand-written mocks"):
#   `ThemesApiTest/Fake.lean`, a package that registers every declared
#   name, which a consumer's tests use in place of any implementation; and
#   `ThemesApiTest/Contract.lean`, the check every implementation runs. Its
#   own tests are `ThemesApiTest/ThemesApi.lean`.
# - `themes-api-test` is its test driver (`lake test`), rooted at
#   `ThemesApiTest/Model.lean`. It is no default target, as the core's
#   `model-test` is not: `mise run lean` links with the system compiler,
#   which this executable has no flags for.
#
# Every Lean linter is on and a warning fails the build, as in the core,
# and the build's own linters, the wait linters, are loaded as a Lean plugin
# as the core's libraries load them (`plugins`; lean/Lint/Wait.lean).
#
# After changing a `require`, run in lean/:
#   lake -d ../packages/themes-api update --keep-toolchain
# then the same for every package and set that reaches this package
# (packages/themes, packages/, tests/packages, tests/user-link), and
# commit each lake-manifest.json.
name = "themes-api"
keywords = ["editor-interface"]
testDriver = "«themes-api-test»"
defaultTargets = ["ThemesApi", "ThemesApiTest"]
leanOptions = { linter.all = true, warningAsError = true }
plugins = ["@editor-core/Lint:shared"]

[[require]]
name = "editor-core"
path = "../../lean"

[[lean_lib]]
name = "ThemesApi"

[[lean_lib]]
name = "ThemesApiTest"
globs = ["ThemesApiTest.+"]

[[lean_exe]]
name = "themes-api-test"
root = "ThemesApiTest.Model"
