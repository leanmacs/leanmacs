# The segments of the mode line that ship: a default package, a Lake
# package outside the core that the default package set requires
# (../lakefile.toml; docs/design/packages.md, "The package set and its
# build"). It was a module of the core, `Editor.ModeLine.Compiled`, until
# the features-as-packages roadmap's phase 3. The gate's package steps
# build, test, lint, format-check and run it headless through the fixture
# set, which requires the default set (tools/package-set.sh), and the
# package imports check holds what it imports of the core
# (tools/package-imports-check.sh).
#
# - `ModeLine` is the package's library: `ModeLine/Compiled.lean`, the
#   `Package` value, and its entry module `ModeLine/EditorPackage.lean`,
#   which the package-set build reads. Its `globs` hold every module under
#   `ModeLine`, so the package imports check sees each one's imports. The
#   data it registers, the shipped segments, is the core's
#   (`lean/Editor/ModeLine.lean`): the core's loop lists them by default
#   and its picture draws them.
# - `mode-line-test` is its test driver (`lake test`): the tests that need
#   no Rust library, rooted at `ModeLineTest/Model.lean`. It is no default
#   target, as the core's `model-test` is not: `mise run lean` links with
#   the system compiler, which this executable has no flags for.
# - `ModeLineTest` holds the test modules.
# - `tests/headless/` holds its headless fixture.
#
# Every Lean linter is on and a warning fails the build, as in the core,
# and the build's own linters, the wait linters, are loaded as a Lean plugin
# as the core's libraries load them (`plugins`; lean/Lint/Wait.lean).
#
# It is an implementation package (docs/design/extension-points.md, "Three
# layers"): it declares no `keywords`, so no package may import its modules,
# and the layer imports check holds it to that (tools/layer-imports-check.sh).
#
# After changing a `require`, run in lean/:
#   lake -d ../packages/mode-line update --keep-toolchain
# then the same for every set that reaches this package (../, tests/packages,
# tests/user-link, tests/layer-imports), and commit each lake-manifest.json.
name = "mode-line"
testDriver = "«mode-line-test»"
defaultTargets = ["ModeLine", "ModeLineTest"]
leanOptions = { linter.all = true, warningAsError = true }
plugins = ["@editor-core/Lint:shared"]

[[require]]
name = "editor-core"
path = "../../lean"

[[lean_lib]]
name = "ModeLine"
globs = ["ModeLine.+"]

[[lean_lib]]
name = "ModeLineTest"
globs = ["ModeLineTest.+"]

[[lean_exe]]
name = "mode-line-test"
root = "ModeLineTest.Model"
