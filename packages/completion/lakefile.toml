# The completion styles and displays that ship, `fuzzy`, `orderless` and
# `path`, and the minibuffer's candidate list, `minibuffer`: a default
# package, a Lake package outside the core that the default package set
# requires (../lakefile.toml; docs/design/packages.md, "The package set and
# its build"). It was modules of the core, `Editor.Completion.Styles`,
# `Editor.Completion.Displays` and `Editor.Completion.Compiled`, until the
# features-as-packages roadmap's phase 4. The gate's package steps build,
# test, lint, format-check and run it headless through the fixture set, which
# requires the default set (tools/package-set.sh), and review holds what it
# imports of the core to the rule in `.agents/rules/structure.md`.
#
# - `Completion` is the package's library: `Completion/Styles.lean`, the
#   styles; `Completion/Displays.lean`, the display;
#   `Completion/Compiled.lean`, the `Package` value; and its entry module
#   `Completion/EditorPackage.lean`, which the package-set build reads. It has
#   no root module, so its `globs` hold every module under `Completion`, and
#   the library's build reaches each one.
# - `completion-test` is its test driver (`lake test`): the tests that need
#   no Rust library, rooted at `CompletionTest/Model.lean`. It is no
#   default target, as the core's `model-test` is not: `mise run lean`
#   links with the system compiler, which this executable has no flags for.
# - `CompletionTest` holds the test modules, `CompletionTest/Linked.lean`
#   among them: the root of the executable the core's `editorLinked` facet
#   links as the editor is linked, with the Rust library. It holds the
#   shipped styles to the completion styles' contract over the library's
#   matcher.
# - `tests/headless/` holds its headless fixture.
#
# Every Lean linter is on and a warning fails the build, as in the core,
# and the build's own linters, the wait linters, are loaded as a Lean plugin
# as the core's libraries load them (`plugins`; lean/Lint/Wait.lean).
#
# It is an implementation package (docs/design/extension-points.md, "Three
# layers"): it declares no `keywords`, so no package may import its modules,
# and the three-layer rule (.agents/rules/structure.md) holds it to that.
#
# After changing a `require`, run in lean/:
#   lake -d ../packages/completion update --keep-toolchain
# then the same for every set that reaches this package (../, tests/packages,
# tests/user-link), and commit each lake-manifest.json.
name = "completion"
testDriver = "«completion-test»"
defaultTargets = ["Completion", "CompletionTest"]
leanOptions = { linter.all = true, warningAsError = true }
plugins = ["@editor-core/lintShared"]

# The interface package this one implements: it declares the name of the
# path style, which the core's files package reaches, and publishes the
# contract check this package's tests run.
[[require]]
name = "completion-api"
path = "../completion-api"

[[require]]
name = "editor-core"
path = "../../lean"

[[lean_lib]]
name = "Completion"
globs = ["Completion.+"]

[[lean_lib]]
name = "CompletionTest"
globs = ["CompletionTest.+"]

[[lean_exe]]
name = "completion-test"
root = "CompletionTest.Model"
