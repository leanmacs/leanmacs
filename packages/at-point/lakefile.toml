# Completion at point: its commands, which the Vim scheme's insert state
# binds, and the source that ships, `words`, the words of the open buffers,
# with its job and its at-point source: a default package, a Lake package
# outside the core that the default package set requires (../lakefile.toml;
# docs/design/packages.md, "The package set and its build"). It was modules of
# the core, `Editor.AtPoint`, `Editor.AtPoint.Compiled` and
# `Editor.Completion.Words`, until the features-as-packages roadmap's phase 4.
# The gate's package steps build, test, lint, format-check and run it headless
# through the fixture set, which requires the default set
# (tools/package-set.sh), and review holds what it imports of the core to the
# rule in `.agents/rules/structure.md`.
#
# - `AtPoint` is the package's library: `AtPoint.lean`, the commands;
#   `AtPoint/Words.lean`, the source `words`, its job and its at-point
#   source; `AtPoint/Compiled.lean`, the `Package` value; and its entry
#   module `AtPoint/EditorPackage.lean`, which the package-set build reads.
# - `at-point-test` is its test driver (`lake test`): the tests that need
#   no Rust library, rooted at `AtPointTest/Model.lean`. It is no default
#   target, as the core's `model-test` is not: `mise run lean` links with
#   the system compiler, which this executable has no flags for.
# - `AtPointTest` holds the test modules.
# - `tests/headless/` holds its headless fixtures.
#
# Every Lean linter is on and a warning fails the build, as in the core,
# and the build's own linters, the wait linters, are loaded as a Lean plugin
# as the core's libraries load them (`plugins`; lean/Lint/Wait.lean).
#
# It is an implementation package (docs/design/extension-points.md, "Three
# layers"): it declares no `keywords`, so no package may import its modules,
# and the three-layer rule (.agents/rules/structure.md) holds it to that.
#
# After changing a `require`, run in lean/:
#   lake -d ../packages/at-point update --keep-toolchain
# then the same for every set that reaches this package (../, tests/packages,
# tests/user-link), and commit each lake-manifest.json.
name = "at-point"
testDriver = "«at-point-test»"
defaultTargets = ["AtPoint", "AtPointTest"]
leanOptions = { linter.all = true, warningAsError = true }
plugins = ["@editor-core/Lint:shared"]

# The interface package this one implements: it declares the names of the
# commands the Vim scheme's insert table and the core reach, and publishes
# the contract check this package's tests run.
[[require]]
name = "at-point-api"
path = "../at-point-api"

# The interface package of evil: the names `insert-newline` and
# `insert-tab`, which `at-point-return` and `at-point-tab` run with no
# session open, and the fake this package's tests run them on.
[[require]]
name = "evil-api"
path = "../evil-api"

[[require]]
name = "editor-core"
path = "../../lean"

[[lean_lib]]
name = "AtPoint"
globs = ["AtPoint.*"]

[[lean_lib]]
name = "AtPointTest"
globs = ["AtPointTest.+"]

[[lean_exe]]
name = "at-point-test"
root = "AtPointTest.Model"
