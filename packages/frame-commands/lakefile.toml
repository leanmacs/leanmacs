# The frame commands: the commands that put the platform's window in
# fullscreen and minimise it, with their default key bindings and Command-Q's:
# a default package, a Lake package outside the core that the default package
# set requires (../lakefile.toml; docs/design/packages.md, "The package set
# and its build"). It was two modules of the core, `Editor.FrameCommands` and
# `Editor.FrameCommands.Compiled`, until the features-as-packages roadmap's
# phase 8. The gate's package steps build, test, lint and format-check it
# through the fixture set, which requires the default set
# (tools/package-set.sh), and review holds what it imports of the core to the
# rule in `.agents/rules/structure.md`.
#
# - `FrameCommands` is the package's library: `FrameCommands.lean`, the
#   commands, `FrameCommands/Compiled.lean`, the `Package` value, and its
#   entry module `FrameCommands/EditorPackage.lean`, which the package-set
#   build reads. Its `globs` hold every module under `FrameCommands`, so the
#   library's build reaches each one. It implements the interface package
#   `frame-commands-api` (`FrameCommandsApi`), which declares the commands'
#   names and which it requires, beside the core.
# - `frame-commands-test` is its test driver (`lake test`): the tests that
#   need no Rust library, rooted at `FrameCommandsTest/Model.lean`. It is
#   no default target, as the core's `model-test` is not: `mise run lean`
#   links with the system compiler, which this executable has no flags for.
# - `FrameCommandsTest` holds the test modules.
#
# It has no headless fixture of its own.
#
# Every Lean linter is on and a warning fails the build, as in the core,
# and the build's own linters, the wait linters, are loaded as a Lean plugin
# as the core's libraries load them (`plugins`; lean/Lint/Wait.lean).
#
# It is an implementation package (docs/design/extension-points.md, "Three
# layers"): it declares no `keywords`, so no package may import its modules,
# and the three-layer rule (.agents/rules/structure.md) holds it to that.
#
# After changing a `require`, run in lean/:
#   lake -d ../packages/frame-commands update --keep-toolchain
# then the same for every set that reaches this package (../, tests/packages,
# tests/user-link), and commit each lake-manifest.json.
name = "frame-commands"
testDriver = "«frame-commands-test»"
defaultTargets = ["FrameCommands", "FrameCommandsTest"]
leanOptions = { linter.all = true, warningAsError = true }
plugins = ["@editor-core/lintShared"]

# The interface package of the frame commands: their names, its fake and
# the contract check this package's tests run.
[[require]]
name = "frame-commands-api"
path = "../frame-commands-api"

[[require]]
name = "editor-core"
path = "../../lean"

[[lean_lib]]
name = "FrameCommands"
globs = ["FrameCommands.*"]

[[lean_lib]]
name = "FrameCommandsTest"
globs = ["FrameCommandsTest.+"]

[[lean_exe]]
name = "frame-commands-test"
root = "FrameCommandsTest.Model"
