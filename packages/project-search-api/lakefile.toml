# The interface package of project search (docs/design/extension-points.md,
# "Three layers"): the contract between the default package
# `project-search`, which implements it, and whatever reaches project search
# by name, the default config's `SPC /` and `SPC *` (config/default) among
# them. It declares the names `project-search` and `project-search-symbol`
# are registered under (`ProjectSearchApi.searchName`,
# `ProjectSearchApi.symbolName`), as an interface package declares every
# name another package may reach ("Reaches by name"), and registers no
# behaviour.
#
# It is an interface package: it declares the keyword `editor-interface`
# below, so another package may import its modules, and the layer imports
# check reads that keyword from Lake (tools/layer-imports-check.sh).
#
# - `ProjectSearchApi` is the package's library: `ProjectSearchApi.lean`, the
#   names.
# - `ProjectSearchApiTest` holds what it publishes for other packages' tests,
#   as the owner of a port publishes its fake and its contract check
#   (AGENTS.md, "Testing with hand-written mocks"):
#   `ProjectSearchApiTest/Fake.lean`, a package that registers every declared
#   name, which a consumer's tests use in place of any implementation; and
#   `ProjectSearchApiTest/Contract.lean`, the check every implementation runs.
#   Its own tests are `ProjectSearchApiTest/ProjectSearchApi.lean`.
# - `project-search-api-test` is its test driver (`lake test`), rooted at
#   `ProjectSearchApiTest/Model.lean`. It is no default target, as the core's
#   `model-test` is not: `mise run lean` links with the system compiler,
#   which this executable has no flags for.
#
# Every Lean linter is on and a warning fails the build, as in the core,
# and the build's own linters, the wait linters, are loaded as a Lean plugin
# as the core's libraries load them (`plugins`; lean/Lint/Wait.lean).
#
# After changing a `require`, run in lean/:
#   lake -d ../packages/project-search-api update --keep-toolchain
# then the same for every package and set that reaches this package
# (packages/project-search, packages/, tests/packages, tests/user-link,
# tests/layer-imports), and commit each lake-manifest.json.
name = "project-search-api"
keywords = ["editor-interface"]
testDriver = "«project-search-api-test»"
defaultTargets = ["ProjectSearchApi", "ProjectSearchApiTest"]
leanOptions = { linter.all = true, warningAsError = true }
plugins = ["@editor-core/lintShared"]

[[require]]
name = "editor-core"
path = "../../lean"

[[lean_lib]]
name = "ProjectSearchApi"

[[lean_lib]]
name = "ProjectSearchApiTest"
globs = ["ProjectSearchApiTest.+"]

[[lean_exe]]
name = "project-search-api-test"
root = "ProjectSearchApiTest.Model"
