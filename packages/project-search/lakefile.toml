# Project search: `project-search`, which searches a workspace's files for a
# pattern into an editable excerpt buffer of the matches, and
# `project-search-symbol`, which searches the word under the cursor, with the
# results buffer's mode and the search's jobs: a default package, a Lake
# package outside the core that the default package set requires
# (../lakefile.toml; docs/design/packages.md, "The package set and its
# build"). It was three modules of the core, `Editor.ProjectSearch`,
# `Editor.ProjectSearch.Run` and `Editor.ProjectSearch.Compiled`, until the
# features-as-packages roadmap's phase 6. The gate's package steps build,
# test, lint and format-check it through the fixture set, which requires the
# default set (tools/package-set.sh), and review holds what it imports of the
# core to the rule in `.agents/rules/structure.md`.
#
# - `ProjectSearch` is the package's library: `ProjectSearch.lean`, the
#   search's pure core, `ProjectSearch/Run.lean`, the commands and jobs,
#   `ProjectSearch/Compiled.lean`, the `Package` value, and its entry module
#   `ProjectSearch/EditorPackage.lean`, which the package-set build reads. Its
#   `globs` hold every module under `ProjectSearch`, so the library's build
#   reaches each one. It implements the interface package
#   `project-search-api`, which it requires, reads what is searched from the
#   core (`Workspace.searchRoot`) and opens files through the core's interface
#   library `files-api`.
# - `project-search-test` is its test driver (`lake test`): the tests that
#   need no Rust library, rooted at `ProjectSearchTest/Model.lean`. It is no
#   default target, as the core's `model-test` is not: `mise run lean` links
#   with the system compiler, which this executable has no flags for.
# - `ProjectSearchTest` holds the test modules and
#   `ProjectSearchTest/Linked.lean`: the root of the executable the core's
#   `editorLinked` facet links as the editor is linked, with the Rust
#   library. It runs project search over the library's grep service, file
#   service and text store. No module of the package, library or tests,
#   reaches a module of evil, by Lake's module graph.
#
# It has no headless fixture of its own: the core's fixture
# tests/headless/working-set-from-search, which runs on the default set's
# editor, searches through it.
#
# Every Lean linter is on and a warning fails the build, as in the core,
# and the build's own linters, the wait linters, are loaded as a Lean plugin
# as the core's libraries load them (`plugins`; lean/Lint/Wait.lean).
#
# It is an implementation package (docs/design/extension-points.md, "Three
# layers"): it declares no `keywords`, so no package may import its modules,
# and the three-layer rule (.agents/rules/structure.md) holds it to that.
#
# After changing a `require`, run in lean/:
#   lake -d ../packages/project-search update --keep-toolchain
# then the same for every set that reaches this package (../, tests/packages), and commit each lake-manifest.json.
name = "project-search"
testDriver = "«project-search-test»"
defaultTargets = ["ProjectSearch", "ProjectSearchTest"]
leanOptions = { linter.all = true, warningAsError = true }
plugins = ["@editor-core/lintShared"]

# The interface package this one implements: it declares the names of
# `project-search` and `project-search-symbol`, which the default config
# binds, and publishes the contract check this package's tests run.
[[require]]
name = "project-search-api"
path = "../project-search-api"

[[require]]
name = "editor-core"
path = "../../lean"

[[lean_lib]]
name = "ProjectSearch"
globs = ["ProjectSearch.*"]

[[lean_lib]]
name = "ProjectSearchTest"
globs = ["ProjectSearchTest.+"]

[[lean_exe]]
name = "project-search-test"
root = "ProjectSearchTest.Model"
