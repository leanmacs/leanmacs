# The binding search, `search-bindings`, which asks for one of the key
# bindings the input scheme reaches and runs it as its key would: a default
# package, a Lake package outside the core that the default package set
# requires (../lakefile.toml; docs/design/packages.md, "The package set and
# its build"). It was modules of the core, `Editor.BindingSearch` and
# `Editor.BindingSearch.Compiled`, until the features-as-packages roadmap's
# phase 3. The gate's package steps build, test, lint, format-check and run
# it headless through the fixture set, which requires the default set
# (tools/package-set.sh), and the package imports check holds what it
# imports of the core (tools/package-imports-check.sh).
#
# - `BindingSearch` is the package's library: `BindingSearch.lean`, the
#   command, its source and its resolution; `BindingSearch/Compiled.lean`,
#   the `Package` value; and its entry module
#   `BindingSearch/EditorPackage.lean`, which the package-set build reads.
#   Its `globs` hold every module under `BindingSearch`, not only what the
#   root imports, so the package imports check sees each one's imports.
# - `binding-search-test` is its test driver (`lake test`): the tests that
#   need no Rust library, rooted at `BindingSearchTest/Model.lean`. It is
#   no default target, as the core's `model-test` is not: `mise run lean`
#   links with the system compiler, which this executable has no flags for.
# - `BindingSearchTest` holds the test modules.
# - `tests/headless/` holds its headless fixture.
#
# Every Lean linter is on and a warning fails the build, as in the core,
# and the build's own linters, the wait linters, are loaded as a Lean plugin
# as the core's libraries load them (`plugins`; lean/Lint/Wait.lean).
#
# It is an implementation package (docs/design/extension-points.md, "Three
# layers"): it declares no `keywords`, so no package may import its modules,
# and the layer imports check holds it to that (tools/layer-imports-check.sh).
#
# After changing a `require`, run in lean/:
#   lake -d ../packages/binding-search update --keep-toolchain
# then the same for every set that reaches this package (../, tests/packages,
# tests/user-link, tests/layer-imports), and commit each lake-manifest.json.
name = "binding-search"
testDriver = "«binding-search-test»"
defaultTargets = ["BindingSearch", "BindingSearchTest"]
leanOptions = { linter.all = true, warningAsError = true }
plugins = ["@editor-core/lintShared"]

# The interface package this one implements: it declares the name the
# binding search is registered under, which the default config binds, and
# publishes the contract check this package's tests run.
[[require]]
name = "binding-search-api"
path = "../binding-search-api"

# The minibuffer's interface package: its tests answer the binding search
# with its fake (`MinibufferApiTest.fake`, the core's test kit's
# minibuffer) and bind its names (`MinibufferApi.acceptName`), so they
# import no implementation of the minibuffer.
[[require]]
name = "minibuffer-api"
path = "../minibuffer-api"

[[require]]
name = "editor-core"
path = "../../lean"

[[lean_lib]]
name = "BindingSearch"
globs = ["BindingSearch.*"]

[[lean_lib]]
name = "BindingSearchTest"
globs = ["BindingSearchTest.+"]

[[lean_exe]]
name = "binding-search-test"
root = "BindingSearchTest.Model"
