# The themes: `load-theme`, the command that switches the theme in force, the
# theme `default`, the built-in one, and the completion source of the
# registered themes' names: a default package, a Lake package outside the core
# that the default package set requires (../lakefile.toml;
# docs/design/packages.md, "The package set and its build"). It was two
# modules of the core, `Editor.Themes` and `Editor.Themes.Compiled`, until the
# features-as-packages roadmap's phase 7. The gate's package steps build,
# test, lint and format-check it through the fixture set, which requires the
# default set (tools/package-set.sh), and review holds what it imports of the
# core to the rule in `.agents/rules/structure.md`.
#
# - `Themes` is the package's library: `Themes.lean`, the command and its
#   source, `Themes/Compiled.lean`, the `Package` value, and its entry module
#   `Themes/EditorPackage.lean`, which the package-set build reads. Its
#   `globs` hold every module under `Themes`, so the library's build reaches
#   each one. It implements the interface package `themes-api` (`ThemesApi`),
#   which declares the command's name and which it requires, beside the core.
# - `themes-test` is its test driver (`lake test`): the tests that need no
#   Rust library, rooted at `ThemesTest/Model.lean`. It is no default
#   target, as the core's `model-test` is not: `mise run lean` links with
#   the system compiler, which this executable has no flags for.
# - `ThemesTest` holds the test modules, `ThemesTest/Linked.lean` among
#   them: the root of the executable the core's `editorLinked` facet links
#   as the editor is linked, with the Rust library. It runs the theme
#   command through the headless host over the real elaborator, the
#   display's real binding and the library's layout.
#
# It has no headless fixture of its own: the fixtures of the shipped
# palettes' package (packages/shipped-themes/tests/headless/), which run on
# the default set's editor, load themes through it.
#
# Every Lean linter is on and a warning fails the build, as in the core,
# and the build's own linters, the wait linters, are loaded as a Lean plugin
# as the core's libraries load them (`plugins`; lean/Lint/Wait.lean).
#
# It is an implementation package (docs/design/extension-points.md, "Three
# layers"): it declares no `keywords`, so no package may import its modules,
# and the three-layer rule (.agents/rules/structure.md) holds it to that.
# The palettes that ship are another package, shipped-themes, which imports
# none of its modules and registers after it.
#
# After changing a `require`, run in lean/:
#   lake -d ../packages/themes update --keep-toolchain
# then the same for every set that reaches this package (../, tests/packages), and commit each lake-manifest.json.
name = "themes"
testDriver = "«themes-test»"
defaultTargets = ["Themes", "ThemesTest"]
leanOptions = { linter.all = true, warningAsError = true }
plugins = ["@editor-core/lintShared"]

# The interface package of the themes: the name `load-theme`, its fake and
# the contract check this package's tests run.
[[require]]
name = "themes-api"
path = "../themes-api"

[[require]]
name = "editor-core"
path = "../../lean"

[[lean_lib]]
name = "Themes"
globs = ["Themes.*"]

[[lean_lib]]
name = "ThemesTest"
globs = ["ThemesTest.+"]

[[lean_exe]]
name = "themes-test"
root = "ThemesTest.Model"
