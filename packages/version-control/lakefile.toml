# Version control: git's implementation of the core's version-control
# interface, the status buffer (`vc-status`), the worktree list, `vc-show`,
# staging and unstaging hunks, the message buffer (`vc-commit`), the review
# buffer (`vc-review`), the log and the blame, and the gutter's marks, as two
# packages, `version-control` and `version-control-gutter`: a default package,
# a Lake package outside the core that the default package set requires
# (../lakefile.toml; docs/design/packages.md, "The package set and its
# build"). It was the seventeen modules of the core under
# `Editor.VersionControl` (and git's half of the repository model, a test
# double now) until the features-as-packages roadmap's phase 6. The gate's
# package steps build, test, lint and format-check it through the fixture set,
# which requires the default set (tools/package-set.sh), and review holds what
# it imports of the core to the rule in `.agents/rules/structure.md`.
#
# - `VersionControl` is the package's library: the modules under
#   `VersionControl/`, and its entry module
#   `VersionControl/EditorPackage.lean`, which the package-set build reads and
#   which lists both packages. It has no root module (`VersionControl.lean`),
#   so its `globs` hold every module under `VersionControl` and none at the
#   root, and the library's build reaches each one. It implements the
#   interface package `vc-api` (its backend `git`, the gutter's jobs and the
#   segment) and reaches a path's workspace through the interface package
#   `project-api`, both of which it requires, beside the core.
# - `version-control-test` is its test driver (`lake test`): the tests that
#   need no Rust library, rooted at `VersionControlTest/Model.lean`. It is no
#   default target, as the core's `model-test` is not: `mise run lean` links
#   with the system compiler, which this executable has no flags for.
# - `VersionControlTest` holds the test modules, git's half of the model of
#   a repository (`VersionControlTest/Git/Model.lean`), the drivers and
#   fixtures of the model checks (`VersionControlTest/Support/`), and
#   `VersionControlTest/Linked.lean`: the root of the executable the core's
#   `editorLinked` facet links as the editor is linked, with the Rust
#   library. It runs version control over real git, in temporary
#   repositories, and the gutter through the headless host.
#
# It has no headless fixture of its own: the core's fixture tests/headless/ex,
# which runs on the default set's editor, lists its ex names.
#
# Every Lean linter is on and a warning fails the build, as in the core,
# and the build's own linters, the wait linters, are loaded as a Lean plugin
# as the core's libraries load them (`plugins`; lean/Lint/Wait.lean).
#
# It is an implementation package (docs/design/extension-points.md, "Three
# layers"): it declares no `keywords`, so no package may import its modules,
# and the three-layer rule (.agents/rules/structure.md) holds it to that.
#
# After changing a `require`, run in lean/:
#   lake -d ../packages/version-control update --keep-toolchain
# then the same for every set that reaches this package (../, tests/packages,
# tests/user-link), and commit each lake-manifest.json.
name = "version-control"
testDriver = "«version-control-test»"
defaultTargets = ["VersionControl", "VersionControlTest"]
leanOptions = { linter.all = true, warningAsError = true }
plugins = ["@editor-core/Lint:shared"]

# The interface package of the workspaces: the reach of the workspace at a
# path, which the worktree list's visit reaches through, and its fake.
[[require]]
name = "project-api"
path = "../project-api"

# The interface package this one implements: the version-control port, the
# backend point git's implementation is registered at, and the gutter's and
# the segment's names, with the model, the contract and the registration
# check its tests run.
[[require]]
name = "vc-api"
path = "../vc-api"

# The interface package of the buffer commands: the hook before a buffer
# closes, which the commit buffer registers at, and its fake, which this
# package's tests close buffers with.
[[require]]
name = "buffers-api"
path = "../buffers-api"

[[require]]
name = "editor-core"
path = "../../lean"

[[lean_lib]]
name = "VersionControl"
globs = ["VersionControl.+"]

[[lean_lib]]
name = "VersionControlTest"
globs = ["VersionControlTest.+"]

[[lean_exe]]
name = "version-control-test"
root = "VersionControlTest.Model"
