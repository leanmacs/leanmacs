# The interface package of the shell (docs/design/extension-points.md,
# "Three layers"): the contract between the default package `shell`, which
# implements it, and what others ask of it: the names of the shell's
# commands, which the ex line hands a `:!` line to and the Vim scheme's
# `C-g` runs, and the history of the lines run (`Shell.history`), which the
# ex line's prompt offers and the compile mode copies. It registers no
# behaviour.
#
# It is an interface package: it declares the keyword `editor-interface`
# below, so another package may import its modules, and the three-layer
# rule reads that keyword (.agents/rules/structure.md). It was
# staged in the core's Lake package as its own `lean_lib` with this layout
# and these names until features-as-packages phase 8, when its last user in
# the core, the ex line, moved out, and moved here with `git mv`, no import
# line changed.
#
# - `ShellApi` is the package's library: `ShellApi.lean`.
# - `ShellApiTest` holds what it publishes for other packages' tests, as the
#   owner of a port publishes its fake and its contract check (AGENTS.md,
#   "Testing with hand-written mocks"), and its own tests, which were the
#   core's model tests (`ModelTest.<name>`) until it moved.
# - `shell-api-test` is its test driver (`lake test`), rooted at
#   `ShellApiTest/Model.lean`. It is no default target, as the core's
#   `model-test` is not: `mise run lean` links with the system compiler,
#   which this executable has no flags for.
#
# Every Lean linter is on and a warning fails the build, as in the core,
# and the build's own linters, the wait linters, are loaded as a Lean plugin
# as the core's libraries load them (`plugins`; lean/Lint/Wait.lean).
#
# After changing a `require`, run in lean/:
#   lake -d ../packages/shell-api update --keep-toolchain
# then the same for every package and set that reaches this package
# (packages/shell, packages/compile, packages/evil, packages/ex,
# packages/ex-api, packages/, tests/packages, tests/user-link), and
# commit each lake-manifest.json.
name = "shell-api"
keywords = ["editor-interface"]
testDriver = "«shell-api-test»"
defaultTargets = ["ShellApi", "ShellApiTest"]
leanOptions = { linter.all = true, warningAsError = true }
plugins = ["@editor-core/lintShared"]

[[require]]
name = "editor-core"
path = "../../lean"

[[lean_lib]]
name = "ShellApi"

[[lean_lib]]
name = "ShellApiTest"
globs = ["ShellApiTest.+"]

[[lean_exe]]
name = "shell-api-test"
root = "ShellApiTest.Model"
