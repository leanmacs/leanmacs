# The crates acp's library may be built from, checked by `mise run deny`
# (AGENTS.md, "Test behaviour, never text"), which runs cargo-deny's bans
# over this crate's own graph:
#
#   cargo deny --locked --manifest-path packages/acp/rust/Cargo.toml \
#     check --config packages/acp/rust/deny.toml -D unused-wrapper bans
#
# Given the manifest of a workspace member, cargo-deny roots the graph at
# that crate alone, so the graph is acp's: its dependencies and its
# dev-dependencies, and theirs, build edges included. An `allow` list that
# is not empty refuses every crate it does not name ("crate '…' is not
# explicitly allowed"), so this list is the whole of what acp's library and
# its tests may contain: the package wrapper and what the wrapper itself is
# built from, the Agent Client Protocol's SDK, `futures`, `serde` and
# `serde_json`, which acp pins exactly, and the rest of their tree, and no
# other crate of the editor's (docs/design/packages.md, "acp, ported, as
# built"). It holds what the root `deny.toml` cannot: there, a crate nothing
# depends on (`editor-ffi`, a `-std` binaries' crate,
# `editor-package-runtime-header`, `editor-package-check`, another
# package's crate) has no parent to name as a wrapper, so an edge from acp
# to it cannot be refused. Neither `editor-service`, `editor-ffi` nor
# `echo-service` is named, so an edge to any of them, a dev-dependency's
# included, fails. The root `deny.toml` still holds that acp reaches the
# definitions and the typed bounds through the wrapper alone, and that no
# crate but acp's depends on the SDK, which an allow list cannot say.
#
# A crate added to acp's graph, a third party's included, gets its entry
# here in the commit of its edge: a bump of the SDK that changes its tree
# changes this list in the same commit (docs/design/agent-hosting.md,
# "Upgrading the SDK"), listed again from
# `cargo tree -p acp-service -e normal,build,dev --prefix none --target all`. cargo-deny
# does not report an entry that matches no crate, so one is taken out with
# the edge that needed it.

[bans]
multiple-versions = "allow"
allow = [
  { crate = "acp-service", reason = "acp's crate itself, the root of the graph" },
  { crate = "agent-client-protocol", reason = "the Agent Client Protocol's SDK, pinned exactly (=5.5.1), which acp keeps inside its library" },
  { crate = "agent-client-protocol-derive", reason = "the SDK's own derive macros" },
  { crate = "agent-client-protocol-schema", reason = "the protocol's messages, reached through the SDK's re-export alone" },
  { crate = "anyhow", reason = "a dependency of the SDK's tree (agent-client-protocol =5.5.1, pinned by the root lock)" },
  { crate = "cfg-if", reason = "a dependency of the SDK's tree (agent-client-protocol =5.5.1, pinned by the root lock)" },
  { crate = "convert_case", reason = "a dependency of the SDK's tree (agent-client-protocol =5.5.1, pinned by the root lock)" },
  { crate = "darling", reason = "a dependency of the SDK's tree (agent-client-protocol =5.5.1, pinned by the root lock)" },
  { crate = "darling_core", reason = "a dependency of the SDK's tree (agent-client-protocol =5.5.1, pinned by the root lock)" },
  { crate = "darling_macro", reason = "a dependency of the SDK's tree (agent-client-protocol =5.5.1, pinned by the root lock)" },
  { crate = "derive_more", reason = "a dependency of the SDK's tree (agent-client-protocol =5.5.1, pinned by the root lock)" },
  { crate = "derive_more-impl", reason = "a dependency of the SDK's tree (agent-client-protocol =5.5.1, pinned by the root lock)" },
  { crate = "editor-package", reason = "the package wrapper, the one crate of the editor's acp depends on" },
  { crate = "editor-package-runtime", reason = "the runtime's C definitions, which the wrapper re-exports (`editor_package::raw`); no static" },
  { crate = "editor-wait", reason = "the typed time bounds, which the wrapper re-exports (`editor_package::wait`); no static" },
  { crate = "equivalent", reason = "a dependency of the SDK's tree (agent-client-protocol =5.5.1, pinned by the root lock)" },
  { crate = "fastrand", reason = "a dependency of the SDK's tree (agent-client-protocol =5.5.1, pinned by the root lock)" },
  { crate = "fixedbitset", reason = "a dependency of the SDK's tree (agent-client-protocol =5.5.1, pinned by the root lock)" },
  { crate = "foldhash", reason = "a dependency of the SDK's tree (agent-client-protocol =5.5.1, pinned by the root lock)" },
  { crate = "futures", reason = "the executor acp runs a session's connection on, and its `select_biased!` (=0.3.34)" },
  { crate = "futures-channel", reason = "one of futures' own crates" },
  { crate = "futures-concurrency", reason = "a dependency of the SDK's tree (agent-client-protocol =5.5.1, pinned by the root lock)" },
