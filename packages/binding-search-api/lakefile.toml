# The interface package of the binding search (docs/design/extension-points.md,
# "Three layers"): the contract between the default package
# `binding-search`, which implements it, and whatever reaches the binding
# search by name, the default config's `SPC ?` (config/default) among
# them. It declares the name the binding search is registered under
# (`BindingSearchApi.searchBindingsName`), as an interface package
# declares every name another package may reach ("Reaches by name"), and
# registers no behaviour.
#
# It is an interface package: it declares the keyword `editor-interface`
# below, so another package may import its modules, and the layer imports
# check reads that keyword from Lake (tools/layer-imports-check.sh).
#
# - `BindingSearchApi` is the package's library: `BindingSearchApi.lean`,
#   the names.
# - `BindingSearchApiTest` holds what it publishes for other packages'
#   tests, as the owner of a port publishes its fake and its contract
#   check (AGENTS.md, "Testing with hand-written mocks"):
#   `BindingSearchApiTest/Fake.lean`, a package that registers every
#   declared name, which a consumer's tests use in place of any
#   implementation; and `BindingSearchApiTest/Contract.lean`, the check
#   every implementation runs. Its own tests are
#   `BindingSearchApiTest/BindingSearchApi.lean`.
# - `binding-search-api-test` is its test driver (`lake test`), rooted at
#   `BindingSearchApiTest/Model.lean`. It is no default target, as the
#   core's `model-test` is not: `mise run lean` links with the system
#   compiler, which this executable has no flags for.
#
# Every Lean linter is on and a warning fails the build, as in the core,
# and the build's own linters, the wait linters, are loaded as a Lean plugin
# as the core's libraries load them (`plugins`; lean/Lint/Wait.lean).
#
# After changing a `require`, run in lean/:
#   lake -d ../packages/binding-search-api update --keep-toolchain
# then the same for every package and set that reaches this package
# (packages/binding-search, packages/, tests/packages, tests/user-link,
# tests/layer-imports), and commit each lake-manifest.json.
name = "binding-search-api"
keywords = ["editor-interface"]
testDriver = "«binding-search-api-test»"
defaultTargets = ["BindingSearchApi", "BindingSearchApiTest"]
leanOptions = { linter.all = true, warningAsError = true }
plugins = ["@editor-core/Lint:shared"]

[[require]]
name = "editor-core"
path = "../../lean"

[[lean_lib]]
name = "BindingSearchApi"

[[lean_lib]]
name = "BindingSearchApiTest"
globs = ["BindingSearchApiTest.+"]

[[lean_exe]]
name = "binding-search-api-test"
root = "BindingSearchApiTest.Model"
