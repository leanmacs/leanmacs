# The interface package of the working sets (docs/design/extension-points.md,
# "Three layers"): the contract between the default package `working-set`,
# which implements it, and whatever reaches the working sets by name, the
# default config's `SPC k a`, `SPC k o` and `SPC RET` (config/default) among
# them. It declares the names `working-set-add` and `working-set-open` are
# registered under (`WorkingSetApi.addName`, `WorkingSetApi.openName`), as
# an interface package declares every name another package may reach
# ("Reaches by name"), and registers no behaviour.
#
# It is an interface package: it declares the keyword `editor-interface`
# below, so another package may import its modules, and the layer imports
# check reads that keyword from Lake (tools/layer-imports-check.sh).
#
# - `WorkingSetApi` is the package's library: `WorkingSetApi.lean`, the
#   names.
# - `WorkingSetApiTest` holds what it publishes for other packages' tests,
#   as the owner of a port publishes its fake and its contract check
#   (AGENTS.md, "Testing with hand-written mocks"):
#   `WorkingSetApiTest/Fake.lean`, a package that registers every declared
#   name, which a consumer's tests use in place of any implementation; and
#   `WorkingSetApiTest/Contract.lean`, the check every implementation runs.
#   Its own tests are `WorkingSetApiTest/WorkingSetApi.lean`.
# - `working-set-api-test` is its test driver (`lake test`), rooted at
#   `WorkingSetApiTest/Model.lean`. It is no default target, as the core's
#   `model-test` is not: `mise run lean` links with the system compiler,
#   which this executable has no flags for.
#
# Every Lean linter is on and a warning fails the build, as in the core,
# and the build's own linters, the wait linters, are loaded as a Lean plugin
# as the core's libraries load them (`plugins`; lean/Lint/Wait.lean).
#
# After changing a `require`, run in lean/:
#   lake -d ../packages/working-set-api update --keep-toolchain
# then the same for every package and set that reaches this package
# (packages/working-set, packages/, tests/packages, tests/user-link,
# tests/layer-imports), and commit each lake-manifest.json.
name = "working-set-api"
keywords = ["editor-interface"]
testDriver = "«working-set-api-test»"
defaultTargets = ["WorkingSetApi", "WorkingSetApiTest"]
leanOptions = { linter.all = true, warningAsError = true }
plugins = ["@editor-core/Lint:shared"]

[[require]]
name = "editor-core"
path = "../../lean"

[[lean_lib]]
name = "WorkingSetApi"

[[lean_lib]]
name = "WorkingSetApiTest"
globs = ["WorkingSetApiTest.+"]

[[lean_exe]]
name = "working-set-api-test"
root = "WorkingSetApiTest.Model"
