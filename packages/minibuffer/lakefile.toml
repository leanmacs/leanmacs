# The minibuffer's commands, which accept, cancel and edit the open prompt
# and move a choice through its candidates, and the mode the minibuffer's
# buffer is made with: a default package, a Lake package outside the core
# that the default package set requires (../lakefile.toml;
# docs/design/packages.md, "The package set and its build"). It was
# modules of the core, `Editor.Minibuffer` and `Editor.Minibuffer.Compiled`,
# until the features-as-packages roadmap's phase 4. The gate's package
# steps build, test, lint, format-check and run it headless through the
# fixture set, which requires the default set (tools/package-set.sh), and
# the package imports check holds what it imports of the core
# (tools/package-imports-check.sh).
#
# - `Minibuffer` is the package's library: `Minibuffer.lean`, the commands
#   and the mode; `Minibuffer/Compiled.lean`, the `Package` value; and its
#   entry module `Minibuffer/EditorPackage.lean`, which the package-set
#   build reads.
# - `minibuffer-test` is its test driver (`lake test`): the tests that
#   need no Rust library, rooted at `MinibufferTest/Model.lean`. It is no
#   default target, as the core's `model-test` is not: `mise run lean`
#   links with the system compiler, which this executable has no flags for.
# - `MinibufferTest` holds the test modules.
# - `tests/headless/` holds its headless fixtures.
#
# Every Lean linter is on and a warning fails the build, as in the core,
# and the build's own linters, the wait linters, are loaded as a Lean plugin
# as the core's libraries load them (`plugins`; lean/Lint/Wait.lean).
#
# It is an implementation package (docs/design/extension-points.md, "Three
# layers"): it declares no `keywords`, so no package may import its modules,
# and the layer imports check holds it to that (tools/layer-imports-check.sh).
#
# After changing a `require`, run in lean/:
#   lake -d ../packages/minibuffer update --keep-toolchain
# then the same for every set that reaches this package (../, tests/packages,
# tests/user-link, tests/layer-imports), and commit each lake-manifest.json.
name = "minibuffer"
testDriver = "«minibuffer-test»"
defaultTargets = ["Minibuffer", "MinibufferTest"]
leanOptions = { linter.all = true, warningAsError = true }
plugins = ["@editor-core/Lint:shared"]

# The interface package this one implements: it declares the names of the
# commands and of the mode that the Vim scheme, the core and other
# packages' tests reach, and publishes the contract check this package's
# tests run.
[[require]]
name = "minibuffer-api"
path = "../minibuffer-api"

[[require]]
name = "editor-core"
path = "../../lean"

[[lean_lib]]
name = "Minibuffer"
globs = ["Minibuffer.*"]

[[lean_lib]]
name = "MinibufferTest"
globs = ["MinibufferTest.+"]

[[lean_exe]]
name = "minibuffer-test"
root = "MinibufferTest.Model"
