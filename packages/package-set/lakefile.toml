# The package-set commands: `:package-install`, `:package-remove` and
# `:package-update`, the job that writes an edited lakefile, and the
# registration of the package-set build: a default package, a Lake package
# outside the core that the default package set requires (../lakefile.toml;
# docs/design/packages.md, "The package set and its build"). It was a module
# of the core, `Editor.PackageSet.Compiled`, until the features-as-packages
# roadmap's phase 8. The gate's package steps build, test, lint and
# format-check it through the fixture set, which requires the default set
# (tools/package-set.sh), and review holds what it imports of the core to the
# rule in `.agents/rules/structure.md`.
#
# - `PackageSet` is the package's library: `PackageSet/Compiled.lean`, the
#   commands and the `Package` value, and its entry module
#   `PackageSet/EditorPackage.lean`, which the package-set build reads. Its
#   `globs` hold every module under `PackageSet`, so the library's build
#   reaches each one. The machinery it registers and edits through is the
#   core's (`lean/Editor/PackageSet/`: the build job and the two commands it
#   posts to, the edits of a lakefile, the fingerprint and what a running
#   editor knows of its set): the reload asks for a build and the hosts start
#   the job by its name, which the core declares.
# - `package-set-test` is its test driver (`lake test`): the tests that
#   need no Rust library, rooted at `PackageSetTest/Model.lean`. It is no
#   default target, as the core's `model-test` is not: `mise run lean`
#   links with the system compiler, which this executable has no flags for.
# - `PackageSetTest` holds the test modules.
#
# It has no headless fixture of its own: its commands start real builds
# and restarts, and its decisions are its model tests'
# (`PackageSetTest`, `ModelTest.packageSetBuildChecks`).
#
# Every Lean linter is on and a warning fails the build, as in the core,
# and the build's own linters, the wait linters, are loaded as a Lean plugin
# as the core's libraries load them (`plugins`; lean/Lint/Wait.lean).
#
# It is an implementation package (docs/design/extension-points.md, "Three
# layers"): it declares no `keywords`, so no package may import its modules,
# and the three-layer rule (.agents/rules/structure.md) holds it to that.
#
# After changing a `require`, run in lean/:
#   lake -d ../packages/package-set update --keep-toolchain
# then the same for every set that reaches this package (../, tests/packages,
# tests/user-link), and commit each lake-manifest.json.
name = "package-set"
testDriver = "«package-set-test»"
defaultTargets = ["PackageSet", "PackageSetTest"]
leanOptions = { linter.all = true, warningAsError = true }
plugins = ["@editor-core/lintShared"]

[[require]]
name = "editor-core"
path = "../../lean"

[[lean_lib]]
name = "PackageSet"
globs = ["PackageSet.+"]

[[lean_lib]]
name = "PackageSetTest"
globs = ["PackageSetTest.+"]

[[lean_exe]]
name = "package-set-test"
root = "PackageSetTest.Model"
