# The shell: `shell-command`, which `:!` hands its line to, `shell-filter`,
# which `:<range>!` hands a range and a command to, `keyboard-quit`, which
# interrupts the run in flight, the run's job and the history of lines run per
# workspace: a default package, a Lake package outside the core that the
# default package set requires (../lakefile.toml; docs/design/packages.md,
# "The package set and its build"). It was two modules of the core,
# `Editor.Shell` and `Editor.Shell.Compiled`, until the features-as-packages
# roadmap's phase 6. The gate's package steps build, test, lint and
# format-check it through the fixture set, which requires the default set
# (tools/package-set.sh), and review holds what it imports of the core to the
# rule in `.agents/rules/structure.md`.
#
# - `Shell` is the package's library: `Shell.lean`, the commands and the run's
#   job, `Shell/Compiled.lean`, the `Package` value, and its entry module
#   `Shell/EditorPackage.lean`, which the package-set build reads. Its `globs`
#   hold every module under `Shell`, so the library's build reaches each one.
#   It implements the interface package `shell-api` (`ShellApi`: the three
#   names and the history, which ex reads), which it requires, beside the
#   core.
# - `shell-test` is its test driver (`lake test`): the tests that need no
#   Rust library, rooted at `ShellTest/Model.lean`. It is no default target,
#   as the core's `model-test` is not: `mise run lean` links with the system
#   compiler, which this executable has no flags for.
# - `ShellTest` holds the test modules, the shell's test kit
#   (`ShellTest/Kit.lean`), and `ShellTest/Linked.lean`: the root of the
#   executable the core's `editorLinked` facet links as the editor is
#   linked, with the Rust library. It runs the shell over the library's
#   process service, with the fixture under `tests/shell`.
#
# It has no headless fixture of its own.
#
# Every Lean linter is on and a warning fails the build, as in the core,
# and the build's own linters, the wait linters, are loaded as a Lean plugin
# as the core's libraries load them (`plugins`; lean/Lint/Wait.lean).
#
# It is an implementation package (docs/design/extension-points.md, "Three
# layers"): it declares no `keywords`, so no package may import its modules,
# and the three-layer rule (.agents/rules/structure.md) holds it to that.
#
# After changing a `require`, run in lean/:
#   lake -d ../packages/shell update --keep-toolchain
# then the same for every set that reaches this package (../, tests/packages), and commit each lake-manifest.json.
name = "shell"
testDriver = "«shell-test»"
defaultTargets = ["Shell", "ShellTest"]
leanOptions = { linter.all = true, warningAsError = true }
plugins = ["@editor-core/lintShared"]

# The interface package this one implements: the names of the shell's
# commands, the history of the lines run, its fake and the contract check
# this package's tests run.
[[require]]
name = "shell-api"
path = "../shell-api"

[[require]]
name = "editor-core"
path = "../../lean"

[[lean_lib]]
name = "Shell"
globs = ["Shell.*"]

[[lean_lib]]
name = "ShellTest"
globs = ["ShellTest.+"]

[[lean_exe]]
name = "shell-test"
root = "ShellTest.Model"
