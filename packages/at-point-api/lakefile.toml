# The interface package of completion at point's commands
# (docs/design/extension-points.md, "Three layers"): the contract between
# the default package `at-point`, which implements it, and whatever
# reaches one of its commands by name: the Vim scheme's insert table, which
# binds seven of them, and the core's loop and hosts, which run the two the
# core declares at a trigger and at a pause. It declares those nine names
# (`AtPointApi.names`), as an interface package declares every name
# another package may reach ("Reaches by name"), and registers no
# behaviour.
#
# It is an interface package: it declares the keyword `editor-interface`
# below, so another package may import its modules, and the three-layer
# rule reads that keyword (.agents/rules/structure.md).
#
# - `AtPointApi` is the package's library: `AtPointApi.lean`, the names.
# - `AtPointApiTest` holds what it publishes for other packages' tests, as
#   the owner of a port publishes its fake and its contract check
#   (AGENTS.md, "Testing with hand-written mocks"):
#   `AtPointApiTest/Fake.lean`, the core's test kit's implementation
#   (`Editor.Test.AtPoint.package`), which a consumer's tests use in place
#   of any implementation; and `AtPointApiTest/Contract.lean`, the check
#   every implementation runs. Its own tests are
#   `AtPointApiTest/AtPointApi.lean`.
# - `at-point-api-test` is its test driver (`lake test`), rooted at
#   `AtPointApiTest/Model.lean`. It is no default target, as the core's
#   `model-test` is not: `mise run lean` links with the system compiler,
#   which this executable has no flags for.
#
# Every Lean linter is on and a warning fails the build, as in the core,
# and the build's own linters, the wait linters, are loaded as a Lean plugin
# as the core's libraries load them (`plugins`; lean/Lint/Wait.lean).
#
# After changing a `require`, run in lean/:
#   lake -d ../packages/at-point-api update --keep-toolchain
# then the same for every package and set that reaches this package
# (packages/at-point, packages/, tests/packages), and
# commit each lake-manifest.json.
name = "at-point-api"
keywords = ["editor-interface"]
testDriver = "«at-point-api-test»"
defaultTargets = ["AtPointApi", "AtPointApiTest"]
leanOptions = { linter.all = true, warningAsError = true }
plugins = ["@editor-core/lintShared"]

[[require]]
name = "editor-core"
path = "../../lean"

[[lean_lib]]
name = "AtPointApi"

[[lean_lib]]
name = "AtPointApiTest"
globs = ["AtPointApiTest.+"]

[[lean_exe]]
name = "at-point-api-test"
root = "AtPointApiTest.Model"
