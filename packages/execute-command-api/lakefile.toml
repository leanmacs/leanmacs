# The interface package of the command prompt (docs/design/extension-points.md,
# "Three layers"): the contract between the default package
# `execute-command`, which implements it, and whatever reaches the command
# prompt by name, the default config's `SPC :` (config/default) among
# them. It declares the name the command prompt is registered under
# (`ExecuteCommandApi.executeCommandName`), as an interface package
# declares every name another package may reach ("Reaches by name"), and
# registers no behaviour.
#
# It is an interface package: it declares the keyword `editor-interface`
# below, so another package may import its modules, and the three-layer
# rule reads that keyword (.agents/rules/structure.md).
#
# - `ExecuteCommandApi` is the package's library: `ExecuteCommandApi.lean`,
#   the names.
# - `ExecuteCommandApiTest` holds what it publishes for other packages'
#   tests, as the owner of a port publishes its fake and its contract
#   check (AGENTS.md, "Testing with hand-written mocks"):
#   `ExecuteCommandApiTest/Fake.lean`, a package that registers every
#   declared name, which a consumer's tests use in place of any
#   implementation; and `ExecuteCommandApiTest/Contract.lean`, the check
#   every implementation runs. Its own tests are
#   `ExecuteCommandApiTest/ExecuteCommandApi.lean`.
# - `execute-command-api-test` is its test driver (`lake test`), rooted at
#   `ExecuteCommandApiTest/Model.lean`. It is no default target, as the
#   core's `model-test` is not: `mise run lean` links with the system
#   compiler, which this executable has no flags for.
#
# Every Lean linter is on and a warning fails the build, as in the core,
# and the build's own linters, the wait linters, are loaded as a Lean plugin
# as the core's libraries load them (`plugins`; lean/Lint/Wait.lean).
#
# After changing a `require`, run in lean/:
#   lake -d ../packages/execute-command-api update --keep-toolchain
# then the same for every package and set that reaches this package
# (packages/execute-command, packages/, tests/packages), and
# commit each lake-manifest.json.
name = "execute-command-api"
keywords = ["editor-interface"]
testDriver = "«execute-command-api-test»"
defaultTargets = ["ExecuteCommandApi", "ExecuteCommandApiTest"]
leanOptions = { linter.all = true, warningAsError = true }
plugins = ["@editor-core/lintShared"]

[[require]]
name = "editor-core"
path = "../../lean"

[[lean_lib]]
name = "ExecuteCommandApi"

[[lean_lib]]
name = "ExecuteCommandApiTest"
globs = ["ExecuteCommandApiTest.+"]

[[lean_exe]]
name = "execute-command-api-test"
root = "ExecuteCommandApiTest.Model"
