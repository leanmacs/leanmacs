# The workspaces: finding the workspace a file is in (`find-workspace`) and
# attaching it to the buffer at `files-api`'s `Opened` hook, turning on the
# modes its markers name (`find-mode-markers`, with the compile mode's
# listing `compile-list`), `workspace-current`, `find-file-in-workspace`,
# `find-file-in-project` and `find-file-in-another-workspace`, and the
# value of the interface library `project-api` that reaches a workspace at a
# path: a default package, a Lake package outside the core that the default
# package set requires (../lakefile.toml; docs/design/packages.md, "The
# package set and its build"). It was nine modules of the core,
# `Editor.Workspace.Attach`, `.Compiled`, `.Finder`, `.FindFile`,
# `.FindInProject`, `.Lister`, `.Modes`, `.Projects` and `.Reach`, until the
# features-as-packages roadmap's phase 6. The workspace data
# (`Editor.Workspace`) and what a search covers (`Editor.SearchRoot`) stay
# the core's. The gate's package steps build, test, lint and format-check it
# through the fixture set, which requires the default set
# (tools/package-set.sh), and the package imports check holds what it
# imports of the core (tools/package-imports-check.sh).
#
# - `Workspace` is the package's library: the modules under `Workspace/`,
#   and its entry module `Workspace/EditorPackage.lean`, which the
#   package-set build reads. It has no root module (`Workspace.lean`), so its
#   `globs` hold every module under `Workspace` and none at the root, and
#   the package imports check sees each one's imports. It implements the
#   core's staged interface library `project-api` (`ProjectApi`) and reads
#   version control through `vc-api` (`VcApi`), both still the core's, so it
#   requires no package but the core.
# - `workspace-test` is its test driver (`lake test`): the tests that need
#   no Rust library, rooted at `WorkspaceTest/Model.lean`. It is no default
#   target, as the core's `model-test` is not: `mise run lean` links with the
#   system compiler, which this executable has no flags for.
# - `WorkspaceTest` holds the test modules, the workspace's test kit
#   (`WorkspaceTest/Kit.lean`), the finder's pure model and its contract
#   (`WorkspaceTest/Finder/`), and `WorkspaceTest/Linked.lean`: the root of
#   the executable the core's `editorLinked` facet links as the editor is
#   linked, with the Rust library. It runs the finder, its contract and the
#   listers over the library's process and file services, with the fixtures
#   under `tests/` standing in for git and fzf, and holds the workspace
#   finder's benchmark as an opt-in argument (`mise run find-file-bench`).
#
# It has no headless fixture of its own: the core's fixtures
# tests/headless/finder-session and the others that open files in a
# workspace run on the default set's editor.
#
# Every Lean linter is on and a warning fails the build, as in the core.
#
# It is an implementation package (docs/design/extension-points.md, "Three
# layers"): it declares no `keywords`, so no package may import its modules,
# and the layer imports check holds it to that (tools/layer-imports-check.sh).
#
# After changing a `require`, run in lean/:
#   lake -d ../packages/workspace update --keep-toolchain
# then the same for every set that reaches this package (../, tests/packages,
# tests/user-link, tests/layer-imports), and commit each lake-manifest.json.
name = "workspace"
testDriver = "«workspace-test»"
defaultTargets = ["Workspace", "WorkspaceTest"]
leanOptions = { linter.all = true, warningAsError = true }

[[require]]
name = "editor-core"
path = "../../lean"

[[lean_lib]]
name = "Workspace"
globs = ["Workspace.+"]

[[lean_lib]]
name = "WorkspaceTest"
globs = ["WorkspaceTest.+"]

[[lean_exe]]
name = "workspace-test"
root = "WorkspaceTest.Model"
