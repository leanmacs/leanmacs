# The workspaces: finding the workspace a file is in (`find-workspace`) and
# attaching it to the buffer at `files-api`'s `Opened` hook, turning on the
# modes its markers name (`find-mode-markers`, with the compile mode's listing
# `compile-list`), `workspace-current`, `find-file-in-workspace`,
# `find-file-in-project` and `find-file-in-another-workspace`, and the value
# of the interface library `project-api` that reaches a workspace at a path: a
# default package, a Lake package outside the core that the default package
# set requires (../lakefile.toml; docs/design/packages.md, "The package set
# and its build"). It was nine modules of the core, `Editor.Workspace.Attach`,
# `.Compiled`, `.Finder`, `.FindFile`, `.FindInProject`, `.Lister`, `.Modes`,
# `.Projects` and `.Reach`, until the features-as-packages roadmap's phase 6.
# The workspace data (`Editor.Workspace`) and what a search covers
# (`Editor.SearchRoot`) stay the core's. The gate's package steps build, test,
# lint and format-check it through the fixture set, which requires the default
# set (tools/package-set.sh), and review holds what it imports of the core to
# the rule in `.agents/rules/structure.md`.
#
# - `Workspace` is the package's library: the modules under `Workspace/`, and
#   its entry module `Workspace/EditorPackage.lean`, which the package-set
#   build reads. It has no root module (`Workspace.lean`), so its `globs` hold
#   every module under `Workspace` and none at the root, and the library's
#   build reaches each one. It implements the interface package `project-api`
#   (`ProjectApi`) and reads version control through the interface package
#   `vc-api` (`VcApi`), both of which it requires, beside the core.
# - `workspace-test` is its test driver (`lake test`): the tests that need
#   no Rust library, rooted at `WorkspaceTest/Model.lean`. It is no default
#   target, as the core's `model-test` is not: `mise run lean` links with the
#   system compiler, which this executable has no flags for.
# - `WorkspaceTest` holds the test modules, the workspace's test kit
#   (`WorkspaceTest/Kit.lean`), the finder's pure model and its contract
#   (`WorkspaceTest/Finder/`), and `WorkspaceTest/Linked.lean`: the root of
#   the executable the core's `editorLinked` facet links as the editor is
#   linked, with the Rust library. It runs the finder, its contract and the
#   listers over the library's process and file services, with the fixtures
#   under `tests/` standing in for git and fzf, and holds the workspace
#   finder's benchmark as an opt-in argument (`mise run find-file-bench`).
#
# It has no headless fixture of its own: the core's fixtures
# tests/headless/finder-session and the others that open files in a
# workspace run on the default set's editor.
#
# Every Lean linter is on and a warning fails the build, as in the core,
# and the build's own linters, the wait linters, are loaded as a Lean plugin
# as the core's libraries load them (`plugins`; lean/Lint/Wait.lean).
#
# It is an implementation package (docs/design/extension-points.md, "Three
# layers"): it declares no `keywords`, so no package may import its modules,
# and the three-layer rule (.agents/rules/structure.md) holds it to that.
#
# After changing a `require`, run in lean/:
#   lake -d ../packages/workspace update --keep-toolchain
# then the same for every set that reaches this package (../, tests/packages), and commit each lake-manifest.json.
name = "workspace"
testDriver = "«workspace-test»"
defaultTargets = ["Workspace", "WorkspaceTest"]
leanOptions = { linter.all = true, warningAsError = true }
plugins = ["@editor-core/lintShared"]

# The interface package this one implements: it declares the reach of the
# workspace at a path and the names others reach, and publishes the fake and
# the contract check this package's tests run.
[[require]]
name = "project-api"
path = "../project-api"

# The interface package of version control: the port it reads a
# repository through, the backend point and the names, and the model and
# contract its tests run on.
[[require]]
name = "vc-api"
path = "../vc-api"

# The interface package of the compile mode: the marker modes the marker
# search looks for are those of the contributions registered at its
# extension point (`Workspace.markerSettings`), the on-modes it turns on
# are its (`Workspace.turnOnModes`), and its tests run on its listing kit.
[[require]]
name = "compile-api"
path = "../compile-api"

[[require]]
name = "editor-core"
path = "../../lean"

[[lean_lib]]
name = "Workspace"
globs = ["Workspace.+"]

[[lean_lib]]
name = "WorkspaceTest"
globs = ["WorkspaceTest.+"]

[[lean_exe]]
name = "workspace-test"
root = "WorkspaceTest.Model"
