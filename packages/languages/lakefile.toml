# The languages that ship, with the `code` mode: a default package, a Lake
# package outside the core that the default package set requires
# (../lakefile.toml; docs/design/packages.md, "The package set and its
# build"). It was a module of the core, `Editor.Language.Compiled`, until the
# features-as-packages roadmap's phase 3. The gate's package steps build,
# test, lint and format-check it through the fixture set, which requires the
# default set (tools/package-set.sh), and review holds what it imports of the
# core to the rule in `.agents/rules/structure.md`.
#
# - `Languages` is the package's library: `Languages/Compiled.lean`, the
#   `Package` value, and its entry module `Languages/EditorPackage.lean`,
#   which the package-set build reads. Its `globs` hold every module under
#   `Languages`, so the library's build reaches each one. The data it
#   registers, the `code` mode and the shipped languages, is the core's
#   (`lean/Editor/Language.lean`): the core's file commands, loop and tests
#   read it.
# - `languages-test` is its test driver (`lake test`): the tests that need
#   no Rust library, rooted at `LanguagesTest/Model.lean`. It is no default
#   target, as the core's `model-test` is not: `mise run lean` links with
#   the system compiler, which this executable has no flags for.
# - `LanguagesTest` holds the test modules.
#
# It has no headless fixture: what it registers is pinned by its model
# test.
#
# Every Lean linter is on and a warning fails the build, as in the core,
# and the build's own linters, the wait linters, are loaded as a Lean plugin
# as the core's libraries load them (`plugins`; lean/Lint/Wait.lean).
#
# It is an implementation package (docs/design/extension-points.md, "Three
# layers"): it declares no `keywords`, so no package may import its modules,
# and the three-layer rule (.agents/rules/structure.md) holds it to that.
#
# After changing a `require`, run in lean/:
#   lake -d ../packages/languages update --keep-toolchain
# then the same for every set that reaches this package (../, tests/packages), and commit each lake-manifest.json.
name = "languages"
testDriver = "«languages-test»"
defaultTargets = ["Languages", "LanguagesTest"]
leanOptions = { linter.all = true, warningAsError = true }
plugins = ["@editor-core/lintShared"]

[[require]]
name = "editor-core"
path = "../../lean"

[[lean_lib]]
name = "Languages"
globs = ["Languages.+"]

[[lean_lib]]
name = "LanguagesTest"
globs = ["LanguagesTest.+"]

[[lean_exe]]
name = "languages-test"
root = "LanguagesTest.Model"
