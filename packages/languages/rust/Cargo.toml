[package]
name = "languages-grammar-sources"
version = "0.1.0"
description = "The languages package's grammar sources: a build-time crate whose build script compiles each grammar the package ships from pinned source, and whose binary the set's build runs to stage the libraries; never linked into the editor"
edition.workspace = true
license.workspace = true
publish = false

# Each grammar from crates.io is a build-dependency: that gets its crate
# locked in the root lock and fetched with the rest (`cargo fetch
# --locked`), and lets `editor-grammar-build` find its directory with
# `cargo metadata`. Its own build compiles its C once more, into an archive
# nothing links. In the dev profile that archive is the very unit the test
# fixture `editor-syntax-fixture-grammars` builds for its own build script,
# since both take the grammar at the same pin and features; in release it
# is compiled at the build-override's opt-level 0 and wasted. Cargo runs
# those builds in parallel; the build script compiles each library once
# more, at `OPT_LEVEL`, one grammar after another. The crates.io grammars
# are about 99 MB of C together, most of it the popular languages' (swift
# 23 MB, typescript and tsx 18 MB, cpp 17 MB, ruby 15 MB), though a parser
# is mostly tables and compiles in under 2 s; the vendored Lean grammar,
# 49 MB, is no dependency at all but a directory the build script compiles
# (`build.rs`), so no build compiles its archive (docs/design/packages.md,
# "A package's grammars", "From source", which records the set's build
# time and the staged size, and the two savings set aside: skipping the
# wasted archives, and compiling the libraries in parallel). Each grammar
# added here gets its
# line in this crate's `deny.toml` and in the grammars table of the
# package's README.md.
#
# The six grammars before `yaml` were compiled into the syntax adapter
# (`crates/editor-syntax-treesitter`) until the shipped-grammars roadmap's
# phase 4, and their pins, the reparse policies their declarations give
# (`Languages/Grammars.lean`) and the alternatives set aside moved here with
# them.
[build-dependencies]
# Compiles the package's grammars from the build script: the one crate of
# the editor's this crate may reach, and that only at build time
# (`deny.toml`).
editor-grammar-build = { path = "../../../crates/editor-grammar-build" }
# The grammar `rust`, for the editor's own language. Each grammar crate
# depends only on `tree-sitter-language`, so they and the syntax adapter's
# tree-sitter are pinned independently. MIT, used unmodified; the newest
# release on 2026-11-16. Its notice is at
# `grammars/licenses/tree-sitter-rust`.
tree-sitter-rust = { version = "=0.24.2" }
# The grammar `json`, the grammar the Lean model reproduces in pure Lean
# (`lean/Editor/SyntaxTree/Model.lean`), so the Lean contract compares the
# model and the library answer for answer. MIT, used unmodified; the newest
# release on 2026-11-16. Its crate ships no `LICENSE`: the notice at
# `grammars/licenses/tree-sitter-json` is upstream's, at the tag `v0.24.8`.
tree-sitter-json = { version = "=0.24.8" }
# The grammars `markdown` and `markdown_inline`, for documents and for the
# code in their fences, which the block grammar's own injections query
# hands to the grammar its info string names
# (`docs/design/rust-library.md`, "Injections, indentation and text
# objects, as built"). It is the tree-sitter-grammars project's grammar, the
# one nvim, Helix and Zed use. MIT, used unmodified; 0.5.4, released on
# 2026-10-24, was the newest release when looked at on crates.io on
# 2026-11-16. The crate holds both grammars, block and inline, each with
# its external scanner, each in a subdirectory of its own, and the build
# script compiles each (`Grammar::package_in`). Its crate ships no
# `LICENSE`: the notice at `grammars/licenses/tree-sitter-md` is upstream's,
# at the tag `v0.5.4`.
#
# Its one feature, `parser`, is off (the crate has no default features): it
# only turns on an optional dependency on tree-sitter for a
# `MarkdownParser` wrapper nothing uses. So its dependencies are
# `tree-sitter-language` and `cc` at build time, both already in the graph.
# The test fixture takes it with the same features, so the two share one
# unit of it in the dev profile.
#
# The inline grammar is `markdown_inline`, the name the block grammar's
# injections query gives each `(inline)` node, so inline Markdown is an
# injected layer. Its reparse policy is `whole`: its incremental reparses
# of texts without errors differ from a fresh parse (598 of 4,000 reparses
# of random edits on 2026-11-16, and 136 of 6,400 in a second sweep that
# day), so it fails the syntax contract's `GRAMMAR_QUALITY`, and each round
# parses it from scratch. The block grammar's 6,000 reparses all equalled
# the fresh parse, and it is `incremental`.
tree-sitter-md = { version = "=0.5.4", default-features = false }
# The grammar `toml`, for manifests and settings: `Cargo.toml`,
# `mise.toml`, `lakefile.toml` and `Cargo.lock`. It is the
# tree-sitter-grammars project's grammar, the continuation of ikatyang's
# original and the same project as `tree-sitter-md`; the most used TOML
# grammar crate. MIT, used unmodified; 0.7.0, released on 2024-12-03, was
# the newest release when looked at on crates.io on 2026-11-17, and the
# repository's last commit is its tag (TOML 1.0 is a stable spec). The
# build script compiles the grammar's `parser.c` and its external scanner
# `scanner.c`. It has no features; its one normal dependency is
# `tree-sitter-language`, and `cc` at build time, both already in the graph
# (its `tree-sitter ^0.24` is a dev-dependency only). It ships a highlights
# query and no other, so TOML has no injections, indents or text objects.
# Its crate ships no `LICENSE`: the notice at
# `grammars/licenses/tree-sitter-toml-ng` is upstream's, at the tag
# `v0.7.0`.
#
# Its reparse policy is `incremental`: on 2026-11-17, 4,221 incremental
# reparses of texts without errors, of random edits to the fixtures under
# `tests/syntax/toml/`, all equalled a fresh parse, and the syntax
# contract passed with the policy `incremental`.
#
# Looked at on 2026-11-17 and set aside:
#
# - `tree-sitter-toml` 0.20.0 (2022): a normal dependency on
#   `tree-sitter ^0.20`, and the old `language()` function, so it cannot
#   hand a `LanguageFn` to the pinned tree-sitter.
# - `tree-sitter-toml-updated` 0.20.0: a personal fork with a normal
#   dependency on `tree-sitter >=0.21` and the same old API.
# - `treease-ts-toml` 0.7.2: a third party's republish of the same
#   repository, with no grammar change over 0.7.0 (upstream has no commit
#   after its tag), from a publisher that is not the project.
# - `konomanoasa-tree-sitter-toml` 0.11.2: a personal fork with few users,
#   which pins `cc =1.11.0` exactly and so would move the locked `cc`.
tree-sitter-toml-ng = { version = "=0.7.0" }
# The grammar `lean`, for the editor's own configuration and most of its
# code, is no dependency: the build script compiles it from the directory
# `vendor/tree-sitter-lean/` (`Grammar::directory`), so no build compiles
# an archive of its 49 MB `parser.c` that nothing links. It is upstream's
# grammar, `github.com/Julian/tree-sitter-lean`, the original Lean 4
# grammar, maintained (commits through November 2026). No crates.io crate
# fits, so upstream's own crate (`tree-sitter-lean` 0.2.0) is vendored at
# commit `0d28e5d6e8c4755f5df7ef9bde3b6ec6f59fae94` (2026-11-01);
# `vendor/README.md` holds the version and says how to update it. MIT, used
# unmodified; its `LICENSE` is in the copy and at
# `grammars/licenses/tree-sitter-lean`. Its generated `parser.c` is ABI 15,
# and it has an external scanner `scanner.c`.
#
# It ships its highlights query in the same commit as the grammar, so the
# query cannot drift from the node types; that is the one query used,
# copied to `grammars/queries/lean/`. Its injections query (doc comments as
# Markdown) is not used: under it each doc comment is a Markdown layer, and
# its inline layers, parsed whole every round, and doc comments already
# draw as comments (`docs/design/rust-library.md`, "Injections, indentation
# and text objects, as built"). Its indents, folds and locals queries are
# not used.
#
# Its reparse policy is `incremental`: on 2026-11-17, 6,894 incremental
# reparses of texts without errors, of random edits to the fixtures under
# `tests/syntax/lean/` and to the 20 files of `lean/Editor/` that parse
# without errors, all equalled a fresh parse, and the syntax contract
# passed with the policy `incremental`.
#
# Looked at on 2026-11-17 and set aside:
#
# - `tree-sitter-lean4` 0.3.0, the only Lean grammar crate on crates.io: a
#   normal dependency on `tree-sitter ^0.25`, which cannot coexist with the
#   pinned library (both `links = "tree-sitter"`), an exported
#   `tree_sitter::Language` of 0.25 rather than a `LanguageFn`, a build that
#   runs the tree-sitter CLI when `parser.c` is missing, and no queries.
# - Its source, the fork `wvhulle/tree-sitter-lean`, vendored instead: it
#   parses this repository's Lean with fewer errors, but has no licence file
#   to vendor (MIT is only declared), no commits since May 2026, and a Rust
#   binding for tree-sitter 0.25, so we would keep an `unsafe` one of our
#   own.
# - A git dependency on upstream: it would make a fetch from GitHub part of
#   a `--locked` build.
# - A path dependency on the vendored copy, as the syntax adapter had while
#   it compiled the grammar in: its own build would compile the 49 MB parser
#   into an archive nothing links, the largest compile in the tree.
#
# The grammar `yaml`: tree-sitter-grammars' YAML grammar, released
# 2025-10-07, the newest on crates.io. Its parser is ABI 14, which the
# pinned tree-sitter (0.27.2) loads; its one normal dependency is
# `tree-sitter-language ^0.1`, already locked. MIT, used unmodified; its
# notice travels with the library at `grammars/licenses/tree-sitter-yaml`.
tree-sitter-yaml = { version = "=0.7.2" }
# The popular languages (the shipped-grammars roadmap's phase 5): java,
# swift, ruby, python, javascript, typescript and tsx, c, cpp and
# clojure_orchard, each looked at on crates.io on 2026-11-27 and each the
# newest release then. Each depends on `tree-sitter-language ^0.1` alone
# (normal) and on `cc` (build), both already locked, so none has a
# `tree-sitter` normal dependency (its `tree-sitter` is a dev-dependency)
# and none can clash with the pinned library over `links = "tree-sitter"`.
# Each ships a generated `parser.c`, any external scanner is a `scanner.c`,
# and each loads into the pinned tree-sitter (0.27.2), so none is vendored:
# each builds as published, and is used unmodified.
#
# Each declares no reparse policy, so it is reparsed whole each round, as
# `yaml` is: each former built-in's `incremental` was earned by a sweep of
# incremental reparses against fresh parses (above), and a sweep each is
# the rdm task `languages-reparse-policies`. Whole is always correct; its
# cost is a whole parse on the syntax worker each round.
#
# Each ships its highlights query, copied to `grammars/queries/<name>/`
# byte for byte or, where the grammar's own `tree-sitter.json` names
# several files, joined from them in its order with nothing between
# (`packages/languages/README.md` names the parts). Locals and tags are
# never shipped: the editor reads only highlights, injections, indents and
# text objects (`Language.Grammar.queryFiles`). No grammar here ships an
# indents or text-objects query in the editor's names, so none ships one.
#
# The grammar `java`: the tree-sitter org's Java grammar, 0.23.5, released
# 2024-12-21. ABI 14. MIT; its crate ships no `LICENSE`: the notice at
# `grammars/licenses/tree-sitter-java` is upstream's, at the tag
# `v0.23.5`. It ships `highlights.scm`.
tree-sitter-java = { version = "=0.23.5" }
# The grammar `swift`: alex-pinkus's Swift grammar, the one nvim, Helix
# and Zed use, 0.7.4, released 2026-10-04. ABI 15. MIT; the notice at
# `grammars/licenses/tree-sitter-swift` is the crate's `LICENSE`. The crate
# also holds a `node_modules/` of four `LICENSE` files and a `Cargo.lock`,
# neither compiled nor shipped. It ships `highlights.scm` and
# `injections.scm`. Its `indents.scm` is nvim-treesitter's rule
# (`@indent.end`, `@indent.dedent`, `@indent.auto`, `#set!
# indent.immediate`), not the five names `Editor/Indent.lean` reads with
# rules of its own, so half-read it would indent wrongly; its
# `textobjects.scm` is Helix's names (`@function.around`,
# `@function.inside`), which the editor's text objects do not read; its
# folds, outline and locals are read by nothing. None of them ships.
tree-sitter-swift = { version = "=0.7.4" }
# The grammar `ruby`: the tree-sitter org's Ruby grammar, 0.23.1, released
# 2024-11-11. ABI 14. MIT; its crate ships no `LICENSE`: the notice at
# `grammars/licenses/tree-sitter-ruby` is upstream's, at the tag
# `v0.23.1`. It ships `highlights.scm`.
tree-sitter-ruby = { version = "=0.23.1" }
# The grammar `python`: the tree-sitter org's Python grammar, 0.25.0,
# released 2025-09-11. ABI 15. MIT; the notice at
# `grammars/licenses/tree-sitter-python` is the crate's `LICENSE`. It ships
# `highlights.scm`.
tree-sitter-python = { version = "=0.25.0" }
# The grammar `javascript`, which covers `.jsx` too: the tree-sitter org's
# JavaScript grammar, 0.25.0, released 2025-09-01. ABI 15. MIT; the notice
# at `grammars/licenses/tree-sitter-javascript` is the crate's `LICENSE`.
# It ships `injections.scm` and a `highlights.scm` joined from the crate's
# `highlights.scm`, `highlights-jsx.scm` and `highlights-params.scm`, its
# `tree-sitter.json`'s order. Its `highlights.scm` and `injections.scm` are
# parts of the TypeScript grammars' queries too.
tree-sitter-javascript = { version = "=0.25.0" }
# The grammars `typescript` and `tsx`: the tree-sitter org's TypeScript
# grammars, 0.23.2, released 2024-11-11. ABI 14. MIT; its crate ships no
# `LICENSE`: the notice at `grammars/licenses/tree-sitter-typescript` is
# upstream's, at the tag `v0.23.2`. The crate holds both grammars, each in
# a subdirectory of its own (`typescript/`, `tsx/`), and the build script
# compiles each (`Grammar::package_in`); each scanner includes
# `../../common/scanner.h`, which resolves beside them. Each ships a
# `highlights.scm` joined in the order of upstream's `tree-sitter.json` at
# `v0.23.2`: TypeScript's `highlights.scm`, then JavaScript's (for `tsx`,
# its `highlights-jsx.scm` first); and JavaScript's `injections.scm`, as
# that config names. Upstream names a `^0.23.1` JavaScript peer; the parts
# are the 0.25.0 we ship, and they compile against both grammars.
#
# Looked at and set aside: `tree-sitter-typescript-next` 0.25.4, a third
# party's republish (28 downloads, 2026-11-25), not the tree-sitter org's
# crate.
tree-sitter-typescript = { version = "=0.23.2" }
# The grammar `c`: the tree-sitter org's C grammar, 0.24.2, released
# 2026-04-22. ABI 15. MIT; the notice at `grammars/licenses/tree-sitter-c`
# is the crate's `LICENSE`. It ships `highlights.scm`, which is the first
# part of `cpp`'s too.
tree-sitter-c = { version = "=0.24.2" }
# The grammar `cpp`: the tree-sitter org's C++ grammar, 0.23.4, released
# 2024-11-11. ABI 14. MIT; its crate ships no `LICENSE`: the notice at
# `grammars/licenses/tree-sitter-cpp` is upstream's, at the tag `v0.23.4`.
# It ships `injections.scm` and a `highlights.scm` joined, in its
# `tree-sitter.json`'s order, from `tree-sitter-c` 0.24.2's
# `highlights.scm` and its own.
tree-sitter-cpp = { version = "=0.23.4" }
# The grammar `clojure_orchard`, for the language `clojure`:
# grammar-orchard's Clojure grammar, sogaiu's archived `tree-sitter-clojure`
# continued, 0.2.9, released 2026-10-29. ABI 14. CC0-1.0, a public-domain
# dedication; the notice at `grammars/licenses/tree-sitter-clojure-orchard`
# is the crate's `LICENSE`. It ships `highlights.scm`. Its library exports
# `tree_sitter_clojure_orchard`, and a declaration's symbol must register
# its declared name, so the grammar is `clojure_orchard` and its language
# `clojure` names it.
#
# Looked at on 2026-11-27 and set aside:
#
# - `tree-sitter-clojure` 0.1.0, a personal fork (`jerielverissimo`): a
#   normal dependency on `tree-sitter ^0.25.6`, which cannot coexist with
#   the pinned 0.27.2 (both `links = "tree-sitter"`).
# - Vendoring sogaiu's archived `tree-sitter-clojure`, for the symbol
#   `tree_sitter_clojure`: the crates.io continuation builds as published,
#   and a grammar is vendored only when it does not.
tree-sitter-clojure-orchard = { version = "=0.2.9" }

[dev-dependencies]
# The temporary directory the on-demand install check
# (`tests/default_install.rs`, `mise run languages-install-check`) lays a
# config and an install out in, pinned as every crate of the workspace pins
# it, with its default features off as they do.
tempfile = { version = "=3.27.0", default-features = false }

[lints]
workspace = true
