# The menu bar that ships: the standard menu (the application's menu, File,
# Edit and Window) and the key bindings of its File and Edit items: a default
# package, a Lake package outside the core that the default package set
# requires (../lakefile.toml; docs/design/packages.md, "The package set and
# its build"). It was a module of the core, `Editor.Menu.Compiled`, until the
# features-as-packages roadmap's phase 8. The gate's package steps build,
# test, lint and format-check it through the fixture set, which requires the
# default set (tools/package-set.sh), and review holds what it imports of the
# core to the rule in `.agents/rules/structure.md`.
#
# - `Menu` is the package's library: `Menu/Compiled.lean`, the standard menu
#   and the `Package` value, and its entry module `Menu/EditorPackage.lean`,
#   which the package-set build reads. Its `globs` hold every module under
#   `Menu`, so the library's build reaches each one. The menu's types and what
#   a registry makes of a menu are the core's (`lean/Editor/Menu.lean`,
#   `lean/Editor/Config/Registry.lean`). Its items name commands of other
#   packages by the constants of the interfaces that declare them: the core's
#   `files-api` and clipboard names, `evil-api`'s `undo` and `redo`, and
#   `frame-commands-api`'s `minimise-window` and `toggle-fullscreen`, the two
#   interface packages it requires.
# - `menu-test` is its test driver (`lake test`): the tests that need no
#   Rust library, rooted at `MenuTest/Model.lean`. It is no default target,
#   as the core's `model-test` is not: `mise run lean` links with the
#   system compiler, which this executable has no flags for.
# - `MenuTest` holds the test modules.
#
# It has no headless fixture of its own.
#
# Every Lean linter is on and a warning fails the build, as in the core,
# and the build's own linters, the wait linters, are loaded as a Lean plugin
# as the core's libraries load them (`plugins`; lean/Lint/Wait.lean).
#
# It is an implementation package (docs/design/extension-points.md, "Three
# layers"): it declares no `keywords`, so no package may import its modules,
# and the three-layer rule (.agents/rules/structure.md) holds it to that.
# Nothing reaches the menu by name, so it has no interface package.
#
# After changing a `require`, run in lean/:
#   lake -d ../packages/menu update --keep-toolchain
# then the same for every set that reaches this package (../, tests/packages), and commit each lake-manifest.json.
name = "menu"
testDriver = "«menu-test»"
defaultTargets = ["Menu", "MenuTest"]
leanOptions = { linter.all = true, warningAsError = true }
plugins = ["@editor-core/lintShared"]

# The interface package of evil: the names `undo` and `redo`, which the
# Edit menu's Undo and Redo, and `s-z` and `s-Z`, run.
[[require]]
name = "evil-api"
path = "../evil-api"

# The interface package of the frame commands: the names `minimise-window`
# and `toggle-fullscreen`, which the Window menu's Minimise and Enter Full
# Screen run.
[[require]]
name = "frame-commands-api"
path = "../frame-commands-api"

[[require]]
name = "editor-core"
path = "../../lean"

[[lean_lib]]
name = "Menu"
globs = ["Menu.+"]

[[lean_lib]]
name = "MenuTest"
globs = ["MenuTest.+"]

[[lean_exe]]
name = "menu-test"
root = "MenuTest.Model"
