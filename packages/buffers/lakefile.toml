# The buffer commands, `switch-buffer`, `list-buffers` and `close-buffer`,
# with the buffer source: a default package, a Lake package outside the core
# that the default package set requires (../lakefile.toml;
# docs/design/packages.md, "The package set and its build"). It was two
# modules of the core, `Editor.Buffers` and `Editor.Buffers.Compiled`, until
# the features-as-packages roadmap's phase 6. The gate's package steps build,
# test, lint and format-check it through the fixture set, which requires the
# default set (tools/package-set.sh), and review holds what it imports of the
# core to the rule in `.agents/rules/structure.md`.
#
# - `Buffers` is the package's library: `Buffers.lean`, the commands,
#   `Buffers/Compiled.lean`, the `Package` value, and its entry module
#   `Buffers/EditorPackage.lean`, which the package-set build reads. Its
#   `globs` hold every module under `Buffers`, so the library's build reaches
#   each one. It implements the interface package `buffers-api` (`BuffersApi`,
#   staged in the core until the ex line, which binds `b`, `ls` and `bd` to
#   its names, moved out), which it requires, beside the core.
# - `buffers-test` is its test driver (`lake test`): the tests that need no
#   Rust library, rooted at `BuffersTest/Model.lean`. It is no default
#   target, as the core's `model-test` is not: `mise run lean` links with
#   the system compiler, which this executable has no flags for.
# - `BuffersTest` holds the test modules.
#
# It has no linked test and no headless fixture: what it registers is
# pinned by its model test, and the default editor's buffer keys by the
# core's fixture tests/headless/default-config, which runs on the default
# set's editor.
#
# Every Lean linter is on and a warning fails the build, as in the core,
# and the build's own linters, the wait linters, are loaded as a Lean plugin
# as the core's libraries load them (`plugins`; lean/Lint/Wait.lean).
#
# It is an implementation package (docs/design/extension-points.md, "Three
# layers"): it declares no `keywords`, so no package may import its modules,
# and the three-layer rule (.agents/rules/structure.md) holds it to that.
#
# After changing a `require`, run in lean/:
#   lake -d ../packages/buffers update --keep-toolchain
# then the same for every set that reaches this package (../, tests/packages,
# tests/user-link), and commit each lake-manifest.json.
name = "buffers"
testDriver = "«buffers-test»"
defaultTargets = ["Buffers", "BuffersTest"]
leanOptions = { linter.all = true, warningAsError = true }
plugins = ["@editor-core/Lint:shared"]

# The interface package this one implements: the hook before a buffer
# closes, the close others ask for, the names the ex names `b`, `ls` and
# `bd` run, its fake and the contract check this package's tests run.
[[require]]
name = "buffers-api"
path = "../buffers-api"

[[require]]
name = "editor-core"
path = "../../lean"

[[lean_lib]]
name = "Buffers"
globs = ["Buffers.*"]

[[lean_lib]]
name = "BuffersTest"
globs = ["BuffersTest.+"]

[[lean_exe]]
name = "buffers-test"
root = "BuffersTest.Model"
