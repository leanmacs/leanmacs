# The tab commands: the commands that open, close, select, rename and move
# the frame's tabs, and the completion source of the tabs: a default
# package, a Lake package outside the core that the default package set
# requires (../lakefile.toml; docs/design/packages.md, "The package set and
# its build"). It was two modules of the core, `Editor.TabCommands` and
# `Editor.TabCommands.Compiled`, until the features-as-packages roadmap's
# phase 8. The gate's package steps build, test, lint and format-check it
# through the fixture set, which requires the default set
# (tools/package-set.sh), and the package imports check holds what it
# imports of the core (tools/package-imports-check.sh).
#
# - `TabCommands` is the package's library: `TabCommands.lean`, the
#   commands and their source, `TabCommands/Compiled.lean`, the `Package`
#   value, and its entry module `TabCommands/EditorPackage.lean`, which the
#   package-set build reads. Its `globs` hold every module under
#   `TabCommands`, so the package imports check sees each one's imports. It
#   implements the interface package `tab-commands-api` (`TabCommandsApi`),
#   which declares the commands' names and which it requires, beside the
#   core.
# - `tab-commands-test` is its test driver (`lake test`): the tests that
#   need no Rust library, rooted at `TabCommandsTest/Model.lean`. It is no
#   default target, as the core's `model-test` is not: `mise run lean`
#   links with the system compiler, which this executable has no flags for.
# - `TabCommandsTest` holds the test modules.
#
# It has no headless fixture of its own: the core's fixture
# `tests/headless/tabs`, which runs on the default set's editor, opens,
# selects and closes tabs through it.
#
# Every Lean linter is on and a warning fails the build, as in the core,
# and the build's own linters, the wait linters, are loaded as a Lean plugin
# as the core's libraries load them (`plugins`; lean/Lint/Wait.lean).
#
# It is an implementation package (docs/design/extension-points.md, "Three
# layers"): it declares no `keywords`, so no package may import its modules,
# and the layer imports check holds it to that (tools/layer-imports-check.sh).
#
# After changing a `require`, run in lean/:
#   lake -d ../packages/tab-commands update --keep-toolchain
# then the same for every set that reaches this package (../, tests/packages,
# tests/user-link, tests/layer-imports), and commit each lake-manifest.json.
name = "tab-commands"
testDriver = "«tab-commands-test»"
defaultTargets = ["TabCommands", "TabCommandsTest"]
leanOptions = { linter.all = true, warningAsError = true }
plugins = ["@editor-core/lintShared"]

# The interface package of the tab commands: their names, its fake and the
# contract check this package's tests run.
[[require]]
name = "tab-commands-api"
path = "../tab-commands-api"

[[require]]
name = "editor-core"
path = "../../lean"

[[lean_lib]]
name = "TabCommands"
globs = ["TabCommands.*"]

[[lean_lib]]
name = "TabCommandsTest"
globs = ["TabCommandsTest.+"]

[[lean_exe]]
name = "tab-commands-test"
root = "TabCommandsTest.Model"
