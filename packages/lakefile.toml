# The default package set: what the editor is built from
# (docs/design/packages.md, "The package set and its build").
#
# A package set is a Lake package whose `require`s are the set. It declares
# no target and holds no Lean source: the core defines the build
# (lean/lakefile.lean). In lean/, `lake -d ../packages build :editor`
# (`mise run lean`) writes a root module from the entry modules of the
# packages required here, each after the packages it requires, builds it and
# links packages/.lake/build/bin/editor; `:editorApp` makes the app bundle
# from it (`mise run app`).
#
# It requires the core and each default package. A default package has a
# directory here and a `require` below: the buffer commands (buffers/), the
# completion styles and displays
# (completion/, with its interface package completion-api/, which it
# requires), the mode line's segments (mode-line/), the minibuffer's
# commands and its mode (minibuffer/, with minibuffer-api/), the shipped
# themes (shipped-themes/), the command prompt
# (execute-command/, with its interface package execute-command-api/,
# which it requires), the binding search (binding-search/, with
# binding-search-api/), the compile mode (compile/), completion at point
# (at-point/, with at-point-api/), then the languages (languages/). They register in that order, after the core's. Every other
# feature is still a package of the core's Lake package
# (lean/EditorCore/EditorPackage.lean). This is also the lakefile a user's
# package set starts from.
#
# After changing a `require`, run in lean/:
#   lake -d ../packages update --keep-toolchain
# and commit lake-manifest.json, here and in every set that requires this
# one (tests/packages/, tests/user-link/): a build fetches nothing and fails on a dependency
# its manifest does not hold.
name = "default-set"

[[require]]
name = "editor-core"
path = "../lean"

# The buffer commands, `switch-buffer`, `list-buffers` and
# `close-buffer`: the first default package (features-as-packages phase 6,
# D5: the features that left the core's list register first, in the core's
# order). It implements the core's interface library buffers-api.
[[require]]
name = "buffers"
path = "buffers"

# The completion styles and displays that ship, `fuzzy`, `orderless`,
# `path` and `minibuffer`: the first default package to register a style or
# a display, so its style and its display are the first registered and the defaults. It requires its
# interface package, completion-api, which so is in the set too and
# registers nothing.
[[require]]
name = "completion"
path = "completion"

# The segments of the mode line that ship: a default package.
[[require]]
name = "mode-line"
path = "mode-line"

# The minibuffer's commands, which answer a prompt, and its mode: a
# default package. It requires its interface package,
# minibuffer-api, which so is in the set too and registers nothing; the
# command prompt, the binding search and the compile mode require it too,
# for their tests.
[[require]]
name = "minibuffer"
path = "minibuffer"

# The shipped themes, Solarized and Fairy Floss: a default package.
[[require]]
name = "shipped-themes"
path = "shipped-themes"

# The command prompt, `execute-command`: a default package. It
# requires its interface package, execute-command-api, which so is in the
# set too and registers nothing.
[[require]]
name = "execute-command"
path = "execute-command"

# The binding search, `search-bindings`: a default package. It
# requires its interface package, binding-search-api, which so is in the
# set too and registers nothing.
[[require]]
name = "binding-search"
path = "binding-search"

# The compile mode, `compile` into a workspace's compilation buffer, with
# the modes that ship (cargo, lake, mise): a default package.
[[require]]
name = "compile"
path = "compile"

# Completion at point, its commands and the source `words`: a
# default package. It requires its interface package, at-point-api, which
# so is in the set too and registers nothing.
[[require]]
name = "at-point"
path = "at-point"

# The languages that ship and the `code` mode: a default package.
[[require]]
name = "languages"
path = "languages"
