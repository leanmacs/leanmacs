# The default package set: what the editor is built from
# (docs/design/packages.md, "The package set and its build").
#
# A package set is a Lake package whose `require`s are the set. It declares
# no target and holds no Lean source: the core defines the build
# (lean/lakefile.lean). In lean/, `lake -d ../packages build :editor`
# (`mise run lean`) writes a root module from the entry modules of the
# packages required here, each after the packages it requires, builds it and
# links packages/.lake/build/bin/editor; `:editorApp` makes the app bundle
# from it (`mise run app`).
#
# It requires the core alone for now: every feature is still a package of
# the core's Lake package (lean/EditorCore/EditorPackage.lean). A default
# package gets a directory here and a `require` below. This is also the
# lakefile a user's package set starts from.
#
# After changing a `require`, run in lean/:
#   lake -d ../packages update --keep-toolchain
# and commit lake-manifest.json, here and in every set that requires this
# one (tests/packages/): a build fetches nothing and fails on a dependency
# its manifest does not hold.
name = "default-set"

[[require]]
name = "editor-core"
path = "../lean"
