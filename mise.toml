  # required too: the fixture package's check against the Rust library, as
  # `ffi-test` is the core's, and its check of a config session on the real
  # elaborator, as `config-test` is the core's; the shipped themes'
  # pictures against their reference images
  # (packages/shipped-themes/tests/render/README.md); and the compile
  # mode's seven checks: a compile and the shipped modes over the real
  # process service, on the package's fixtures
  # (packages/compile/tests/compile/README), and a compile in a headless
  # host (packages/compile/CompileTest/Linked.lean). The compile mode's
  # fixtures were written against the editor with the compile mode still in
  # the core, and moved into the package unchanged: `ex-names`, each of its
  # six ex names reaching its command, and `config`, a config written on
  # the package's declarations, which elaborates because the set's config
  # base holds the package's entry module. `shipped-formats` was written
  # after the move: the shipped modes' formats (rustc's for cargo-mode,
  # Lean's for lake-mode, and cargo-mode's reading a mise task's output)
  # read canned output of each tool into locations, and mise-mode's reader
  # turns a canned task list into commands, with no process and no path of
  # the machine; what it prints was compared with what an editor built at
  # the commit before the move prints for it.
  "out=$(sh ../tools/package-set.sh run ../tests/packages \"$(lean --print-prefix)\" .lake/build/lib/lean) || { printf '%s\\n' \"$out\"; exit 1; }; printf '%s\\n' \"$out\"; for line in 'package-set: linked test ExTest.Linked of ex' 'ex linked test: 9 checks passed' 'package-set: linked test EvilTest.Linked of evil' 'evil linked test: 20 checks passed' 'package-set: linked test ThemesTest.Linked of themes' 'themes linked test: 3 checks passed' 'package-set: linked test FilesTest.Linked of files' 'files linked test: 25 checks passed' 'package-set: linked test WorkspaceTest.Linked of workspace' 'workspace linked test: 21 checks passed' 'package-set: linked test ProjectSearchTest.Linked of project-search' 'project-search linked test: 1 checks passed' 'package-set: linked test WorkingSetTest.Linked of working-set' 'working-set linked test: 1 checks passed' 'package-set: linked test ShellTest.Linked of shell' 'shell linked test: 2 checks passed' 'package-set: linked test VersionControlTest.Linked of version-control' 'version-control linked test: 89 checks passed' 'package-set: linked test GreetingTest.Linked of greeting' 'greeting linked test: the Rust library holds \"hello from the greeting package!\"' 'greeting linked test: config bound a key to greeting-hello and the config session ran it' 'package-set: headless fixture hello of greeting' 'package-set: headless fixture reply of greeting-loud' 'package-set: linked test EchoTest.Linked of echo' \"echo linked test: the contract's 7 properties hold on the Rust-backed binding, each request completed through the completion queue\" 'package-set: linked test CompletionTest.Linked of completion' 'completion linked test: 6 checks passed' 'package-set: headless fixture completion-choices of completion' 'package-set: linked test ShippedThemesTest.Linked of shipped-themes' \"shipped-themes linked test: solarized-dark, solarized-light and fairy-floss match their reference images; in each the paper, the cursor and the text carry the palette's colours; the picture of solarized-light is not the reference of solarized-dark\" 'package-set: headless fixture load-theme of shipped-themes' 'package-set: headless fixture package-names of shipped-themes' 'package-set: headless fixture shipped-themes of shipped-themes' 'package-set: headless fixture themes of shipped-themes' 'package-set: linked test CompileTest.Linked of compile' 'compile linked test: 7 checks passed' 'package-set: headless fixture config of compile' 'package-set: headless fixture ex-names of compile' 'package-set: headless fixture mode-line of mode-line' 'package-set: headless fixture candidates of minibuffer' 'package-set: headless fixture prompt of minibuffer' 'package-set: headless fixture command-prompt of execute-command' 'package-set: headless fixture binding-search of binding-search' 'package-set: headless fixture shipped-formats of compile' 'package-set: headless fixture at-point of at-point' 'package-set: headless fixture at-point-tuned of at-point' 'package-set: headless fixture as-config of word-count' 'package-set: headless fixture count of word-count' 'package-set: headless fixture from-config of word-count' 'package-set: ran 14 linked tests and 20 headless fixtures over 48 packages'; do printf '%s\\n' \"$out\" | grep -qxF \"$line\" || { echo \"ffi-test: the package steps did not print: $line\"; exit 1; }; done",
  # With `--only`, `run` runs over the named packages alone, and still
  # refuses to run nothing: the interface package `greeting-api` has no
  # linked test and no headless fixture, so `--only greeting-api` is exit
  # 2, unless the caller says with `--allow-empty-run` that running nothing
  # is what it means, as the pre-commit hook does for a change to an
  # interface package; the gate never says it. Their output is shown only
  # when it is not that.
  "status=0; out=$(sh ../tools/package-set.sh --only greeting-api run ../tests/packages \"$(lean --print-prefix)\" .lake/build/lib/lean 2>&1) || status=$?; { test \"$status\" -eq 2 && printf '%s\\n' \"$out\" | grep -qF 'nothing to run'; } || { printf '%s\\n' \"$out\"; exit 1; }",
  "out=$(sh ../tools/package-set.sh --only greeting-api --allow-empty-run run ../tests/packages \"$(lean --print-prefix)\" .lake/build/lib/lean 2>&1) && printf '%s\\n' \"$out\" | grep -qxF 'package-set: ran 0 linked tests and 0 headless fixtures over 1 package' || { printf '%s\\n' \"$out\"; exit 1; }",
  # The same step over the default set (packages/): the linked test and
  # the fixtures of the default packages, on the editor built from the
  # default set, the one that is shipped. So the compile mode's linked test
  # and three fixtures, and the shipped themes' four
  # fixtures, hold of that editor too, `load-theme` among them: with no
  # theme of config's, its theme prompt offers `default`, `solarized-dark`,
  # `solarized-light` and `fairy-floss`, in that order; and `package-names`,
  # whose config names a declaration of the package
  # (`ShippedThemes.themes`): it elaborates because the editor's config
  # base is its set's, and the package's `.olean` directory, which these
  # lines do not give, is found through the record the build wrote beside
  # the editor. The lines of what it is here to run are required, as
  # above.
  "out=$(sh ../tools/package-set.sh run ../packages \"$(lean --print-prefix)\" .lake/build/lib/lean) || { printf '%s\\n' \"$out\"; exit 1; }; printf '%s\\n' \"$out\"; for line in 'package-set: linked test ExTest.Linked of ex' 'ex linked test: 9 checks passed' 'package-set: linked test EvilTest.Linked of evil' 'evil linked test: 20 checks passed' 'package-set: linked test ThemesTest.Linked of themes' 'themes linked test: 3 checks passed' 'package-set: linked test FilesTest.Linked of files' 'files linked test: 25 checks passed' 'package-set: linked test WorkspaceTest.Linked of workspace' 'workspace linked test: 21 checks passed' 'package-set: linked test ProjectSearchTest.Linked of project-search' 'project-search linked test: 1 checks passed' 'package-set: linked test WorkingSetTest.Linked of working-set' 'working-set linked test: 1 checks passed' 'package-set: linked test ShellTest.Linked of shell' 'shell linked test: 2 checks passed' 'package-set: linked test VersionControlTest.Linked of version-control' 'version-control linked test: 89 checks passed' 'package-set: linked test CompletionTest.Linked of completion' 'completion linked test: 6 checks passed' 'package-set: headless fixture completion-choices of completion' 'package-set: linked test ShippedThemesTest.Linked of shipped-themes' 'package-set: headless fixture load-theme of shipped-themes' 'package-set: headless fixture package-names of shipped-themes' 'package-set: headless fixture shipped-themes of shipped-themes' 'package-set: headless fixture themes of shipped-themes' 'package-set: linked test CompileTest.Linked of compile' 'compile linked test: 7 checks passed' 'package-set: headless fixture config of compile' 'package-set: headless fixture ex-names of compile' 'package-set: headless fixture mode-line of mode-line' 'package-set: headless fixture candidates of minibuffer' 'package-set: headless fixture prompt of minibuffer' 'package-set: headless fixture command-prompt of execute-command' 'package-set: headless fixture binding-search of binding-search' 'package-set: headless fixture shipped-formats of compile' 'package-set: headless fixture at-point of at-point' 'package-set: headless fixture at-point-tuned of at-point' 'package-set: ran 12 linked tests and 15 headless fixtures over 43 packages'; do printf '%s\\n' \"$out\" | grep -qxF \"$line\" || { echo \"ffi-test: the package steps over the default set did not print: $line\"; exit 1; }; done",
  # And the editor of the default set, which does not hold the fixture
  # package, has no such command: on the same config and script its
  # headless mode must print `run greeting-hello: no such command`. So the
  # command above came from the set, not from the core.
  "out=$(../packages/.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/packages/greeting/tests/headless/hello/config ../tests/packages/greeting/tests/headless/hello/script) && printf '%s\\n' \"$out\" | grep -qxF 'run greeting-hello: no such command'",
]

# The app bundle's layout, staged and run (tools/bundle-test.sh, whose
# header says each step; docs/dev-practices/the-gate.md, "The bundle
# test"; docs/dev-practices/headless-mode.md, "From an app bundle"):
# tools/stage-bundle.sh lays `Leanmacs.app` out in a temporary directory
# from what `lake -d ../packages query :editorShipped` lists, the whole
# Lean toolchain, the Rust archive and, on macOS, the link stubs; the
# bundle must hold every piece a user's package-set build needs; and its
# editor, run through the launcher with no directory argument and an empty
# environment, must run the headless fixtures from its own modules,
# generate a lakefile naming the bundle's set, say its version, and be
# found by the launcher. It runs the built executables only, so it needs
# just `lean` before it, and has a time limit of its own: on Linux the
# toolchain is copied, about 3.1 GB, where macOS clones it.
[tasks.bundle-test]
description = "Stage the app bundle's layout in a temporary directory, with the launcher, the whole Lean toolchain, the core and the default packages built, the Rust archive and the link stubs, check it holds each piece a package-set build needs, and run its editor through the launcher with no directory argument and an empty environment: the headless fixtures, the generated lakefile, --version and the launcher's probes (tools/bundle-test.sh, tools/stage-bundle.sh, tests/headless/bundle)"
depends = ["lean"]
dir = "lean"
# The bundle fixture's first settle may wait 90 s (tests/headless/bundle/
# script says why), and on CI it starts 60 to 70 s in, after the launcher's
# release build and the staging. The task's 600 s, set for the toolchain's
# copy, lets that settle run out and say so before the task's own limit
# does.
timeout = "600s"
run = "sh ../tools/bundle-test.sh"

# A user's package set end to end, through the app's launcher
# (tools/user-sets-test.sh; docs/dev-practices/the-gate.md, "The user sets
# test"; docs/design/packages.md, "User package sets"): an install that
# restarts the editor into a per-user build with the session as it was, a
# link that fails while the editor keeps running, a default package
# dropped, a set that fails to elaborate, and git missing. Everything it
# writes is in a temporary directory, with HOME and XDG_* inside it, but
# the fixture packages' own .lake/ (tests/user-sets/<name>), as the fixture
# set's packages build in place. Its Lake builds read what `lean` built
# and write nothing it shares: it ends by requiring the default set's
# editor to read as up to date. It has a task and a time limit of its own,
# as the builds take longer than `ffi-test`'s commands.
[tasks.user-sets-test]
description = "A user's package set end to end through the launcher: install a package and restart into the per-user build with the session restored, a failing link that keeps the editor running, a default package dropped, a set that fails to elaborate, and git missing (tools/user-sets-test.sh, tests/user-sets)"
depends = ["lean", "launcher"]
dir = "lean"
timeout = "600s"
run = "sh ../tools/user-sets-test.sh"

# Opt-in, never part of `ci` or hk.pkl: the leave-out check
# (tools/leave-out-check.sh; docs/dev-practices/the-gate.md, "The leave-out
# check"). For each implementation package of the default set, it builds
# an editor from the set without that package, in a temporary directory,
# requires that editor's generated root to import every other entry module
# and not that one, and prints `leave-out: <package>: built, …` with the
# first line of the editor's `--probe`. It links one editor a package,
# twenty-five of them, which is why it is not in the gate; the gate keeps
# what makes it true, the layer imports check (no package imports an
# implementation package's module), and the check's own edit of a
# lakefile, by dry runs (`lean-test`). It builds the packages where they
# are, so never run it while `ci` or another build of this checkout runs.
[tasks.leave-out]
description = "Opt-in, never part of ci: build an editor from the default package set without each implementation package, one at a time, and say what each one's --probe answers (tools/leave-out-check.sh)"
depends = ["lean"]
dir = "lean"
env = { LEAN_CC = "/usr/bin/cc" }
run = "sh ../tools/leave-out-check.sh ../packages"

# Opt-in, never part of `ci`: the user package sets checks that need git,
# Cargo or more builds than the gate's (tools/user-sets-check.sh;
# docs/dev-practices/on-demand-checks.md, "User package sets, on demand"):
# the first launch after an editor update, a package updated from a local
# git repository, a set holding a Rust crate built with Cargo, and a probe
# failure. Everything it writes is in a temporary directory, but the
# fixture packages' own .lake/ and, for the Rust set, the checkout's
# target/.
[tasks.user-sets-check]
description = "Opt-in, never part of ci: a user's package set after an editor update, updated from git, holding a Rust crate, and failing its probe (tools/user-sets-check.sh)"
depends = ["lean", "launcher"]
dir = "lean"
run = "sh ../tools/user-sets-check.sh"

# The build ID (crates/editor-release, `build_id`): LEANMACS_BUILD_ID when
# it is set, else HEAD's committer time in UTC, the time landing sets. CI's
# `build-id` job runs it once per run, so every job of a run names the same
# build. `app`, `dmg` and `dmg-check` read it through the same binary.
[tasks.build-id]
description = "Print the build ID: LEANMACS_BUILD_ID when set, else HEAD's committer time in UTC as YYYYMMDDHHMMSS (crates/editor-release)"
run = "cargo run --quiet --locked -p editor-release-std --bin leanmacs-release -- build-id"

# Opt-in: run it by hand, on macOS on arm64, and do not add it to `ci` or to
# hk.pkl. The bundle is about 600 MB and signing hashes all of it, and the
# gate runs on Linux too, where the target is refused with the reason.
#
# It builds `packages/.lake/build/Leanmacs.app` with Lake, from the default
# package set (the facet `editorApp` of lean/lakefile.lean, on
# packages/lakefile.toml): the set's editor executable, the `.olean` files of the
# modules `Editor` imports, Info.plist with the version from
# lean/app/version, the build ID as CFBundleVersion and the commit as
# LeanmacsCommit, and the icon made from lean/app/Leanmacs.png with sips
# and iconutil, ad-hoc signed as a whole, last. The build ID and the commit
# come from `leanmacs-release build-id` and `commit` (crates/editor-release),
# which take LEANMACS_BUILD_ID and LEANMACS_COMMIT first, so CI's values
# pass through checked, and HEAD otherwise; `editorApp` refuses a build
# without them. Lake rebuilds it only when an input changed, a new commit
# among them, so a second run with nothing changed copies and signs
# nothing, and prints no `Built «default-set»:editorApp` line. It waits for `lean` so
# that the Lake builds in lean/ run in one chain, and sets LEAN_CC as
# `lean` does, since the executables it fetches must be linked by the
# system compiler.
[tasks.app]
description = "Opt-in, never part of ci; macOS on arm64 only: build packages/.lake/build/Leanmacs.app with Lake from the default package set (`editorApp` in lean/lakefile.lean), stamped with the build ID and the commit, ad-hoc signed"
depends = ["lean"]
dir = "lean"
env = { LEAN_CC = "/usr/bin/cc" }
run = "id=$(cargo run --quiet --locked --manifest-path ../Cargo.toml -p editor-release-std --bin leanmacs-release -- build-id) && commit=$(cargo run --quiet --locked --manifest-path ../Cargo.toml -p editor-release-std --bin leanmacs-release -- commit) && LEANMACS_BUILD_ID=$id LEANMACS_COMMIT=$commit lake -d ../packages build --wfail :editorApp"

# Opt-in: run it by hand, on macOS on arm64, and do not add it to `ci` or to
# hk.pkl: the gate does not build the bundle, and runs on Linux too. It is
# the check for any change to `editorApp`, tools/stage-bundle.sh or module
# lookup (lean/Editor/ModuleLookup.lean).
#
# tools/app-check.sh copies the built bundle into a temporary directory
# removed by a trap, verifies its signature with `codesign --verify
# --strict --deep`, reads its Info.plist (its document types and its
# version keys, which must be the line of lean/app/version, among its keys)
# and icon (the ten standard sizes, 16 to 1024 pixels) as the system does,
# runs its headless mode on tests/headless/bundle with no directory
# argument, an empty environment and / as the working directory, which must
# print exactly `expected`, and builds `editorApp` again to show that copies
# and signs nothing. In a clone of lean/ and packages/ it shows that a failed rebuild
# leaves the old bundle, that changing the version or the artwork rebuilds
# it, that a malformed version or artwork other than a 1024x1024 PNG fails
# the build, and that the build and the check both take a version file
# with no final newline. It ends `app-check: ok`.
# It opens no window and needs no person.
[tasks.app-check]
description = "Opt-in, never part of ci; macOS on arm64 only: verify the built Leanmacs.app's signature and run its headless mode from a copy in a temporary directory, with no directory argument, an empty environment and / as the working directory, then build a user's package set from the copy's own toolchain with its resources read-only: the default set, a package installed and a default one dropped, and a package with C (tools/app-check.sh, tools/bundle-sets.sh, tests/headless/bundle)"
depends = ["app"]
timeout = "600s"
run = "tools/app-check.sh lean packages"

# The app's identity across a restart, on a desktop (tools/restart-check.sh;
# docs/dev-practices/on-demand-checks.md, "The restart on a desktop"). A copy
# of the built bundle in a temporary directory, with an identifier of its
# own, is launched with `open`; open-file events then restart it into a copy
# of its editor outside the bundle, and into a program that fails, whose
# fallback the launcher's watcher starts. LaunchServices must list one
# instance of the app, its bundle path the copy, after each, and the next
# open-file event must reach the new executable. It opens windows and needs
# no person. It ends `restart-check: ok`.
[tasks.restart-check]
description = "Opt-in, never part of ci; macOS only: launch a copy of the built Leanmacs.app, restart it into an editor outside the bundle and into one that fails, and check with lsappinfo that the app keeps one instance and its identity and that open-file events reach the new executable (tools/restart-check.sh). Opens windows on this desktop"
depends = ["app"]
run = "tools/restart-check.sh packages"

# Opt-in: run it by hand, on macOS on arm64, and do not add it to `ci` or to
# hk.pkl: the gate does not build the bundle, and runs on Linux too. CI's
# build job runs it on main (.github/workflows/build.yml).
#
# `leanmacs-release dmg` (crates/editor-release, `dmg`) packs the built
# bundle into `dist/Leanmacs-<build-id>.dmg`: the app, a link to
# /Applications, LICENSE and packaging/macos/README.txt, staged in
# target/dmg/staging and packed with hdiutil. It refuses a bundle whose
# CFBundleVersion is not this build's ID, and prints the image's path.
[tasks.dmg]
description = "Opt-in, never part of ci; macOS on arm64 only: pack the built Leanmacs.app, a link to /Applications, LICENSE and the README into dist/Leanmacs-<build-id>.dmg (crates/editor-release)"
depends = ["app"]
run = "cargo run --quiet --locked -p editor-release-std --bin leanmacs-release -- dmg packages/.lake/build/Leanmacs.app dist"

# Opt-in: run it by hand, on macOS, and do not add it to `ci` or to hk.pkl:
# it mounts a disk image. It does not depend on `dmg`, so CI's build job
# packs once; it fails, saying to run `mise run dmg`, when this build's
# image is not in dist/.
#
# The ignored test crates/editor-release-std/tests/dmg_mount.rs mounts the
# image read-only on a temporary mount point and detaches it when done. The
# volume's root must be exactly the app, the link to /Applications, LICENSE
# and README.txt (names starting with `.` aside); the two files must be
# the repository's; the app's signature must verify; its CFBundleVersion
# must be the build the file name names and this build's ID, its
# LeanmacsCommit this build's commit and its CFBundleShortVersionString
# lean/app/version's line; and its `editor --version`, run with an empty
# environment, must print those three.
[tasks.dmg-check]
description = "Opt-in, never part of ci; macOS only: mount dist/Leanmacs-<build-id>.dmg and check its root, its files, the app's signature, Info.plist and `editor --version`, and build the default set from the read-only volume alone (crates/editor-release-std/tests/dmg_mount.rs)"
run = 'id=$(cargo run --quiet --locked -p editor-release-std --bin leanmacs-release -- build-id) && dmg="$PWD/dist/Leanmacs-$id.dmg" && { [ -f "$dmg" ] || { echo "dmg-check: no $dmg: run \`mise run dmg\`" >&2; exit 1; }; } && LEANMACS_DMG="$dmg" cargo test --locked -p editor-release-std --test dmg_mount -- --ignored --nocapture'

# Opt-in: run it by hand, on macOS, and do not add it to `ci` or to hk.pkl:
# it mounts a disk image. CI's release job runs it on main
# (.github/workflows/release.yml), as its "Prepare the nightly" step. It
# does not depend on `dmg`, so CI packs once; run `mise run dmg` first.
#
# `leanmacs-release nightly` (crates/editor-release, `nightly`) takes
# dist/Leanmacs-<build-id>.dmg, mounts it at target/nightly-mount and checks
# that the app's CFBundleVersion and LeanmacsCommit are this build's ID and
# commit, then writes the nightly's assets to target/nightly:
# Leanmacs-<build-id>.dmg, Leanmacs.dmg, Leanmacs.dmg.sha256 and build.json,
# with the release notes in notes.md. It holds no token and talks to no
# server; `leanmacs-release publish target/nightly` uploads them, in CI only.
[tasks.nightly]
description = "Opt-in, never part of ci; macOS only: check dist/Leanmacs-<build-id>.dmg's stamp and prepare the nightly's assets in target/nightly, with no token (crates/editor-release, `nightly`)"
run = "cargo run --quiet --locked -p editor-release-std --bin leanmacs-release -- nightly dist target/nightly"

# Any host, part of nothing: the golden tests in `mise run test`
# (crates/editor-release's `site` and crates/editor-release-std/tests/site.rs)
# cover it. CI's release job runs it on main, on the build.json `nightly`
# just prepared (.github/workflows/release.yml).
#
# `leanmacs-release site` (crates/editor-release, `site`) renders the
# download page for the build a build.json describes into
# <out-dir>/index.html, target/site by default. The minimum macOS it shows
# is [env]'s MACOSX_DEPLOYMENT_TARGET, the one the executable is linked for;
# run outside mise, with that unset, it refuses.
[tasks.site]
description = "Any host: render the download page from a build.json into <out-dir>/index.html (default target/site): mise run site -- <build.json> [<out-dir>] (crates/editor-release, site)"
run = "cargo run --quiet --locked -p editor-release-std --bin leanmacs-release -- site"

# Opt-in: run it by hand, on macOS, and do not add it to `ci` or to hk.pkl:
# it mounts a disk image. The ignored test
# crates/editor-release-std/tests/nightly_mount.rs packs a tiny stamped app
# into an image in a temporary directory and runs the nightly's prepare on
# it through the real process adapter: the five files, `shasum -a 256 -c`,
# the build read back, a wrong commit refused, and the image detached every
# time.
[tasks.nightly-check]
description = "Opt-in, never part of ci; macOS only: prepare a nightly from a tiny stamped image in a temporary directory, with real hdiutil, plutil and shasum (crates/editor-release-std/tests/nightly_mount.rs)"
run = "cargo test --locked -p editor-release-std --test nightly_mount -- --ignored --nocapture"

# Opt-in, by hand: converts a config directory from the old form, `.lean`
# files in byte order with no header, to the form the editor loads, a root
# `init.lean` and modules under `Config/` (tools/config-migrate.sh, whose
# header says what it moves and what it refuses). With no argument it
# converts `${XDG_CONFIG_HOME:-$HOME/.config}/leanmacs`; `mise run
# config-migrate -- <dir>` converts another. The file that defines `setup`
# becomes `init.lean`, with the files after it, and the files before it
# become `Config/<Name>.lean`, so the converted config loads as the old one
# did. The gate runs the script on copies of a fixture and on directories
# it writes (`ffi-test`, tools/config-migrate-check.sh), never on a real
# config.
[tasks.config-migrate]
description = "Opt-in, never part of ci: convert a config directory of .lean files in byte order with no header to init.lean and Config/<Name>.lean (tools/config-migrate.sh); `mise run config-migrate -- [<config dir>]`, default ~/.config/leanmacs. The file that defines setup, and the files after it, become init.lean"
run = "sh tools/config-migrate.sh"

# Opt-in: run it by hand, on macOS on arm64, and do not add it to `ci` or to
# hk.pkl: it writes outside the checkout. After `app-check`,
# tools/install-app.sh replaces /Applications/Leanmacs.app with the built
# bundle, installs the default config config/default (a starter SPC map) to
# ~/.config/leanmacs only when no config is there, otherwise only saying
# where the default config is, and deletes the backups
# the earlier install script left. It keeps no backups and opens, registers
# or runs nothing.
[tasks.install]
description = "Opt-in, never part of ci; macOS on arm64 only: build and check Leanmacs.app and install it to /Applications, replacing the old one and deleting leftover backups (tools/install-app.sh)"
depends = ["app-check"]
run = "tools/install-app.sh packages"

# Opt-in: run it by hand, and do not add it to `ci` or to hk.pkl. It ends in
# an abort, and on macOS every abort makes the system write a crash report
# under ~/Library/Logs/DiagnosticReports, so in the gate it would leave a file
# on the developer's machine on every run. The `overflow` scenario itself and
# its fixture are still built by `lean`, inside the gate.
#
# A stack overflow in interpreted code is not caught: the process must die of
# SIGABRT, which the shell reports as status 134. The interpreter overflows
# only once its thread's stack is full. The entry point gives every thread
# Lean creates a 64 MiB stack (`editor_entry` in lean/ffi/glue.c; the
# `ffi-test` task checks the size), so the overflow takes milliseconds, and
# the scenario runs under that size: LEAN_STACK_SIZE_KB would override it, so
# it is removed from the scenario's environment. The runtime's own message
# has one line per interpreter frame (635 KB when the stack was 16 MiB, and
# more now), so stderr is dropped.
# `ulimit -c 0`: no core file. The sysroot and the directory of
# `InterpretedFixture.olean` are passed in, so the scenario reads nothing
# from the environment.
#
# The status alone is not enough: an abort before the recursion would give it
# too. The scenario prints one marker line once interpreted code has run and
# just before it recurses, so the marker must be the last line of stdout as
# well.
[tasks.ffi-overflow]
description = "Opt-in, never part of ci: check that a stack overflow in interpreted Lean code aborts the process (lean/FfiTest/Editor/Ffi/MainThread.lean). Each run makes macOS write a crash report under ~/Library/Logs/DiagnosticReports"
depends = ["lean"]
dir = "lean"
timeout = "60s"
run = '''status=0; out=$( (ulimit -c 0; exec env -u LEAN_STACK_SIZE_KB .lake/build/bin/ffi-test overflow "$(lean --print-prefix)" .lake/build/lib/lean 2>/dev/null) ) || status=$?; printf '%s\n' "$out" "ffi-test overflow: exit status $status"; test "$status" -eq 134 && test "$(printf '%s\n' "$out" | tail -n 1)" = "ffi-test overflow: entering the recursion"'''

# Opt-in: run it by hand on a quiet machine, and do not add it to `ci` or to
# hk.pkl. It measures and asserts nothing: its numbers depend on the machine,
# so none of them is a pass or a fail. The gate still builds the subcommands,
# under every linter (`lean`).
#
# Each run is a fresh process under `/usr/bin/time -l`, which prints the
# process's real time and its maximum resident set size (in bytes) on stderr
# after the subcommand's own line on stdout:
#
# - `bench-start` with each import set: how long the base takes to import and
#   the first config to load, and what the process then weighs;
# - `bench-reload`: the median and the maximum of 20 reloads of a one-line
#   root, of a 20-line config, of 50 definitions with a `simp` proof, and of
#   a config of two files, the 50 definitions in an imported file that
#   changes, on a base with `Lean`;
# - `bench-reload-directory`: the first and the last two of those again, with the config
#   read from a config directory, a temporary one, and not from memory, so
#   the directory's lookups are in the time;
# - `bench-soak` with 100 and with 500 reloads of a config that is its root
#   alone, which imports `Lean` and uses it: the mean time of a reload, and,
#   from the two resident set sizes, whether replaced configs are freed;
# - `bench-soak-modules` with 100 and with 500 reloads of a config of two
#   files, a root that imports `Lean` and a config file that changes each
#   round: the same, for a reload that writes a module file and makes an
#   environment that imports it. 500 of them take about two minutes.
#
#
# Each soak is run by tools/soak-ratio.sh, which prints the soak's own line
# for each count and then its two maximum resident set sizes and what the
# second is of the first: a config whose replaced versions are freed stays
# within a few percent. Memory is reported, never gating.
#
# The config is held in memory but for `bench-reload-directory`, so nothing
# else is read but the `.olean` files, whose directories are passed in. LEAN_STACK_SIZE_KB is removed from the
# environment, so the threads have the stack the editor gives them.
[tasks.config-bench]
description = "Opt-in, never part of ci: measure start-up, reload time and memory across reloads of the config session (lean/ConfigTest/Bench.lean). It asserts nothing"
depends = ["lean"]
dir = "lean"
run = [
  "/usr/bin/time -l env -u LEAN_STACK_SIZE_KB .lake/build/bin/config-test bench-start \"$(lean --print-prefix)\" .lake/build/lib/lean Editor",
  "/usr/bin/time -l env -u LEAN_STACK_SIZE_KB .lake/build/bin/config-test bench-start \"$(lean --print-prefix)\" .lake/build/lib/lean Editor Std",
  "/usr/bin/time -l env -u LEAN_STACK_SIZE_KB .lake/build/bin/config-test bench-start \"$(lean --print-prefix)\" .lake/build/lib/lean Editor Lean",
  "/usr/bin/time -l env -u LEAN_STACK_SIZE_KB .lake/build/bin/config-test bench-reload \"$(lean --print-prefix)\" .lake/build/lib/lean",
  "/usr/bin/time -l env -u LEAN_STACK_SIZE_KB .lake/build/bin/config-test bench-reload-directory \"$(lean --print-prefix)\" .lake/build/lib/lean",
  "sh ../tools/soak-ratio.sh .lake/build/bin/config-test \"$(lean --print-prefix)\" .lake/build/lib/lean bench-soak",
  "sh ../tools/soak-ratio.sh .lake/build/bin/config-test \"$(lean --print-prefix)\" .lake/build/lib/lean bench-soak-modules",
]

# Opt-in: run it by hand on a quiet machine, on macOS, and do not add it to
# `ci` or to hk.pkl. It measures and asserts nothing: its numbers depend on
# the machine, so none of them is a pass or a fail. The gate still builds
# `config-test bench-modules`, under every linter (`lean`), and runs it in
# `bundle-test`.
#
# What config may import, measured, for the import sets `Editor` and
# `Editor` with `Lean` (tools/module-bench.sh): the modules each import
# reads and the bytes of each file kind, of whole top-level directories and
# of those modules alone; which file kinds the import needs, found by
# staging the directories with tools/stage-bundle.sh in a temporary
# directory with each kind set in turn and importing from them; and, staged
# with the kinds it needs, the start-up time and resident memory of
# `bench-start`, and of the staged bundle's headless mode for `Editor`. The
# figures are in docs/design/lean-runtime.md, "What config may import,
# measured". It takes a minute or two and needs a few GB of temporary disk.
# Opt-in, never part of `ci`; macOS on arm64 only, after `app` and `dmg`:
# the app bundle with the toolchain, measured (tools/bundle-bench.sh;
# docs/design/lean-runtime.md, "The bundle with the toolchain, measured";
# docs/dev-practices/on-demand-checks.md, "The bundle, measured on
# demand"): the bundle's bytes and files by part, the image's share of
# GitHub's 2 GiB asset limit, the bundled editor's start-up and resident
# memory, and the time of builds of a user's set from the bundle. It
# asserts nothing but that each run it times did what it times.
[tasks.bundle-bench]
description = "Opt-in, never part of ci; macOS on arm64 only: measure the built Leanmacs.app and its disk image: bytes by part, the image's share of GitHub's 2 GiB asset limit, start-up and resident memory, and the time of a user's set built from the bundle (tools/bundle-bench.sh)"
run = 'id=$(cargo run --quiet --locked -p editor-release-std --bin leanmacs-release -- build-id) && sh tools/bundle-bench.sh packages/.lake/build/Leanmacs.app "dist/Leanmacs-$id.dmg"'

[tasks.module-bench]
description = "Opt-in, never part of ci; macOS only: measure what each import set config may use needs to ship (file kinds, bytes) and costs at start-up (time, memory), from a staged bundle, and what the bundle of the default set's config base holds and costs (tools/module-bench.sh). It asserts only that the headless runs it times installed their config"
depends = ["lean"]
run = "tools/module-bench.sh lean"

# Opt-in: run it by hand, on macOS on arm64, from a shell that is not itself
# sandboxed, and do not add it to `ci` or to hk.pkl: the gate runs on Linux
# too, where it is refused with the reason, and it copies the 3 GB toolchain.
# Unlike the benchmarks it asserts: it fails at the first step that does not
# hold, naming it.
#
# The user-side link, checked (tools/user-link-check.sh): can an `editor` be
# linked on a user's Mac from pieces the app ships, with the clang and
# ld64.lld the Lean toolchain bundles and no Xcode command line tools? It
# stages the toolchain, the editor's `.olean` files, objects, glue object and
# Rust archive as `lean` built them, and link stubs made from the built
# editor's import table (tools/link-stubs.sh), in a temporary directory;
# shows that a sandbox (tools/user-link/sandbox.sb) makes the tools, both
# SDKs, the real toolchain and the repository unreachable; builds the
# trivial package tests/user-link/package and links an `editor` from it,
# and from the root the package-set build generates for the set that holds
# it (tests/user-link), inside that sandbox with the staged `lake`; signs
# it ad hoc; and runs its headless mode on tests/headless and on
# tests/user-link, where the package's command must run. It then shows the linker opened nothing
# outside the stage, and prints the staged pieces and the medians of five
# timed runs. `tools/user-link-check.sh lean --linker system` is the
# baseline: the same link with /usr/bin/cc and the SDK. The decision and the
# figures are in docs/design/lean-runtime.md, "A link on the user's machine,
# measured". It takes about half a minute. The staged copies are made with
# `cp -c`, which clones on APFS; where it cannot clone, the stage is about
# 3.4 GB of temporary disk.
[tasks.user-link-check]
description = "Opt-in, never part of ci; macOS on arm64 only: link an editor from the trivial package tests/user-link/package and the staged pieces with the Lean toolchain's own clang and ld64.lld, in a sandbox where the Xcode command line tools cannot be reached, sign it ad hoc and run its headless mode (tools/user-link-check.sh). It asserts"
depends = ["lean"]
run = "tools/user-link-check.sh lean"

# Opt-in: run it by hand on a quiet machine, and do not add it to `ci` or to
# hk.pkl. It measures and asserts nothing: its numbers depend on the machine
# and on what else the machine is doing, so none of them is a pass or a fail.
# The gate still builds the subcommand, under every linter (`lean`).
#
# `bench-jobs` measures the latency of the editor loop, from posting
# `run noop` to the editor thread having run it, over 10,000 samples a row:
# with nothing running; with 64 jobs each sleeping a millisecond in a loop;
# with one interpreted job computing on each pool thread; with two for each;
# and with nothing running again. It then times a million `now` requests in
# one compiled job. It says which loaded rows are within bound: a row whose
# median is at most twice the larger of the two idle medians and whose 99th
# percentile is under 100 µs. The maximum is printed and not judged.
#
# Each row is a headless host on the real elaborator, the real queue and the
# library's timer service, with a config held in memory, so nothing is read
# but the `.olean` files, whose directories are passed in. LEAN_NUM_THREADS
# and LEAN_STACK_SIZE_KB are removed from the environment, so the pool has
# Lean's size and the threads the stack the editor gives them.
[tasks.job-bench]
description = "Opt-in, never part of ci: measure the latency of the editor loop while background jobs run (lean/ConfigTest/Bench.lean). It asserts nothing"
depends = ["lean"]
dir = "lean"
run = "env -u LEAN_NUM_THREADS -u LEAN_STACK_SIZE_KB .lake/build/bin/config-test bench-jobs \"$(lean --print-prefix)\" .lake/build/lib/lean 10000"

# Opt-in: do not add it to `ci` or to hk.pkl. It measures the session
# journal's cost on the editor thread (docs/design/concurrency.md, "The
# session journal"): the reconciler and the hand-off of its orders to the
# library's file service, for 10,000 one-character inserts into a buffer of
# 4 KiB, 1 MiB and 10 MiB, at its start, middle and end, each row named
# `journal_order/<size>/<position>`, for perf-suite to adopt once its
# harness exists. It asserts nothing.
[tasks.journal-bench]
description = "Opt-in, never part of ci: measure the session journal's cost on the editor thread, the reconciler and the hand-off to the file service for 10,000 one-character inserts at 4 KiB, 1 MiB and 10 MiB, at the start, middle and end (lean/ConfigTest/Bench.lean, `bench-journal`). It asserts nothing"
depends = ["lean"]
dir = "lean"
run = "env -u LEAN_NUM_THREADS -u LEAN_STACK_SIZE_KB .lake/build/bin/config-test bench-journal"

# Opt-in: run it by hand on a quiet machine, and do not add it to `ci` or to
# hk.pkl. It asserts nothing: its numbers depend on the machine and on what
# else the machine is doing. The gate still builds the subcommand, under
# every linter (`lean`).
#
# `bench-prompt` measures what a key costs in a prompt, over 600 keys a row,
# each of `src/f1` committed into the open prompt: from sending the key to
# the editor thread having handled it and published its scene. Rows: a
# prompt with no candidates; 1,000, 10,000 and 100,000 paths of about 40
# bytes listed on the editor thread (the inline limit lifted); 100,000
# matched off the editor thread, each key joined (and the listing's
# latency, key to delivery, printed); and 100,000 off the thread with the
# keys back to back, joining nothing, so each meets a match in flight or a
# delivery. It says whether the two off-thread rows are within bound:
# median at most twice the no-candidates median, 99th percentile under 1 ms
# (`docs/design/concurrency.md`, "Matching off the editor thread, measured").
#
# Each row is a headless host on the real queue and the library, its
# matcher among it; LEAN_NUM_THREADS and LEAN_STACK_SIZE_KB are removed from
# the environment, as for `job-bench`.
[tasks.prompt-bench]
description = "Opt-in, never part of ci: measure what a key costs in a prompt over many candidates, listed on the editor thread and matched off it (lean/ConfigTest/Bench.lean). It asserts nothing"
depends = ["lean"]
dir = "lean"
run = "env -u LEAN_NUM_THREADS -u LEAN_STACK_SIZE_KB .lake/build/bin/config-test bench-prompt \"$(lean --print-prefix)\" .lake/build/lib/lean 600"

# Opt-in: do not add it to `ci` or to hk.pkl. It runs real git and the fzf
# `[tools]` pins over a repository of 100,000 files.
#
# `bench-workspace-files`, an opt-in argument of the workspace package's
# linked test (packages/workspace/WorkspaceTest/Linked.lean), measures
# `find-file-in-workspace` (packages/workspace/Workspace/FindFile.lean) over
# a real repository, 120 keys a
# row, each of `m`, `1`, `2`, `f`, `3` and `4` committed into the open
# prompt. Rows: a key in a prompt with no candidates, the floor; a key in the
# finder's prompt, each joined, from sending it to the editor thread having
# handled it and published its scene, and the time from that key to the
# post of the batch for its text, the updated list, which takes in the
# source's 50 ms pause, `git ls-files` and fzf; and a key in the finder's
# prompt with the keys 120 ms apart, nothing joined, so each arrives while
# the job of the text before it runs its lister or its filter. Then the
# lister and the filter alone, outside the editor, 20 runs each. It says
# whether the two finder rows' keys are within bound: median at most twice
# the floor's, 99th percentile under 1 ms (`docs/design/concurrency.md`, "A
# key in the workspace finder, measured").
#
# The repository is made by tools/workspace-bench-repo.sh in a temporary
# directory, removed on exit; WORKSPACE_BENCH_REPO names a checkout to
# measure instead. The task builds the linked test's executable as the
# package steps do (`lake -d ../packages/workspace build
# +WorkspaceTest.Linked:editorLinked`) and asks Lake for its path. The host
# is a headless host on the real queue and the library's process and file
# services; LEAN_NUM_THREADS and LEAN_STACK_SIZE_KB are removed from the
# environment, as for `job-bench`, and LEAN_CC is the system compiler, as
# for `lean`, which links the executable.
[tasks.find-file-bench]
description = "Opt-in, never part of ci: measure what a key costs in find-file-in-workspace's prompt over a repository of 100,000 files, and the time from a key to its updated list (packages/workspace/WorkspaceTest/Linked/Workspace/Bench.lean). It asserts nothing"
depends = ["lean"]
dir = "lean"
env = { LEAN_CC = "/usr/bin/cc" }
run = '''
if [ -n "${WORKSPACE_BENCH_REPO:-}" ]; then
  repo=$WORKSPACE_BENCH_REPO
else
  dir=$(mktemp -d) && trap 'rm -rf "$dir"' EXIT && repo=$dir/repo && sh ../tools/workspace-bench-repo.sh "$repo" || exit 1
fi
lake -d ../packages/workspace build --wfail +WorkspaceTest.Linked:editorLinked || exit 1
bench=$(lake -d ../packages query :editorPackages | awk -F '\t' '$1 == "workspace" { print $4 }')
env -u LEAN_NUM_THREADS -u LEAN_STACK_SIZE_KB "$bench" bench-workspace-files "$(lean --print-prefix)" "$(cd .lake/build/lib/lean && pwd)" "$repo" 120
'''

# Opt-in: do not add it to `ci` or to hk.pkl. It opens a window on this
# desktop.
#
# `editor window-check` opens the real window and counts what of the keyboard
# reaches a Lean loop that pulls the editor queue: keys, the text they
# typed, the latency of each from its arrival in Rust to its handling in
# Lean, dead keys and an input method's composition. When the window closes
# the report is eight lines on stdout (lean/Editor/WindowCheck.lean gives
# their form).
#
# `mise run window-check -- --no-ime` runs the window with composition not
# allowed, so a dead key arrives as a key; `-- --seconds <n>` sets how long
# the window stays open if nobody closes it (120 by default).
#
# The gate runs the same loop on the library's scripted platform, which opens
# nothing (`ffi-test`), and on a fake (`lean-test`).
[tasks.window-check]
description = "Opt-in, never part of ci: open a window and report what of the keyboard reaches the Lean loop, with the latency of each key (lean/Editor/WindowCheck.lean). Needs a display"
depends = ["lean"]
dir = "lean"
run = "../packages/.lake/build/bin/editor window-check"

# Opt-in: the editor on a file, in a window (lean/Editor/Window/Real.lean).
# Do not add it to `ci` or to hk.pkl: it opens a window and stays until it
# is closed. `mise run edit -- <file>` opens the file, resolved
# against the directory the task was run from (mise hands that directory
# over as MISE_ORIGINAL_CWD), and `mise run edit` with no file opens the
# editor on its one empty buffer; the options go before the file, as
# `mise run edit -- --report --config <dir> <file>`. The task always gives
# the toolchain `lean/lean-toolchain` pins (`--sysroot`), so config is
# loaded at start: from `--config`, or from `leanmacs` under
# `$XDG_CONFIG_HOME` (or `$HOME/.config`) when that directory exists, and
# again on `:reload`. It runs in lean/, so mise picks that toolchain, and
# hands the editor the build tree's `.olean` files.
[tasks.edit]
description = "Opt-in, never part of ci: open a file, or an empty buffer, in the editor's window (lean/Editor/Window/Real.lean), through the app's launcher, which starts the newest per-user build of your package set, else the default set's editor; `mise run edit -- [options] [<file>]`. Needs a display"
depends = ["lean", "launcher"]
dir = "lean"
run = 'lean_dir=$PWD && sysroot=$(lean --print-prefix) && cd "$MISE_ORIGINAL_CWD" && "$lean_dir/../target/release/leanmacs" --default "$lean_dir/../packages/.lake/build/bin/editor" -- --sysroot "$sysroot"'

# Opt-in: milestone 1's figures with no window, for the phase body
# (docs/dev-practices/on-demand-checks.md, "Milestone 1, measured"). Run it
# on a quiet machine, and do not add it to `ci` or to hk.pkl: it takes about
# a minute, half of it an idle period, and asserts nothing. It runs five
