# Opt-in: run it by hand, on macOS, and do not add it to `ci` or to hk.pkl.
# It needs the system's `swift`, and it writes files of the repository,
# which no gate may do.
#
# It runs `tools/coretext/capture.swift`: Core Text draws the sentence "the
# window draws this" from the fixture font at 14 pt, as one line, and the
# drawings and the glyphs' places are written under `tests/coretext/`:
#
# - `sentence.png`, at scale 2, black on white, the context's subpixel
#   flags left at their defaults: the macOS weight's target. The renderer's
#   test draws the same sentence through its CPU path and holds its weight
#   to the file's (`crates/editor-render-wgpu/src/weight_tests.rs`). It is
#   drawn exactly as it was on 2026-11-14.
# - `sentence-dark.png`, at scale 2, the default theme's `#d8dee9` on
#   `#2e3440`; `sentence-14.png` and `sentence-14-dark.png`, at scale 1,
#   black on white and light on dark; `sentence-grey.png`, at scale 2,
#   `#808080` on white. Each is the coverage, and is what the Core Text
#   adapter's masks are compared with (`mise run coretext-check`).
# - `positions.txt`, each glyph's place on the line at scale 1 and 2, which
#   the shaper's and the painter's placement tests hold to
#   (`crates/editor-shape-parley/tests/core_text.rs`,
#   `crates/editor-render-wgpu/src/placement_tests.rs`).
# - `composited/<drawing>.png`, for each of the five drawings: the
#   bitmap's own pixels as 8-bit RGB, what macOS composited, which the
#   renderer's composite of the sentence is compared with on demand
#   (`mise run coretext-check`, its second half).
# - `blend.txt`, Core Graphics' own result for uniform fills of four text
#   colours over three grounds at five alphas, which the renderer's encoded
#   blending is held to in the gate (`crates/editor-render-wgpu/src/
#   blend.rs`).
#
# Every drawing is made with the context's default subpixel flags, as
# native apps draw text: Core Text floors each glyph's place to its own
# grid (thirds of a pixel at scale 1, halves at scale 2), the grid the
# renderer's painter places glyphs on.
#
# The script checks each drawing itself (nothing on the border, the three
# channels one coverage) and fails rather than write one that is not. Run
# it on a new major version of macOS, or when the fixture font changes, and
# record the capture in `tests/coretext/README.md`. If `sentence.png`
# changes, the weight's fit is out of date: `tests/coretext/README.md` says
# what to do.
[tasks.coretext-reference]
description = "Opt-in, never part of ci; macOS only: draw the weight sentence with Core Text from the fixture font and write the drawings and the glyphs' places under tests/coretext/, the macOS weight's target and the Core Text adapter's comparison"
run = "swift tools/coretext/capture.swift tests/fonts/NotoSansMono-Regular.subset.ttf tests/coretext"

# Opt-in: run it by hand, on macOS, and do not add it to `ci` or to
# hk.pkl. What Core Text draws is the system's: it changes between macOS
# releases, and the gate's macOS runner is not the machine the captures
# were made on, so it is no part of a gate that must give the same answer
# everywhere.
#
# It runs two examples, and each must exit 0.
#
# First the Core Text adapter's (`crates/editor-raster-coretext/examples/
# check/`): the adapter held to the rasteriser port's contract, smoothed
# and not, at 14 and 28 pixels; what `AppleFontSmoothing` holds and what
# was decided from it; and the adapter's masks, laid at the painter's bins
# of Core Text's own positions, against Core Text's drawings under
# `tests/coretext/`, each within its thresholds, with the controls that
# must miss them.
#
# Then the blending's (`crates/editor-ffi/examples/coretext/`): the
# sentence drawn through the real renderers, the headless one and the wgpu
# one on this machine's GPU, with `Settings::core_text()` and the Core Text
# rasteriser, against what macOS composited (`tests/coretext/composited/`),
# each within its thresholds and the GPU within 3 of 255 of the CPU, with
# the controls that must miss: linear light, in the direction that is why
# macOS blends encoded, and the old contrast of 0.1. It opens no window.
#
# A pass is exit 0 from both: every property holds, every capture is
# within the thresholds of its scale and every control is outside them.
# The gate builds both examples and never runs them.
#
# Run it when macOS's major version changes, when a binding's pin or the
# wgpu pin moves, when the adapter changes, and when the blend, the shader
# or the surface changes, and record its figures, dated, in
# `docs/dev-practices/on-demand-checks.md`.
[tasks.coretext-check]
description = "Opt-in, never part of ci; macOS only: hold the Core Text rasteriser to the rasteriser port's contract and compare its masks with Core Text's own drawings, then the renderers' composite of the sentence with what macOS composited, under tests/coretext/. Needs a GPU, opens no window"
run = [
  "cargo run --locked -p editor-raster-coretext --example check",
  "cargo run --locked -p editor-ffi --example coretext",
]

# Opt-in: run it by hand, on macOS, and do not add it to `ci` or to
# hk.pkl. It reads a font of the machine, Menlo, whose licence keeps it out
# of the repository, and it needs the system's `swift`.
#
# It writes Core Text's places of the glyphs of "the window draws this" in
# Menlo at 14 pt, at scale 1 and 2 (`tools/coretext/capture.swift
# --positions`), into a temporary directory that is removed when it ends,
# and runs the shaper's example (`crates/editor-shape-parley/examples/
# core_text/`): the same sentence laid out through Parley over Menlo
# alone, each glyph's error against Core Text's printed, and its exit
# status non-zero when a glyph is not Core Text's or a place is more than
# an eighth of a pixel off. The gate holds the fixture font to the same
# bound (`crates/editor-shape-parley/tests/core_text.rs`); this is the
# font the owner reads. The gate builds the example and never runs it.
#
# Run it when macOS's major version changes, when the pin of Parley or
# fontique moves, and when the shaper changes, and record its result,
# dated, in `docs/dev-practices/on-demand-checks.md`.
[tasks.coretext-menlo]
description = "Opt-in, never part of ci; macOS only: hold the shaper's places of a sentence in Menlo to Core Text's"
run = "dir=$(mktemp -d) && trap 'rm -rf \"$dir\"' EXIT && swift tools/coretext/capture.swift --positions /System/Library/Fonts/Menlo.ttc \"$dir/menlo.txt\" && cargo run --locked -p editor-shape-parley --example core_text -- /System/Library/Fonts/Menlo.ttc \"$dir/menlo.txt\" Menlo"

# Opt-in: run it by hand, and do not add it to `ci` or to hk.pkl. What it
# finds depends on this machine's GPU and its driver, so it is no part of
# a gate that must give the same answer everywhere, and a machine with no
# GPU has nothing to run it on. It opens no window.
#
# It runs the renderer's example (`crates/editor-render-wgpu/examples/
# gpu.rs`): the wgpu adapter on this machine's adapter, held to the
# renderer port's contract; then the fixture frame drawn on the GPU, read
# back, and compared with the reference image and with the CPU's picture
# (within 3 of 255 a channel), in linear light and, at the macOS setting,
# in sRGB-encoded values, with a control that must miss (the GPU encoded
# against the CPU in linear light); then how long a first frame, an
# edited frame and a cursor-only frame took, which nothing is asserted
# of. Its exit status is whether the contract, the comparisons and the
# control held.
#
# The gate runs the wgpu adapter on wgpu's no-op back end only, which
# checks its calls and draws nothing. This is where its picture is
# checked. Run it after a change to the shader, the device, the painter or
# `blend`, and when the pin of wgpu moves; `linux-render` runs the same in
# the container, on Mesa's software Vulkan.
# Opt-in: run it by hand, on macOS, and do not add it to `ci` or to
# hk.pkl. It opens the window, so it needs a desktop session, but it draws
# nothing it waits on and presents nothing it judges, so it passes with the
# screen locked. Its first half is `editor-platform-winit`'s example
# `settings`, whose pure module's tests run in the gate; its second is
# `editor-ffi`'s example `layer`, whose rules (`editor-render-wgpu`'s
# `layer::misses`) are tested in the gate on readings built in code.
# `docs/dev-practices/on-demand-checks.md`, "The window's settings and its
# Metal layer, on demand", says when to run it and what it read.
[tasks.window-layer]
description = "Opt-in, never part of ci; macOS only: open the window, ask it for a paper and the dark appearance and read back its settings, then read the Metal layer the renderer draws on and hold it to the surface's configuration. Presents nothing, so it passes with the screen locked"
run = [
  "cargo run --locked --package editor-platform-winit --example settings",
  "cargo run --locked --package editor-ffi --example layer",
]

[tasks.render-gpu]
description = "Opt-in, never part of ci: hold the wgpu renderer on this machine's GPU to the renderer port's contract, and compare the frame it draws with the reference image. Opens no window; needs a GPU"
run = "cargo run --locked --package editor-render-wgpu --example gpu"

# Opt-in: run it by hand, and do not add it to `ci` or to hk.pkl. It needs
# Docker and, the first time, the network.
#
# The script builds the image `tools/linux/Dockerfile` describes (Debian with
# the system compiler, mise and elan), copies the checkout into a work
# directory, and runs `mise run ci` there: the tracked files and the
# untracked files git does not ignore, so uncommitted work is tested and this
# machine's own build output is not touched. Its exit status is the gate's.
#
# The toolchains and the copy live in `.linux-ci/` at the root of the checkout
# (set EDITOR_LINUX_CACHE to put them elsewhere); Cargo's home and `target/`
# live on the Docker volume `editor-linux-ci-cargo`. The script's header says
# why they differ.
#
# `mise run linux-ci -- --clean` empties the copy's build output first and
# keeps the toolchains and Cargo's registry: a clean build with no download.
[tasks.linux-ci]
description = "Opt-in, never part of ci: run the gate on Linux, in a container (tools/linux/run.sh). Needs Docker"
run = "tools/linux/run.sh ci"

# Opt-in, never part of `ci` or hk.pkl: the stress loop in the Linux
# container (tools/linux/run.sh stress): the gate once, then
# `tools/stress.sh` with the task's arguments under `2 x nproc` hogs.
[tasks.linux-stress]
description = "Opt-in, never part of ci: run the gate and then the stress loop, the wiring set, on Linux, in a container (tools/linux/run.sh stress). Needs Docker"
run = "tools/linux/run.sh stress"

# Opt-in: run it by hand, and do not add it to `ci` or to hk.pkl. It needs
# Docker, like `linux-ci`, whose image, cache and volume it shares.
#
# This is where the winit adapter is held to the window port's contract
# without a desktop, the window draws, and the arboard adapter is held to
# the clipboard port's: run it after a change to
# `crates/editor-platform-winit`, to `crates/editor-platform-arboard`, to a
# contract in `crates/editor-platform`, to the surface code of
# `crates/editor-render-wgpu`, or to `crates/editor-ffi`'s `render`. In the
# container, under Xvfb, it runs the window adapter's example; then
# `editor window-check` with xdotool giving the window the focus and typing
# into it, then the same with `--no-ime`; then the window that draws
# (`editor-ffi`'s example `window`) on Mesa's software Vulkan driver, with
# `--require-picture`, so that a frame whose picture was not read back and
# compared fails it, and with xdotool giving it a key, a named key, a key
# with modifiers, a press, a drag, a release, a turn of the wheel and a
# resize, once at the display's scale of 1, ending with a change of the
# display's scale to 2 under the open window, and once with winit told a
# scale of 2, which is what shows the window's scale reaching layout; then
# the clipboard
# adapter's example on that display's clipboard, and a text written to it
# by one process and read by another, which exits 1 when it reads other
# text; then the editor on a copy of `tests/window/session.txt`, `editor
# --report <copy>`, with xdotool typing `ihello <Escape>:w<Return>:q<Return>`:
# it must exit 0. Each part passes by its exit status, the keyboard check's
# among them, which is 1 when no key reached the Lean loop. It fails if any
# of the seven fails.
# The input is synthetic: this is not the check a person makes at the
# keyboard (`window-check`). The clipboard is the container's own.
#
# It is the confirmation of what the gate cannot hold: a change that
# touches a window, a surface or the clipboard is not done until this exits
# 0, every part (docs/dev-practices/on-demand-checks.md).
[tasks.linux-window]
description = "Opt-in, never part of ci: in the Linux container, under Xvfb, hold the winit window to the window port's contract, run the keyboard check on keys typed by xdotool, draw a fixture frame in the window and give it input, and hold that display's clipboard to the clipboard port's contract (tools/linux/run.sh). Needs Docker"
run = "tools/linux/run.sh window"

# Opt-in: run it by hand, and do not add it to `ci` or to hk.pkl. It reads
# and WRITES THE CLIPBOARD OF THIS DESKTOP.
#
# It runs the arboard adapter's example (`crates/editor-platform-arboard/
# examples/clipboard.rs`) with `contract`: the system clipboard held to the
# clipboard port's contract (`editor_platform::clipboard::contract`). It
# keeps the text it finds on the clipboard, writes texts of its own, and
# puts the text it found back. Only text is put back: an image or a file
# that was on the clipboard is lost, and a clipboard that held no text is
# left holding the contract's last text. Copy something disposable first.
# It prints each property with whether it holds; its exit status is the
# result. The gate builds the example and never runs it; `linux-window`
# runs the same in the container, on a clipboard that is nobody's.
[tasks.clipboard-contract]
description = "Opt-in, never part of ci: hold the system clipboard to the clipboard port's contract. WRITES THIS DESKTOP'S CLIPBOARD, and puts back only the text it found there"
run = "cargo run --locked --package editor-platform-arboard --example clipboard -- contract"

# Opt-in: run it by hand, and do not add it to `ci` or to hk.pkl. It needs
# Docker, like `linux-ci`, whose image, cache and volume it shares.
#
# This is where the wgpu renderer draws on Linux without a GPU: in the
# container it runs the renderer's example (`render-gpu`'s) on Mesa's
# software Vulkan driver, llvmpipe, which the image installs for this task
# alone. The gate in that image asks for no adapter and is not changed by
# the driver being there.
[tasks.linux-render]
description = "Opt-in, never part of ci: in the Linux container, on Mesa's software Vulkan, hold the wgpu renderer to the renderer port's contract and compare the frame it draws with the reference image (tools/linux/run.sh). Needs Docker"
run = "tools/linux/run.sh render"

# The workflow lint (docs/dev-practices/ci.md), part of `ci`. Offline, and it
# reads no git history, so it runs the same in `linux-ci`'s copy of the
# checkout. actionlint checks the workflows are valid, and zizmor that they
# are safe, with every `uses:` pinned by a full SHA (.github/zizmor.yml).
# What this repository needs of each workflow beyond that is a reviewer
# rule (.agents/rules/workflows.md).
#
# actionlint runs with shellcheck and pyflakes off: neither is pinned here,
# so with them on the result would depend on what the machine has
# installed.
[tasks.workflow-lint]
description = "actionlint and zizmor (pinned) over .github/workflows; offline"
run = [
  "actionlint -shellcheck= -pyflakes= .github/workflows/*.yml",
  "zizmor --offline --config .github/zizmor.yml .github/workflows",
]

# On demand: run it by hand, and do not add it to `ci` or to hk.pkl (the
# operator's decision, 2026-11-26): it installs a package set, about 420 MB,
# and no gate step installs one (docs/design/packages.md, "The install").
# The wiring check over the grammar set's build (`ffi-test`) covers the
# grammar path in the gate. It copies the test package ini-grammar with the
# fixture grammar library at this platform's path, builds and installs a set
# that requires the default set and the copy with `:editorInstall` into a
# temporary directory of its own, and runs the installed editor headless on
# the INI fixture (crates/editor-syntax-fixture-ini/tests/package_install.rs;
# docs/dev-practices/on-demand-checks.md, "A package's grammar, installed,
# on demand"). It needs the default set's editor, which `lean` builds.
[tasks.grammar-install-check]
description = "On demand, never part of ci: install a set with a package that ships a grammar into a temporary directory and see the installed editor, run headless, highlight the package's language (crates/editor-syntax-fixture-ini/tests/package_install.rs)"
depends = ["lean"]
run = 'LEANMACS_SYSROOT="$(cd lean && lean --print-prefix)" cargo test --locked -p editor-syntax-fixture-ini --test package_install -- --ignored --nocapture'

# On demand: run it by hand, and do not add it to `ci` or to hk.pkl (the
# operator's decision, 2026-11-26): it installs a package set, about 420 MB,
# and no gate step installs one (docs/design/packages.md, "The install").
# The languages package's wiring checks over the default set's build
# (`ffi-test`) cover the path of the grammars it ships in the gate. It
# generates a config directory with no setup of its own, installs the
# default set with `:editorInstall` into a temporary directory of its own,
# and runs the installed editor headless on the Rust fixture, opened with
# the Vim scheme's keys (packages/languages/rust/tests/default_install.rs;
# docs/dev-practices/on-demand-checks.md, "The default set's grammars,
# installed, on demand"). It needs the default set's editor, which `lean`
# builds.
[tasks.languages-install-check]
description = "On demand, never part of ci: install the default set with no config into a temporary directory and see the installed editor, run headless, highlight a .rs file with the languages package's grammar (packages/languages/rust/tests/default_install.rs)"
depends = ["lean"]
run = 'LEANMACS_SYSROOT="$(cd lean && lean --print-prefix)" cargo test --locked -p languages-grammar-sources --test default_install -- --ignored --nocapture'

[tasks.library-install-check]
description = "On demand, never part of ci: install a set with a package that declares an already-built native library into a temporary directory, with no cargo on PATH, and see the installed editor load the library from the install once the package's source and the set's build are gone (crates/editor-package-check/tests/package_install.rs)"
depends = ["lean"]
run = 'LEANMACS_SYSROOT="$(cd lean && lean --print-prefix)" cargo test --locked -p editor-package-check --test package_install -- --ignored --nocapture'

[tasks.ci]
description = "The whole gate; the pre-commit hook and `hk check` run this, and it gates review and landing (rdm's dispatch.verify)"
depends = ["fmt", "lint", "deny", "doc", "test", "lean-test", "lean", "lean-deny", "lean-fmt", "ffi-test", "window-scenarios", "c-fmt", "workflow-lint"]

# Never part of `ci` or hk.pkl: `linux-ci` runs `ci` in a copy of the
# checkout with no history, where a history scan has nothing to read.
#
# gitleaks (pinned above), with `.gitleaks.toml` (the default rules) and
# `.gitleaksignore` (reviewed findings that are not secrets), over every
# commit reachable from the local `main`, then again with each merge diffed
# against its first parent (a secret typed into a conflict resolution is in
# no parent's diff), then the unstaged and the staged changes to tracked
# files. The passes are defined once, in `tools/secrets-scan.sh`, which
# exits with gitleaks' verdict. `infra-apply` runs this
# before it changes anything on GitHub. A CI job that runs it needs the full
# history and a local `main` (docs/dev-practices/publishing.md, "The secret
# scan", which also says what to do with a finding).
[tasks.secrets-scan]
description = "gitleaks (pinned) over every commit reachable from main, merges included, and the uncommitted tree; never part of ci (linux-ci's copy has no history). infra-apply runs it first"
run = "sh tools/secrets-scan.sh ."

# OpenTofu over infra/github, the repository's GitHub settings
# (infra/github/README.md). infra-plan and infra-apply act on the LIVE
# repository with the owner's `gh` token and 1Password, so they are never
# part of `ci` or hk.pkl, and only the owner runs them. infra-check needs no
# credentials and no GitHub API, only the OpenTofu registry once for the
# provider download (then cached under infra/github/.terraform/). It is
# kept out of `ci` and hk.pkl too, so the gate does not depend on OpenTofu
# or its registry; run it after any change under infra/.
[tasks.infra-check]
description = "fmt, validate, mocked-provider plan tests and the state-encryption guard for infra/github, with no credentials and no GitHub API; never part of ci or hk"
# Evaluating the encryption block needs some passphrase. No state exists
# where this runs, so the value protects nothing.
env = { TF_VAR_state_passphrase = "check-only-not-a-secret" }
run = [
  "tofu -chdir=infra/github fmt -check -recursive",
  "tofu -chdir=infra/github init -backend=false -input=false -lockfile=readonly",
  "tofu -chdir=infra/github validate",
  "tofu -chdir=infra/github test",
  "sh infra/check-encryption.sh infra/github",
]

# Even `tofu init` evaluates the encryption block, so it needs the
# passphrase and runs inside the same `op run` as plan/apply.
[tasks.infra-plan]
description = "OWNER ONLY: plan infra/github against the LIVE repository (gh token, 1Password); never part of ci or hk"
run = "GITHUB_TOKEN=$(gh auth token) op run --env-file=infra/github/op.env -- sh -c 'tofu -chdir=infra/github init -input=false -lockfile=readonly && tofu -chdir=infra/github plan'"

# Runs `secrets-scan` first: this is the apply that makes the repository
# public (docs/dev-practices/publishing.md).
[tasks.infra-apply]
description = "OWNER ONLY: run secrets-scan, then apply infra/github to the LIVE repository interactively (makes it public); never part of ci or hk"
depends = ["secrets-scan"]
run = "GITHUB_TOKEN=$(gh auth token) op run --env-file=infra/github/op.env -- sh -c 'tofu -chdir=infra/github init -input=false -lockfile=readonly && tofu -chdir=infra/github apply'"
