run = [
  ".lake/build/bin/ffi-test theme-pictures ../tests/render/themes ../tests/fonts/NotoSansMono-Regular.subset.ttf --write",
  "sysroot=$(lean --print-prefix) && oleans=$PWD/.lake/build/lib/lean && cd ../packages/shipped-themes && .lake/build/bin/ShippedThemesTest-Linked \"$sysroot\" \"$oleans\" --write",
]

# Opt-in: run it by hand, and do not add it to `ci` or to hk.pkl. It
# writes a file of the repository, which no gate may do.
#
# It draws the excerpt picture, as `ffi-test excerpt-picture` in the
