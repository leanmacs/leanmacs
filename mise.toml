[tasks.dmg-check]
description = "Opt-in, never part of ci; macOS only: mount dist/Leanmacs-<build-id>.dmg and check its root, its files, the app's signature, Info.plist and `editor --version` (crates/editor-release-std/tests/dmg_mount.rs)"
run = 'id=$(cargo run --quiet --locked -p editor-release-std --bin leanmacs-release -- build-id) && dmg="$PWD/dist/Leanmacs-$id.dmg" && { [ -f "$dmg" ] || { echo "dmg-check: no $dmg: run \`mise run dmg\`" >&2; exit 1; }; } && LEANMACS_DMG="$dmg" cargo test --locked -p editor-release-std --test dmg_mount -- --ignored --nocapture'

# Opt-in: run it by hand, on macOS, and do not add it to `ci` or to hk.pkl:
