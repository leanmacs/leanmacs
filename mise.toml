[tasks.theme-references]
description = "Opt-in, never part of ci: draw the picture of the theme default and write it to tests/render/themes, and the shipped themes' pictures (Solarized dark and light, Fairy Floss) and write them to packages/shipped-themes/tests/render, their reference images. Look at the files before committing them"
depends = ["lean"]
