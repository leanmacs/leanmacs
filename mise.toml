# temporary directory (tools/milestone-bench.sh): start, open a generated
# 10 MiB file, scroll it, type, and idle. Every figure it prints is labelled
# "headless: cell shaper, CPU renderer, no glyphs", with the machine.
[tasks.milestone-bench]
