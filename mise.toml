[tools]
rust = { version = "1.98.1", components = "rustfmt,clippy" }
# cargo-deny is a prebuilt release binary that aqua's registry names with its
# checksum, so installing it never compiles.
"aqua:EmbarkStudios/cargo-deny" = "0.19.9"
hk = "2.4.0"
pkl = "0.32.1"
# The formatter for the C glue (`mise run c-fmt`, `mise run c-format`). The
# PyPI wheel is an exact pin of the binary; mise installs it with `uv` or
# `pipx`, whichever the machine has.
"pipx:clang-format" = "23.1.4"
# Lean (lean, lake) is not listed here: `lean/lean-toolchain` is its one pin
# (AGENTS.md, "Toolchains"). mise reads that file through the `lean` plugin,
# which the global mise config declares along with
# `idiomatic_version_file_enable_tools = ["lean"]`.

[env]
RDM_ROOT = "{{env.HOME | default(value=env.USERPROFILE | default(value=''))}}/Projects/rdm-atlas-repo"
RDM_PROJECT = "editor-project"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all --check"

[tasks.lint]
description = "Clippy over every crate and target, warnings are errors"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.deny]
description = "cargo-deny's bans over the dependency graph (deny.toml); stale `wrappers` are errors"
run = "cargo deny --locked check -D unused-wrapper bans"

[tasks.doc]
description = "Rustdoc over every crate, private items included, with broken intra-doc links denied"
env = { RUSTDOCFLAGS = "-D rustdoc::broken_intra_doc_links" }
run = "cargo doc --workspace --no-deps --document-private-items --locked"

[tasks.test]
description = "Rust unit, integration and doc tests"
run = "cargo test --workspace --locked"

# The model tests: editor logic run in Lean alone, against hand-written fakes
# and the pure models of the editor's ports (lean/ModelTest.lean). They must
# pass without the Rust library being built, and the task shows that by
# behaviour: `lean/no-cargo/cargo` is a fake `cargo` that always fails, put
# first on the PATH, and Lake's `rustlib` target runs `cargo` on every build
# that reaches it. So this passes only if nothing the test driver needs
# reaches `rustlib`, on a tree where the archive is already built as well as
# on a clean one. Seen to bite once by hand: with the same PATH,
# `LEAN_CC=/usr/bin/cc lake build editor` fails at `editor/rustlib`.
#
# No LEAN_CC: the test driver links no C glue, so Lean's bundled compiler
# builds it.
#
# Nothing is removed from the environment. LEAN_NUM_THREADS sets the size of
# Lean's task pool, and the checks that warm the pool and count the threads
# jobs wait from pin no size: they pass under a bare `lake test` whatever the
# variable says.
[tasks.lean-test]
description = "Run the Lean model tests with `lake test`, with a `cargo` that fails first on the PATH: they need no Rust library (lean/ModelTest.lean)"
dir = "lean"
run = 'PATH="$PWD/no-cargo:$PATH" lake test --wfail'

# Runs in lean/, so mise picks the toolchain `lean/lean-toolchain` pins.
#
# It waits for `lean-test` only so that two Lake builds never run in lean/ at
# once: the Lake tasks run in one chain, `lean-test`, `lean`, then `lean-fmt`
# and `ffi-test`.
[tasks.lean]
description = "Build the Lean package and the executables with Lake, which runs Cargo for the Rust static library; every linter is on and a warning fails the build (lean/lakefile.lean)"
depends = ["lean-test"]
dir = "lean"
# On macOS the executables must be compiled and linked by the system compiler:
# the clang bundled with Lean has no `pthread.h` for the C glue, and its linker
# cannot link the system frameworks the Rust library will need. This is set
# here and not in the top-level [env] because lean-fmt must keep building with
# Lean's bundled compiler: under /usr/bin/cc its link fails (`library 'gmp'
# not found`). It is the absolute path because `cc` on mise's PATH may be a
# shim for another compiler.
env = { LEAN_CC = "/usr/bin/cc" }
# --wfail also fails on warnings Lake itself logs, which `warningAsError` in
# the lakefile does not reach.
run = "lake build --wfail"

# lean-fmt is a Lake dependency (lean/lakefile.lean), pinned to the tag named
# after the Lean toolchain. Both tasks wait for `lean`, so two Lake builds
# never run in lean/ at once.
[tasks.lean-fmt]
description = "Check Lean formatting and lean-fmt's lints; changes nothing"
depends = ["lean"]
dir = "lean"
run = [
  "lake exe lean-fmt format --check",
  "lake exe lean-fmt check",
]

[tasks.lean-format]
description = "Rewrite the Lean sources in lean-fmt's style and apply its safe lint fixes"
depends = ["lean"]
dir = "lean"
run = [
  "lake exe lean-fmt format",
  "lake exe lean-fmt check --fix",
]

# Tracked files only, so Lake's fetched packages and build output are never
# looked at. A new C file is checked once it is `git add`ed.
[tasks.c-fmt]
description = "Check the formatting of the C and C++ sources (.clang-format); changes nothing"
run = "git ls-files -z '*.c' '*.h' '*.cc' '*.cpp' '*.hpp' | xargs -0 clang-format --dry-run --Werror"

[tasks.c-format]
description = "Rewrite the C and C++ sources in the style .clang-format sets"
run = "git ls-files -z '*.c' '*.h' '*.cc' '*.cpp' '*.hpp' | xargs -0 clang-format -i"

# Runs the built executables only (no Lake), so it needs just `lean` before it.
# The time limit turns a hang into a failure: a deadlock in the main-thread
# hand-off, or a process that waits for a task still blocked in the library.
[tasks.ffi-test]
description = "Run the checks and scenarios of the Lean/Rust boundary (lean/FfiTest.lean), the text port's and the job port's contracts against their real bindings (lean/ContractTest.lean), the config session against the real elaborator (lean/ConfigTest.lean) and the editor executable"
depends = ["lean"]
dir = "lean"
timeout = "60s"
run = [
  # One of these checks measures the stack the entry point gives Lean's
  # threads, and LEAN_STACK_SIZE_KB overrides that size, so a variable in the
  # developer's shell must not reach it.
  "env -u LEAN_STACK_SIZE_KB .lake/build/bin/ffi-test",
  # Arguments reach Lean's `main`, and its result is the exit status.
  "status=0; .lake/build/bin/ffi-test exit 7 || status=$?; test \"$status\" -eq 7",
  # Quit is for good and process-wide, so shutdown has processes of its own.
  ".lake/build/bin/ffi-test shutdown",
  ".lake/build/bin/ffi-test exit-while-blocked",
  # The same properties `lean-test` runs against the pure models, here against
  # the Rust library: the text port's, and the job port's over the timer
  # service. Its check of Lean's task pool pins no size, so LEAN_NUM_THREADS
  # in the developer's shell does it no harm.
  ".lake/build/bin/contract-test",
  # The config session against the real elaborator. The toolchain's directory
  # and the package's `.olean` directory are passed in, so it reads nothing
  # from the environment.
  ".lake/build/bin/config-test \"$(lean --print-prefix)\" .lake/build/lib/lean",
  ".lake/build/bin/editor",
  # The headless mode, on the fixture checked in under tests/headless: it
  # loads the config directory, runs the script, and must print exactly
  # `expected`. Every path is an argument.
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/config ../tests/headless/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/expected -",
  # The same, with a script that sends keys with their identity: each goes
  # through the library's window input, as a window's would, and must be
  # printed back with its logical key, physical key and modifiers
  # (`keys-expected`).
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/config ../tests/headless/keys-script) && printf '%s\\n' \"$out\" | diff ../tests/headless/keys-expected -",
  # The display fixture: the scene `editor-layout`'s own test lays out
  # (crates/editor-layout/tests/frame_fixture.rs), published from Lean
  # through the display's real binding, must give the frame checked in at
  # tests/display/frame.expected; the scene must come back as sent; and a
  # move asked through the binding must land on the frame's next row.
  ".lake/build/bin/ffi-test display ../tests/display/frame.expected",
  # The editor's failure statuses. A command line it does not understand is
  # status 2, with the usage on stderr.
  "status=0; .lake/build/bin/editor bogus || status=$?; test \"$status\" -eq 2",
  # A script that cannot be read is status 1, with nothing on stdout and a
  # line on stderr that starts `editor: ` and says why. No file of that name
  # is checked in.
  "status=0; err=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/config ../tests/headless/no-such-script 2>&1 >/dev/null) || status=$?; printf '%s\\n' \"$err\"; test \"$status\" -eq 1 && test \"${err#editor: }\" != \"$err\"",
]

# Opt-in: run it by hand, and do not add it to `ci` or to hk.pkl. It ends in
# an abort, and on macOS every abort makes the system write a crash report
# under ~/Library/Logs/DiagnosticReports, so in the gate it would leave a file
# on the developer's machine on every run. The `overflow` scenario itself and
# its fixture are still built by `lean`, inside the gate.
#
# A stack overflow in interpreted code is not caught: the process must die of
# SIGABRT, which the shell reports as status 134. The interpreter overflows
# only once its thread's stack is full. The entry point gives every thread
# Lean creates a 64 MiB stack (`editor_entry` in lean/ffi/glue.c; the
# `ffi-test` task checks the size), so the overflow takes milliseconds, and
# the scenario runs under that size: LEAN_STACK_SIZE_KB would override it, so
# it is removed from the scenario's environment. The runtime's own message
# has one line per interpreter frame (635 KB when the stack was 16 MiB, and
# more now), so stderr is dropped.
# `ulimit -c 0`: no core file. The sysroot and the directory of
# `InterpretedFixture.olean` are passed in, so the scenario reads nothing
# from the environment.
#
# The status alone is not enough: an abort before the recursion would give it
# too. The scenario prints one marker line once interpreted code has run and
# just before it recurses, so the marker must be the last line of stdout as
# well.
[tasks.ffi-overflow]
description = "Opt-in, never part of ci: check that a stack overflow in interpreted Lean code aborts the process (lean/FfiTest.lean). Each run makes macOS write a crash report under ~/Library/Logs/DiagnosticReports"
depends = ["lean"]
dir = "lean"
timeout = "60s"
run = '''status=0; out=$( (ulimit -c 0; exec env -u LEAN_STACK_SIZE_KB .lake/build/bin/ffi-test overflow "$(lean --print-prefix)" .lake/build/lib/lean 2>/dev/null) ) || status=$?; printf '%s\n' "$out" "ffi-test overflow: exit status $status"; test "$status" -eq 134 && test "$(printf '%s\n' "$out" | tail -n 1)" = "ffi-test overflow: entering the recursion"'''

# Opt-in: run it by hand on a quiet machine, and do not add it to `ci` or to
# hk.pkl. It measures and asserts nothing: its numbers depend on the machine,
# so none of them is a pass or a fail. The gate still builds the subcommands,
# under every linter (`lean`).
#
# Each line is a fresh process under `/usr/bin/time -l`, which prints the
# process's real time and its maximum resident set size (in bytes) on stderr
# after the subcommand's own line on stdout:
#
# - `bench-start` with each import set: how long the base takes to import and
#   the first config to load, and what the process then weighs;
# - `bench-reload`: the median and the maximum of 20 reloads of a one-line
#   chunk, of a 20-line config, and of 50 definitions with a `simp` proof;
# - `bench-soak` with 100 and with 500 reloads: the mean time of a reload,
#   and, from the two resident set sizes, whether replaced configs are freed.
#
# The config is held in memory, so nothing is read but the `.olean` files,
# whose directories are passed in. LEAN_STACK_SIZE_KB is removed from the
# environment, so the threads have the stack the editor gives them.
[tasks.config-bench]
description = "Opt-in, never part of ci: measure start-up, reload time and memory across reloads of the config session (lean/ConfigTest.lean). It asserts nothing"
depends = ["lean"]
dir = "lean"
run = [
  "/usr/bin/time -l env -u LEAN_STACK_SIZE_KB .lake/build/bin/config-test bench-start \"$(lean --print-prefix)\" .lake/build/lib/lean Editor",
  "/usr/bin/time -l env -u LEAN_STACK_SIZE_KB .lake/build/bin/config-test bench-start \"$(lean --print-prefix)\" .lake/build/lib/lean Editor Std",
  "/usr/bin/time -l env -u LEAN_STACK_SIZE_KB .lake/build/bin/config-test bench-start \"$(lean --print-prefix)\" .lake/build/lib/lean Editor Lean",
  "/usr/bin/time -l env -u LEAN_STACK_SIZE_KB .lake/build/bin/config-test bench-reload \"$(lean --print-prefix)\" .lake/build/lib/lean",
  "/usr/bin/time -l env -u LEAN_STACK_SIZE_KB .lake/build/bin/config-test bench-soak \"$(lean --print-prefix)\" .lake/build/lib/lean 100",
  "/usr/bin/time -l env -u LEAN_STACK_SIZE_KB .lake/build/bin/config-test bench-soak \"$(lean --print-prefix)\" .lake/build/lib/lean 500",
]

# Opt-in: run it by hand on a quiet machine, and do not add it to `ci` or to
# hk.pkl. It measures and asserts nothing: its numbers depend on the machine
# and on what else the machine is doing, so none of them is a pass or a fail.
# The gate still builds the subcommand, under every linter (`lean`).
#
# `bench-jobs` measures the latency of the editor loop, from posting
# `run noop` to the editor thread having run it, over 10,000 samples a row:
# with nothing running; with 64 jobs each sleeping a millisecond in a loop;
# with one interpreted job computing on each pool thread; with two for each;
# and with nothing running again. It then times a million `now` requests in
# one compiled job. It says which loaded rows are within bound: a row whose
# median is at most twice the larger of the two idle medians and whose 99th
# percentile is under 100 µs. The maximum is printed and not judged.
#
# Each row is a headless host on the real elaborator, the real queue and the
# library's timer service, with a config held in memory, so nothing is read
# but the `.olean` files, whose directories are passed in. LEAN_NUM_THREADS
# and LEAN_STACK_SIZE_KB are removed from the environment, so the pool has
# Lean's size and the threads the stack the editor gives them.
[tasks.job-bench]
description = "Opt-in, never part of ci: measure the latency of the editor loop while background jobs run (lean/ConfigTest.lean). It asserts nothing"
depends = ["lean"]
dir = "lean"
run = "env -u LEAN_NUM_THREADS -u LEAN_STACK_SIZE_KB .lake/build/bin/config-test bench-jobs \"$(lean --print-prefix)\" .lake/build/lib/lean 10000"

# Opt-in: run it by hand, at the keyboard, and do not add it to `ci` or to
# hk.pkl. It opens a window on this desktop and waits for a person.
#
# `editor window-check` opens the real window and counts what of the keyboard
# reaches a Lean loop that pulls the editor queue: keys, the text they
# typed, the latency of each from its arrival in Rust to its handling in
# Lean, dead keys and an input method's composition. Type in the window, then
# close it: the report is eight lines on stdout (lean/Editor/WindowCheck.lean
# gives their form). Start it from a terminal that is in front, or the system
# may not give the window the keyboard until it is clicked.
#
# `mise run window-check -- --no-ime` runs the window with composition not
# allowed, so a dead key arrives as a key; `-- --seconds <n>` sets how long
# the window stays open if nobody closes it (120 by default).
#
# The gate runs the same loop on the library's scripted platform, which opens
# nothing (`ffi-test`), and on a fake (`lean-test`).
[tasks.window-check]
description = "Opt-in, never part of ci: open a window and report what of the keyboard reaches the Lean loop, with the latency of each key (lean/Editor/WindowCheck.lean). Needs a display and a person"
depends = ["lean"]
dir = "lean"
run = ".lake/build/bin/editor window-check"

# Opt-in: run it by hand, at the keyboard, and do not add it to `ci` or to
# hk.pkl. It opens two windows on this desktop, one after the other, so it
# needs a display and, for the second, a person.
#
# First it runs the winit adapter's example (`crates/editor-platform-winit/
# examples/contract.rs`): the real window held to the window port's contract
# (`editor_platform::contract`). The window opens, is asked to close from
# another thread, and the run must return. It prints one line, and its exit
# status is the result.
#
# Then it runs `editor-ffi`'s example (`crates/editor-ffi/examples/
# window.rs`): the window that draws. The wgpu renderer draws a fixture
# frame in the real window, on this machine's GPU; the example checks that a
# frame was presented, that its picture is the frame's, that nothing is
# drawn that nothing asked for, and that input arrives on the queue. Once
# it prints `window: ready for input`, type, click, drag, scroll and resize
# in the window: each input is printed. It stays 20 seconds or until it is
# closed (`-- --seconds <n>` does not reach it: run the example by hand for
# another time). Its exit status is the result.
#
# It is run here without `--require-picture`. A picture that could not be
# read back fails it, but a surface that says it does not let its texture
# be copied from does not: the example says so for each frame, and the
# picture was then not checked on this machine.
#
# The gate builds both examples and runs neither, though it does run the
# second's unit tests, which open no window; `linux-window` runs both
# under Xvfb, with no desktop, gives the second its input with xdotool,
# and requires its picture.
[tasks.window-contract]
description = "Opt-in, never part of ci: hold the winit window to the window port's contract, then draw a fixture frame in a window and check the picture, that nothing is drawn while idle, and that input arrives. Opens two windows on this desktop; the second waits for a person"
run = [
  "cargo run --locked --package editor-platform-winit --example contract",
  "cargo run --locked --package editor-ffi --example window",
]

# Opt-in: run it by hand, and do not add it to `ci` or to hk.pkl. What it
# finds depends on the fonts this machine has, so it is no part of a gate
# that must give the same answer everywhere.
#
# It runs the Parley adapter's example (`crates/editor-shape-parley/
# examples/system.rs`): the real shaper over the system's fonts
# (`FontSet::system`), held to the shaper port's contract
# (`editor_layout::shaper::contract`). It prints the family the default
# font is shaped in and how many families the machine has, then the
# properties that fail, by name, or that all hold; its exit status is the
# result. The gate builds the example and never runs it: every test of the
# adapter runs on the fixture fonts under `tests/fonts`, and the crate's
# `clippy.toml` forbids the system's fonts to them.
#
# Run it when the pin of Parley or fontique moves, and when
# `FontSet::system` changes.
[tasks.shaper-system]
description = "Opt-in, never part of ci: hold the Parley shaper over this machine's fonts to the shaper port's contract. Its result depends on the fonts installed"
run = "cargo run --locked --package editor-shape-parley --example system"

# Opt-in: run it by hand, and do not add it to `ci` or to hk.pkl. It writes
# a file of the repository, which no gate may do.
#
# It runs the renderer's example (`crates/editor-render-wgpu/examples/
# reference.rs`): the fixture frame of real text, drawn by the headless
# adapter at scale 1 with subpixel antialiasing, written to
# `tests/render/frame.png`. That file is the reference image the gate's
# test compares the same frame with (`crates/editor-render-wgpu/tests/
# reference.rs`). The gate builds the example and never runs it.
#
# Run it when the picture is meant to change: the fixture frame, the
# painter, the blend, or the pin of Parley or of swash. Then look at the
# file before committing it: a reference nobody looked at pins whatever
# was drawn. `tests/render/README.md` says what it should show.
[tasks.render-reference]
description = "Opt-in, never part of ci: draw the renderer's fixture frame with the headless adapter and write it to tests/render/frame.png, the reference image. Look at the file before committing it"
run = "cargo run --locked --package editor-render-wgpu --example reference -- tests/render/frame.png"

# Opt-in: run it by hand, and do not add it to `ci` or to hk.pkl. What it
# finds depends on this machine's GPU and its driver, so it is no part of
# a gate that must give the same answer everywhere, and a machine with no
# GPU has nothing to run it on. It opens no window.
#
# It runs the renderer's example (`crates/editor-render-wgpu/examples/
# gpu.rs`): the wgpu adapter on this machine's adapter, held to the
# renderer port's contract; then the fixture frame drawn on the GPU, read
# back, and compared with the reference image (within 3 of 255 a channel);
# then how long a first frame, an edited frame and a cursor-only frame
# took, which nothing is asserted of. Its exit status is whether the
# contract and the comparison held.
#
# The gate runs the wgpu adapter on wgpu's no-op back end only, which
# checks its calls and draws nothing. This is where its picture is
# checked. Run it after a change to the shader, the device, the painter or
# `blend`, and when the pin of wgpu moves; `linux-render` runs the same in
# the container, on Mesa's software Vulkan.
[tasks.render-gpu]
description = "Opt-in, never part of ci: hold the wgpu renderer on this machine's GPU to the renderer port's contract, and compare the frame it draws with the reference image. Opens no window; needs a GPU"
run = "cargo run --locked --package editor-render-wgpu --example gpu"

# Opt-in: run it by hand, and do not add it to `ci` or to hk.pkl. It needs
# Docker and, the first time, the network.
#
# The script builds the image `tools/linux/Dockerfile` describes (Debian with
# the system compiler, mise and elan), copies the checkout into a work
# directory, and runs `mise run ci` there: the tracked files and the
# untracked files git does not ignore, so uncommitted work is tested and this
# machine's own build output is not touched. Its exit status is the gate's.
#
# The toolchains and the copy live in `.linux-ci/` at the root of the checkout
# (set EDITOR_LINUX_CACHE to put them elsewhere); Cargo's home and `target/`
# live on the Docker volume `editor-linux-ci-cargo`. The script's header says
# why they differ.
#
# `mise run linux-ci -- --clean` empties the copy's build output first and
# keeps the toolchains and Cargo's registry: a clean build with no download.
[tasks.linux-ci]
description = "Opt-in, never part of ci: run the gate on Linux, in a container (tools/linux/run.sh). Needs Docker"
run = "tools/linux/run.sh ci"

# Opt-in: run it by hand, and do not add it to `ci` or to hk.pkl. It needs
# Docker, like `linux-ci`, whose image, cache and volume it shares.
#
# This is where the winit adapter is held to the window port's contract
# without a desktop, the window draws, and the arboard adapter is held to
# the clipboard port's: run it after a change to
# `crates/editor-platform-winit`, to `crates/editor-platform-arboard`, to a
# contract in `crates/editor-platform`, to the surface code of
# `crates/editor-render-wgpu`, or to `crates/editor-ffi`'s `render`. In the
# container, under Xvfb, it runs the window adapter's example; then
# `editor window-check` with xdotool giving the window the focus and typing
# into it, then the same with `--no-ime`; then the window that draws
# (`editor-ffi`'s example `window`) on Mesa's software Vulkan driver, with
# `--require-picture`, so that a frame whose picture was not read back and
# compared fails it, and with xdotool giving it a key, a named key, a key
# with modifiers, a press, a drag, a release, a turn of the wheel and a
# resize; then the clipboard
# adapter's example on that display's clipboard, and a text written to it
# by one process and read by another. It fails if any of the six fails.
# The input is synthetic: this is not the check a person makes at the
# keyboard (`window-check`). The clipboard is the container's own.
#
# It is the confirmation of what the gate cannot hold: a change that
# touches a window, a surface or the clipboard is not done until this exits
# 0, every part (docs/dev-practices/on-demand-checks.md).
[tasks.linux-window]
description = "Opt-in, never part of ci: in the Linux container, under Xvfb, hold the winit window to the window port's contract, run the keyboard check on keys typed by xdotool, draw a fixture frame in the window and give it input, and hold that display's clipboard to the clipboard port's contract (tools/linux/run.sh). Needs Docker"
run = "tools/linux/run.sh window"

# Opt-in: run it by hand, and do not add it to `ci` or to hk.pkl. It reads
# and WRITES THE CLIPBOARD OF THIS DESKTOP.
#
# It runs the arboard adapter's example (`crates/editor-platform-arboard/
# examples/clipboard.rs`) with `contract`: the system clipboard held to the
# clipboard port's contract (`editor_platform::clipboard::contract`). It
# keeps the text it finds on the clipboard, writes texts of its own, and
# puts the text it found back. Only text is put back: an image or a file
# that was on the clipboard is lost, and a clipboard that held no text is
# left holding the contract's last text. Copy something disposable first.
# It prints each property with whether it holds; its exit status is the
# result. The gate builds the example and never runs it; `linux-window`
# runs the same in the container, on a clipboard that is nobody's.
[tasks.clipboard-contract]
description = "Opt-in, never part of ci: hold the system clipboard to the clipboard port's contract. WRITES THIS DESKTOP'S CLIPBOARD, and puts back only the text it found there"
run = "cargo run --locked --package editor-platform-arboard --example clipboard -- contract"

# Opt-in: run it by hand, and do not add it to `ci` or to hk.pkl. It needs
# Docker, like `linux-ci`, whose image, cache and volume it shares.
#
# This is where the wgpu renderer draws on Linux without a GPU: in the
# container it runs the renderer's example (`render-gpu`'s) on Mesa's
# software Vulkan driver, llvmpipe, which the image installs for this task
# alone. The gate in that image asks for no adapter and is not changed by
# the driver being there.
[tasks.linux-render]
description = "Opt-in, never part of ci: in the Linux container, on Mesa's software Vulkan, hold the wgpu renderer to the renderer port's contract and compare the frame it draws with the reference image (tools/linux/run.sh). Needs Docker"
run = "tools/linux/run.sh render"

[tasks.ci]
description = "The whole gate; `hk check` runs this, and it gates review and landing (rdm's dispatch.verify)"
depends = ["fmt", "lint", "deny", "doc", "test", "lean-test", "lean", "lean-fmt", "ffi-test", "c-fmt"]
