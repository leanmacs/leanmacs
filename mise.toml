  # header's background must be block-header's, and the cursor's cell must
  # be lower than with no blocks (tests/render/excerpts/README.md). It
  # reads only checked-in files and writes nothing. `mise run
  # excerpt-reference` makes the image again.
  ".lake/build/bin/ffi-test excerpt-picture ../tests/render/excerpts ../tests/fonts/NotoSansMono-Regular.subset.ttf",
  # And the record of the fixture set's editor names the `.olean` directory
  # of each of the set's Lake packages that holds a library, one a line,
  # the core's first and each package after the ones it requires:
  # forty-nine directories and no more, each holding its package's modules,
