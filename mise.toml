run = "tools/milestone-bench.sh lean"

# Opt-in: do not add it to `ci` or to hk.pkl. It opens two windows on this
# desktop, one after the other, so it needs a display.
#
# First it runs the winit adapter's example (`crates/editor-platform-winit/
# examples/contract/main.rs`): the real window held to the window port's
# contract (`editor_platform::contract`). The window opens, is asked to
# close from another thread, and the run must return. On macOS it is also
# asked to quit as the system asks (`terminate:` and the quit Apple Event,
# examples/contract/terminate.rs), and must report each ask once, keep
# handling requests while AppKit waits, and keep running when it is told
# to; then, in a second process and a second window
# (examples/contract/pending.rs), a close with a terminate pending must let
# AppKit end the process, with status 0, only after the verdict. It needs
# no key or pointer input. It prints its verdict, then each resize the
# window reported on a line of its own, and its exit status is the result.
#
# Then it runs `editor-ffi`'s example (`crates/editor-ffi/examples/window/`):
# the window that draws. The wgpu renderer draws a fixture
# frame in the real window, on this machine's GPU; the example checks that
# each frame is laid out at the scale the window said, that a frame was
# presented, that its picture is the frame's, that nothing is drawn that
# nothing asked for, that input arrives on the queue, and that the window,
# whenever it is left alone for a second, shows what was laid out for the
# size and scale it last said. Each input is printed, and the run fails if
# no key or pointer input arrives. It stays 20 seconds or until it is
# closed (`-- --seconds <n>` does not reach it: run the example with
# `cargo run` for another time). Its exit status is the result.
#
# It is run here without `--require-picture`. A picture that could not be
# read back fails it, but a surface that says it does not let its texture
# be copied from does not: the example says so for each frame, and the
# picture was then not checked on this machine.
#
# The gate builds both examples and runs neither, though it does run the
# second's unit tests, which open no window; `linux-window` runs both
# under Xvfb, with no desktop, gives the second its input with xdotool,
# and requires its picture.
[tasks.window-contract]
description = "Opt-in, never part of ci: hold the winit window to the window port's contract, then draw a fixture frame in a window and check the picture, that nothing is drawn while idle, and that input arrives. Opens two windows on this desktop (three on macOS); the last fails without a key or pointer input"
run = [
  "cargo run --locked --package editor-platform-winit --example contract",
  "cargo run --locked --package editor-ffi --example window",
]

# Opt-in: do not add it to `ci` or to hk.pkl. It opens the window that
# draws (`crates/editor-ffi/examples/window/`) with `--until-closed
# --no-picture` and leaves it open until it is closed, for trying the
# window out (`docs/dev-practices/on-demand-checks.md`, "The window to
# try, on demand").
[tasks.window-by-hand]
description = "Opt-in, never part of ci: open the window that draws and leave it open until it is closed, to try it out. Reads no picture back. Needs a display"
run = "cargo run --locked --package editor-ffi --example window -- --until-closed --no-picture"

# Opt-in: run it by hand, and do not add it to `ci` or to hk.pkl. What it
# finds depends on the fonts this machine has, so it is no part of a gate
# that must give the same answer everywhere.
#
# It runs the Parley adapter's example (`crates/editor-shape-parley/
# examples/system.rs`): the real shaper over the system's fonts
# (`FontSet::system`), held to the shaper port's contract
