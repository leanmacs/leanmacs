[tools]
rust = { version = "1.98.1", components = "rustfmt,clippy" }
# cargo-deny is a prebuilt release binary that aqua's registry names with its
# checksum, so installing it never compiles.
"aqua:EmbarkStudios/cargo-deny" = "0.19.9"
hk = "2.4.0"
pkl = "0.32.1"
# The formatter for the C glue (`mise run c-fmt`, `mise run c-format`). The
# PyPI wheel is an exact pin of the binary; mise installs it with `uv` or
# `pipx`, whichever the machine has.
"pipx:clang-format" = "23.1.4"
# The secret scanner (`mise run secrets-scan`), never part of `ci`. Like
# cargo-deny, a prebuilt release binary whose checksum aqua checks.
"aqua:gitleaks/gitleaks" = "8.30.1"
# OpenTofu, for infra/ only (`mise run infra-check`, `infra-plan`,
# `infra-apply`); never part of `ci`.
opentofu = "1.13.2"
# The workflow lint (`mise run workflow-lint`, part of `ci`): actionlint and
# zizmor over .github/workflows, and yq for tools/workflow-check.sh's
# structural check of the workflows. Like cargo-deny, prebuilt release binaries
# whose checksums aqua checks. Each is a release at least two weeks old when
# pinned (docs/dev-practices/ci.md).
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.32.0"
"aqua:mikefarah/yq" = "4.54.1"
# Lean (lean, lake) is not listed here: `lean/lean-toolchain` is its one pin
# (AGENTS.md, "Toolchains"). mise reads that file through the `lean` plugin,
# which the global mise config declares along with
# `idiomatic_version_file_enable_tools = ["lean"]`.

[env]
RDM_ROOT = "{{env.HOME | default(value=env.USERPROFILE | default(value=''))}}/Projects/rdm-atlas-repo"
RDM_PROJECT = "editor-project"
# The lowest macOS every Lake link targets, the executable's `minos`, here
# and in CI alike. With this unset Lake links for 99.0, and Finder refuses
# to start the app ("you can't use this version"). It must equal
# `appMinimumSystemVersion` in lean/lakefile.lean, the bundle's
# LSMinimumSystemVersion; `mise run app-check` fails when the executable's
# `minos` is later. It is the CI runner's macOS (macos-26): dyld refuses to
# start a Mach-O whose `minos` is newer than the host, and the gate and the
# build job run what they build there (docs/dev-practices/ci.md,
# "Deployment target"). Other platforms ignore it.
MACOSX_DEPLOYMENT_TARGET = "26.0"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all --check"

[tasks.lint]
description = "Clippy over every crate and target, warnings are errors"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.deny]
description = "cargo-deny's bans over the dependency graph (deny.toml); stale `wrappers` are errors"
run = "cargo deny --locked check -D unused-wrapper bans"

[tasks.doc]
description = "Rustdoc over every crate, private items included, with broken intra-doc links denied"
env = { RUSTDOCFLAGS = "-D rustdoc::broken_intra_doc_links" }
run = "cargo doc --workspace --no-deps --document-private-items --locked"

[tasks.test]
description = "Rust unit, integration and doc tests"
run = "cargo test --workspace --locked"

# The model tests: editor logic run in Lean alone, against hand-written fakes
# and the pure models of the editor's ports (lean/ModelTest.lean and
# lean/ModelTest/). They must pass without the Rust library being built, and
# the task shows that by behaviour: `lean/no-cargo/cargo` is a fake `cargo`
# that always fails, put first on the PATH, and Lake's `rustlib` target runs
# `cargo` on every build that reaches it. So this passes only if nothing the
# test driver needs reaches `rustlib`, on a tree where the archive is already
# built as well as on a clean one. Seen to bite once by hand: with the same
# PATH, `LEAN_CC=/usr/bin/cc lake build editor` fails at `editor/rustlib`.
#
# No LEAN_CC: the test driver links no C glue, so Lean's bundled compiler
# builds it.
#
# Nothing is removed from the environment. LEAN_NUM_THREADS sets the size of
# Lean's task pool, and the checks that warm the pool and count the threads
# jobs wait from pin no size: they pass under a bare `lake test` whatever the
# variable says.
[tasks.lean-test]
description = "Run the Lean model tests with `lake test`, with a `cargo` that fails first on the PATH: they need no Rust library (lean/ModelTest.lean and lean/ModelTest/)"
dir = "lean"
run = 'PATH="$PWD/no-cargo:$PATH" lake test --wfail'

# Runs in lean/, so mise picks the toolchain `lean/lean-toolchain` pins.
#
# It waits for `lean-test` only so that two Lake builds never run in lean/ at
# once: the Lake tasks run in one chain, `lean-test`, `lean`, then `lean-fmt`
# and `ffi-test`.
[tasks.lean]
description = "Build the Lean package and the executables with Lake, which runs Cargo for the Rust static library; every linter is on and a warning fails the build (lean/lakefile.lean)"
depends = ["lean-test"]
dir = "lean"
# On macOS the executables must be compiled and linked by the system compiler:
# the clang bundled with Lean has no `pthread.h` for the C glue, and its linker
# cannot link the system frameworks the Rust library will need. This is set
# here and not in the top-level [env] because lean-fmt must keep building with
# Lean's bundled compiler: under /usr/bin/cc its link fails (`library 'gmp'
# not found`). It is the absolute path because `cc` on mise's PATH may be a
# shim for another compiler.
env = { LEAN_CC = "/usr/bin/cc" }
# --wfail also fails on warnings Lake itself logs, which `warningAsError` in
# the lakefile does not reach.
run = "lake build --wfail"

# lean-fmt is a Lake dependency (lean/lakefile.lean), pinned to the tag named
# after the Lean toolchain. Both tasks wait for `lean`, so two Lake builds
# never run in lean/ at once.
[tasks.lean-fmt]
description = "Check Lean formatting and lean-fmt's lints; changes nothing"
depends = ["lean"]
dir = "lean"
run = [
  "lake exe lean-fmt format --check",
  "lake exe lean-fmt check",
]

[tasks.lean-format]
description = "Rewrite the Lean sources in lean-fmt's style and apply its safe lint fixes"
depends = ["lean"]
dir = "lean"
run = [
  "lake exe lean-fmt format",
  "lake exe lean-fmt check --fix",
]

# Tracked files only, so Lake's fetched packages and build output are never
# looked at. A new C file is checked once it is `git add`ed. Vendored C
# (`vendor/`, vendor/README.md) is left out: it is upstream's generated code,
# neither checked nor rewritten here, and clang-format takes about 51 s on the
# Lean grammar's `parser.c` alone.
[tasks.c-fmt]
description = "Check the formatting of the C and C++ sources (.clang-format); changes nothing"
run = "git ls-files -z -- '*.c' '*.h' '*.cc' '*.cpp' '*.hpp' ':!:vendor/**' | xargs -0 clang-format --dry-run --Werror"

[tasks.c-format]
description = "Rewrite the C and C++ sources in the style .clang-format sets"
run = "git ls-files -z -- '*.c' '*.h' '*.cc' '*.cpp' '*.hpp' ':!:vendor/**' | xargs -0 clang-format -i"

# Runs the built executables only (no Lake), so it needs just `lean` before it.
# The time limit turns a hang into a failure: a deadlock in the main-thread
# hand-off, or a process that waits for a task still blocked in the library.
# It bounds each command, not the task, and is set well above the slowest:
# `contract-test`, whose version-control properties run real git in
# temporary repositories, takes about 15 s on a developer's Mac and 50 to
# 60 s on the macOS runner while the gate's other tasks run beside it.
[tasks.ffi-test]
description = "Run the checks and scenarios of the Lean/Rust boundary (lean/FfiTest.lean), the text port's, the job port's and the syntax tree interface's contracts against their real bindings (lean/ContractTest.lean), the config session against the real elaborator (lean/ConfigTest.lean) and the editor executable"
depends = ["lean"]
dir = "lean"
timeout = "180s"
run = [
  # One of these checks measures the stack the entry point gives Lean's
  # threads, and LEAN_STACK_SIZE_KB overrides that size, so a variable in the
  # developer's shell must not reach it.
  "env -u LEAN_STACK_SIZE_KB .lake/build/bin/ffi-test",
  # Arguments reach Lean's `main`, and its result is the exit status.
  "status=0; .lake/build/bin/ffi-test exit 7 || status=$?; test \"$status\" -eq 7",
  # Quit is for good and process-wide, so shutdown has processes of its own.
  ".lake/build/bin/ffi-test shutdown",
  ".lake/build/bin/ffi-test exit-while-blocked",
  # The same properties `lean-test` runs against the pure models, here against
  # the Rust library: the text port's, and the job port's over the timer
  # service. Its check of Lean's task pool pins no size, so LEAN_NUM_THREADS
  # in the developer's shell does it no harm. Its first two arguments are the
  # directory of the fixtures that stand in for mise in the checks of a
  # child's environment (tests/process-environment), and the directory of
  # the fixture that stands in for git in the workspace finder's checks,
  # whose properties `lean-test` runs against the finder's model
  # (tests/workspaces). Its third is the directory of the fixture `:!` runs
  # over the real process service, which is also the editor's working
  # directory in those checks (tests/shell). Its fourth is the directory of
  # the fixtures `compile` runs over the real process service (tests/compile):
  # the fixture `three-lines`, and the programs that stand for cargo, lake
  # and mise first on each child's PATH, with the trees the shipped modes are
  # checked in. Its fifth is the directory of the syntax fixtures, whose Rust
  # fixtures the indent and text-object checks read (tests/syntax). Its
  # sixth is the directory of the fixture that stands in for fzf in the
  # checks of a source a command filters (tests/completion).
  ".lake/build/bin/contract-test ../tests/process-environment ../tests/workspaces ../tests/shell ../tests/compile ../tests/syntax ../tests/completion",
  # The config session against the real elaborator. The toolchain's directory
  # and the package's `.olean` directory are passed in, so it reads nothing
  # from the environment; its third argument is the directory of the syntax
  # fixtures, whose Rust indent fixture the indent checks read (tests/syntax),
  # and its fourth the default config `mise run install` ships, which the
  # default config checks read (config/default).
  ".lake/build/bin/config-test \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/syntax ../config/default",
  # The demonstration. With no arguments the editor is the window mode on
  # an empty buffer, which opens a window, so the gate never runs that.
  ".lake/build/bin/editor demo",
  # The headless mode, on the fixture checked in under tests/headless: it
  # loads the config directory, runs the script, and must print exactly
  # `expected`. Every path is an argument.
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/config ../tests/headless/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/expected -",
  # The same, with a script that sends keys with their identity: each goes
  # through the library's window input, as a window's would, and must be
  # printed back with its logical key, physical key and modifiers
  # (`keys-expected`).
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/config ../tests/headless/keys-script) && printf '%s\\n' \"$out\" | diff ../tests/headless/keys-expected -",
  # The same, with a script that enters insert state, commits text as an
  # input method would and asks for the scene: the editor loop's frame is
  # made at the first window event, and the view's snapshot must hold the
  # text, read from the library (`scene-expected`). Its second half reloads and runs a job once the
  # frame exists, and each must be followed by a scene.
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/config ../tests/headless/scene-script) && printf '%s\\n' \"$out\" | diff ../tests/headless/scene-expected -",
  # Keys dispatched to commands, on a config of its own (tests/headless/
  # dispatch): a key sequence config binds runs its command, the interrupt
  # key stops one that loops over requests and rolls back its edit, the next
  # key's command runs to its end, and a key's command starts a job with an
  # argument, whose result the job's command says in the echo area
  # (`dispatch/expected`). A command that is not stopped loops for longer
  # than the time limit.
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/dispatch/config ../tests/headless/dispatch/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/dispatch/expected -",
  # The finder-session config fixture (tests/headless/finder-session): it
  # loads, and its command, run by its key `C-c h`
  # and by its ex name `finder-hello`, says `finder-session: config loaded`
  # in the echo area each time (`finder-session/expected`).
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/finder-session/config ../tests/headless/finder-session/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/finder-session/expected -",
  # The file commands the editor ships, on a config of its own (tests/
  # headless/files): `save-buffer`, which no config registers, says the
  # scratch buffer has no file, and a command of config's opens a path that
  # is not absolute, which starts the compiled job `load-file` and is
  # refused by the library before it asks the file system, so the run
  # touches no file (`files/expected`).
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/files/config ../tests/headless/files/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/files/expected -",
  # A prompt, on a config of its own (tests/headless/prompt), under the
  # editor's input scheme: a command of config's asks for a prompt, a
  # key that prints is typed into the minibuffer, whose view the scene
  # shows with the prompt text as its status line; `<Enter>` accepts with
  # the compiled command `minibuffer-accept`, and config's command that
  # receives the answer says it in the echo area; `<Escape>` cancels with
  # `minibuffer-cancel`, and that command does not run (`prompt/expected`).
  # It touches no file.
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/prompt/config ../tests/headless/prompt/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/prompt/expected -",
  # A prompt with candidates, on a config of its own (tests/headless/
  # candidates), under the editor's input scheme and with the library's
  # fuzzy matcher: a command of config's asks with three candidates, a key
  # is typed, and the scene lists the candidates the text matches after
  # the prompt's label, in the minibuffer's status line, the one that is
  # the text first; `C-n`, pressed twice, chooses the second with the
  # compiled command `minibuffer-next`, and the scene shows it in the
  # chosen face; `<Enter>` accepts, and config's command that receives the
  # answer says the chosen candidate in the echo area; with a text no
  # candidate matches the scene lists none, `<Tab>` puts nothing in the
  # input, and the command receives the typed text; and `<Tab>`, the
  # compiled command `minibuffer-insert`, puts the first listed candidate
  # in the input, the prompt still open (`candidates/expected`). It touches
  # no file.
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/candidates/config ../tests/headless/candidates/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/candidates/expected -",
  # Named themes, on a config of its own (tests/headless/themes) that
  # defines two themes and names the first: the scene line names the theme
  # each scene was drawn in, the first after the reload, the second after
  # the compiled command `load-theme` is answered with its name, with no
  # reload between, and the shipped `solarized-dark` and `fairy-floss`
  # after it as each is answered with its name (`themes/expected`). It
  # touches no file.
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/themes/config ../tests/headless/themes/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/themes/expected -",
  # A shipped theme named by config, on a config of its own
  # (tests/headless/shipped-themes) that names `solarized-light`: the scene
  # after the reload is drawn in it, and the one after `load-theme` is
  # answered with `fairy-floss` in that (`shipped-themes/expected`). It
  # touches no file.
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/shipped-themes/config ../tests/headless/shipped-themes/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/shipped-themes/expected -",
  # The segmented mode line, on a config of its own (tests/headless/
  # mode-line) that defines a segment and lists the mode line for each side,
  # one name nobody registered among them: the reload says that name, on a
  # line of its own and in the echo area, and each scene's status line has
  # its left fields, ` | ` and its right ones, in the listing's order, with
  # their paddings, in insert state, in normal state and with the ex prompt
  # open (`mode-line/expected`). It touches no file.
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/mode-line/config ../tests/headless/mode-line/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/mode-line/expected -",
  # The frame padding (tests/headless/padding): a config that sets it to 12
  # points; each scene prints the window's view padded 12 across and down,
  # the echo padded 12, and with the ex prompt open the minibuffer's view
  # padded 12 across and none down (`padding/expected`). It touches no file.
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/padding/config ../tests/headless/padding/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/padding/expected -",
  # The monocle layout (tests/headless/monocle): a config that chooses it
  # and binds keys to split the window and to focus the next one; each
  # scene shows only the focused window's view, in the whole area above
  # the bottom row: view 0, view 0 again after the split, view 1 once it is
  # focused, and view 1, the asker, above the minibuffer's view with the ex
  # prompt open (`monocle/expected`). It touches no file.
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/monocle/config ../tests/headless/monocle/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/monocle/expected -",
  # Two windows on one buffer (tests/headless/two-windows), under the
  # default layout, with the same keys: in a frame of 640 by 120 the window
  # is split over twelve lines, the second view's cursor goes to the last
  # line, its anchor following it down, and the first view, at the top,
  # appends to its first line. The last scene shows both views side by
  # side with the edit, each with its own cursor and scroll anchor, moved
  # by the edit (`two-windows/expected`). It touches no file.
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/two-windows/config ../tests/headless/two-windows/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/two-windows/expected -",
  # The manual split layout (tests/headless/manual-splits): a config that
  # chooses it and binds no key, so the Vim scheme's own `C-w` keys reach
  # the window commands. `C-w s` puts the new window above and focuses it,
  # `C-w v` the next one on its left, `C-w j` focuses the window below,
  # `C-w C-w` wraps from the last window to the first, and `C-w C-c` three
  # times closes two windows and is refused on the last, with the reason in
  # the echo area (`manual-splits/expected`). It touches no file.
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/manual-splits/config ../tests/headless/manual-splits/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/manual-splits/expected -",
  # The dividers and the selected window's mode line (tests/headless/
  # window-dividers), under the manual split layout and the Vim scheme's
  # `C-w` keys: `C-w v` puts a divider between two side-by-side windows,
  # `C-w s` adds one across the stacked pair, none is along the frame's
  # edges, and `C-w C-w` moves `mode-line.active` to the window it focuses
  # (`window-dividers/expected`). It touches no file.
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/window-dividers/config ../tests/headless/window-dividers/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/window-dividers/expected -",
  # The window commands in insert state (tests/headless/insert-window-keys):
  # a config that binds every key of the Vim scheme's `C-w` table with
  # `bindKey`. `C-w v` puts view 1 on the right, under master-and-stack,
  # and `C-w h` and `C-w l` in insert state focus view 0 and view 1 again
  # without leaving insert state, so the text typed after them goes on
  # where it was (`insert-window-keys/expected`). It touches no file.
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/insert-window-keys/config ../tests/headless/insert-window-keys/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/insert-window-keys/expected -",
  # Vim's word delete in insert state (tests/headless/insert-word-delete):
  # a config that binds no key under `C-w`, so `C-w` deletes the word
  # before the bar and the `l` after it is text (`insert-word-delete/expected`).
  # It touches no file.
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/insert-word-delete/config ../tests/headless/insert-word-delete/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/insert-word-delete/expected -",
  # Completion at point's auto popup (tests/headless/at-point), on the shared
  # config: two characters typed in insert state, then `advance 240` on the
  # headless mode's fake clock fires the pause of the shipped `words` source,
  # whose session lists the words that match; `C-n` previews the first and
  # `RET` accepts it (`at-point/expected`). It touches no file.
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/config ../tests/headless/at-point/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/at-point/expected -",
  # Display rules (tests/headless/display-rules): a config whose one rule
  # names the right edge the default layout lacks is installed with the
  # rule left out, and says so in its report's `rule:` line and in the
  # echo area; `:ls` and a command of
  # config's that makes a buffer each show it in a new window at the end of
  # the stack, focused, while main keeps the buffer being edited, and `:ls`
  # again focuses the list's window (`display-rules/expected`). It touches
  # no file.
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/display-rules/config ../tests/headless/display-rules/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/display-rules/expected -",
  # A sidebar (tests/headless/edge-sidebar): a config that chooses a left
  # edge of 25 percent and a rule that sends a mode's buffers there; the
  # buffer a command makes is docked in the strip, focused by direction,
  # moved into the tiles and back with `C-w H`, made main with `C-w m` and
  # closed with `C-w C-c`, and `C-w H` on the last tile is refused with the
  # reason in the echo area (`edge-sidebar/expected`). It touches no file.
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/edge-sidebar/config ../tests/headless/edge-sidebar/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/edge-sidebar/expected -",
  # Floats a display rule opens (tests/headless/float-rule): a config whose
  # rules send what two commands open to a transient and to a pinned float;
  # each opens centred in the tiled area, listed after view 0 and focused,
  # the transient one closes when `C-w C-p` moves the focus, the pinned one
  # stays, and `C-w F` moves it into the tiles, where it joins the stack
  # (`float-rule/expected`). It touches no file.
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/float-rule/config ../tests/headless/float-rule/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/float-rule/expected -",
  # A float anchored at the cursor (tests/headless/float-anchor): a config
  # whose command opens a transient float at the cursor without the focus;
  # it is placed directly under the cursor's row, closes when `C-f` scrolls
  # the row out of the view, and on the last row shown is flipped above it
  # (`float-anchor/expected`). It touches no file.
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/float-anchor/config ../tests/headless/float-anchor/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/float-anchor/expected -",
  # Tabs (tests/headless/tabs): under the default layout, `C-w c` makes a
  # second tab and the tab bar appears above the bottom row, its chip of the
  # tab in view in `tab-bar.selected`; `C-w p` and `C-w n` show each tab as
  # it was left, its windows, focus and zoom; `C-w 3` and the last `C-w &`
  # are refused with the reason in the echo area; `tab-rename` and
  # `tab-switch` go through the minibuffer (`tabs/expected`). It touches no
  # file.
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/tabs/config ../tests/headless/tabs/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/tabs/expected -",
  # Evil, with no config: the script has no `reload`, so nothing of the
  # config directory is loaded, and every command its keys run is one the
  # editor ships. `i` begins an insert and the keys that print are typed
  # text, `<Escape>` returns to normal state, and `0` moves to the line's
  # start: the scenes show the text, the cursor and the state's name in the
  # status line (`evil-expected`).
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/config ../tests/headless/evil-script) && printf '%s\\n' \"$out\" | diff ../tests/headless/evil-expected -",
  # The ex command line, with no config (tests/headless/ex): the script has
  # no `reload`, so the ex command and every ex name are the ones the
  # editor ships. Two of its lines are opened with the `:` key, as a user
  # opens them. A name nobody bound is said in the echo area, `w` in the
  # scratch buffer says it has no file, `e` with no path asks with the file
  # prompt, whose listing of the working directory is waited for and not
  # printed, and `q` quits the editor: the loop ends, the `scene` line after
  # it is not run, and the status is 0 (`ex/expected`). It writes no file.
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/config ../tests/headless/ex/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/ex/expected -",
  # `e`, an edit, `w` and `q` on a real file, as a process. Lean spawns no
  # child (docs/design/overview.md), so the check is here: this entry is one
  # shell, which makes a temporary directory and removes it by a trap when
  # the shell ends, whether the check passed or failed. It copies the
  # fixture file `ex/note.txt` there, and writes the script there from the
  # template `ex/save-quit-script`, with the copy's absolute path in place
  # of `@FILE@`: the file port takes absolute paths only. The editor must
  # exit with status 0, the copy must hold the bytes of `ex/note-expected`,
  # and no line of the output may start with `commands:`, which the `show`
  # line after the quit would print. Nothing outside the temporary
  # directory is written, and the task's time limit ends a run that hangs.
  "dir=$(mktemp -d) && trap 'rm -rf \"$dir\"' EXIT && cp ../tests/headless/ex/note.txt \"$dir/note.txt\" && sed \"s|@FILE@|$dir/note.txt|\" ../tests/headless/ex/save-quit-script > \"$dir/script\" && out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/config \"$dir/script\") && printf '%s\\n' \"$out\" && cmp \"$dir/note.txt\" ../tests/headless/ex/note-expected && ! printf '%s\\n' \"$out\" | grep -q '^commands:'",
  # The same with `wq` in place of `w` and `q` (`ex/wq-script`): the quit
  # waits for the save, so the script has a `join` after the `wq` line,
  # which ends when the save's result has ended the loop.
  "dir=$(mktemp -d) && trap 'rm -rf \"$dir\"' EXIT && cp ../tests/headless/ex/note.txt \"$dir/note.txt\" && sed \"s|@FILE@|$dir/note.txt|\" ../tests/headless/ex/wq-script > \"$dir/script\" && out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/config \"$dir/script\") && printf '%s\\n' \"$out\" && cmp \"$dir/note.txt\" ../tests/headless/ex/note-expected && ! printf '%s\\n' \"$out\" | grep -q '^commands:'",
  # An evil session on a real file, as a process, with no config
  # (tests/headless/session): `:e`, a count and an operator (`2dw`), a dot
  # repeat, an undo, a change with typed text and its dot repeat, a visual
  # yank, a put, an undo and a redo, and `:w`, with a scene printed after
  # each step. This entry is one shell, as the two above are: it makes a
  # temporary directory and removes it by a trap, copies `session/verse.txt`
  # there, and writes the script there from the template `session/script`
  # with the copy's absolute path in place of `@FILE@`. The editor must exit
  # with status 0, its output, with the temporary directory's path written
  # `@DIR@`, must be exactly `session/expected` (the text, the cursor, the
  # selection, the state and the echo of every scene), and the copy must
  # hold the bytes of `session/verse-expected`.
  "dir=$(mktemp -d) && trap 'rm -rf \"$dir\"' EXIT && cp ../tests/headless/session/verse.txt \"$dir/verse.txt\" && sed \"s|@FILE@|$dir/verse.txt|\" ../tests/headless/session/script > \"$dir/script\" && out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/config \"$dir/script\") && printf '%s\\n' \"$out\" | sed \"s|$dir|@DIR@|g\" | diff ../tests/headless/session/expected - && cmp \"$dir/verse.txt\" ../tests/headless/session/verse-expected",
  # `open-file`'s prompt over real files, as a process, with no config
  # (tests/headless/open-file): the file source lists the directory typed so
  # far through the library's file service, directories first with
  # `directory` beside them and `.hidden` left out until a `.` is typed, from
  # the one read; `no` lists `notes/` with its match; `<Tab>` goes into it
  # and lists `todo.md`; `C-n` and `<Enter>` open it; and a directory that
  # is not there says why in the echo area and lists nothing. This entry is
  # one shell, as the session's is: it makes a temporary directory and
  # removes it by a trap, copies `open-file/tree` there, and writes the
  # script there from the template `open-file/script` with the directory's
  # absolute path in place of `@DIR@`. The editor must exit with status 0,
  # and its output, with that path written `@DIR@`, must be exactly
  # `open-file/expected`. Every job is waited for with `join`, so its lines
  # are fixed. No file is written. The prompt's view prints the cursor's
  # byte offset over the absolute path typed, which the scrub cannot
  # rewrite, so the directory is made from a template under `/tmp`, not
  # under `$TMPDIR`: its path is always 23 bytes, on every machine.
  "dir=$(mktemp -d /tmp/open-file.XXXXXXXX) && trap 'rm -rf \"$dir\"' EXIT && cp -R ../tests/headless/open-file/tree \"$dir/tree\" && sed \"s|@DIR@|$dir|g\" ../tests/headless/open-file/script > \"$dir/script\" && out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/config \"$dir/script\") && printf '%s\\n' \"$out\" | sed \"s|$dir|@DIR@|g\" | diff ../tests/headless/open-file/expected -",
  # A view that follows its cursor, as a process, with no config
  # (tests/headless/view): the script sizes the frame, opens a file of 120
  # lines with `:e`, and moves the cursor 100 lines down, with a scene
  # printed after each step: the second scene's view has its scroll anchor
  # moved so that the cursor's line is among the rows it shows. Then `C-u`,
  # `C-f` twice, the second at the text's end, `zt` and `zb` scroll the
  # view, and a resize to a third of the height is followed. The display
  # is the recorder, the display model's rule over the library's snapshots,
  # in cells of 8 by 16. This entry is one shell, as the three above are: it
  # makes a temporary directory and removes it by a trap, copies
  # `view/lines.txt` there, and writes the script there from the template
  # `view/script` with the copy's absolute path in place of `@FILE@`. The
  # editor must exit with status 0, and its output, with the temporary
  # directory's path written `@DIR@`, must be exactly `view/expected`. The
  # file is not written.
  "dir=$(mktemp -d) && trap 'rm -rf \"$dir\"' EXIT && cp ../tests/headless/view/lines.txt \"$dir/lines.txt\" && sed \"s|@FILE@|$dir/lines.txt|\" ../tests/headless/view/script > \"$dir/script\" && out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/config \"$dir/script\") && printf '%s\\n' \"$out\" | sed \"s|$dir|@DIR@|g\" | diff ../tests/headless/view/expected - && cmp \"$dir/lines.txt\" ../tests/headless/view/lines.txt",
  # `j` and `k` aiming for a display column, as a process, with no config
  # (tests/headless/column): the script opens a file of three lines, one
  # with a tab and one with a wide character, with `:e`, and moves the
  # cursor down from after the tab and up from after the wide character,
  # with a scene printed after each step: the cursor lands at the display
  # column it started in, the tab stop's and two past the wide character's.
  # There is no `resize`, so the frame is 0 by 0: the column does not need
  # the view's rectangle. The display is the recorder, the display model's
  # rule over the library's snapshots. This entry is one shell, as the four
  # above are: it makes a temporary directory and removes it by a trap,
  # copies `column/lines.txt` there, and writes the script there from the
  # template `column/script` with the copy's absolute path in place of
  # `@FILE@`. The editor must exit with status 0, and its output, with the
  # temporary directory's path written `@DIR@`, must be exactly
  # `column/expected`. The file is not written.
  "dir=$(mktemp -d) && trap 'rm -rf \"$dir\"' EXIT && cp ../tests/headless/column/lines.txt \"$dir/lines.txt\" && sed \"s|@FILE@|$dir/lines.txt|\" ../tests/headless/column/script > \"$dir/script\" && out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/config \"$dir/script\") && printf '%s\\n' \"$out\" | sed \"s|$dir|@DIR@|g\" | diff ../tests/headless/column/expected - && cmp \"$dir/lines.txt\" ../tests/headless/column/lines.txt",
  # Milestone 1 over the whole program, with no config
  # (tests/headless/milestone): the headless mode with `--render`, whose
  # display is the real binding over the library's layout in cells of 8 by
  # 16, bound to the library's headless render session, which draws every
  # frame on the CPU renderer. The script opens a source file of 60 lines
  # with `:e`, runs an evil session on it (`2dw`, `.`, `u`, `j`, `cw` with a
  # committed text, `<Escape>`, `$ p`, `u`, `C-r`), scrolls with `C-f`,
  # saves with `:w`, and checks twice with `agree` that the last rows query
  # about the view gave the rows of the frame drawn of it; then `idle 1000`
  # waits for the render loop to be at rest and counts what it draws and is
  # handed over one second, which must be nothing. That second is the one
  # real-time wait of the gate's checks of the render loop
  # (docs/design/text-and-display.md). This entry is one shell, as the five
  # above are: it makes a temporary directory and removes it by a trap,
  # copies `milestone/source.txt` there, and writes the script there from
  # the template `milestone/script` with the copy's absolute path in place
  # of `@FILE@`. The editor must exit with status 0, its output, with the
  # temporary directory's path written `@DIR@`, must be exactly
  # `milestone/expected`, and the copy must hold the bytes of
  # `milestone/source-expected`.
  "dir=$(mktemp -d) && trap 'rm -rf \"$dir\"' EXIT && cp ../tests/headless/milestone/source.txt \"$dir/source.txt\" && sed \"s|@FILE@|$dir/source.txt|\" ../tests/headless/milestone/script > \"$dir/script\" && out=$(.lake/build/bin/editor headless --render \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/config \"$dir/script\") && printf '%s\\n' \"$out\" | sed \"s|$dir|@DIR@|g\" | diff ../tests/headless/milestone/expected - && cmp \"$dir/source.txt\" ../tests/headless/milestone/source-expected",
  # The display fixture: the scene `editor-layout`'s own test lays out
  # (crates/editor-layout/tests/frame_fixture.rs), published from Lean
  # through the display's real binding, must give the frame checked in at
  # tests/display/frame.expected; the scene must come back as sent; and a
  # move asked through the binding must land on the frame's next row.
  ".lake/build/bin/ffi-test display ../tests/display/frame.expected",
  # The shipped themes' pictures: the fixture file tests/render/themes/
  # source.lean, published from Lean through the display's real binding in
  # `solarized-dark`, `solarized-light` and `fairy-floss`, over a display
  # of the one fixture font given here, and drawn by the CPU renderer, must
  # match
  # `tests/render/themes/<name>.png` within 2 of 255 a channel; in each,
  # the paper, the cursor and the text must carry the palette's colours;
  # and the light picture must not match the dark reference
  # (tests/render/themes/README.md). It reads only checked-in files and
  # writes nothing. `mise run theme-references` makes the images again.
  ".lake/build/bin/ffi-test theme-pictures ../tests/render/themes ../tests/fonts/NotoSansMono-Regular.subset.ttf",
  # The excerpt picture (lean/FfiTest/Editor/ExcerptView.lean,
  # `excerptPictureScenario`): an
  # excerpt document's view with each excerpt's header as a block above it,
  # drawn by the CPU renderer through the display's real binding in
  # solarized-dark, must match tests/render/excerpts/excerpts.png within the
  # same tolerance; the scene with no blocks must differ from it, the
  # header's background must be block-header's, and the cursor's cell must
  # be lower than with no blocks (tests/render/excerpts/README.md). It
  # reads only checked-in files and writes nothing. `mise run
  # excerpt-reference` makes the image again.
  ".lake/build/bin/ffi-test excerpt-picture ../tests/render/excerpts ../tests/fonts/NotoSansMono-Regular.subset.ttf",
  # The window mode's wiring, `editor <file>` (lean/Editor/Window/Real.lean),
  # on the library's scripted platform, as a process of its own, so that its
  # render session is the only one the process starts: a cells display bound
  # to the presenter, the host opening a copy of `ex/note.txt`, the scripted
  # sample window opening, sending its fixed input and asking to close. The
  # scenario must exit 0, which it does only once the window has run and
  # closed and the render session's counters show a frame drawn, and the
  # copy must be unchanged. It opens no window and touches no clipboard of
  # the desktop's.
  "dir=$(mktemp -d) && trap 'rm -rf \"$dir\"' EXIT && cp ../tests/headless/ex/note.txt \"$dir/note.txt\" && .lake/build/bin/ffi-test window-host \"$dir/note.txt\" && cmp \"$dir/note.txt\" ../tests/headless/ex/note.txt",
  # The same wiring with no file, as Finder starts the app: the host posts
  # no open, and the window runs on the editor's one empty buffer. It must
  # exit 0 as the scenario with a file does. It touches no file.
  ".lake/build/bin/ffi-test window-host",
  # The same wiring with no file and config loaded at start, on the fixture
  # tests/window/title-bar/config, whose `setup` keeps the standard title
  # bar: the host waits for the start-up reload, with no bound so that the
  # result does not race the clock (this task's time limit ends a run that
  # hangs), and the scripted window must be opened with the standard title
  # bar. The toolchain's directory and the `.olean` directory are passed in,
  # as for config-test. It touches no file.
  ".lake/build/bin/ffi-test window-host-config \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/window/title-bar/config",
  # The same wiring on the library's scripted platform whose renderer cannot
  # be made, as a machine with no usable GPU gives: the window runs with
  # nothing drawing in it. The scenario must exit 0, which it does only when
  # the window mode ended with status 1 and no render session was started;
  # stderr must hold the window mode's line saying why nothing drew, with
  # the platform's reason whole (`SCRIPTED_NO_RENDERER` in
  # crates/editor-ffi/src/window.rs); and the copy must be unchanged.
  "dir=$(mktemp -d) && trap 'rm -rf \"$dir\"' EXIT && cp ../tests/headless/ex/note.txt \"$dir/note.txt\" && err=$(.lake/build/bin/ffi-test window-host-undrawn \"$dir/note.txt\" 2>&1 >/dev/null) && printf '%s\\n' \"$err\" | grep -qxF \"editor: nothing could draw in the window: the scripted platform's window has no renderer: pas de GPU\" && cmp \"$dir/note.txt\" ../tests/headless/ex/note.txt",
  # The editor's failure statuses. A command line it does not understand is
  # status 2, with the usage on stderr: an option it does not know, and two
  # files, `demo x` among them. (A word that is no mode is a file to open,
  # and `demo` is a mode only on its own.)
  "status=0; .lake/build/bin/editor --bogus || status=$?; test \"$status\" -eq 2",
  "status=0; .lake/build/bin/editor a b || status=$?; test \"$status\" -eq 2",
  "status=0; .lake/build/bin/editor demo x || status=$?; test \"$status\" -eq 2",
  # The headless mode with only a config directory and a script, from the
  # build tree, outside a bundle: there is no toolchain to use, so it is
  # status 2 with a line on stderr saying so, before the usage
  # (lean/Editor/Headless/CommandLine.lean). `bundle-test` runs the same
  # command line from a bundle.
  "status=0; err=$(.lake/build/bin/editor headless ../tests/headless/config ../tests/headless/script 2>&1 >/dev/null) || status=$?; printf '%s\\n' \"$err\"; test \"$status\" -eq 2 && test \"${err#editor: no Lean toolchain}\" != \"$err\"",
  # A script that cannot be read is status 1, with nothing on stdout and a
  # line on stderr that starts `editor: ` and says why. No file of that name
  # is checked in.
  "status=0; err=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/config ../tests/headless/no-such-script 2>&1 >/dev/null) || status=$?; printf '%s\\n' \"$err\"; test \"$status\" -eq 1 && test \"${err#editor: }\" != \"$err\"",
]

# The headless mode run from a bundle, as the installed editor will be
# (docs/dev-practices/headless-mode.md, "From an app bundle"). It runs the
# built executables only, so it needs just `lean` before it, and has a time
# limit of its own: copying the 180 MB executable and the module files must
# not eat `ffi-test`'s.
#
# One shell, which makes a temporary directory and removes it by a trap when
# the shell ends, whether the check passed or failed. In it,
# tools/stage-bundle.sh lays out `Leanmacs.app` as the bundle will be: a
# copy of `editor` (not a link) in `Contents/MacOS`, and the `.olean`,
# `.olean.server` and `.olean.private` files of the modules `Editor`
# imports, which `config-test bench-modules` lists, under
# `Contents/Resources/lean/toolchain/lib/lean` and
# `Contents/Resources/lean/editor`. Those three kinds and that closure are
# what `mise run module-bench` measured the import to need
# (docs/design/lean-runtime.md, "What config may import, measured").
# `lean --print-prefix` runs on the staging side only. The fixture's config
# and script (tests/headless/bundle) are copied into the temporary
# directory, and the copy of the editor runs its headless mode on them from
# a working directory outside the bundle, with no directory argument and an
# empty environment (no `HOME`, `PATH`, `LEAN_PATH` or `XDG_*`): it must
# exit 0 and print exactly `expected`. It passes only if the executable
# found its modules from its own path: outside a bundle it would find no
# toolchain and be refused, and the build tree's `.olean` directory is not
# beside the copy. The fixture's commands only make texts, so nothing is
# written outside the temporary directory.
#
# Then `editor --version` (lean/Editor/Version.lean), through `IO.appPath`
# and the real file read: the fixture's `Info.plist`, which holds only the
# three keys with a fake stamp, is copied into the staged `Contents/`, and
# the copy, run with an empty environment, must print exactly
# `version-expected`; and the build tree's `editor`, outside a bundle, must
# print the line of a development build.
[tasks.bundle-test]
description = "Stage the app bundle's layout in a temporary directory and run the headless mode of a copy of the editor there, with no directory argument, an empty environment and a working directory outside it, and its --version on a fixture Info.plist (tools/stage-bundle.sh, tests/headless/bundle)"
depends = ["lean"]
dir = "lean"
timeout = "120s"
run = '''lean_dir=$PWD && dir=$(mktemp -d) && trap 'rm -rf "$dir"' EXIT && sysroot=$(lean --print-prefix) && fixtures=$PWD/../tests/headless/bundle && .lake/build/bin/config-test bench-modules "$sysroot" .lake/build/lib/lean Editor >"$dir/closure" && ../tools/stage-bundle.sh --closure "$dir/closure" "$dir/Leanmacs.app" .lake/build/bin/editor "$sysroot" .lake/build/lib/lean olean olean.server olean.private && cp -R "$fixtures/config" "$dir/config" && cp "$fixtures/script" "$dir/script" && mkdir "$dir/elsewhere" && cd "$dir/elsewhere" && out=$(env -i "$dir/Leanmacs.app/Contents/MacOS/editor" headless "$dir/config" "$dir/script") && printf '%s\n' "$out" | diff "$fixtures/expected" - && cp "$fixtures/Info.plist" "$dir/Leanmacs.app/Contents/Info.plist" && env -i "$dir/Leanmacs.app/Contents/MacOS/editor" --version | diff "$fixtures/version-expected" - && "$lean_dir/.lake/build/bin/editor" --version | grep -qxF 'Leanmacs, a development build: not run from an app bundle, so it has no version, build ID or commit''''

# The build ID (crates/editor-release, `build_id`): LEANMACS_BUILD_ID when
# it is set, else HEAD's committer time in UTC, the time landing sets. CI's
# `build-id` job runs it once per run, so every job of a run names the same
# build. `app`, `dmg` and `dmg-check` read it through the same binary.
[tasks.build-id]
description = "Print the build ID: LEANMACS_BUILD_ID when set, else HEAD's committer time in UTC as YYYYMMDDHHMMSS (crates/editor-release)"
run = "cargo run --quiet --locked -p editor-release-std --bin leanmacs-release -- build-id"

# Opt-in: run it by hand, on macOS on arm64, and do not add it to `ci` or to
# hk.pkl. The bundle is about 600 MB and signing hashes all of it, and the
# gate runs on Linux too, where the target is refused with the reason.
#
# It builds `lean/.lake/build/Leanmacs.app` with Lake (`editorApp` in
# lean/lakefile.lean): the editor executable, the `.olean` files of the
# modules `Editor` imports, Info.plist with the version from
# lean/app/version, the build ID as CFBundleVersion and the commit as
# LeanmacsCommit, and the icon made from lean/app/Leanmacs.png with sips
# and iconutil, ad-hoc signed as a whole, last. The build ID and the commit
# come from `leanmacs-release build-id` and `commit` (crates/editor-release),
# which take LEANMACS_BUILD_ID and LEANMACS_COMMIT first, so CI's values
# pass through checked, and HEAD otherwise; `editorApp` refuses a build
# without them. Lake rebuilds it only when an input changed, a new commit
# among them, so a second run with nothing changed copies and signs
# nothing, and prints no `Built editorApp` line. It waits for `lean` so
# that the Lake builds in lean/ run in one chain, and sets LEAN_CC as
# `lean` does, since the executables it fetches must be linked by the
# system compiler.
[tasks.app]
description = "Opt-in, never part of ci; macOS on arm64 only: build lean/.lake/build/Leanmacs.app with Lake (`editorApp` in lean/lakefile.lean), stamped with the build ID and the commit, ad-hoc signed"
depends = ["lean"]
dir = "lean"
env = { LEAN_CC = "/usr/bin/cc" }
run = "id=$(cargo run --quiet --locked --manifest-path ../Cargo.toml -p editor-release-std --bin leanmacs-release -- build-id) && commit=$(cargo run --quiet --locked --manifest-path ../Cargo.toml -p editor-release-std --bin leanmacs-release -- commit) && LEANMACS_BUILD_ID=$id LEANMACS_COMMIT=$commit lake build --wfail editorApp"

# Opt-in: run it by hand, on macOS on arm64, and do not add it to `ci` or to
# hk.pkl: the gate does not build the bundle, and runs on Linux too. It is
# the check for any change to `editorApp`, tools/stage-bundle.sh or module
# lookup (lean/Editor/ModuleLookup.lean).
#
# tools/app-check.sh copies the built bundle into a temporary directory
# removed by a trap, verifies its signature with `codesign --verify
# --strict --deep`, reads its Info.plist (its document types and its
# version keys, which must be the line of lean/app/version, among its keys)
# and icon (the ten standard sizes, 16 to 1024 pixels) as the system does,
# runs its headless mode on tests/headless/bundle with no directory
# argument, an empty environment and / as the working directory, which must
# print exactly `expected`, and builds `editorApp` again to show that copies
# and signs nothing. In a clone of lean/ it shows that a failed rebuild
# leaves the old bundle, that changing the version or the artwork rebuilds
# it, that a malformed version or artwork other than a 1024x1024 PNG fails
# the build, and that the build and the check both take a version file
# with no final newline. It ends `app-check: ok`.
# It opens no window and needs no person.
[tasks.app-check]
description = "Opt-in, never part of ci; macOS on arm64 only: verify the built Leanmacs.app's signature and run its headless mode from a copy in a temporary directory, with no directory argument, an empty environment and / as the working directory (tools/app-check.sh, tests/headless/bundle)"
depends = ["app"]
timeout = "300s"
