  ".lake/build/bin/config-test \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/syntax ../config/default ../packages . ../tests/config-package/lsp",
  # The demonstration. With no arguments the editor is the window mode on
  # an empty buffer, which opens a window, so the gate never runs that.
  "../packages/.lake/build/bin/editor demo",
  # The headless fixtures of tests/headless (docs/dev-practices/headless-mode.md,
  # "How the gate runs a fixture"): the default set's fixture harness
  # (`fixture-test`, linked by `lean`) runs each stepped, on the fakes,
