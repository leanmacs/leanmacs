[tools]
rust = { version = "1.98.1", components = "rustfmt,clippy" }
# cargo-deny is a prebuilt release binary that aqua's registry names with its
# checksum, so installing it never compiles.
"aqua:EmbarkStudios/cargo-deny" = "0.19.9"
hk = "2.4.0"
pkl = "0.32.1"
# The formatter for the C glue (`mise run c-fmt`, `mise run c-format`). The
# PyPI wheel is an exact pin of the binary; mise installs it with `uv` or
# `pipx`, whichever the machine has.
"pipx:clang-format" = "23.1.4"
# The secret scanner (`mise run secrets-scan`), never part of `ci`. Like
# cargo-deny, a prebuilt release binary whose checksum aqua checks.
"aqua:gitleaks/gitleaks" = "8.30.1"
# OpenTofu, for infra/ only (`mise run infra-check`, `infra-plan`,
# `infra-apply`); never part of `ci`.
opentofu = "1.13.2"
# The workflow lint (`mise run workflow-lint`, part of `ci`): actionlint and
# zizmor over .github/workflows, and yq for tools/workflow-check.sh's
# structural check of the workflows. Like cargo-deny, prebuilt release binaries
# whose checksums aqua checks. Each is a release at least two weeks old when
# pinned (docs/dev-practices/ci.md).
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.32.0"
"aqua:mikefarah/yq" = "4.54.1"
# fzf, the default filter of `find-file-in-workspace`'s source
# (packages/workspace/Workspace/FindFile.lean): for the workspace finder's benchmark
# (`mise run find-file-bench`), never part of `ci`, whose checks stand in a
# fixture for it (tests/completion), and on the PATH of an editor started
# inside this project when dogfooding. Like cargo-deny, a prebuilt release
# binary whose checksum aqua checks, the newest release at least two weeks
# old when pinned (docs/dev-practices/ci.md).
"aqua:junegunn/fzf" = "0.74.5"
# Lean (lean, lake) is not listed here: `lean/lean-toolchain` is its one pin
# (AGENTS.md, "Toolchains"). mise reads that file through the `lean` plugin,
# which the global mise config declares along with
# `idiomatic_version_file_enable_tools = ["lean"]`.

[env]
RDM_ROOT = "{{env.HOME | default(value=env.USERPROFILE | default(value=''))}}/Projects/rdm-atlas-repo"
RDM_PROJECT = "editor-project"
# The lowest macOS every Lake link targets, the executable's `minos`, here
# and in CI alike. With this unset Lake links for 99.0, and Finder refuses
# to start the app ("you can't use this version"). It must equal
# `appMinimumSystemVersion` in lean/lakefile.lean, the bundle's
# LSMinimumSystemVersion; `mise run app-check` fails when the executable's
# `minos` is later. It is the CI runner's macOS (macos-26): dyld refuses to
# start a Mach-O whose `minos` is newer than the host, and the gate and the
# build job run what they build there (docs/dev-practices/ci.md,
# "Deployment target"). Other platforms ignore it.
MACOSX_DEPLOYMENT_TARGET = "26.0"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all --check"

[tasks.lint]
description = "Clippy over every crate and target, warnings are errors"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.deny]
description = "cargo-deny's bans over the dependency graph (deny.toml); stale `wrappers` are errors"
run = "cargo deny --locked check -D unused-wrapper bans"

[tasks.doc]
description = "Rustdoc over every crate, private items included, with broken intra-doc links denied"
env = { RUSTDOCFLAGS = "-D rustdoc::broken_intra_doc_links" }
run = "cargo doc --workspace --no-deps --document-private-items --locked"

[tasks.test]
description = "Rust unit, integration and doc tests, and the decision of which crates the pre-commit hook's Rust step runs over (tools/rust-targets.sh)"
run = [
  "cargo test --workspace --locked",
  # What the pre-commit hook's Rust step runs for a staged change
  # (tools/rust-targets.sh; docs/dev-practices/the-gate.md, "The pre-commit
  # hook"), decided over a crate graph written by hand
  # (tests/rust-targets/graph, its crates under /repo): for each case under
  # tests/rust-targets/cases/, the decision for the staged paths `paths`
  # must be exactly `expected`: a crate and every crate that depends on it,
  # the whole workspace for any other path the step reads, or nothing.
  "for case in leaf depended prefix nested outer crate-manifest crate-clippy package-crate lock root-manifest mise rust-outside tooling fixtures workspace-wins docs-only two-crates; do c=tests/rust-targets/cases/$case; out=$(sh tools/rust-targets.sh --lines tests/rust-targets/graph --root /repo $(cat \"$c/paths\")) || { echo \"test: rust-targets failed on the case $case\"; exit 1; }; { if [ -n \"$out\" ]; then printf '%s\\n' \"$out\"; fi; } | diff \"$c/expected\" - || { echo \"test: rust-targets decided otherwise on the case $case\"; exit 1; }; done",
  # And it cannot pass by deciding over nothing: a graph of lines not of
  # three fields, with a dependency that is no line, or holding no line,
  # is exit 2 with the message beside it (tests/rust-targets/bad/), and so
  # is a command line with no path. Their output is shown only when it is
  # not that.
  "for bad in two-fields unknown-dep empty; do b=tests/rust-targets/bad/$bad; status=0; out=$(sh tools/rust-targets.sh --lines \"$b/graph\" --root /repo crates/b/src/lib.rs 2>&1) || status=$?; { test \"$status\" -eq 2 && printf '%s\\n' \"$out\" | grep -qF \"$(cat \"$b/message\")\"; } || { printf '%s\\n' \"$out\"; echo \"test: rust-targets exited $status on tests/rust-targets/bad/$bad\"; exit 1; }; done",
  "status=0; out=$(sh tools/rust-targets.sh --lines tests/rust-targets/graph --root /repo 2>&1) || status=$?; { test \"$status\" -eq 2 && printf '%s\\n' \"$out\" | grep -qF 'no path'; } || { printf '%s\\n' \"$out\"; exit 1; }",
  # What the hook's Rust step then runs (tools/rust-hook.sh), with
  # `--dry-run`, which prints each command instead of running it, over the
  # same graph: for a crate no crate depends on, a crate others depend on,
  # the workspace and docs alone, the decision and the commands must be
  # exactly the case's `hook-expected`.
  "for case in leaf depended lock docs-only; do c=tests/rust-targets/cases/$case; out=$(sh tools/rust-hook.sh --dry-run --lines tests/rust-targets/graph --root /repo $(cat \"$c/paths\")) && printf '%s\\n' \"$out\" | diff \"$c/hook-expected\" - || { echo \"test: rust-hook would run otherwise on the case $case\"; exit 1; }; done",
  # Then on Cargo's real graph: every crate of the workspace is one the
  # hook targets, a file in its directory reaching that crate, not the
  # workspace and not nothing; and a change to `editor-service` reaches it
  # and the crates that depend on it, `editor-ffi` and the fixture
  # package's `echo-service`, and no other. A crate whose directory were
  # outside the repository would fail here rather than be skipped.
  "n=0; f=$(mktemp) && trap 'rm -f \"$f\"' EXIT && sh tools/rust-targets.sh --print-graph > \"$f\" && root=$(git rev-parse --show-toplevel) && tab=$(printf '\\t') && while IFS=$tab read -r name dir deps; do out=$(sh tools/rust-targets.sh --lines \"$f\" --root \"$root\" \"${dir#\"$root\"/}/src/lib.rs\") && printf '%s\\n' \"$out\" | grep -qxF \"crate $name\" || { printf '%s\\n' \"$out\"; echo \"test: a file in the directory of $name does not reach $name\"; exit 1; }; n=$((n + 1)); done < \"$f\" && test \"$n\" -gt 0 || { echo \"test: the hook targets $n crates of the workspace\"; exit 1; }",
  "test \"$(sh tools/rust-targets.sh crates/editor-service/src/lib.rs | sort | tr '\\n' ' ')\" = 'crate echo-service crate editor-ffi crate editor-service ' || { sh tools/rust-targets.sh crates/editor-service/src/lib.rs; echo 'test: rust-targets did not reach editor-service and its dependents alone'; exit 1; }",
]

# The model tests: editor logic run in Lean alone, against hand-written fakes
# and the pure models of the editor's ports (lean/ModelTest.lean and
# lean/ModelTest/). They must pass without the Rust library being built, and
# the task shows that by behaviour: `lean/no-cargo/cargo` is a fake `cargo`
# that always fails, put first on the PATH, and Lake's `rustlib` target runs
# `cargo` on every build that reaches it. So this passes only if nothing the
# test driver needs reaches `rustlib`, on a tree where the archive is already
# built as well as on a clean one. Seen to bite once by hand: with the same
# PATH, `LEAN_CC=/usr/bin/cc lake -d ../packages build :editor` fails at
# `editor-core/rustlib`.
#
# No LEAN_CC: the test driver links no C glue, so Lean's bundled compiler
# builds it.
#
# Nothing is removed from the environment. LEAN_NUM_THREADS sets the size of
# Lean's task pool, and the checks that warm the pool and count the threads
# jobs wait from pin no size: they pass under a bare `lake test` whatever the
# variable says.
#
# First, the toolchain check (tools/toolchain-check.sh;
# docs/dev-practices/the-gate.md, "The toolchain check"): every Lake package
# outside lean/ holds a copy of the pin, `lean-toolchain`, and each tracked
# copy must equal lean/lean-toolchain. It is here because this is the first
# task of the Lake chain, so a copy that fell behind fails before anything
# is built. Its second line shows it bite: told the pin is another file
# (the core's Lake manifest), it must name the formatter host's copy and
# exit 1. Its output is shown only when it does not.
[tasks.lean-test]
description = "Check that every copy of the Lean pin equals lean/lean-toolchain (tools/toolchain-check.sh), then run the Lean model tests with `lake test`, and those of each package of the fixture set, the default packages (the shipped themes, the compile mode) among them, with a `cargo` that fails first on the PATH: they need no Rust library (lean/ModelTest.lean and lean/ModelTest/; tools/package-set.sh)"
dir = "lean"
run = [
  "sh ../tools/toolchain-check.sh",
  "status=0; out=$(sh ../tools/toolchain-check.sh lake-manifest.json 2>&1) || status=$?; { test \"$status\" -eq 1 && printf '%s\\n' \"$out\" | grep -qxF tools/lean-fmt/lean-toolchain; } || { printf '%s\\n' \"$out\"; exit 1; }",
  # The decision both pre-commit hooks share (tools/graph-targets.sh;
  # docs/dev-practices/the-gate.md, "The pre-commit hook"): which nodes of
  # a graph the staged paths reach, over a graph written by hand
  # (tests/graph-targets/graph, its nodes under /repo). For each case
  # under tests/graph-targets/cases/, the decision must be exactly
  # `expected`: a path in a node's directory reaches that node and, when
  # the node propagates, every node that requires it, directly or through
  # any other; any other path reaches the fallback. And it cannot pass by
  # deciding over nothing: each graph under tests/graph-targets/bad/ is
  # exit 2 with the message beside it. The adapters' own cases below
  # (tests/hook-targets/, and tests/rust-targets/ in `test`) hold their
  # graphs and relevance rules to it.
  "for case in propagates stops through prefix nested fallback fallback-wins union order; do c=../tests/graph-targets/cases/$case; out=$(sh ../tools/graph-targets.sh --lines ../tests/graph-targets/graph --root /repo --fallback all --label node $(cat \"$c/paths\")) || { echo \"lean-test: graph-targets failed on the case $case\"; exit 1; }; { if [ -n \"$out\" ]; then printf '%s\\n' \"$out\"; fi; } | diff \"$c/expected\" - || { echo \"lean-test: graph-targets decided otherwise on the case $case\"; exit 1; }; done",
  "for bad in three-fields bad-propagates unknown-require empty; do b=../tests/graph-targets/bad/$bad; status=0; out=$(sh ../tools/graph-targets.sh --lines \"$b/graph\" --root /repo --fallback all --label node a/mid/X 2>&1) || status=$?; { test \"$status\" -eq 2 && printf '%s\\n' \"$out\" | grep -qF \"$(cat \"$b/message\")\"; } || { printf '%s\\n' \"$out\"; echo \"lean-test: graph-targets exited $status on tests/graph-targets/bad/$bad\"; exit 1; }; done",
  "status=0; out=$(sh ../tools/graph-targets.sh --lines ../tests/graph-targets/graph --root /repo --fallback all --label node 2>&1) || status=$?; { test \"$status\" -eq 2 && printf '%s\\n' \"$out\" | grep -qF 'no path'; } || { printf '%s\\n' \"$out\"; exit 1; }",
  # What the pre-commit hook runs for a staged change (tools/hook-targets.sh;
  # docs/dev-practices/the-gate.md, "The pre-commit hook"), decided over a
  # package graph written by hand (tests/hook-targets/graph, its packages
  # under /repo): for each case under tests/hook-targets/cases/, the
  # decision for the staged paths `paths` must be exactly `expected`: a
  # package's own checks, those of an interface package and every package
  # that requires it, directly or not, the core's for any other
  # Lean-relevant path, or nothing for a change no Lean step reads. Lake is
  # not asked and nothing is built.
  "for case in impl-only interface order prefix nested core core-wins docs-only set-files set-manifest core-fixture tooling rust-outside rust-inside new-package two-packages docs-package; do c=../tests/hook-targets/cases/$case; out=$(sh ../tools/hook-targets.sh --lines ../tests/hook-targets/graph --root /repo $(cat \"$c/paths\")) || { echo \"lean-test: hook-targets failed on the case $case\"; exit 1; }; { if [ -n \"$out\" ]; then printf '%s\\n' \"$out\"; fi; } | diff \"$c/expected\" - || { echo \"lean-test: hook-targets decided otherwise on the case $case\"; exit 1; }; done",
  # And it cannot pass by deciding over nothing: a graph of lines not of
  # four fields, with a layer it does not know, requiring a package that is
  # no line, or holding no line, is exit 2 with the message beside it
  # (tests/hook-targets/bad/), and so is a command line with no path or an
  # option it does not take. Their output is shown only when it is not that.
  "for bad in three-fields bad-layer unknown-require empty; do b=../tests/hook-targets/bad/$bad; status=0; out=$(sh ../tools/hook-targets.sh --lines \"$b/graph\" --root /repo tests/packages/impl-a/ImplA.lean 2>&1) || status=$?; { test \"$status\" -eq 2 && printf '%s\\n' \"$out\" | grep -qF \"$(cat \"$b/message\")\"; } || { printf '%s\\n' \"$out\"; echo \"lean-test: hook-targets exited $status on tests/hook-targets/bad/$bad\"; exit 1; }; done",
  "status=0; out=$(sh ../tools/hook-targets.sh --lines ../tests/hook-targets/graph --root /repo 2>&1) || status=$?; { test \"$status\" -eq 2 && printf '%s\\n' \"$out\" | grep -qF 'no path'; } || { printf '%s\\n' \"$out\"; exit 1; }",
  "status=0; out=$(sh ../tools/hook-targets.sh --graph ../tests/hook-targets/graph lean/X.lean 2>&1) || status=$?; { test \"$status\" -eq 2 && printf '%s\\n' \"$out\" | grep -qF 'usage:'; } || { printf '%s\\n' \"$out\"; exit 1; }",
  # What the hook's Lean step then runs (tools/lean-hook.sh), with
  # `--dry-run`, which prints each command instead of running it, over the
  # same graph: for one implementation package, an interface package, the
  # core and docs alone, the decision and the commands must be exactly the
  # case's `hook-expected`. And what a package-targeted commit runs
  # (tools/lean-packages.sh, the `lean-packages` task): for `compile`, a
  # default package, and `greeting`, a fixture package, exactly
  # tests/hook-targets/lean-packages/compile-expected, whose last two
  # commands build the default set's editor and run `compile` over it;
  # for `greeting` alone, exactly greeting-expected, which never names the
  # default set. It asks Lake for the default set's packages and builds
  # nothing. With no name it is exit 2.
  "for case in impl-only interface core docs-only; do out=$(cd .. && sh tools/lean-hook.sh --dry-run --lines tests/hook-targets/graph --root /repo $(cat \"tests/hook-targets/cases/$case/paths\")) && printf '%s\\n' \"$out\" | diff \"../tests/hook-targets/cases/$case/hook-expected\" - || { echo \"lean-test: lean-hook would run otherwise on the case $case\"; exit 1; }; done",
  "for names in 'compile greeting' greeting; do out=$(sh ../tools/lean-packages.sh --dry-run $names) && printf '%s\\n' \"$out\" | diff \"../tests/hook-targets/lean-packages/${names%% *}-expected\" - || { echo \"lean-test: lean-packages would run otherwise for $names\"; exit 1; }; done",
  "status=0; out=$(sh ../tools/lean-packages.sh --dry-run 2>&1) || status=$?; { test \"$status\" -eq 2 && printf '%s\\n' \"$out\" | grep -qF 'names no package'; } || { printf '%s\\n' \"$out\"; exit 1; }",
  # The leave-out check's edit of a set's lakefile (tools/leave-out-check.sh;
  # docs/dev-practices/the-gate.md, "The leave-out check"), held on a
  # lakefile written by hand (tests/leave-out/lakefile.toml): its dry run,
  # which builds nothing and asks Lake nothing, prints the lakefile without
  # the named package's `[[require]]`, the comment directly above it and one
  # blank line, every relative `path` made absolute against the root it is
  # given, exactly `without-beta` for a package in the middle and
  # `without-gamma` for the last. A package the lakefile does not require
  # is exit 2, and so is a command line it does not take. The builds
  # themselves, one editor a package, are opt-in (`mise run leave-out`).
  "for package in beta gamma; do out=$(sh ../tools/leave-out-check.sh --dry-run $package --root /repo/set ../tests/leave-out) && printf '%s\\n' \"$out\" | diff ../tests/leave-out/without-$package - || { echo \"lean-test: leave-out-check's dry run printed another lakefile without $package\"; exit 1; }; done",
  "status=0; out=$(sh ../tools/leave-out-check.sh --dry-run delta --root /repo/set ../tests/leave-out 2>&1) || status=$?; { test \"$status\" -eq 2 && printf '%s\\n' \"$out\" | grep -qF 'has no [[require]] of delta'; } || { printf '%s\\n' \"$out\"; exit 1; }",
  "status=0; out=$(sh ../tools/leave-out-check.sh 2>&1) || status=$?; { test \"$status\" -eq 2 && printf '%s\\n' \"$out\" | grep -qF 'usage:'; } || { printf '%s\\n' \"$out\"; exit 1; }",
  'PATH="$PWD/no-cargo:$PATH" lake test --wfail',
  # The same for each package of the fixture set (tools/package-set.sh;
  # docs/dev-practices/the-gate.md, "The package steps"): its Lake test
  # driver, with the same `cargo` that fails, so a package's model tests
  # reach no `rustlib` either. The fixture set requires the default set, so
  # the default packages are among them, and the step's output is kept to
  # require that: it must hold the line the step prints as it reaches each
  # default package and each interface package of the default set,
  # `package-set: test <name> (<its directory>)` for `completion-api`,
  # `completion`, `mode-line`, `minibuffer-api`, `minibuffer`,
  # `shipped-themes`, `execute-command-api`, `execute-command`,
  # `binding-search-api`, `binding-search`, `compile`, `at-point-api`,
  # `at-point` and `languages`, and
  # the line for the writing guide's example package, `package-set: test
  # word-count (<its directory>)` (docs/packages/word-count/), matched on
  # what comes before the directory. The step stops at the first package whose
  # driver fails, so those lines and exit 0 say each package's tests ran
  # and passed: the themes hold under the core's completeness check
  # (packages/shipped-themes/ShippedThemesTest/ShippedThemes.lean), and the
  # compile mode's model checks, which were the core's until it moved out,
  # hold on the core's test kit (packages/compile/CompileTest/Model.lean),
  # as the shipped completion styles' and display's do
  # (packages/completion/CompletionTest/Model.lean), completion at
  # point's (packages/at-point/AtPointTest/Model.lean) and the
  # minibuffer's (packages/minibuffer/MinibufferTest/Model.lean).
  "out=$(PATH=\"$PWD/no-cargo:$PATH\" sh ../tools/package-set.sh test ../tests/packages 2>&1) || { printf '%s\\n' \"$out\"; exit 1; }; printf '%s\\n' \"$out\"; for name in shell-api ex-api buffers-api ex frame-commands-api frame-commands menu window-commands-api window-commands tab-commands-api tab-commands restore package-set evil-api minibuffer-api at-point-api evil themes-api themes files buffers compile-api project-api vc-api workspace project-search-api project-search working-set-api working-set shell version-control completion-api completion mode-line minibuffer shipped-themes execute-command-api execute-command binding-search-api binding-search compile at-point languages word-count; do printf '%s\\n' \"$out\" | grep -qF \"package-set: test $name (\" || { echo \"lean-test: the package steps did not test $name\"; exit 1; }; done",
  # And a step refuses a set it would run over nothing of: the fixture set
  # tests/empty-set requires the core alone, so it holds no package and the
  # step must exit 2, saying so. Its output is shown only when it does not.
  "status=0; out=$(sh ../tools/package-set.sh test ../tests/empty-set 2>&1) || status=$?; { test \"$status\" -eq 2 && printf '%s\\n' \"$out\" | grep -q 'names no package of the set'; } || { printf '%s\\n' \"$out\"; exit 1; }",
  # With `--only`, a step runs over the named packages of the set alone,
  # as the pre-commit hook asks for (tools/lean-hook.sh): told `greeting`,
  # the test step tests `greeting` and no other package. A name that is no
  # package of the set is exit 2, naming it, so a misspelt name cannot pass
  # by running over nothing. Their output is shown only when it is not that.
  "out=$(PATH=\"$PWD/no-cargo:$PATH\" sh ../tools/package-set.sh --only greeting test ../tests/packages 2>&1) && test \"$(printf '%s\\n' \"$out\" | grep '^package-set: test ')\" = \"package-set: test greeting ($(cd ../tests/packages/greeting && pwd))\" || { printf '%s\\n' \"$out\"; echo 'lean-test: package-set --only greeting did not test greeting alone'; exit 1; }",
  "status=0; out=$(sh ../tools/package-set.sh --only greeting --only nosuch test ../tests/packages 2>&1) || status=$?; { test \"$status\" -eq 2 && printf '%s\\n' \"$out\" | grep -qF 'nosuch is no package of the set'; } || { printf '%s\\n' \"$out\"; exit 1; }",
]

# Runs in lean/, so mise picks the toolchain `lean/lean-toolchain` pins.
#
# It waits for `lean-test` only so that two Lake builds never run in lean/ at
# once: the Lake tasks run in one chain, `lean-test`, `lean`, then `lean-fmt`
# and `ffi-test`.
[tasks.lean]
description = "Build the Lean core and the test executables with Lake, which runs Cargo for the Rust static library, then the editor from the default package set (packages/), the fixture set with its packages (tests/packages/) and the editor from the core alone (tests/empty-set/); every linter is on and a warning fails the build (lean/lakefile.lean)"
depends = ["lean-test"]
dir = "lean"
# On macOS the executables must be compiled and linked by the system compiler:
# the clang bundled with Lean has no `pthread.h` for the C glue, and its linker
# cannot link the system frameworks the Rust library will need. This is set
# here and not in the top-level [env] because lean-fmt must keep building with
# Lean's bundled compiler: under /usr/bin/cc its link fails (`library 'gmp'
# not found`). It is the absolute path because `cc` on mise's PATH may be a
# shim for another compiler.
env = { LEAN_CC = "/usr/bin/cc" }
# --wfail also fails on warnings Lake itself logs, which `warningAsError` in
# the lakefile does not reach.
run = [
  "lake build --wfail",
  # The editor, from the default package set (packages/lakefile.toml): the
  # package-set build, a facet the core's lakefile defines, writes the
  # set's root module, builds it and links
  # packages/.lake/build/bin/editor (docs/design/packages.md, "The package
  # set and its build").
  "lake -d ../packages build --wfail :editor",
  # The fixture set (tests/packages/lakefile.toml): its editor, linked by
  # the package-set build, each of its packages' default targets, with the
  # package's own linters on, and each package's linked test, an executable
  # linked as the editor is (tools/package-set.sh;
  # docs/dev-practices/the-gate.md, "The package steps").
  "sh ../tools/package-set.sh build ../tests/packages",
  # The editor of the set that holds no package, tests/empty-set, which
  # requires the core alone: the default set with its packages dropped,
  # evil, which supplies the input scheme, among them. `ffi-test` runs it
  # (tests/headless/no-input-scheme) to show that an editor of a set with
  # no input-scheme package refuses to start.
  "lake -d ../tests/empty-set build --wfail :editor",
]

# lean-fmt is the Lake dependency of a package of its own, its host
# (tools/lean-fmt/lakefile.toml), pinned to the tag named after the Lean
# toolchain: the core requires no git repository, so a package set that
# requires the core fetches none (docs/design/packages.md, "The package set
# and its build"). `lake -d ../tools/lean-fmt exe` builds and runs the
# formatter from the host, which keeps the clone under lean/.lake/packages,
# and `--root .` names the package it is run over, the core; the last line
# of each task runs it over each package of the fixture set, each of which
# holds the copy of the pin the formatter requires of a root. Both tasks wait
# for `lean`, so two Lake builds never run in lean/ at once.
[tasks.lean-fmt]
description = "Check Lean formatting and lean-fmt's lints, over the core and each package of the fixture set; changes nothing"
depends = ["lean"]
dir = "lean"
run = [
  "lake -d ../tools/lean-fmt exe lean-fmt format --check --root .",
  "lake -d ../tools/lean-fmt exe lean-fmt check --root .",
  # The same two over each package of the fixture set (tools/package-set.sh;
  # docs/dev-practices/the-gate.md, "The package steps").
  "sh ../tools/package-set.sh fmt ../tests/packages",
]

[tasks.lean-format]
description = "Rewrite the Lean sources of the core and of each package of the fixture set in lean-fmt's style and apply its safe lint fixes"
depends = ["lean"]
dir = "lean"
run = [
  "lake -d ../tools/lean-fmt exe lean-fmt format --root .",
  "lake -d ../tools/lean-fmt exe lean-fmt check --fix --root .",
  "sh ../tools/package-set.sh format ../tests/packages",
]

# The Lean checks of some packages alone: what the pre-commit hook runs for
# a staged change that reaches only those packages (tools/lean-hook.sh,
# which sets LEAN_HOOK_PACKAGES to their names, separated by spaces, from
# tools/hook-targets.sh; docs/dev-practices/the-gate.md, "The pre-commit
# hook"). What it runs, and in what order, is tools/lean-packages.sh's,
# whose `--dry-run` `lean-test` pins. Never part of `ci`: the gate runs
# every package's checks and the core's, and a commit's targeting never
# stands in for it.
[tasks.lean-packages]
description = "The Lean checks of the packages named in LEAN_HOOK_PACKAGES alone, over the fixture set and, for default packages, the default set: what pre-commit runs for a change that reaches only those packages (tools/lean-hook.sh, tools/lean-packages.sh); never part of ci"
dir = "lean"
run = 'sh ../tools/lean-packages.sh ${LEAN_HOOK_PACKAGES:-}'

# Tracked files only, so Lake's fetched packages and build output are never
# looked at. A new C file is checked once it is `git add`ed. Vendored C
# (`vendor/`, vendor/README.md) is left out: it is upstream's generated code,
# neither checked nor rewritten here, and clang-format takes about 51 s on the
# Lean grammar's `parser.c` alone.
[tasks.c-fmt]
description = "Check the formatting of the C and C++ sources (.clang-format); changes nothing"
run = "git ls-files -z -- '*.c' '*.h' '*.cc' '*.cpp' '*.hpp' ':!:vendor/**' | xargs -0 clang-format --dry-run --Werror"

[tasks.c-format]
description = "Rewrite the C and C++ sources in the style .clang-format sets"
run = "git ls-files -z -- '*.c' '*.h' '*.cc' '*.cpp' '*.hpp' ':!:vendor/**' | xargs -0 clang-format -i"

# Runs the built executables, so it needs just `lean` before it. Its uses
# of Lake are the two import checks and the package steps' list of the
# fixture set's packages, which ask Lake for module imports and for a
# set's packages (`lake query`): they build nothing and write nothing
# under lean/ or a set, since `lean` has written the sets' roots, so it may
# run beside `lean-fmt`, the other task that waits for `lean`. The one
# file they may write is the root of the user-side link's set, in that
# set's own build directory (tests/user-link/.lake), which no other task
# reads. The one build is of the fixture set's Rust archive, after its
# file of system libraries is deleted (`:editorRust`), which `lean` built
# and which runs Cargo alone, writing under target/ and nowhere `lean-fmt`
# reads.
# The time limit turns a hang into a failure: a deadlock in the main-thread
# hand-off, or a process that waits for a task still blocked in the library.
# It bounds each command, not the task, and is set well above the slowest:
# `contract-test`, whose version-control properties run real git in
# temporary repositories, eight at a time. It takes about 9 s on a
# developer's Mac (about 14 s with every core busy), down from 14 s (29 s)
# when those properties ran one after another. The 180 s limit was set when
# contract-test took 50 to 62 s on the macOS runner while the gate's other
# tasks ran beside it; it is to come down once a run on the runner confirms
# the new time.
[tasks.launcher]
description = "Build the app's launcher and its test helper, release (crates/editor-launch-std: leanmacs and launch-probe), for the gate's restart entries"
run = "cargo build --quiet --locked --release -p editor-launch-std --bins"

[tasks.ffi-test]
description = "Check on Lake's module graph that the host's modules import no feature module (tools/host-imports-check.sh), that the core imports no module of a feature that moves out of it (tools/core-imports-check.sh), that a package imports only the core's API (tools/package-imports-check.sh) and that the core imports no package and no package imports an implementation package (tools/layer-imports-check.sh), then run the checks and scenarios of the Lean/Rust boundary (lean/FfiTest.lean), the text port's, the job port's and the syntax tree interface's contracts against their real bindings (lean/ContractTest.lean), the config session against the real elaborator (lean/ConfigTest.lean), the editor executable built from the default package set, its restart through the launcher (tests/headless/restart), and the linked test and headless fixtures of each package of the fixture set and of the default set (tools/package-set.sh)"
depends = ["lean", "launcher"]
dir = "lean"
# Measured at 130 to 210 s on 2026-11-20 (Apple M5 Max), with
# `bundle-test`'s builds from a staged bundle running beside it.
timeout = "300s"
run = [
  # The host's modules import no feature module, on Lake's module graph
  # (tools/host-imports-check.sh; docs/dev-practices/the-gate.md, "The host
  # imports check"), checked on the root the package-set build generates for
  # the default set (packages/): the modules that root imports, other than
  # the entry modules that list the packages (the default packages',
  # `Ex.EditorPackage` to `Languages.EditorPackage`; the core's Lake
  # package has none), reach neither an entry module nor a module one
  # imports. Three `lake query` calls, about half a second each.
  "sh ../tools/host-imports-check.sh",
  # And the check bites: pointed at the core's module `ConfigTest`, a root
  # that imports modules that define packages, with the test kit's
  # stand-ins for default packages (`Editor.Test.Shipped`) as the list
  # module, it must find them and exit 1. The core has no entry module to
  # name: its Lake package registers no package. Its output is shown only
  # when it does not.
  "status=0; out=$(sh ../tools/host-imports-check.sh ConfigTest Editor.Test.Shipped 2>&1) || status=$?; test \"$status\" -eq 1 || { printf '%s\\n' \"$out\"; exit 1; }",
  # The same check on the root generated for the fixture set
  # (tests/packages/), with `--set`: that root imports fourteen entry
  # modules, the core's, the three fixture packages', the nine default
  # packages' and the writing guide's example package's, and the host's
  # modules must reach none of them, nor what they import (`Greeting`,
  # `GreetingLoud`, `Echo.Packages`, `ShippedThemes`, `Compile.Compiled`,
  # `ExecuteCommand.Compiled` and the rest).
  "sh ../tools/host-imports-check.sh --set ../tests/packages",
  # The root of the user-side link's fixture set (tests/user-link/): the
  # check that links an editor as a user's Mac would (`mise run
  # user-link-check`, opt-in) stages the root the package-set build
  # generates for that set, written by the facet `editorRoot`, which writes
  # a set's root and links nothing. Here the facet must give a file, and
  # the root's imports, as Lake resolves them, must be the config base, the
  # executable's entry, the default packages' entry modules and then the
  # fixture package's (the core's Lake package has none): the root the
  # check compiles is generated, lists the fixture package after the
  # default set's packages, and its modules are found.
  "root=$(lake -d ../tests/user-link query :editorRoot) && test -f \"$root\" && test \"$(lake -d ../tests/user-link query :editorRootImports | tr '\\n' ' ')\" = 'Editor Editor.Main Ex.EditorPackage FrameCommands.EditorPackage Menu.EditorPackage WindowCommands.EditorPackage TabCommands.EditorPackage Restore.EditorPackage PackageSet.EditorPackage Evil.EditorPackage Themes.EditorPackage Files.EditorPackage Buffers.EditorPackage Workspace.EditorPackage ProjectSearch.EditorPackage WorkingSet.EditorPackage Shell.EditorPackage VersionControl.EditorPackage Completion.EditorPackage ModeLine.EditorPackage Minibuffer.EditorPackage ShippedThemes.EditorPackage ExecuteCommand.EditorPackage BindingSearch.EditorPackage Compile.EditorPackage AtPoint.EditorPackage Languages.EditorPackage UserLink.EditorPackage '",
  # The core's lakefile is elaborated against the toolchain of the `lake`
  # that runs it, never a `lean` found on the PATH (`leanSystemLibDir` in
  # lean/lakefile.lean; docs/design/lean-runtime.md, "Build"): an app
  # bundle's `lake` runs with no `lean` on the PATH, or a user's other one.
  # In a fresh workspace, so its `.lake/config` holds no elaboration of
  # the core's lakefile from before, whose `lakefile.toml` requires the
  # default set, `lake query :editorRoot` must write the set's root with a
  # `lean` that exits 1 first on the PATH. Everything it writes is in its
  # temporary directory.
  "t=$(mktemp -d) && trap 'rm -rf \"$t\"' EXIT && mkdir \"$t/no-lean\" && printf '#!/bin/sh\\nexit 1\\n' >\"$t/no-lean/lean\" && chmod +x \"$t/no-lean/lean\" && cp lean-toolchain \"$t/lean-toolchain\" && printf 'name = \"probe\"\\n\\n[[require]]\\nname = \"default-set\"\\npath = \"%s/packages\"\\n' \"$(cd .. && pwd -P)\" >\"$t/lakefile.toml\" && { root=$(PATH=\"$t/no-lean:$PATH\" lake -d \"$t\" query :editorRoot 2>\"$t/err\") && test -f \"$root\"; } || { cat \"$t/err\"; exit 1; }",
  # The nine default packages are Lake packages in the default set, and no
  # packages of the core: the root generated for the default set
  # (packages/) imports the config base, the executable's entry, the core's
  # entry module and then each default package's entry module, in the order
  # the set's lakefile requires them, and nothing else; and the record
  # beside the default set's editor names the core's `.olean` directory and
  # then, one a line and no more, each package's, which is under packages/
  # and holds the package's entry module, or for an interface package,
  # which has none, its library's root (the loop over `<dir>:<module>`
  # pairs, which a later move adds a pair to). That the core's own list
  # holds none of them is `ModelTest.packageSetChecks`', and that the
  # core's hosts start with nothing of them `ConfigTest.shippedChecks`'.
  "test \"$(lake -d ../packages query :editorRootImports | tr '\\n' ' ')\" = 'Editor Editor.Main Ex.EditorPackage FrameCommands.EditorPackage Menu.EditorPackage WindowCommands.EditorPackage TabCommands.EditorPackage Restore.EditorPackage PackageSet.EditorPackage Evil.EditorPackage Themes.EditorPackage Files.EditorPackage Buffers.EditorPackage Workspace.EditorPackage ProjectSearch.EditorPackage WorkingSet.EditorPackage Shell.EditorPackage VersionControl.EditorPackage Completion.EditorPackage ModeLine.EditorPackage Minibuffer.EditorPackage ShippedThemes.EditorPackage ExecuteCommand.EditorPackage BindingSearch.EditorPackage Compile.EditorPackage AtPoint.EditorPackage Languages.EditorPackage '",
  "{ IFS= read -r core && test -f \"$core/Editor.olean\" && for p in ../packages/shell-api:ShellApi ../packages/ex-api:ExApi ../packages/buffers-api:BuffersApi ../packages/ex:Ex/EditorPackage ../packages/frame-commands-api:FrameCommandsApi ../packages/frame-commands:FrameCommands/EditorPackage ../packages/evil-api:EvilApi ../packages/menu:Menu/EditorPackage ../packages/window-commands-api:WindowCommandsApi ../packages/window-commands:WindowCommands/EditorPackage ../packages/tab-commands-api:TabCommandsApi ../packages/tab-commands:TabCommands/EditorPackage ../packages/restore:Restore/EditorPackage ../packages/package-set:PackageSet/EditorPackage ../packages/minibuffer-api:MinibufferApi ../packages/at-point-api:AtPointApi ../packages/evil:Evil/EditorPackage ../packages/themes-api:ThemesApi ../packages/themes:Themes/EditorPackage ../packages/files:Files/EditorPackage ../packages/buffers:Buffers/EditorPackage ../packages/compile-api:CompileApi ../packages/project-api:ProjectApi ../packages/vc-api:VcApi ../packages/workspace:Workspace/EditorPackage ../packages/project-search-api:ProjectSearchApi ../packages/project-search:ProjectSearch/EditorPackage ../packages/working-set-api:WorkingSetApi ../packages/working-set:WorkingSet/EditorPackage ../packages/shell:Shell/EditorPackage ../packages/version-control:VersionControl/EditorPackage ../packages/completion-api:CompletionApi ../packages/completion:Completion/EditorPackage ../packages/mode-line:ModeLine/EditorPackage ../packages/minibuffer:Minibuffer/EditorPackage ../packages/shipped-themes:ShippedThemes/EditorPackage ../packages/execute-command-api:ExecuteCommandApi ../packages/execute-command:ExecuteCommand/EditorPackage ../packages/binding-search-api:BindingSearchApi ../packages/binding-search:BindingSearch/EditorPackage ../packages/compile:Compile/EditorPackage ../packages/at-point:AtPoint/EditorPackage ../packages/languages:Languages/EditorPackage; do IFS= read -r dir && test -f \"$dir/${p#*:}.olean\" && test \"$dir\" = \"$(cd ${p%%:*} && pwd)/.lake/build/lib/lean\" || { echo \"ffi-test: the default set's editor.oleans does not name ${p%%:*} next, or it holds no ${p#*:}.olean\"; exit 1; }; done && ! IFS= read -r more; } < ../packages/.lake/build/bin/editor.oleans",
  # The two records the package-set build writes beside a set's editor for
  # a user's set build (docs/design/packages.md, "User package sets"):
  # `editor.core`, the core's identity, one line of hex, which is the same
  # for every set over one core, so the default set's and the fixture
  # set's are equal though their packages differ; and `editor.build`, the
  # environment the link ran with, which on macOS holds the compiler
  # `mise run lean` sets.
  "cmp ../packages/.lake/build/bin/editor.core ../tests/packages/.lake/build/bin/editor.core && grep -qxE '[0-9a-f]{16}' ../packages/.lake/build/bin/editor.core",
  "test \"$(uname)\" != Darwin || grep -qxF LEAN_CC=/usr/bin/cc ../packages/.lake/build/bin/editor.build",
  # A set's editor installed into a directory of its own (the facet
  # `editorInstall`): the fixture set's, into a fresh temporary directory,
  # runs the fixture package `greeting`'s headless fixture with no `.olean`
  # directory given, so every module it loads is found through the
  # install's relative record (`lib/lean`) under the install's own
  # directory; on macOS the copy's ad-hoc signature verifies; and a second
  # install into the same directory is refused, saying it exists. The set's
  # editor is up to date after `lean`, so this builds nothing; it writes
  # only the temporary directory and the records beside the set's editor,
  # which hold the same text, and it runs Cargo's own up-to-date check
  # under target/, as `:editorRust` above does. LEAN_CC is set as `lean`
  # sets it, so the link's environment record is unchanged.
  "dir=$(mktemp -d) && trap 'rm -rf \"$dir\"' EXIT && f=../tests/packages/greeting/tests/headless/hello && EDITOR_INSTALL_DIR=\"$dir/v\" LEAN_CC=/usr/bin/cc lake -d ../tests/packages build --wfail -q :editorInstall && test \"$(cat \"$dir/v/editor.oleans\")\" = lib/lean && out=$(\"$dir/v/editor\" headless \"$(lean --print-prefix)\" '' $f/config $f/script) && printf '%s\\n' \"$out\" | diff $f/expected - && { test \"$(uname)\" != Darwin || codesign --verify --strict \"$dir/v/editor\"; } && status=0 && { out=$(EDITOR_INSTALL_DIR=\"$dir/v\" LEAN_CC=/usr/bin/cc lake -d ../tests/packages build -q :editorInstall 2>&1) || status=$?; } && test \"$status\" -ne 0 && printf '%s\\n' \"$out\" | grep -qF \"$dir/v already exists\" || { printf '%s\\n' \"$out\"; echo 'ffi-test: the install of the fixture set did not run its fixture, or took a directory that exists'; exit 1; }",
  # A user's package set (docs/design/packages.md, "User package sets",
  # "Who can build it"): a set outside the repository with no Rust crate
  # runs no Cargo, and a package's C source, the preferred way to bring
  # native code, builds with the toolchain's compiler (decided 2026-11-20).
  # A set written in a fresh temporary directory, requiring the default set
  # and the fixture package `c-glue` (tests/user-sets/c-glue), whose C
  # source the toolchain's compiler builds, is resolved and its editor
  # linked with a `cargo` that always fails first on the PATH
  # (lean/no-cargo/cargo): its archive's source is `prebuilt`, reused as
  # `lean` built it, while the default set's is `cargo`; its `editor.core`
  # equals the default set's; the package's command, which calls its C
  # function, answers as `c-glue-expected` says; and the default set's
  # editor still reads as up to date, so nothing it shares was built again.
  # The link reads what `lean` built and writes the temporary directory and
  # the fixture package's own `.lake/`.
  "dir=$(mktemp -d) && trap 'rm -rf \"$dir\"' EXIT && repo=$(cd .. && pwd -P) && cp lean-toolchain \"$dir/\" && printf 'name = \"config\"\\n\\n[[require]]\\nname = \"default-set\"\\npath = \"%s/packages\"\\n\\n[[require]]\\nname = \"c-glue\"\\npath = \"%s/tests/user-sets/c-glue\"\\n' \"$repo\" \"$repo\" > \"$dir/lakefile.toml\" && test \"$(lake -d ../packages query :editorRustSource)\" = cargo && PATH=\"$PWD/no-cargo:$PATH\" lake -d \"$dir\" update -q --keep-toolchain && test \"$(PATH=\"$PWD/no-cargo:$PATH\" lake -d \"$dir\" query :editorRustSource)\" = prebuilt && PATH=\"$PWD/no-cargo:$PATH\" LEAN_CC=/usr/bin/cc lake -d \"$dir\" build -q --wfail :editor && cmp \"$dir/.lake/build/bin/editor.core\" ../packages/.lake/build/bin/editor.core && mkdir \"$dir/config\" && out=$(\"$dir/.lake/build/bin/editor\" headless \"$(lean --print-prefix)\" .lake/build/lib/lean \"$dir/config\" ../tests/user-sets/c-glue-script) && printf '%s\\n' \"$out\" | diff ../tests/user-sets/c-glue-expected - && LEAN_CC=/usr/bin/cc lake -d ../packages build --no-build -q :editor || { echo 'ffi-test: a user set with a C package did not link without Cargo'; exit 1; }",
  # A Rust crate outside the repository is refused with its reason
  # (`setRustCrates`; docs/design/packages.md, "Who can build it"): a copy
  # of the fixture package `echo` in a temporary directory, in a set there,
  # makes `lake query :editorRustCrates` fail saying so
  # (tools/rust-outside-check.sh).
  "sh ../tools/rust-outside-check.sh",
  # The package-set build in the headless mode (tests/user-sets/): a config
  # whose lakefile names a git dependency, with a data directory in a
  # temporary directory and a PATH that holds no git, says git is required
  # and how to get it, builds nothing and writes nothing in the data
  # directory, and the next command still answers; the paths of the
  # checkout are written @REPO@, and the build buffer's cursor, which
  # depends on their length, @SELECTIONS@. And a generated lakefile, which
  # requires the set the editor was built from, starts no build.
  "dir=$(mktemp -d) && trap 'rm -rf \"$dir\"' EXIT && mkdir \"$dir/empty\" && repo=$(cd .. && pwd -P) && sysroot=$(lean --print-prefix) && f=../tests/user-sets/git-missing && out=$(PATH=\"$dir/empty\" ../packages/.lake/build/bin/editor headless --data \"$dir/data\" \"$sysroot\" .lake/build/lib/lean $f/config $f/script) && printf '%s\\n' \"$out\" | sed \"s|$repo|@REPO@|g\" | grep -v '^job ' | sed '/Package build of/s/selections [0-9]*\\.\\.[0-9]*/selections @SELECTIONS@/' | diff $f/expected - && test ! -e \"$dir/data\"",
  "dir=$(mktemp -d) && trap 'rm -rf \"$dir\"' EXIT && f=../tests/user-sets/match && cp -R $f/config \"$dir/config\" && out=$(../packages/.lake/build/bin/editor headless --generate --data \"$dir/data\" \"$(lean --print-prefix)\" .lake/build/lib/lean \"$dir/config\" $f/script) && printf '%s\\n' \"$out\" | diff $f/expected - && test -e \"$dir/config/lakefile.toml\" && test ! -e \"$dir/data\"",
  # The config base of a set is the set's (lean/Editor/Main.lean, "The
  # base"; the facet `editorBase`): `Editor`, the core's base, then the
  # entry module of each package of the set outside the core, so that
  # config can name what a default package declares. The default set's is
  # `Editor`, the shipped themes' entry module and the compile mode's, and
  # that of the set with no package (tests/empty-set) `Editor` alone: an
  # editor without the packages still loads config.
  "test \"$(lake -d ../packages query :editorBase | tr '\\n' ' ')\" = 'Editor Ex.EditorPackage FrameCommands.EditorPackage Menu.EditorPackage WindowCommands.EditorPackage TabCommands.EditorPackage Restore.EditorPackage PackageSet.EditorPackage Evil.EditorPackage Themes.EditorPackage Files.EditorPackage Buffers.EditorPackage Workspace.EditorPackage ProjectSearch.EditorPackage WorkingSet.EditorPackage Shell.EditorPackage VersionControl.EditorPackage Completion.EditorPackage ModeLine.EditorPackage Minibuffer.EditorPackage ShippedThemes.EditorPackage ExecuteCommand.EditorPackage BindingSearch.EditorPackage Compile.EditorPackage AtPoint.EditorPackage Languages.EditorPackage '",
  "test \"$(lake -d ../tests/empty-set query :editorBase | tr '\\n' ' ')\" = 'Editor '",
  # And the root of that set imports the config base and the executable's
  # entry alone: the core's Lake package has no entry module, so an editor
  # of the core alone hands its hosts no package.
  "test \"$(lake -d ../tests/empty-set query :editorRootImports | tr '\\n' ' ')\" = 'Editor Editor.Main '",
  # The Rust crates of a set (the facet `editorRustCrates`;
  # docs/design/packages.md, "Rust in a package"): the package-set build
  # finds a package's crate through the target `editorRustCrate` its
  # lakefile declares, with no list kept by hand. The fixture set holds one,
  # the fixture package `echo`'s crate `echo-service`, so its editor links
  # the archive generated from `editor-ffi` and that crate
  # (target/release/libeditor_rust_echo.a); the default set holds none, so
  # its editor links the core's (libeditor_rust.a), as `tests/empty-set`'s
  # and the core's own executables do.
  "test \"$(lake -d ../tests/packages query :editorRustCrates | cut -f1,2)\" = \"$(printf 'echo\\techo-service')\"",
  "test -z \"$(lake -d ../packages query :editorRustCrates)\"",
  # A set's archive comes back with its system libraries when the file that
  # holds them is gone and the archive is fresh (`buildRust`): rustc writes
  # the file only when it runs, so the build cleans the generated crate and
  # builds it again. With the fixture set's file deleted (`lean` built it),
  # building `:editorRust` must write it back holding the same line, which
  # names `-lz`, the system library `echo-service`'s zlib needs. It writes
  # only under target/, which `lean-fmt` does not read, and Cargo locks
  # that directory.
  "f=../target/editor-rust/echo/native-static-libs && before=$(cat \"$f\") && rm \"$f\" && lake -d ../tests/packages build --wfail :editorRust && test \"$(cat \"$f\")\" = \"$before\" && grep -qw -- -lz \"$f\" || { echo \"ffi-test: building :editorRust did not write back $f\"; exit 1; }",
  # A package's crate depends on `editor-service` and on nothing else of
  # the editor's, held by cargo-deny's bans over the crate generated from
  # the set, with the `deny.toml` written beside it, in which the generated
  # crate is the one crate allowed to depend on `editor-ffi` or on a
  # package's crate (tools/rust-bans-check.sh;
  # docs/dev-practices/the-gate.md, "The Rust bans check"). It holds of the
  # fixture set and of the default set. And it bites: on tests/rust-bans,
  # whose package `bans-ffi`'s crate depends on `editor-ffi` and
  # `bans-peer`'s on `bans-ffi`'s, it must exit 1 with both crates
  # explicitly banned. Its output is shown only when it does not. The check
  # writes the generated crates under target/editor-rust/ and Lake's
  # configuration in tests/rust-bans/**/.lake, which no other task reads.
  "sh ../tools/rust-bans-check.sh ../tests/packages",
  "sh ../tools/rust-bans-check.sh ../packages",
  "status=0; out=$(sh ../tools/rust-bans-check.sh ../tests/rust-bans 2>&1) || status=$?; { test \"$status\" -eq 1 && printf '%s\\n' \"$out\" | grep -qF \"crate 'editor-ffi = 0.1.0' is explicitly banned\" && printf '%s\\n' \"$out\" | grep -qF \"crate 'bans-ffi = 0.1.0' is explicitly banned\"; } || { printf '%s\\n' \"$out\"; echo \"ffi-test: the Rust bans check exited $status on tests/rust-bans\"; exit 1; }",
  # The core's root holds the whole core, on Lake's module graph
  # (tools/core-imports-check.sh; docs/dev-practices/the-gate.md, "The core
  # imports check"): every `Editor.…` module the build reaches is the
  # core's root, `Editor.Core`, or one of the modules it imports; and every
  # root that links the elaborator links the config base. No feature is
  # between having its edges from the core cut and moving out, so the check
  # is given no moving name, and its first rule, that the root reaches no
  # moving module, holds of nothing: the two features it was about, the
  # shipped palettes and the compile mode, are Lake packages now, which the
  # core cannot import. The roots of the build are the core's executables'
  # and the root generated for the default set. Six `lake query` calls,
  # about half a second each.
  "sh ../tools/core-imports-check.sh",
  # And each rule of the check bites. Told that a module of the core, the
  # ex line's data (`Editor.Ex.Line`), is moving, it must find it in the
  # core's root's closure and exit 1: no feature is left in the core to
  # name since the ex line moved out, and the first rule is ready for
  # whatever module's edges are cut before it moves.
  # Pointed at the root `Editor.Setup`, which imports no moving module and
  # not the whole core, it must find the core modules outside it and exit 3.
  # Told the config base is `Editor.Core`, which no executable's root
  # imports, it must name the roots that link the elaborator without it and
  # exit 4. And told the elaborator adapter is `Editor.Core`, which no root
  # reaches, so that the third rule would hold of nothing, it must say so
  # and exit 2. The output of each is shown only when it is not that.
  "status=0; out=$(sh ../tools/core-imports-check.sh Editor.Core Editor.Ex.Line 2>&1) || status=$?; test \"$status\" -eq 1 || { printf '%s\\n' \"$out\"; exit 1; }",
  "status=0; out=$(sh ../tools/core-imports-check.sh Editor.Setup 2>&1) || status=$?; test \"$status\" -eq 3 || { printf '%s\\n' \"$out\"; exit 1; }",
  "status=0; out=$(sh ../tools/core-imports-check.sh --base Editor.Core 2>&1) || status=$?; test \"$status\" -eq 4 || { printf '%s\\n' \"$out\"; exit 1; }",
  "status=0; out=$(sh ../tools/core-imports-check.sh --elaborator Editor.Core 2>&1) || status=$?; { test \"$status\" -eq 2 && test \"${out#core-imports-check: no root of the build}\" != \"$out\"; } || { printf '%s\\n' \"$out\"; exit 1; }",
  # A package imports only what a package may import of the core, on Lake's
  # module graph (tools/package-imports-check.sh;
  # docs/dev-practices/the-gate.md, "The package imports check"): a
  # package's library names modules of the core's API alone, its tests may
  # also name the core's test doubles, its linked test (the root and the
  # modules under it) also the linked test kit, which runs over the Rust
  # library, and the root of its linked test what an executable linked as
  # the editor is needs. First the rule itself, on
  # lines written by hand (tests/package-imports/lines), one for each
  # branch of it: it must exit 1 and print exactly
  # tests/package-imports/expected, each refused import with its reason
  # and no allowed one.
  "status=0; out=$(sh ../tools/package-imports-check.sh --lines ../tests/package-imports/lines 2>&1) || status=$?; { test \"$status\" -eq 1 && printf '%s\\n' \"$out\" | diff ../tests/package-imports/expected -; } || { echo \"ffi-test: the package imports check exited $status on tests/package-imports/lines\"; exit 1; }",
  # Then the packages: those of the fixture set (tests/packages/), which
  # requires the default set and so reaches the default packages, and the
  # package of the user-side link's set (tests/user-link/). One `lake
  # query` each, which builds nothing.
  "sh ../tools/package-imports-check.sh ../tests/packages",
  "sh ../tools/package-imports-check.sh ../tests/user-link",
  # And it refuses to pass over nothing: the set tests/empty-set holds no
  # package, so there is no line to check and it must exit 2, saying so.
  # Its output is shown only when it does not.
  "status=0; out=$(sh ../tools/package-imports-check.sh ../tests/empty-set 2>&1) || status=$?; { test \"$status\" -eq 2 && printf '%s\\n' \"$out\" | grep -q 'so there is nothing to check'; } || { printf '%s\\n' \"$out\"; exit 1; }",
  # The three-layer import rule, on Lake's module graph
  # (tools/layer-imports-check.sh; docs/dev-practices/the-gate.md, "The
  # layer imports check"; docs/design/extension-points.md, "Three layers"):
  # the core imports no package, and no package imports a module of an
  # implementation package, a package whose lakefile does not declare
  # `keywords = ["editor-interface"]`. First the rule itself, on lines
  # written by hand (tests/layer-imports/lines), one for each branch of it:
  # it must exit 1 and print exactly tests/layer-imports/expected, each
  # refused import with its reason and no allowed one. Among the refused
  # are a core module importing a module of `shipped-themes` and one of
  # `compile`: the core's lakefile requires no package, so no real graph
  # can show that refusal.
  "status=0; out=$(sh ../tools/layer-imports-check.sh --lines ../tests/layer-imports/lines 2>&1) || status=$?; { test \"$status\" -eq 1 && printf '%s\\n' \"$out\" | diff ../tests/layer-imports/expected -; } || { echo \"ffi-test: the layer imports check exited $status on tests/layer-imports/lines\"; exit 1; }",
  # A layer it does not know is exit 2, and so is input in which no module
  # of the core is an importer: the core's half of the rule would then hold
  # of nothing. Their output is shown only when it is not that.
  "status=0; out=$(sh ../tools/layer-imports-check.sh --lines ../tests/layer-imports/bad-layer 2>&1) || status=$?; { test \"$status\" -eq 2 && printf '%s\\n' \"$out\" | grep -qF 'in the layer `plugin`'; } || { printf '%s\\n' \"$out\"; exit 1; }",
  "status=0; out=$(sh ../tools/layer-imports-check.sh --lines ../tests/layer-imports/no-core 2>&1) || status=$?; { test \"$status\" -eq 2 && printf '%s\\n' \"$out\" | grep -qF 'no module of the core is an importer'; } || { printf '%s\\n' \"$out\"; exit 1; }",
  # The facet the check reads walks the core's modules: on the default
  # set's real graph, some of its lines have a module of the core as the
  # importer. A facet that skipped the core would give none, and every run
  # below would then exit 2.
  "n=$(lake -d ../packages query :editorLayerImports | awk -F '\t' '$2 == \"core\" { n++ } END { print n + 0 }') && test \"$n\" -gt 0 || { echo 'ffi-test: editorLayerImports lists no import by a module of the core'; exit 1; }",
  # Then real sets. The default set (packages/): `shipped-themes` and
  # `compile`, implementation packages, import only the core. The user-side
  # link's set (tests/user-link/), whose package imports only the core. And
  # the set with no package (tests/empty-set/): the core alone, so only the
  # core's own imports are checked. One `lake query` each, about two and a
  # half seconds on a developer's Mac, most of it reading the core's
  # headers; the script's own pass is a tenth of a second.
  "sh ../tools/layer-imports-check.sh ../packages",
  "sh ../tools/layer-imports-check.sh ../tests/user-link",
  "sh ../tools/layer-imports-check.sh ../tests/empty-set",
  # The fixture set (tests/packages/), which reaches the default set too:
  # `greeting-loud` reaches `greeting`'s command by the name the interface
  # package `greeting-api` declares, and imports nothing of `greeting`.
  "sh ../tools/layer-imports-check.sh ../tests/packages",
  # And the rule on a real graph: the set tests/layer-imports/ holds the
  # fixture set and the package `greeting-reach`, whose library module
  # imports `GreetingApi`, of an interface package, and `Greeting`, of an
  # implementation package, and whose test library, a second library, has
  # a module that imports `Greeting` too. The check must exit 1 and print
  # exactly tests/layer-imports/graph-expected, the two refused imports: it
  # reads the layer `greeting-api`'s lakefile declares, reads every library
  # of a package, so a facet that walked only a package's first library
  # would miss the test module's import and fail here, and refuses on
  # Lake's graph.
  "status=0; out=$(sh ../tools/layer-imports-check.sh ../tests/layer-imports 2>&1) || status=$?; { test \"$status\" -eq 1 && printf '%s\\n' \"$out\" | diff ../tests/layer-imports/graph-expected -; } || { echo \"ffi-test: the layer imports check exited $status on tests/layer-imports\"; exit 1; }",
  # The package graph the pre-commit hook decides over
  # (tools/hook-targets.sh; the facet `editorPackageGraph`;
  # docs/dev-practices/the-gate.md, "The pre-commit hook"). On the fixture
  # set, its names, layers and requires must be exactly
  # tests/hook-targets/fixture-set-graph, in the set's order: `greeting-api`
  # is the interface package, and `greeting-loud` requires `greeting` and
  # `greeting-api`, the core not among them. One `lake query`, which builds
  # nothing.
  "lake -d ../tests/packages query :editorPackageGraph | cut -f1,2,4 | diff ../tests/hook-targets/fixture-set-graph - || { echo 'ffi-test: editorPackageGraph is not tests/hook-targets/fixture-set-graph'; exit 1; }",
  # The decision over that graph as the hook asks for it, from Lake and
  # git: a change to the interface package's module reaches it and the two
  # packages that require it, and no other.
  "out=$(sh ../tools/hook-targets.sh ../tests/packages tests/packages/greeting-api/GreetingApi.lean) && test \"$out\" = \"$(printf 'package greeting-api\\npackage greeting\\npackage greeting-loud')\" || { printf '%s\\n' \"$out\"; echo 'ffi-test: hook-targets did not reach greeting-api, greeting and greeting-loud alone'; exit 1; }",
  # And every package of the set is one the hook targets: a file in its
  # directory reaches that package, not the core and not nothing. A
  # package whose directory were outside the repository, or outside the
  # paths a Lean step reads, would fail here rather than be skipped by the
  # hook. The graph is asked for once, then decided over with `--lines`;
  # the count of packages is the count Lake names for the set
  # (`editorPackages`), so a package added to a set changes no number
  # here, and only tests/hook-targets/fixture-set-graph pins what the
  # fixture set holds.
  "n=0; f=$(mktemp) && trap 'rm -f \"$f\"' EXIT && lake -d ../tests/packages query :editorPackageGraph > \"$f\" && root=$(git rev-parse --show-toplevel) && tab=$(printf '\\t') && while IFS=$tab read -r name layer dir requires; do out=$(sh ../tools/hook-targets.sh --lines \"$f\" --root \"$root\" \"${dir#\"$root\"/}/lakefile.toml\") && printf '%s\\n' \"$out\" | grep -qxF \"package $name\" || { printf '%s\\n' \"$out\"; echo \"ffi-test: a file in the directory of $name does not reach $name\"; exit 1; }; n=$((n + 1)); done < \"$f\" && total=$(lake -d ../tests/packages query :editorPackages | wc -l | tr -d ' ') && test \"$n\" -gt 0 && test \"$n\" -eq \"$total\" || { echo \"ffi-test: the hook targets $n of the ${total:-?} packages Lake names for the fixture set\"; exit 1; }",
  # One of these checks measures the stack the entry point gives Lean's
  # threads, and LEAN_STACK_SIZE_KB overrides that size, so a variable in the
  # developer's shell must not reach it.
  "env -u LEAN_STACK_SIZE_KB .lake/build/bin/ffi-test",
  # Arguments reach Lean's `main`, and its result is the exit status.
  "status=0; .lake/build/bin/ffi-test exit 7 || status=$?; test \"$status\" -eq 7",
  # Quit is for good and process-wide, so shutdown has processes of its own.
  ".lake/build/bin/ffi-test shutdown",
  ".lake/build/bin/ffi-test exit-while-blocked",
  # The same properties `lean-test` runs against the pure models, here against
  # the Rust library: the text port's, and the job port's over the timer
  # service. Its check of Lean's task pool pins no size, so LEAN_NUM_THREADS
  # in the developer's shell does it no harm. Its first argument is the
  # directory of the fixtures that stand in for mise in the checks of a
  # child's environment (tests/process-environment). Its second is the
  # directory of the syntax fixtures, whose Rust fixtures the indent and
  # text-object checks read (tests/syntax). Its third is the directory of
  # the fixture that stands in for fzf in the checks of a source a command
  # filters (tests/completion). A compile over the real process service is
  # no check of this executable any more, and nor are the workspace finder,
  # the listers and `:!`: they are the compile package's, the workspace
  # package's and the shell package's linked tests'
  # (packages/compile/CompileTest/Linked.lean,
  # packages/workspace/WorkspaceTest/Linked.lean,
  # packages/shell/ShellTest/Linked.lean), which the package steps run below
  # on those packages' own fixtures (packages/compile/tests/compile,
  # packages/workspace/tests/workspaces and tests/completion,
  # packages/shell/tests/shell).
  ".lake/build/bin/contract-test ../tests/process-environment ../tests/syntax ../tests/completion",
  # The config session against the real elaborator. The toolchain's directory
  # and the package's `.olean` directory are passed in, so it reads nothing
  # from the environment; its third argument is the directory of the syntax
  # fixtures, whose Rust indent fixture the indent checks read (tests/syntax),
  # and its fourth the default config `mise run install` ships, which the
  # default config checks read (config/default).
  ".lake/build/bin/config-test \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/syntax ../config/default",
  # The demonstration. With no arguments the editor is the window mode on
  # an empty buffer, which opens a window, so the gate never runs that.
  "../packages/.lake/build/bin/editor demo",
  # The headless mode, on the fixture checked in under tests/headless: it
  # loads the config directory, runs the script, and must print exactly
  # `expected`. Every path is an argument.
  "out=$(../packages/.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/config ../tests/headless/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/expected -",
  # The same, with a script that sends keys with their identity: each goes
  # through the library's window input, as a window's would, and must be
  # printed back with its logical key, physical key and modifiers
  # (`keys-expected`).
  "out=$(../packages/.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/config ../tests/headless/keys-script) && printf '%s\\n' \"$out\" | diff ../tests/headless/keys-expected -",
  # The same, with a script that enters insert state, commits text as an
  # input method would and asks for the scene: the editor loop's frame is
  # made at the first window event, and the view's snapshot must hold the
  # text, read from the library (`scene-expected`). Its second half reloads and runs a job once the
  # frame exists, and each must be followed by a scene.
  "out=$(../packages/.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/config ../tests/headless/scene-script) && printf '%s\\n' \"$out\" | diff ../tests/headless/scene-expected -",
  # Keys dispatched to commands, on a config of its own (tests/headless/
  # dispatch): a key sequence config binds runs its command, the interrupt
  # key stops one that loops over requests and rolls back its edit, the next
  # key's command runs to its end, and a key's command starts a job with an
  # argument, whose result the job's command says in the echo area
  # (`dispatch/expected`). A command that is not stopped loops for longer
  # than the time limit.
  "out=$(../packages/.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/dispatch/config ../tests/headless/dispatch/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/dispatch/expected -",
  # Config as modules (tests/headless/modules): a root that imports `Lean`,
  # a module of a default package (`Compile`) and two config files under
  # `Config/`, and names a declaration of each. Every file elaborates; the
  # command a program of `Config/Keys.lean` registers runs, since the root's
  # `setup` calls that program; and the command the `setup` of
  # `Config/Unused.lean` registers is no command, since the editor runs the
  # root's `setup` and no other (`modules/expected`).
  "out=$(../packages/.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/modules/config ../tests/headless/modules/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/modules/expected -",
  # A module that is not linked (tests/headless/not-linked): the root
  # imports `Lake`, which is in the toolchain and in no editor. The reload
  # is rejected with one diagnostic, at the import, that names the module
  # (`not-linked/expected`).
  "out=$(../packages/.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/not-linked/config ../tests/headless/not-linked/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/not-linked/expected -",
  # A module of a package the config's lakefile names
  # (tests/headless/needs-rebuild): the root imports `Greeting`, and the
  # directory's `lakefile.toml` requires the fixture package `greeting`. On
  # the default set's editor, which does not link that package, the reload
  # is rejected and the diagnostic names the package and says the package
  # set needs a rebuild (`needs-rebuild/expected`); on the fixture set's
  # editor, which links it, the config loads and the package's command runs
  # (`needs-rebuild/installed-expected`). The headless mode is run with no
  # `--generate`, so it reads the fixture's lakefile and writes nothing: the
  # third line fails if the fixture's config directory holds anything but
  # its two tracked files.
  "out=$(../packages/.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/needs-rebuild/config ../tests/headless/needs-rebuild/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/needs-rebuild/expected -",
  "out=$(../tests/packages/.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/needs-rebuild/config ../tests/headless/needs-rebuild/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/needs-rebuild/installed-expected -",
  "test \"$(ls -A ../tests/headless/needs-rebuild/config | tr '\\n' ' ')\" = 'init.lean lakefile.toml '",
  # The old form (tests/config-migrate): a config directory of files in byte
  # order with no header is refused, with a diagnostic that names the files
  # and `mise run config-migrate`; a copy that tools/config-migrate.sh
  # converted loads, and so do directories of one file, of three, with
  # `setup` defined before the last file, with a private declaration a
  # later file uses, and with a `setup` no line is seen to declare; and
  # what that script refuses, a file already headed among it, it leaves as
  # it was (tools/config-migrate-check.sh).
  "sh ../tools/config-migrate-check.sh ../packages/.lake/build/bin/editor \"$(lean --print-prefix)\" .lake/build/lib/lean",
  # The config directory as a Lake package (tests/headless/generate, whose
  # config directory holds `init.lean` alone): on a temporary copy, the
  # default set's `editor headless --generate` creates `lean-toolchain`,
  # equal to `lean/lean-toolchain`, and a `lakefile.toml` that requires the
  # set by its directory, and the config loads; a second run rewrites
  # neither; and a run without `--generate` on another copy writes neither.
  # Then Lean's language server, started in the directory the first run
  # generated, with the root and the config file of
  # tests/config-package/lsp put in it: the root imports `Lean`, `Compile`
  # and `Config.Keys` and holds one type error, and the server must report
  # that error, at 8:19, and no other, so no import failed
  # (`config-test lsp`, lean/ConfigTest/Lsp.lean). It takes about three
  # seconds, needs no network, and writes in the temporary directory alone
  # (tools/config-package-check.sh). The two lines it prints are required.
  "out=$(sh ../tools/config-package-check.sh ../packages \"$(lean --print-prefix)\" .lake/build/lib/lean) || { printf '%s\\n' \"$out\"; exit 1; }; printf '%s\\n' \"$out\"; for line in 'config-package: generated lakefile.toml and lean-toolchain, the config loaded, and a second run wrote nothing' 'config-test lsp: init.lean: no import error, and the type error is at 8:19'; do printf '%s\\n' \"$out\" | grep -qxF \"$line\" || { echo \"config-package-check did not print: $line\" >&2; exit 1; }; done",
  # The finder-session config fixture (tests/headless/finder-session): it
  # loads, and its command, run by its key `C-c h`
  # and by its ex name `finder-hello`, says `finder-session: config loaded`
  # in the echo area each time (`finder-session/expected`).
  "out=$(../packages/.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/finder-session/config ../tests/headless/finder-session/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/finder-session/expected -",
  # The file commands the editor ships, on a config of its own (tests/
  # headless/files): `save-buffer`, which no config registers, says the
  # scratch buffer has no file, and a command of config's opens a path that
  # is not absolute, which starts the compiled job `load-file` and is
  # refused by the library before it asks the file system, so the run
  # touches no file (`files/expected`).
  "out=$(../packages/.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/files/config ../tests/headless/files/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/files/expected -",
  # The default config `mise run install` ships (config/default), on the
  # editor of the default set (tests/headless/default-config): the binding
  # search lists its `SPC f f  open-file`, and `SPC :` and `SPC ?`, run
  # from the search as their keys would run, open the command prompt and
  # the binding search; its file, buffer, workspace, search and working-set
  # keys are listed, and each run from the search opens its prompt or says
  # why it cannot (`default-config/expected`). The config is copied into a
  # temporary directory, which a trap removes, so nothing is written into
  # the checkout, and the editor runs in an empty directory beside it, so
  # the prompts that start at the working directory, or search it, are the
  # same everywhere once the directory's path, taken physically, is written
  # `@DIR@`.
  "dir=$(mktemp -d) && trap 'rm -rf \"$dir\"' EXIT && dir=$(cd \"$dir\" && pwd -P) && root=$(pwd) && prefix=$(lean --print-prefix) && cp -R ../config/default \"$dir/config\" && mkdir \"$dir/cwd\" && out=$(cd \"$dir/cwd\" && \"$root/../packages/.lake/build/bin/editor\" headless \"$prefix\" \"$root/.lake/build/lib/lean\" \"$dir/config\" \"$root/../tests/headless/default-config/script\") && printf '%s\\n' \"$out\" | sed \"s|$dir|@DIR@|g\" | diff ../tests/headless/default-config/expected -",
  # An editor of a set with no input-scheme package refuses to start
  # (tests/headless/no-input-scheme), run on the editor built from the set
  # tests/empty-set, which is the default set with its packages dropped:
  # the Vim scheme is the default package evil's (packages/evil/), so no
  # package of that set supplies a scheme (`Editor.Main.run`,
  # docs/design/packages.md, "Input schemes"). The headless mode must exit
  # 1 having printed exactly `no-input-scheme/expected`, the one line
  # `editor: no input scheme is installed: no package of this editor's
  # package set supplies one`, before it reads the script or loads the
  # config; and so must `--probe`, which a restart runs before it hands
  # the session over, so that a restart into such a set is given up. Any
  # other status or text fails. It touches no file. The two fixtures that
  # ran on this editor while the core supplied the scheme, core-themes and
  # core-ex-names, are retired: what they showed of an editor without the
  # default packages is held by `ConfigTest.shippedChecks`
  # (docs/design/packages.md, "Dropping evil or themes leaves…").
  "status=0; out=$(../tests/empty-set/.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/no-input-scheme/config ../tests/headless/no-input-scheme/script 2>&1) || status=$?; test \"$status\" -eq 1 && printf '%s\\n' \"$out\" | diff ../tests/headless/no-input-scheme/expected -",
  "status=0; out=$(../tests/empty-set/.lake/build/bin/editor --probe 2>&1) || status=$?; test \"$status\" -eq 1 && printf '%s\\n' \"$out\" | diff ../tests/headless/no-input-scheme/expected -",
  # The frame padding (tests/headless/padding): a config that sets it to 12
  # points; each scene prints the window's view padded 12 across and down,
  # the echo padded 12, and with the ex prompt open the minibuffer's view
  # padded 12 across and none down (`padding/expected`). It touches no file.
  "out=$(../packages/.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/padding/config ../tests/headless/padding/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/padding/expected -",
  # The monocle layout (tests/headless/monocle): a config that chooses it
  # and binds keys to split the window and to focus the next one; each
  # scene shows only the focused window's view, in the whole area above
  # the bottom row: view 0, view 0 again after the split, view 1 once it is
  # focused, and view 1, the asker, above the minibuffer's view with the ex
  # prompt open (`monocle/expected`). It touches no file.
  "out=$(../packages/.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/monocle/config ../tests/headless/monocle/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/monocle/expected -",
  # Two windows on one buffer (tests/headless/two-windows), under the
  # default layout, with the same keys: in a frame of 640 by 120 the window
  # is split over twelve lines, the second view's cursor goes to the last
  # line, its anchor following it down, and the first view, at the top,
  # appends to its first line. The last scene shows both views side by
  # side with the edit, each with its own cursor and scroll anchor, moved
  # by the edit (`two-windows/expected`). It touches no file.
  "out=$(../packages/.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/two-windows/config ../tests/headless/two-windows/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/two-windows/expected -",
  # The manual split layout (tests/headless/manual-splits): a config that
  # chooses it and binds no key, so the Vim scheme's own `C-w` keys reach
  # the window commands. `C-w s` puts the new window above and focuses it,
  # `C-w v` the next one on its left, `C-w j` focuses the window below,
  # `C-w C-w` wraps from the last window to the first, and `C-w C-c` three
  # times closes two windows and is refused on the last, with the reason in
  # the echo area (`manual-splits/expected`). It touches no file.
  "out=$(../packages/.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/manual-splits/config ../tests/headless/manual-splits/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/manual-splits/expected -",
  # The dividers and the selected window's mode line (tests/headless/
