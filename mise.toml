  ".lake/build/bin/ffi-test theme-pictures ../tests/render/themes ../tests/fonts/NotoSansMono-Regular.subset.ttf",
  # The excerpt picture (lean/FfiTest/Editor/ExcerptView.lean,
  # `excerptPictureScenario`): an
  # excerpt document's view with each excerpt's header as a block above it,
  # drawn by the CPU renderer through the display's real binding in
