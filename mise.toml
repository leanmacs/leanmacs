[tools]
rust = { version = "1.98.1", components = "rustfmt,clippy" }
# cargo-deny is a prebuilt release binary that aqua's registry names with its
# checksum, so installing it never compiles.
"aqua:EmbarkStudios/cargo-deny" = "0.19.9"
hk = "2.4.0"
pkl = "0.32.1"
# The formatter for the C glue (`mise run c-fmt`, `mise run c-format`). The
# PyPI wheel is an exact pin of the binary; mise installs it with `uv` or
# `pipx`, whichever the machine has.
"pipx:clang-format" = "23.1.4"
# The secret scanner (`mise run secrets-scan`), never part of `ci`. Like
# cargo-deny, a prebuilt release binary whose checksum aqua checks.
"aqua:gitleaks/gitleaks" = "8.30.1"
# OpenTofu, for infra/ only (`mise run infra-check`, `infra-plan`,
# `infra-apply`); never part of `ci`.
opentofu = "1.13.2"
# The workflow lint (`mise run workflow-lint`, part of `ci`): actionlint and
# zizmor over .github/workflows. Like cargo-deny, prebuilt release binaries
# whose checksums aqua checks. Each is a release at least two weeks old when
# pinned (docs/dev-practices/ci.md).
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.32.0"
# fzf, the default filter of `find-file-in-workspace`'s source
# (packages/workspace/Workspace/FindFile.lean): for the workspace finder's benchmark
# (`mise run find-file-bench`), never part of `ci`, whose checks stand in a
# fixture for it (tests/completion), and on the PATH of an editor started
# inside this project when dogfooding. Like cargo-deny, a prebuilt release
# binary whose checksum aqua checks, the newest release at least two weeks
# old when pinned (docs/dev-practices/ci.md).
"aqua:junegunn/fzf" = "0.74.5"
# Lean (lean, lake) is not listed here: `lean/lean-toolchain` is its one pin
# (AGENTS.md, "Toolchains"). mise reads that file through the `lean` plugin,
# which the global mise config declares along with
# `idiomatic_version_file_enable_tools = ["lean"]`.

[env]
RDM_ROOT = "{{env.HOME | default(value=env.USERPROFILE | default(value=''))}}/Projects/rdm-atlas-repo"
RDM_PROJECT = "editor-project"
# The lowest macOS every Lake link targets, the executable's `minos`, here
# and in CI alike. With this unset Lake links for 99.0, and Finder refuses
# to start the app ("you can't use this version"). It must equal
# `appMinimumSystemVersion` in lean/lakefile.lean, the bundle's
# LSMinimumSystemVersion; the `editorApp` build fails when it is later
# (`deploymentTargetFits`). It is the CI runner's macOS (macos-26): dyld
# refuses to start a Mach-O whose `minos` is newer than the host, and the
# gate and the build job run what they build there (docs/dev-practices/ci.md,
# "Deployment target"). Other platforms ignore it.
MACOSX_DEPLOYMENT_TARGET = "26.0"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all --check"

[tasks.lint]
description = "Clippy over every crate and target, warnings are errors, under the root clippy.toml's bans; and the wait bans bite (tests/wait-lints)"
run = [
  # The lint levels are the root Cargo.toml's `[workspace.lints.clippy]`,
  # and the bans the root clippy.toml's, which every crate reads.
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  # The wait bans bite: the fixture tests/wait-lints calls each banned wait
  # once, and each `allow-invalid` entry point no crate calls, each call
  # under an `#[expect]` of its own, so this passes only while clippy
  # refuses every one of them. It is a workspace of its own,
  # read `--locked --offline` (its Cargo.toml says how to seed its lock
  # again), and builds into target/wait-lints/ alone.
  "cargo clippy --offline --locked --manifest-path tests/wait-lints/Cargo.toml --target-dir target/wait-lints -- -D warnings",
]

[tasks.deny]
description = "cargo-deny's bans over the dependency graph (deny.toml), stale `wrappers` errors; and over echo's and acp's crates' own graphs and that of the languages package's grammar-source crate, each of which may hold only the crates its deny.toml allows"
run = [
  "cargo deny --locked check -D unused-wrapper bans",
  # echo's library is built from the package wrapper and nothing else of
  # the editor's: rooted at echo's manifest, the graph is echo's alone, and
  # its config's `allow` list refuses every crate it does not name
  # (tests/packages/echo/rust/deny.toml says why the root's cannot).
  "cargo deny --locked --manifest-path tests/packages/echo/rust/Cargo.toml check --config tests/packages/echo/rust/deny.toml -D unused-wrapper bans",
  # acp's library the same way: the package wrapper, the Agent Client
  # Protocol's SDK and their tree, and nothing else of the editor's
  # (packages/acp/rust/deny.toml).
  "cargo deny --locked --manifest-path packages/acp/rust/Cargo.toml check --config packages/acp/rust/deny.toml -D unused-wrapper bans",
  # The languages package's grammar-source crate, which is no library: a
  # build-time crate whose binary the set's build runs. It reaches
  # `editor-grammar-build` alone of the editor's crates, at build time, its
  # grammars and their trees, and nothing else
  # (packages/languages/rust/deny.toml).
  "cargo deny --locked --manifest-path packages/languages/rust/Cargo.toml check --config packages/languages/rust/deny.toml -D unused-wrapper bans",
]

[tasks.doc]
description = "Rustdoc over every crate, private items included, with broken intra-doc links denied"
env = { RUSTDOCFLAGS = "-D rustdoc::broken_intra_doc_links" }
run = "cargo doc --workspace --no-deps --document-private-items --locked"

[tasks.test]
description = "Rust unit, integration and doc tests"
run = "cargo test --workspace --locked"

# The model tests: editor logic run in Lean alone, against hand-written fakes
# and the pure models of the editor's ports (lean/ModelTest.lean and
# lean/ModelTest/). They must pass without the Rust library being built, and
# the task shows that by behaviour: `lean/no-cargo/cargo` is a fake `cargo`
# that always fails, put first on the PATH, and Lake's `rustlib` target runs
# `cargo` on every build that reaches it. So this passes only if nothing the
# test driver needs reaches `rustlib`, on a tree where the archive is already
# built as well as on a clean one.
#
# No LEAN_CC: the test driver links no C glue, so Lean's bundled compiler
# builds it.
#
# Nothing is removed from the environment. LEAN_NUM_THREADS sets the size of
# Lean's task pool, and the checks that hold the pool and count the threads
# jobs wait from read it as Lean's runtime does (`Pool.expected`): they pass
# under a bare `lake test` whatever the variable says.
[tasks.lean-test]
description = "Run the Lean model tests with `lake test` and the build's linters' checks with `lake exe lint-test`, and those of each package of the fixture set, the default packages (the shipped themes, the compile mode) among them, with a `cargo` that fails first on the PATH: they need no Rust library (lean/ModelTest.lean and lean/ModelTest/; tools/package-set.sh)"
dir = "lean"
run = [
  'PATH="$PWD/no-cargo:$PATH" lake test --wfail',
  # The checks of the build's linters (lean/LintTest.lean), which import the
  # linters and so are a test executable of their own: model-test links no
  # module of Lean's frontend (.agents/rules/structure.md, "Core imports").
  'PATH="$PWD/no-cargo:$PATH" lake exe lint-test',
  # The same for each package of the fixture set (tools/package-set.sh;
  # docs/dev-practices/the-gate.md, "The package steps"): its Lake test
  # driver, with the same `cargo` that fails, so a package's model tests
  # reach no `rustlib` either. The fixture set requires the default set, so
  # the default packages are among them. It stops at the first package
  # whose driver fails, with that driver's status.
  'PATH="$PWD/no-cargo:$PATH" sh ../tools/package-set.sh test ../tests/packages',
  # The test driver of the package that ships a grammar, in a set of its own
  # (tests/grammar-set/lakefile.toml says why it is apart), which no package
  # step reaches: with the same `cargo` that fails.
  'PATH="$PWD/no-cargo:$PATH" lake -d ../tests/grammar-set/ini-grammar test --wfail',
]

# Runs in lean/, so mise picks the toolchain `lean/lean-toolchain` pins.
#
# It waits for `lean-test` only so that two Lake builds never run in lean/ at
# once: the Lake tasks run in one chain, `lean-test`, `lean`, then
# `lean-deny`, then `lean-fmt`, and `ffi-test`.
[tasks.lean]
description = "Build the Lean core and the test executables with Lake, which runs Cargo for the Rust static library, then the editor and the headless fixture harness from the default package set (packages/), the fixture set with its packages and its harness (tests/packages/) and the editor from the core alone (tests/empty-set/); every linter is on and a warning fails the build (lean/lakefile.lean)"
depends = ["lean-test"]
dir = "lean"
# On macOS the executables must be compiled and linked by the system compiler:
# the clang bundled with Lean has no `pthread.h` for the C glue, and its linker
# cannot link the system frameworks the Rust library will need. This is set
# here and not in the top-level [env] because lean-fmt must keep building with
# Lean's bundled compiler: under /usr/bin/cc its link fails (`library 'gmp'
# not found`). It is the absolute path because `cc` on mise's PATH may be a
# shim for another compiler.
env = { LEAN_CC = "/usr/bin/cc" }
# --wfail also fails on warnings Lake itself logs, which `warningAsError` in
# the lakefile does not reach.
run = [
  "lake build --wfail",
  # The editor, from the default package set (packages/lakefile.toml): the
  # package-set build, a facet the core's lakefile defines, writes the
  # set's root module, builds it and links
  # packages/.lake/build/bin/editor (docs/design/packages.md, "The package
  # set and its build"); and beside it the set's headless fixture harness,
  # packages/.lake/build/bin/fixture-test, linked the same way from a root
  # of its own (`editorFixtures`; docs/dev-practices/headless-mode.md, "How
  # the gate runs a fixture"), which ffi-test runs.
  "lake -d ../packages build --wfail :editor :editorFixtures",
  # The fixture set (tests/packages/lakefile.toml): its editor and its
  # fixture harness, linked by the package-set build, each of its
  # packages' default targets, with the package's own linters on, and
  # each package's linked test, an executable linked as the editor is
  # (tools/package-set.sh;
  # docs/dev-practices/the-gate.md, "The package steps").
  "sh ../tools/package-set.sh build ../tests/packages",
  # The editor of the set that holds no package, tests/empty-set, which
  # requires the core alone: the default set with its packages dropped,
  # evil, which supplies the input scheme, among them. That it builds shows
  # the core links an editor with no package; that such an editor refuses
  # to start is ModelTest's (lean/ModelTest/Editor/Executable/Refusal.lean).
  "lake -d ../tests/empty-set build --wfail :editor",
  # The editor of the grammar set (tests/grammar-set), whose `editor` facet
  # stages the package ini-grammar's `grammars/` under the set's build
  # directory and writes `editor.grammars` beside the editor, which the
  # package's linked test reads (ffi-test, below); the editor is never
  # started. No package step reaches this set.
  "lake -d ../tests/grammar-set build --wfail :editor",
  # The package's default targets, with its own linters on.
  "lake -d ../tests/grammar-set/ini-grammar build --wfail",
  # And its linked test, linked as the editor is.
  "lake -d ../tests/grammar-set/ini-grammar build --wfail +IniGrammarTest.Linked:editorLinked",
]

# lean-deny checks the structure rules (.agents/rules/structure.md) over
# Lake's resolved module graph (docs/dev-practices/the-gate.md, "The
# structure check"). Like lean-fmt, it is the Lake dependency of a host of
# its own (tools/lean-deny/lakefile.toml), so the core and the default set
# fetch no git repository; `lake -d ../tools/lean-deny exe` builds and runs
# it from the host, with no LEAN_CC, as for lean-fmt. Each line passes by its
# exit status alone: 0 when every rule holds, 1 on a violation, 2 on a bad
# policy or workspace.
#
# - packages/lean-deny.toml, over the default set (packages/, which requires
#   the core): Core imports, Host imports, What a package may import, Three
#   layers, Leave-out, Module map (it reads docs/design/packages.md) and
#   Lint plugins. It reads the two roots that `lean`'s package-set build
#   writes under packages/.lake/build/root/, and lean-deny never runs Lake to
#   write them, so this task waits for `lean`.
# - lean/lean-deny.core.toml, over the core alone (lean/): the core imports
#   rules the core answers by itself.
[tasks.lean-deny]
description = "Check the structure rules with lean-deny, over the default package set and over the core (packages/lean-deny.toml, lean/lean-deny.core.toml)"
depends = ["lean"]
dir = "lean"
run = [
  "lake -d ../tools/lean-deny exe lean-deny check --workspace ../packages --config ../packages/lean-deny.toml",
  "lake -d ../tools/lean-deny exe lean-deny check --workspace . --config lean-deny.core.toml",
]

# lean-fmt is the Lake dependency of a package of its own, its host
# (tools/lean-fmt/lakefile.toml), pinned to the tag named after the Lean
# toolchain: the core requires no git repository, so a package set that
# requires the core fetches none (docs/design/packages.md, "The package set
# and its build"). `lake -d ../tools/lean-fmt exe` builds and runs the
# formatter from the host, which keeps the clone under lean/.lake/packages,
# and `--root .` names the package it is run over, the core; the last line
# of each task runs it over each package of the fixture set, each of which
# holds the link to the pin the formatter requires of a root. Both tasks wait
# for `lean`, and `lean-fmt` for `lean-deny` too, so two Lake builds never
# run in lean/ at once.
[tasks.lean-fmt]
description = "Check Lean formatting and lean-fmt's lints, over the core and each package of the fixture set; changes nothing"
depends = ["lean", "lean-deny"]
dir = "lean"
run = [
  "lake -d ../tools/lean-fmt exe lean-fmt format --check --workers \"$(sh ../tools/lean-fmt-workers.sh)\" --root .",
  "lake -d ../tools/lean-fmt exe lean-fmt check --workers \"$(sh ../tools/lean-fmt-workers.sh)\" --root .",
  # The same two over each package of the fixture set (tools/package-set.sh;
  # docs/dev-practices/the-gate.md, "The package steps").
  "sh ../tools/package-set.sh fmt ../tests/packages",
  # The same two over the package of the grammar set, which no package step
  # reaches.
  "lake -d ../tools/lean-fmt exe lean-fmt format --check --workers \"$(sh ../tools/lean-fmt-workers.sh)\" --root ../tests/grammar-set/ini-grammar",
  "lake -d ../tools/lean-fmt exe lean-fmt check --workers \"$(sh ../tools/lean-fmt-workers.sh)\" --root ../tests/grammar-set/ini-grammar",
]

[tasks.lean-format]
description = "Rewrite the Lean sources of the core and of each package of the fixture set in lean-fmt's style and apply its safe lint fixes"
depends = ["lean"]
dir = "lean"
run = [
  "lake -d ../tools/lean-fmt exe lean-fmt format --workers \"$(sh ../tools/lean-fmt-workers.sh)\" --root .",
  "lake -d ../tools/lean-fmt exe lean-fmt check --fix --workers \"$(sh ../tools/lean-fmt-workers.sh)\" --root .",
  "sh ../tools/package-set.sh format ../tests/packages",
  "lake -d ../tools/lean-fmt exe lean-fmt format --workers \"$(sh ../tools/lean-fmt-workers.sh)\" --root ../tests/grammar-set/ini-grammar",
  "lake -d ../tools/lean-fmt exe lean-fmt check --fix --workers \"$(sh ../tools/lean-fmt-workers.sh)\" --root ../tests/grammar-set/ini-grammar",
]

# Tracked files only, so Lake's fetched packages and build output are never
# looked at. A new C file is checked once it is `git add`ed. Vendored C
# (`vendor/`, vendor/README.md) is left out: it is upstream's generated code,
# neither checked nor rewritten here, and clang-format takes about 51 s on the
# Lean grammar's `parser.c` alone. So is the fixture grammar's `grammar/src/`
# (crates/editor-syntax-fixture-ini/README.md): generated by the tree-sitter
# CLI and never edited. The fixture's own `grammar/exports.c` is checked.
# So is the package runtime's header, `crates/editor-package-runtime/include/`:
# generated by cbindgen and held to it by a test, never edited.
[tasks.c-fmt]
description = "Check the formatting of the C and C++ sources (.clang-format); changes nothing"
run = "git ls-files -z -- '*.c' '*.h' '*.cc' '*.cpp' '*.hpp' ':!:vendor/**' ':!:crates/editor-syntax-fixture-ini/grammar/src/**' ':!:crates/editor-package-runtime/include/**' | xargs -0 clang-format --dry-run --Werror"

[tasks.c-format]
description = "Rewrite the C and C++ sources in the style .clang-format sets"
run = "git ls-files -z -- '*.c' '*.h' '*.cc' '*.cpp' '*.hpp' ':!:vendor/**' ':!:crates/editor-syntax-fixture-ini/grammar/src/**' ':!:crates/editor-package-runtime/include/**' | xargs -0 clang-format -i"

# Runs the built executables, so it needs just `lean` before it. Its uses
# of Lake are the package steps' list of a set's packages and the two
# queries that write each set's generated crate (`lake query`): they build
# nothing and write nothing under lean/ or a set, only under
# target/editor-rust/, which `lean-fmt` does not read, so it may run beside
# `lean-fmt`, the other task that waits for `lean`.
# The time limit turns a hang into a failure: a deadlock in the main-thread
# hand-off, or a process that waits for a task still blocked in the library.
# It bounds each command, not the task, and is set well above the slowest:
# `contract-test`, whose version-control properties run real git in
# temporary repositories, eight at a time. It takes about 9 s on a
# developer's Mac (about 14 s with every core busy), down from 14 s (29 s)
# when those properties ran one after another. The 180 s limit was set when
# contract-test took 50 to 62 s on the macOS runner while the gate's other
# tasks ran beside it; it is to come down once a run on the runner confirms
# the new time.
[tasks.launcher]
description = "Build the app's launcher and its test helper, release (crates/editor-launch-std: leanmacs and launch-probe), for `mise run edit`"
run = "cargo build --quiet --locked --release -p editor-launch-std --bins"

[tasks.ffi-test]
description = "Run the checks and scenarios of the Lean/Rust boundary (lean/FfiTest.lean), the text port's, the job port's and the syntax tree interface's contracts against their real bindings (lean/ContractTest.lean), the config session against the real elaborator (lean/ConfigTest.lean), cargo-deny over the core's generated crate, the headless fixtures under tests/headless on the default set's fixture harness, stepped on the fakes, and the linked test and headless fixtures of each package of the fixture set, which names every default package, so each linked test runs once, then the default set's headless fixtures alone (tools/package-set.sh --no-linked)"
depends = ["lean"]
dir = "lean"
# Measured at 130 to 210 s on 2026-11-20 (Apple M5 Max). On 2026-11-27, with
# echo's user-set wiring check (a user's set built and linked with the
# toolchain's lake, tests/packages/echo/EchoTest/Linked/Echo/Real/UserSet.lean),
# the whole task took 126 s and echo's wiring groups alone 12.6 s, the
# user-set check about 10 s of that, on the same machine; the limit is
# raised by more than that check's share under load. On 2026-11-27, with
# acp's installed-set wiring check (a config laid out as `install --agents`
# leaves it, built with the toolchain's lake and no cargo,
# packages/acp/AcpTest/Linked/Acp/Real/InstalledSet.lean), the task alone
# took 86 s on an idle machine and acp's wiring groups 9.2 s, the check
# about 9 s of that (a fresh copy of acp's Lean compiled and a set's editor
# linked), on the same machine; the limit is raised by 60 s, over six
# times that check's share, for a loaded runner.
timeout = "420s"
run = [
  # The core's archive, the one Rust archive every set's editor links, is
  # built from `editor-ffi` alone and holds no `editor-release-std`, held by
  # cargo-deny's bans over the crate the core's build generates for it
  # (`rustlib`, which `mise run lean` built just before, under
  # target/editor-rust/core/), with the `deny.toml` the build writes beside
  # it, in which the generated crate is `editor-ffi`'s one wrapper
  # (docs/dev-practices/the-gate.md, "The Rust bans check"). The root
  # `deny.toml` cannot say either. A package's crate is in no archive: each
  # ships a library of its own, whose edges its own allow list holds
  # (`mise run deny`). It passes by cargo-deny's exit status, offline: the
  # crate's lock is seeded from the root's.
  "cargo deny --offline --manifest-path ../target/editor-rust/core/Cargo.toml check --config ../target/editor-rust/core/deny.toml -D unused-wrapper bans",
  # One of these checks measures the stack the entry point gives Lean's
  # threads, and LEAN_STACK_SIZE_KB overrides that size, so a variable in the
  # developer's shell must not reach it. Its one argument is the directory of
  # the grammars the core's tests load (crates/editor-syntax-fixture-grammars:
  # the six grammars the syntax adapter compiles in, built by Cargo as native
  # libraries from the same pinned sources, their queries beside them),
  # printed by that crate's binary: the library hides its compiled-in
  # grammars from every test, so its syntax checks register these first. The
  # line only builds it and passes its path, and a failed build fails the
  # line; the lines below that take it build it the same way, which compiles
  # nothing once `cargo test` has.
  "grammars=$(cargo run --quiet --locked --manifest-path ../Cargo.toml -p editor-syntax-fixture-grammars) && env -u LEAN_STACK_SIZE_KB .lake/build/bin/ffi-test \"$grammars\"",
  # Quit is for good and process-wide, so shutdown has processes of its own.
  ".lake/build/bin/ffi-test shutdown",
  ".lake/build/bin/ffi-test exit-while-blocked",
  # The same properties `lean-test` runs against the pure models, here against
  # the Rust library: the text port's, and the job port's over the timer
  # service. Its check of Lean's task pool pins no size, so LEAN_NUM_THREADS
  # in the developer's shell does it no harm. Its first argument is the
  # directory of the syntax fixtures, whose Rust fixtures the indent and
  # text-object checks read (tests/syntax). Its second is the directory of
  # the fixture that stands in for fzf in the checks of a source a command
  # filters (tests/completion). Its third is the directory of the launch
  # fixtures the launcher's tests read too (tests/launch). Its fourth is the
  # fixture grammar library the job port's grammar properties register,
  # built by Cargo and printed by the fixture crate's binary
  # (crates/editor-syntax-fixture-ini): the line only builds it and passes
  # its path, and a failed build fails the line. Its fifth is the directory
  # of the grammars the core's tests load (as for ffi-test above), which it
  # registers once before the checks that draw. A compile over
  # the real process service is
  # no check of this executable any more, and nor are the workspace finder,
  # the listers, `:!` and a child's environment looked up by mise: they are
  # the compile package's, the workspace package's, the shell package's and
  # the mise package's linked tests' (packages/compile/CompileTest/Linked.lean,
  # packages/workspace/WorkspaceTest/Linked.lean,
  # packages/shell/ShellTest/Linked.lean, packages/mise/MiseTest/Linked.lean),
  # which the package steps run below on those packages' own fixtures
  # (packages/compile/tests/compile, packages/workspace/tests/workspaces and
  # tests/completion, packages/mise/tests/process-environment); the shell's
  # run on a rig over fakes, with no fixture.
  "lib=$(cargo run --quiet --locked --manifest-path ../Cargo.toml -p editor-syntax-fixture-ini) && grammars=$(cargo run --quiet --locked --manifest-path ../Cargo.toml -p editor-syntax-fixture-grammars) && .lake/build/bin/contract-test ../tests/syntax ../tests/completion ../tests/launch \"$lib\" \"$grammars\"",
  # The config session against the real elaborator. The toolchain's directory
  # and the package's `.olean` directory are passed in, so it reads nothing
  # from the environment; its third argument is the directory of the syntax
  # fixtures, whose Rust indent fixture the indent checks read (tests/syntax),
  # and its fourth the default config `mise run install` ships, which the
  # default config checks read (config/default). Its fifth, sixth and
  # seventh are the default set's directory, the core's (this one) and the
  # language server check's root and config file (tests/config-package/lsp):
  # the check writes the config package an editor of that set generates in
  # a temporary directory of its own, puts the two files in it, and starts
  # Lean's language server there (lean/ConfigTest/Lsp.lean). Its eighth is
  # the config directory the config-migrate binary makes of the old-form
  # fixture (tests/config-migrate/migrated), which the migrated config's
  # check loads; its ninth the directory of the grammars the core's tests
  # load (as for ffi-test above), which its real syntax checks register or
  # declare; the binary's own test holds its conversion to the same
  # files (crates/editor-config-migrate-std/tests/convert.rs). Which of its checks may
  # run a real editor loop thread or a real service is no list here: `lake
  # build`'s `linter.realHost` confines them to the wiring set's modules
  # (docs/dev-practices/real-thread-checks.md); every other host check runs
  # on a host stepped on its own thread.
  "grammars=$(cargo run --quiet --locked --manifest-path ../Cargo.toml -p editor-syntax-fixture-grammars) && .lake/build/bin/config-test \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/syntax ../config/default ../packages . ../tests/config-package/lsp ../tests/config-migrate/migrated \"$grammars\"",
  # The headless fixtures of tests/headless (docs/dev-practices/headless-mode.md,
  # "How the gate runs a fixture"): the default set's fixture harness
  # (`fixture-test`, linked by `lean`) runs each stepped, on the fakes,
  # against its expected file and its setup's after-checks
  # (`Editor.Test.Fixture.Setup`). It exits 1 on a fixture that differs,
  # naming the first line, and for a root that holds no fixture.
  "../packages/.lake/build/bin/fixture-test \"$(lean --print-prefix)\" .lake/build/lib/lean --repo .. run ../tests/headless",
  # The display fixture: the scene `editor-layout`'s own test lays out
  # (crates/editor-layout/tests/frame_fixture.rs), published from Lean
  # through the display's real binding, must give the frame checked in at
  # tests/display/frame.expected; the scene must come back as sent; and a
  # move asked through the binding must land on the frame's next row.
  ".lake/build/bin/ffi-test display ../tests/display/frame.expected",
  # The picture of the theme `default` (the core's theme picture check,
  # lean/Editor/Theme/Picture.lean): the fixture file tests/render/themes/
  # source.lean, published from Lean through the display's real binding in
  # the built-in theme, over a display of the one fixture font given here,
  # and drawn by the CPU renderer, must match
  # `tests/render/themes/default.png` within 2 of 255 a channel, and its
  # paper, cursor and text must carry the placeholder palette's colours
  # (tests/render/themes/README.md). It reads only checked-in files and
  # writes nothing. `mise run theme-references` makes the image again. The
  # shipped themes' pictures are their package's linked test's, which the
  # package steps run below.
  ".lake/build/bin/ffi-test theme-pictures ../tests/render/themes ../tests/fonts/NotoSansMono-Regular.subset.ttf",
  # The excerpt picture (lean/FfiTest/Editor/ExcerptView.lean,
  # `excerptPictureScenario`): an
  # excerpt document's view with each excerpt's header as a block above it,
  # drawn by the CPU renderer through the display's real binding in
  # the built-in theme, must match tests/render/excerpts/excerpts.png within the
  # same tolerance; the scene with no blocks must differ from it, the
  # header's background must be block-header's, and the cursor's cell must
  # be lower than with no blocks (tests/render/excerpts/README.md). It
  # reads only checked-in files and writes nothing. `mise run
  # excerpt-reference` makes the image again.
  ".lake/build/bin/ffi-test excerpt-picture ../tests/render/excerpts ../tests/fonts/NotoSansMono-Regular.subset.ttf",
  # The linked tests and headless fixtures of the fixture set, then the
  # headless fixtures of the default set (tools/package-set.sh). The
  # fixture set requires the default set, so Lake names every default
  # package for it too, and its `run` runs every linked test, each once,
  # with each package's fixtures on the fixture set's harness. The default
  # set's run is `--no-linked`, so its fixtures run on the shipped set's
  # own harness and no linked test runs twice. Each linked test is handed
  # the directory of the grammars the core's tests load (as for ffi-test
  # above) as its third argument, which those that draw with a real grammar
  # declare or register and every other ignores.
  "grammars=$(cargo run --quiet --locked --manifest-path ../Cargo.toml -p editor-syntax-fixture-grammars) && sh ../tools/package-set.sh run ../tests/packages \"$(lean --print-prefix)\" .lake/build/lib/lean \"$grammars\"",
  "grammars=$(cargo run --quiet --locked --manifest-path ../Cargo.toml -p editor-syntax-fixture-grammars) && sh ../tools/package-set.sh --no-linked run ../packages \"$(lean --print-prefix)\" .lake/build/lib/lean \"$grammars\"",
  # The linked test of the package that ships a grammar
  # (tests/grammar-set/ini-grammar/IniGrammarTest/Linked.lean), which no
  # package step reaches: run in the package's directory with the grammar
  # set's editor, beside which `lean` staged the package's `grammars/`, the
  # fixture grammar library Cargo builds (the line only builds it and passes
  # its path), and the syntax fixtures.
  "lib=$(cargo run --quiet --locked --manifest-path ../Cargo.toml -p editor-syntax-fixture-ini) && (cd ../tests/grammar-set/ini-grammar && .lake/build/bin/IniGrammarTest-Linked \"$(cd ../.lake/build/bin && pwd)/editor\" \"$lib\" \"$(cd ../../syntax && pwd)\")",
]

# The window scenarios of the wiring set (`FfiTest.windowScenarios`,
# lean/FfiTest/Editor/Window/Real.lean), one line each: the window mode's
# wiring, `Editor.Window.host`, on the library's scripted platform, each a
# process of its own with a real editor loop thread. Each opens no window
# of the desktop's and passes by its exit status; a scenario handed a file
# or a config directory it may write runs on a copy in a temporary
# directory of its own. That every scenario has its line here is a
# reviewer rule (.agents/rules/structure.md, "The wiring set's runs"). It
# runs the built ffi-test alone, so it needs just `lean` before it. The
# time limit is a guard against a hang only: each takes a second or two.
[tasks.window-scenarios]
description = "Run each window scenario of ffi-test (FfiTest.windowScenarios: the window mode's wiring on the library's scripted platform), each by its exit status"
depends = ["lean"]
dir = "lean"
timeout = "120s"
run = [
  ".lake/build/bin/ffi-test window-host ../tests/headless/ex/note.txt",
  # With no file, as Finder starts the app.
  ".lake/build/bin/ffi-test window-host",
  ".lake/build/bin/ffi-test window-host-config \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/window/title-bar/config",
  ".lake/build/bin/ffi-test window-host-restart \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/window/title-bar/config",
  ".lake/build/bin/ffi-test window-host-base \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/window/base/config",
  ".lake/build/bin/ffi-test window-host-generate \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/window/title-bar/config",
  # As the default set's editor and the fixture set's start it when run
  # directly, finding their `.olean` directories by default, each in a
  # temporary home of its own, never the developer's.
  ".lake/build/bin/ffi-test window-host-direct ../packages/.lake/build/bin/editor \"$(lean --print-prefix)\" ../tests/window/title-bar/config",
  ".lake/build/bin/ffi-test window-host-direct ../tests/packages/.lake/build/bin/editor \"$(lean --print-prefix)\" ../tests/window/title-bar/config",
  ".lake/build/bin/ffi-test window-host-undrawn ../tests/headless/ex/note.txt",
]

# The build ID (crates/editor-release, `build_id`): LEANMACS_BUILD_ID when
# it is set, else HEAD's committer time in UTC, the time landing sets. CI's
# `build-id` job runs it once per run, so every job of a run names the same
# build. `app`, `dmg` and `dmg-check` read it through the same binary.
[tasks.build-id]
description = "Print the build ID: LEANMACS_BUILD_ID when set, else HEAD's committer time in UTC as YYYYMMDDHHMMSS (crates/editor-release)"
run = "cargo run --quiet --locked -p editor-release-std --bin leanmacs-release -- build-id"

# Opt-in: run it by hand, on macOS on arm64, and do not add it to `ci` or to
# hk.pkl. The bundle is about 600 MB and signing hashes all of it, and the
# gate runs on Linux too, where the target is refused with the reason.
#
# It builds `packages/.lake/build/Leanmacs.app` with Lake, from the default
# package set (the facet `editorApp` of lean/lakefile.lean, on
# packages/lakefile.toml): the set's editor executable, the `.olean` files of the
# modules `Editor` imports, Info.plist with the version from
# lean/app/version, the build ID as CFBundleVersion and the commit as
# LeanmacsCommit, and the icon made from lean/app/Leanmacs.png with sips
# and iconutil, ad-hoc signed as a whole, last. The build ID and the commit
# come from `leanmacs-release build-id` and `commit` (crates/editor-release),
# which take LEANMACS_BUILD_ID and LEANMACS_COMMIT first, so CI's values
# pass through checked, and HEAD otherwise; `editorApp` refuses a build
# without them. Lake rebuilds it only when an input changed, a new commit
# among them, so a second run with nothing changed copies and signs
# nothing, and prints no `Built «default-set»:editorApp` line. It waits for `lean` so
# that the Lake builds in lean/ run in one chain, and sets LEAN_CC as
# `lean` does, since the executables it fetches must be linked by the
# system compiler.
[tasks.app]
description = "Opt-in, never part of ci; macOS on arm64 only: build packages/.lake/build/Leanmacs.app with Lake from the default package set (`editorApp` in lean/lakefile.lean), stamped with the build ID and the commit, ad-hoc signed"
depends = ["lean"]
dir = "lean"
env = { LEAN_CC = "/usr/bin/cc" }
run = "id=$(cargo run --quiet --locked --manifest-path ../Cargo.toml -p editor-release-std --bin leanmacs-release -- build-id) && commit=$(cargo run --quiet --locked --manifest-path ../Cargo.toml -p editor-release-std --bin leanmacs-release -- commit) && LEANMACS_BUILD_ID=$id LEANMACS_COMMIT=$commit lake -d ../packages build --wfail :editorApp"

# Opt-in: run it by hand, on macOS on arm64, and do not add it to `ci` or to
# hk.pkl: the gate does not build the bundle, and runs on Linux too. CI's
# build job runs it on main (.github/workflows/build.yml).
#
# `leanmacs-release dmg` (crates/editor-release, `dmg`) packs the built
# bundle into `dist/Leanmacs-<build-id>.dmg`: the app, a link to
# /Applications, LICENSE and packaging/macos/README.txt, staged in
# target/dmg/staging and packed with hdiutil. It refuses a bundle whose
# CFBundleVersion is not this build's ID, and prints the image's path.
[tasks.dmg]
description = "Opt-in, never part of ci; macOS on arm64 only: pack the built Leanmacs.app, a link to /Applications, LICENSE and the README into dist/Leanmacs-<build-id>.dmg (crates/editor-release)"
depends = ["app"]
run = "cargo run --quiet --locked -p editor-release-std --bin leanmacs-release -- dmg packages/.lake/build/Leanmacs.app dist"

# Opt-in: run it by hand, on macOS, and do not add it to `ci` or to hk.pkl:
# it mounts a disk image. It does not depend on `dmg`, so CI's build job
# packs once; it fails, saying to run `mise run dmg`, when this build's
# image is not in dist/.
#
# The ignored test crates/editor-release-std/tests/dmg_mount.rs mounts the
# image read-only on a temporary mount point and detaches it when done. The
# volume's root must be exactly the app, the link to /Applications, LICENSE
# and README.txt (names starting with `.` aside); the two files must be
# the repository's; the app's signature must verify; its CFBundleVersion
# must be the build the file name names and this build's ID, its
# LeanmacsCommit this build's commit and its CFBundleShortVersionString
# lean/app/version's line; and its `editor --version`, run with an empty
# environment, must print those three.
[tasks.dmg-check]
description = "Opt-in, never part of ci; macOS only: mount dist/Leanmacs-<build-id>.dmg and check its root, its files, the app's signature, Info.plist and `editor --version`, and build the default set from the read-only volume alone (crates/editor-release-std/tests/dmg_mount.rs)"
run = 'id=$(cargo run --quiet --locked -p editor-release-std --bin leanmacs-release -- build-id) && dmg="$PWD/dist/Leanmacs-$id.dmg" && { [ -f "$dmg" ] || { echo "dmg-check: no $dmg: run \`mise run dmg\`" >&2; exit 1; }; } && LEANMACS_DMG="$dmg" cargo test --locked -p editor-release-std --test dmg_mount -- --ignored --nocapture'

# Opt-in: run it by hand, on macOS, and do not add it to `ci` or to hk.pkl:
# it mounts a disk image. CI's release job runs it on main
# (.github/workflows/release.yml), as its "Prepare the nightly" step. It
# does not depend on `dmg`, so CI packs once; run `mise run dmg` first.
#
# `leanmacs-release nightly` (crates/editor-release, `nightly`) takes
# dist/Leanmacs-<build-id>.dmg, mounts it at target/nightly-mount and checks
# that the app's CFBundleVersion and LeanmacsCommit are this build's ID and
# commit, then writes the nightly's assets to target/nightly:
# Leanmacs-<build-id>.dmg, Leanmacs.dmg, Leanmacs.dmg.sha256 and build.json,
# with the release notes in notes.md. It holds no token and talks to no
# server; `leanmacs-release publish target/nightly` uploads them, in CI only.
[tasks.nightly]
description = "Opt-in, never part of ci; macOS only: check dist/Leanmacs-<build-id>.dmg's stamp and prepare the nightly's assets in target/nightly, with no token (crates/editor-release, `nightly`)"
run = "cargo run --quiet --locked -p editor-release-std --bin leanmacs-release -- nightly dist target/nightly"

# Any host, part of nothing: the golden tests in `mise run test`
# (crates/editor-release's `site` and crates/editor-release-std/tests/site.rs)
# cover it. CI's release job runs it on main, on the build.json `nightly`
# just prepared (.github/workflows/release.yml).
#
# `leanmacs-release site` (crates/editor-release, `site`) renders the
# download page for the build a build.json describes into
# <out-dir>/index.html, target/site by default. The minimum macOS it shows
# is [env]'s MACOSX_DEPLOYMENT_TARGET, the one the executable is linked for;
# run outside mise, with that unset, it refuses.
[tasks.site]
description = "Any host: render the download page from a build.json into <out-dir>/index.html (default target/site): mise run site -- <build.json> [<out-dir>] (crates/editor-release, site)"
run = "cargo run --quiet --locked -p editor-release-std --bin leanmacs-release -- site"

# Opt-in: run it by hand, on macOS, and do not add it to `ci` or to hk.pkl:
# it mounts a disk image. The ignored test
# crates/editor-release-std/tests/nightly_mount.rs packs a tiny stamped app
# into an image in a temporary directory and runs the nightly's prepare on
# it through the real process adapter: the five files, `shasum -a 256 -c`,
# the build read back, a wrong commit refused, and the image detached every
# time.
[tasks.nightly-check]
description = "Opt-in, never part of ci; macOS only: prepare a nightly from a tiny stamped image in a temporary directory, with real hdiutil, plutil and shasum (crates/editor-release-std/tests/nightly_mount.rs)"
run = "cargo test --locked -p editor-release-std --test nightly_mount -- --ignored --nocapture"

# Opt-in, by hand: converts a config directory from the old form, `.lean`
# files in byte order with no header, to the form the editor loads, a root
# `init.lean` and modules under `Config/` (the config-migrate binary of
# crates/editor-config-migrate-std, over editor_config_migrate::migrate,
# whose module docs say what it moves and what it refuses). With no argument it
# converts `${XDG_CONFIG_HOME:-$HOME/.config}/leanmacs`; `mise run
# config-migrate -- <dir>` converts another. The file that defines `setup`
# becomes `init.lean`, with the files after it, and the files before it
# become `Config/<Name>.lean`, so the converted config loads as the old one
# did. Its tests run the binary on copies of a fixture and on directories
# they write (crates/editor-config-migrate-std/tests/convert.rs), never on
# a real config.
[tasks.config-migrate]
description = "Opt-in, never part of ci: convert a config directory of .lean files in byte order with no header to init.lean and Config/<Name>.lean (the config-migrate binary, crates/editor-config-migrate-std); `mise run config-migrate -- [<config dir>]`, default ~/.config/leanmacs. The file that defines setup, and the files after it, become init.lean"
run = "cargo run --quiet --locked -p editor-config-migrate-std --bin config-migrate --"

# Opt-in: run it by hand, on macOS on arm64, and do not add it to `ci` or to
# hk.pkl: it writes outside the checkout. After `app`,
# tools/install-app.sh replaces /Applications/Leanmacs.app with the built
# bundle, installs the default config config/default (a starter SPC map) to
# ~/.config/leanmacs only when no config is there, otherwise only saying
# where the default config is, and deletes the backups
# the earlier install script left. `mise run install -- --agents` first
# builds acp's library with the developer's Cargo into packages/acp/lib/
# (gitignored), then requires agents-api and acp from this checkout in the
# config's lakefile, so the installed app's `:reload` builds that config
# with no Cargo. `LEANMACS_APPLICATIONS` and `LEANMACS_CONFIG_DIR` point it
# at a scratch prefix, for testing only. It keeps no backups and opens,
# registers or runs nothing.
[tasks.install]
description = "Opt-in, never part of ci; macOS on arm64 only: build Leanmacs.app and install it to /Applications, replacing the old one and deleting leftover backups (tools/install-app.sh); `-- --agents` also builds acp's library with the developer's Cargo into packages/acp/lib/ and adds agents-api and acp to ~/.config/leanmacs/lakefile.toml, whose :reload then runs no Cargo"
depends = ["app"]
run = "tools/install-app.sh packages"

# Opt-in: run it by hand, and do not add it to `ci` or to hk.pkl. It ends in
# an abort, and on macOS every abort makes the system write a crash report
# under ~/Library/Logs/DiagnosticReports, so in the gate it would leave a file
# on the developer's machine on every run. The `overflow` scenario itself and
# its fixture are still built by `lean`, inside the gate.
#
# A stack overflow in interpreted code is not caught: the process must die of
# SIGABRT, which the shell reports as status 134. The interpreter overflows
# only once its thread's stack is full. The entry point gives every thread
# Lean creates a 64 MiB stack (`editor_entry` in lean/ffi/glue.c; the
# `ffi-test` task checks the size), so the overflow takes milliseconds, and
# the scenario runs under that size: LEAN_STACK_SIZE_KB would override it, so
# it is removed from the scenario's environment. The runtime's own message
# has one line per interpreter frame (635 KB when the stack was 16 MiB, and
# more now), so stderr is dropped.
# `ulimit -c 0`: no core file. The sysroot and the directory of
# `InterpretedFixture.olean` are passed in, so the scenario reads nothing
# from the environment.
#
# The status alone is not enough: an abort before the recursion would give it
# too. The scenario prints one marker line once interpreted code has run and
# just before it recurses, so the marker must be the last line of stdout as
# well.
[tasks.ffi-overflow]
description = "Opt-in, never part of ci: check that a stack overflow in interpreted Lean code aborts the process (lean/FfiTest/Editor/Ffi/MainThread.lean). Each run makes macOS write a crash report under ~/Library/Logs/DiagnosticReports"
depends = ["lean"]
dir = "lean"
timeout = "60s"
run = '''status=0; out=$( (ulimit -c 0; exec env -u LEAN_STACK_SIZE_KB .lake/build/bin/ffi-test overflow "$(lean --print-prefix)" .lake/build/lib/lean 2>/dev/null) ) || status=$?; printf '%s\n' "$out" "ffi-test overflow: exit status $status"; test "$status" -eq 134 && test "$(printf '%s\n' "$out" | tail -n 1)" = "ffi-test overflow: entering the recursion"'''

# Opt-in: run it by hand on a quiet machine, and do not add it to `ci` or to
# hk.pkl. It measures and asserts nothing: its numbers depend on the machine,
# so none of them is a pass or a fail. The gate still builds the subcommands,
# under every linter (`lean`).
#
# Each run is a fresh process under `/usr/bin/time -l`, which prints the
# process's real time and its maximum resident set size (in bytes) on stderr
# after the subcommand's own line on stdout:
#
# - `bench-start` with each import set: how long the base takes to import and
#   the first config to load, and what the process then weighs;
# - `bench-reload`: the median and the maximum of 20 reloads of a one-line
#   root, of a 20-line config, of 50 definitions with a `simp` proof, and of
#   a config of two files, the 50 definitions in an imported file that
#   changes, on a base with `Lean`;
# - `bench-reload-directory`: the first and the last two of those again, with the config
#   read from a config directory, a temporary one, and not from memory, so
#   the directory's lookups are in the time;
# - `bench-soak` with 100 and with 500 reloads of a config that is its root
#   alone, which imports `Lean` and uses it: the mean time of a reload, and,
#   from the two resident set sizes, whether replaced configs are freed;
# - `bench-soak-modules` with 100 and with 500 reloads of a config of two
#   files, a root that imports `Lean` and a config file that changes each
#   round: the same, for a reload that writes a module file and makes an
#   environment that imports it. 500 of them take about two minutes.
#
#
# Each soak is run by tools/soak-ratio.sh, which prints the soak's own line
# for each count and then its two maximum resident set sizes and what the
# second is of the first: a config whose replaced versions are freed stays
# within a few percent. Memory is reported, never gating.
#
# The config is held in memory but for `bench-reload-directory`, so nothing
# else is read but the `.olean` files, whose directories are passed in. LEAN_STACK_SIZE_KB is removed from the
# environment, so the threads have the stack the editor gives them.
[tasks.config-bench]
description = "Opt-in, never part of ci: measure start-up, reload time and memory across reloads of the config session (lean/ConfigTest/Bench.lean), and auto-reload's rewrite-to-shown latency (packages/files/FilesTest/Linked/Files/Bench.lean). It asserts nothing"
depends = ["lean"]
dir = "lean"
run = [
  "/usr/bin/time -l env -u LEAN_STACK_SIZE_KB .lake/build/bin/config-test bench-start \"$(lean --print-prefix)\" .lake/build/lib/lean Editor",
  "/usr/bin/time -l env -u LEAN_STACK_SIZE_KB .lake/build/bin/config-test bench-start \"$(lean --print-prefix)\" .lake/build/lib/lean Editor Std",
  "/usr/bin/time -l env -u LEAN_STACK_SIZE_KB .lake/build/bin/config-test bench-start \"$(lean --print-prefix)\" .lake/build/lib/lean Editor Lean",
  "/usr/bin/time -l env -u LEAN_STACK_SIZE_KB .lake/build/bin/config-test bench-reload \"$(lean --print-prefix)\" .lake/build/lib/lean",
  "/usr/bin/time -l env -u LEAN_STACK_SIZE_KB .lake/build/bin/config-test bench-reload-directory \"$(lean --print-prefix)\" .lake/build/lib/lean",
  "sh ../tools/soak-ratio.sh .lake/build/bin/config-test \"$(lean --print-prefix)\" .lake/build/lib/lean bench-soak",
  "sh ../tools/soak-ratio.sh .lake/build/bin/config-test \"$(lean --print-prefix)\" .lake/build/lib/lean bench-soak-modules",
  # Auto-reload's criterion 9, "shown within a second", measured over the
  # library's real watch service: the latency from another process's
  # rewrite of an open buffer's file to the rewrite shown, printed with its
  # budget beside it. Real time is what it measures, so it is here, never a
  # pass or fail of the files package's linked test
  # (`FilesTest.Linked.autoReloadChecks`). It is `bench-auto-reload`, an
  # opt-in argument of that linked test
  # (packages/files/FilesTest/Linked.lean), since auto-reload is the files
  # package's: the line builds the linked test's executable as the package
  # steps do, with the system compiler, as `lean` links, asks Lake for its
  # path and runs it in the package's directory, as the package steps run
  # a linked test (tools/package-set.sh).
  "LEAN_CC=/usr/bin/cc lake -d ../packages/files build --wfail +FilesTest.Linked:editorLinked && bench=$(lake -d ../packages query :editorPackages | awk -F '\\t' '$1 == \"files\" { print $4 }') && oleans=$(cd .lake/build/lib/lean && pwd) && (cd ../packages/files && \"$bench\" bench-auto-reload \"$(lean --print-prefix)\" \"$oleans\" 10)",
]

# Opt-in: run it by hand on a quiet machine, on macOS, and do not add it to
# `ci` or to hk.pkl. It measures and asserts nothing: its numbers depend on
# the machine, so none of them is a pass or a fail. The gate still builds
# `config-test bench-modules`, under every linter (`lean`).
#
# What config may import, measured, for the import sets `Editor` and
# `Editor` with `Lean` (tools/module-bench.sh): the modules each import
# reads and the bytes of each file kind, of whole top-level directories and
# of those modules alone; which file kinds the import needs, found by
# staging the directories with the stage-bundle binary in a temporary
# directory with each kind set in turn and importing from them; and, staged
# with the kinds it needs, the start-up time and resident memory of
# `bench-start`, and of the staged bundle's headless mode for `Editor`. The
# figures are in docs/design/lean-runtime.md, "What config may import,
# measured". It takes a minute or two and needs a few GB of temporary disk.
# Opt-in, never part of `ci`; macOS on arm64 only, after `app` and `dmg`:
# the app bundle with the toolchain, measured (tools/bundle-bench.sh;
# docs/design/lean-runtime.md, "The bundle with the toolchain, measured";
# docs/dev-practices/on-demand-checks.md, "The bundle, measured on
# demand"): the bundle's bytes and files by part, the image's share of
# GitHub's 2 GiB asset limit, the bundled editor's start-up and resident
# memory, and the time of builds of a user's set from the bundle. It
# asserts nothing.
[tasks.bundle-bench]
description = "Opt-in, never part of ci; macOS on arm64 only: measure the built Leanmacs.app and its disk image: bytes by part, the image's share of GitHub's 2 GiB asset limit, start-up and resident memory, and the time of a user's set built from the bundle (tools/bundle-bench.sh)"
run = 'id=$(cargo run --quiet --locked -p editor-release-std --bin leanmacs-release -- build-id) && sh tools/bundle-bench.sh packages/.lake/build/Leanmacs.app "dist/Leanmacs-$id.dmg"'

[tasks.module-bench]
description = "Opt-in, never part of ci; macOS only: measure what each import set config may use needs to ship (file kinds, bytes) and costs at start-up (time, memory), from a staged bundle, and what the bundle of the default set's config base holds and costs (tools/module-bench.sh). It asserts nothing"
depends = ["lean"]
run = "tools/module-bench.sh lean"

# Opt-in, never part of `ci` or hk.pkl: it runs for hours and loads every
# core. The stress loop (tools/stress.sh; docs/dev-practices/on-demand-checks.md,
# "The stress loop, on demand"): `mise run stress -- <rounds> [suite ...]`
# runs the wiring set, read from code (its four default suites: config-test's
# and ffi-test's wiring groups and the window scenarios, contract-test, and
# each linked test's wiring groups;
# docs/dev-practices/real-thread-checks.md, "How the set runs"), or the
# suites named (`rust`, `gate-ffi` for the whole of ffi-test), that many
# times under `2 x cores` `yes` hogs at lowered priority, decides each run
# by its exit status, and prints each suite's passes. Run it after `mise
# run ci` has built everything.
[tasks.stress]
description = "Opt-in, never part of ci: run the wiring set over and over under a CPU load of twice the cores, each run decided by its exit status, and print each suite's passes (tools/stress.sh). Run after `mise run ci`"
run = "sh tools/stress.sh"

# Opt-in: run it by hand on a quiet machine, and do not add it to `ci` or to
# hk.pkl. It measures and asserts nothing: its numbers depend on the machine
# and on what else the machine is doing, so none of them is a pass or a fail.
# The gate still builds the subcommand, under every linter (`lean`).
#
# `bench-jobs` measures the latency of the editor loop, from posting
# `run noop` to the editor thread having run it, over 10,000 samples a row:
# with nothing running; with 64 jobs each sleeping a millisecond in a loop;
# with one interpreted job computing on each pool thread; with two for each;
# and with nothing running again. It then times a million `now` requests in
# one compiled job. It says which loaded rows are within bound: a row whose
# median is at most twice the larger of the two idle medians and whose 99th
# percentile is under 100 µs. The maximum is printed and not judged.
#
# Each row is a headless host on the real elaborator, the real queue and the
# library's timer service, with a config held in memory, so nothing is read
# but the `.olean` files, whose directories are passed in. LEAN_NUM_THREADS
# and LEAN_STACK_SIZE_KB are removed from the environment, so the pool has
# Lean's size and the threads the stack the editor gives them.
[tasks.job-bench]
description = "Opt-in, never part of ci: measure the latency of the editor loop while background jobs run (lean/ConfigTest/Bench.lean). It asserts nothing"
depends = ["lean"]
dir = "lean"
run = "env -u LEAN_NUM_THREADS -u LEAN_STACK_SIZE_KB .lake/build/bin/config-test bench-jobs \"$(lean --print-prefix)\" .lake/build/lib/lean 10000"

# Opt-in: do not add it to `ci` or to hk.pkl. It measures the session
# journal's cost on the editor thread (docs/design/concurrency.md, "The
# session journal"): the reconciler and the hand-off of its orders to the
# library's file service, for 10,000 one-character inserts into a buffer of
# 4 KiB, 1 MiB and 10 MiB, at its start, middle and end, each row named
# `journal_order/<size>/<position>`, for perf-suite to adopt once its
# harness exists. It asserts nothing.
[tasks.journal-bench]
description = "Opt-in, never part of ci: measure the session journal's cost on the editor thread, the reconciler and the hand-off to the file service for 10,000 one-character inserts at 4 KiB, 1 MiB and 10 MiB, at the start, middle and end (lean/ConfigTest/Bench.lean, `bench-journal`). It asserts nothing"
depends = ["lean"]
dir = "lean"
run = "env -u LEAN_NUM_THREADS -u LEAN_STACK_SIZE_KB .lake/build/bin/config-test bench-journal"

# Opt-in: run it by hand on a quiet machine, and do not add it to `ci` or to
# hk.pkl. It asserts nothing: its numbers depend on the machine and on what
# else the machine is doing. The gate still builds the subcommand, under
# every linter (`lean`).
#
# `bench-prompt` measures what a key costs in a prompt, over 600 keys a row,
# each of `src/f1` committed into the open prompt: from sending the key to
# the editor thread having handled it and published its scene. Rows: a
# prompt with no candidates; 1,000, 10,000 and 100,000 paths of about 40
# bytes listed on the editor thread (the inline limit lifted); 100,000
# matched off the editor thread, each key joined (and the listing's
# latency, key to delivery, printed); and 100,000 off the thread with the
# keys back to back, joining nothing, so each meets a match in flight or a
# delivery. It says whether the two off-thread rows are within bound:
# median at most twice the no-candidates median, 99th percentile under 1 ms
# (`docs/design/concurrency.md`, "Matching off the editor thread, measured").
#
# Each row is a headless host on the real queue and the library, its
# matcher among it; LEAN_NUM_THREADS and LEAN_STACK_SIZE_KB are removed from
# the environment, as for `job-bench`.
[tasks.prompt-bench]
description = "Opt-in, never part of ci: measure what a key costs in a prompt over many candidates, listed on the editor thread and matched off it (lean/ConfigTest/Bench.lean). It asserts nothing"
depends = ["lean"]
dir = "lean"
run = "env -u LEAN_NUM_THREADS -u LEAN_STACK_SIZE_KB .lake/build/bin/config-test bench-prompt \"$(lean --print-prefix)\" .lake/build/lib/lean 600"

# Opt-in: do not add it to `ci` or to hk.pkl. It runs real git and the fzf
# `[tools]` pins over a repository of 100,000 files.
#
# `bench-workspace-files`, an opt-in argument of the workspace package's
# linked test (packages/workspace/WorkspaceTest/Linked.lean), measures
# `find-file-in-workspace` (packages/workspace/Workspace/FindFile.lean) over
# a real repository, 120 keys a
# row, each of `m`, `1`, `2`, `f`, `3` and `4` committed into the open
# prompt. Rows: a key in a prompt with no candidates, the floor; a key in the
# finder's prompt, each joined, from sending it to the editor thread having
# handled it and published its scene, and the time from that key to the
# post of the batch for its text, the updated list, which takes in the
# source's 50 ms pause, `git ls-files` and fzf; and a key in the finder's
# prompt with the keys 120 ms apart, nothing joined, so each arrives while
# the job of the text before it runs its lister or its filter. Then the
# lister and the filter alone, outside the editor, 20 runs each. It says
# whether the two finder rows' keys are within bound: median at most twice
# the floor's, 99th percentile under 1 ms (`docs/design/concurrency.md`, "A
# key in the workspace finder, measured").
#
# The repository is made by tools/workspace-bench-repo.sh in a temporary
# directory, removed on exit; WORKSPACE_BENCH_REPO names a checkout to
# measure instead. The task builds the linked test's executable as the
# package steps do (`lake -d ../packages/workspace build
# +WorkspaceTest.Linked:editorLinked`) and asks Lake for its path. The host
# is a headless host on the real queue and the library's process and file
# services; LEAN_NUM_THREADS and LEAN_STACK_SIZE_KB are removed from the
# environment, as for `job-bench`, and LEAN_CC is the system compiler, as
# for `lean`, which links the executable.
[tasks.find-file-bench]
description = "Opt-in, never part of ci: measure what a key costs in find-file-in-workspace's prompt over a repository of 100,000 files, and the time from a key to its updated list (packages/workspace/WorkspaceTest/Linked/Workspace/Bench.lean). It asserts nothing"
depends = ["lean"]
dir = "lean"
env = { LEAN_CC = "/usr/bin/cc" }
run = '''
if [ -n "${WORKSPACE_BENCH_REPO:-}" ]; then
  repo=$WORKSPACE_BENCH_REPO
else
  dir=$(mktemp -d) && trap 'rm -rf "$dir"' EXIT && repo=$dir/repo && sh ../tools/workspace-bench-repo.sh "$repo" || exit 1
fi
lake -d ../packages/workspace build --wfail +WorkspaceTest.Linked:editorLinked || exit 1
bench=$(lake -d ../packages query :editorPackages | awk -F '\t' '$1 == "workspace" { print $4 }')
env -u LEAN_NUM_THREADS -u LEAN_STACK_SIZE_KB "$bench" bench-workspace-files "$(lean --print-prefix)" "$(cd .lake/build/lib/lean && pwd)" "$repo" 120
'''

# Opt-in: do not add it to `ci` or to hk.pkl. It opens a window on this
# desktop.
#
# `editor window-check` opens the real window and counts what of the keyboard
# reaches a Lean loop that pulls the editor queue: keys, the text they
# typed, the latency of each from its arrival in Rust to its handling in
# Lean, dead keys and an input method's composition. When the window closes
# the report is eight lines on stdout (lean/Editor/WindowCheck.lean gives
# their form).
#
# `mise run window-check -- --no-ime` runs the window with composition not
# allowed, so a dead key arrives as a key; `-- --seconds <n>` sets how long
# the window stays open if nobody closes it (120 by default).
#
# The gate runs the same loop on the library's scripted platform, which opens
# nothing (`ffi-test`), and on a fake (`lean-test`).
[tasks.window-check]
description = "Opt-in, never part of ci: open a window and report what of the keyboard reaches the Lean loop, with the latency of each key (lean/Editor/WindowCheck.lean). Needs a display"
depends = ["lean"]
dir = "lean"
run = "../packages/.lake/build/bin/editor window-check"

# Opt-in: the editor on a file, in a window (lean/Editor/Window/Real.lean).
# Do not add it to `ci` or to hk.pkl: it opens a window and stays until it
# is closed. `mise run edit -- <file>` opens the file, resolved
# against the directory the task was run from (mise hands that directory
# over as MISE_ORIGINAL_CWD), and `mise run edit` with no file opens the
# editor on its one empty buffer; the options go before the file, as
# `mise run edit -- --report --config <dir> <file>`. The task always gives
# the toolchain `lean/lean-toolchain` pins (`--sysroot`), so config is
# loaded at start: from `--config`, or from `leanmacs` under
# `$XDG_CONFIG_HOME` (or `$HOME/.config`) when that directory exists, and
# again on `:reload`. It runs in lean/, so mise picks that toolchain, and
# hands the editor the build tree's `.olean` files.
[tasks.edit]
description = "Opt-in, never part of ci: open a file, or an empty buffer, in the editor's window (lean/Editor/Window/Real.lean), through the app's launcher, which starts the newest per-user build of your package set, else the default set's editor; `mise run edit -- [options] [<file>]`. Needs a display"
depends = ["lean", "launcher"]
dir = "lean"
run = 'lean_dir=$PWD && sysroot=$(lean --print-prefix) && cd "$MISE_ORIGINAL_CWD" && "$lean_dir/../target/release/leanmacs" --default "$lean_dir/../packages/.lake/build/bin/editor" -- --sysroot "$sysroot"'

# Opt-in: milestone 1's figures with no window, for the phase body
# (docs/dev-practices/on-demand-checks.md, "Milestone 1, measured"). Run it
# on a quiet machine, and do not add it to `ci` or to hk.pkl: it takes about
# a minute, half of it an idle period, and asserts nothing. It runs five
