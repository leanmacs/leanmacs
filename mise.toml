[tools]
rust = { version = "1.98.1", components = "rustfmt,clippy" }
# cargo-deny is a prebuilt release binary that aqua's registry names with its
# checksum, so installing it never compiles.
"aqua:EmbarkStudios/cargo-deny" = "0.19.9"
hk = "2.4.0"
pkl = "0.32.1"
# The formatter for the C glue (`mise run c-fmt`, `mise run c-format`). The
# PyPI wheel is an exact pin of the binary; mise installs it with `uv` or
# `pipx`, whichever the machine has.
"pipx:clang-format" = "23.1.4"
# Lean (lean, lake) is not listed here: `lean/lean-toolchain` is its one pin
# (AGENTS.md, "Toolchains"). mise reads that file through the `lean` plugin,
# which the global mise config declares along with
# `idiomatic_version_file_enable_tools = ["lean"]`.

[env]
RDM_ROOT = "{{env.HOME | default(value=env.USERPROFILE | default(value=''))}}/Projects/rdm-atlas-repo"
RDM_PROJECT = "editor-project"
# The lowest macOS every Lake link targets, the executable's `minos`. With
# this unset Lake links for 99.0, and Finder refuses to start the app ("you
# can't use this version"). It must equal `appMinimumSystemVersion` in
# lean/lakefile.lean, the bundle's LSMinimumSystemVersion; `mise run
# app-check` fails when the executable's `minos` is later. Other platforms
# ignore it.
MACOSX_DEPLOYMENT_TARGET = "27.2"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all --check"

[tasks.lint]
description = "Clippy over every crate and target, warnings are errors"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.deny]
description = "cargo-deny's bans over the dependency graph (deny.toml); stale `wrappers` are errors"
run = "cargo deny --locked check -D unused-wrapper bans"

[tasks.doc]
description = "Rustdoc over every crate, private items included, with broken intra-doc links denied"
env = { RUSTDOCFLAGS = "-D rustdoc::broken_intra_doc_links" }
run = "cargo doc --workspace --no-deps --document-private-items --locked"

[tasks.test]
description = "Rust unit, integration and doc tests"
run = "cargo test --workspace --locked"

# The model tests: editor logic run in Lean alone, against hand-written fakes
# and the pure models of the editor's ports (lean/ModelTest.lean). They must
# pass without the Rust library being built, and the task shows that by
# behaviour: `lean/no-cargo/cargo` is a fake `cargo` that always fails, put
# first on the PATH, and Lake's `rustlib` target runs `cargo` on every build
# that reaches it. So this passes only if nothing the test driver needs
# reaches `rustlib`, on a tree where the archive is already built as well as
# on a clean one. Seen to bite once by hand: with the same PATH,
# `LEAN_CC=/usr/bin/cc lake build editor` fails at `editor/rustlib`.
#
# No LEAN_CC: the test driver links no C glue, so Lean's bundled compiler
# builds it.
#
# Nothing is removed from the environment. LEAN_NUM_THREADS sets the size of
# Lean's task pool, and the checks that warm the pool and count the threads
# jobs wait from pin no size: they pass under a bare `lake test` whatever the
# variable says.
[tasks.lean-test]
description = "Run the Lean model tests with `lake test`, with a `cargo` that fails first on the PATH: they need no Rust library (lean/ModelTest.lean)"
dir = "lean"
run = 'PATH="$PWD/no-cargo:$PATH" lake test --wfail'

# Runs in lean/, so mise picks the toolchain `lean/lean-toolchain` pins.
#
# It waits for `lean-test` only so that two Lake builds never run in lean/ at
# once: the Lake tasks run in one chain, `lean-test`, `lean`, then `lean-fmt`
# and `ffi-test`.
[tasks.lean]
description = "Build the Lean package and the executables with Lake, which runs Cargo for the Rust static library; every linter is on and a warning fails the build (lean/lakefile.lean)"
depends = ["lean-test"]
dir = "lean"
# On macOS the executables must be compiled and linked by the system compiler:
# the clang bundled with Lean has no `pthread.h` for the C glue, and its linker
# cannot link the system frameworks the Rust library will need. This is set
# here and not in the top-level [env] because lean-fmt must keep building with
# Lean's bundled compiler: under /usr/bin/cc its link fails (`library 'gmp'
# not found`). It is the absolute path because `cc` on mise's PATH may be a
# shim for another compiler.
env = { LEAN_CC = "/usr/bin/cc" }
# --wfail also fails on warnings Lake itself logs, which `warningAsError` in
# the lakefile does not reach.
run = "lake build --wfail"

# lean-fmt is a Lake dependency (lean/lakefile.lean), pinned to the tag named
# after the Lean toolchain. Both tasks wait for `lean`, so two Lake builds
# never run in lean/ at once.
[tasks.lean-fmt]
description = "Check Lean formatting and lean-fmt's lints; changes nothing"
depends = ["lean"]
dir = "lean"
run = [
  "lake exe lean-fmt format --check",
  "lake exe lean-fmt check",
]

[tasks.lean-format]
description = "Rewrite the Lean sources in lean-fmt's style and apply its safe lint fixes"
depends = ["lean"]
dir = "lean"
run = [
  "lake exe lean-fmt format",
  "lake exe lean-fmt check --fix",
]

# Tracked files only, so Lake's fetched packages and build output are never
# looked at. A new C file is checked once it is `git add`ed.
[tasks.c-fmt]
description = "Check the formatting of the C and C++ sources (.clang-format); changes nothing"
run = "git ls-files -z '*.c' '*.h' '*.cc' '*.cpp' '*.hpp' | xargs -0 clang-format --dry-run --Werror"

[tasks.c-format]
description = "Rewrite the C and C++ sources in the style .clang-format sets"
run = "git ls-files -z '*.c' '*.h' '*.cc' '*.cpp' '*.hpp' | xargs -0 clang-format -i"

# Runs the built executables only (no Lake), so it needs just `lean` before it.
# The time limit turns a hang into a failure: a deadlock in the main-thread
# hand-off, or a process that waits for a task still blocked in the library.
[tasks.ffi-test]
description = "Run the checks and scenarios of the Lean/Rust boundary (lean/FfiTest.lean), the text port's, the job port's and the syntax tree interface's contracts against their real bindings (lean/ContractTest.lean), the config session against the real elaborator (lean/ConfigTest.lean) and the editor executable"
depends = ["lean"]
dir = "lean"
timeout = "60s"
run = [
  # One of these checks measures the stack the entry point gives Lean's
  # threads, and LEAN_STACK_SIZE_KB overrides that size, so a variable in the
  # developer's shell must not reach it.
  "env -u LEAN_STACK_SIZE_KB .lake/build/bin/ffi-test",
  # Arguments reach Lean's `main`, and its result is the exit status.
  "status=0; .lake/build/bin/ffi-test exit 7 || status=$?; test \"$status\" -eq 7",
  # Quit is for good and process-wide, so shutdown has processes of its own.
  ".lake/build/bin/ffi-test shutdown",
  ".lake/build/bin/ffi-test exit-while-blocked",
  # The same properties `lean-test` runs against the pure models, here against
  # the Rust library: the text port's, and the job port's over the timer
  # service. Its check of Lean's task pool pins no size, so LEAN_NUM_THREADS
  # in the developer's shell does it no harm. Its two arguments are the
  # directory of the fixtures that stand in for mise in the checks of a
  # child's environment (tests/process-environment), and the directory of
  # the fixture that stands in for git in the workspace finder's checks,
  # whose properties `lean-test` runs against the finder's model
  # (tests/workspaces), and the directory of the syntax fixtures, whose Rust
  # fixtures the indent and text-object checks read (tests/syntax).
  ".lake/build/bin/contract-test ../tests/process-environment ../tests/workspaces ../tests/syntax",
  # The config session against the real elaborator. The toolchain's directory
  # and the package's `.olean` directory are passed in, so it reads nothing
  # from the environment.
  ".lake/build/bin/config-test \"$(lean --print-prefix)\" .lake/build/lib/lean",
  # The demonstration. With no arguments the editor is the window mode on
  # an empty buffer, which opens a window, so the gate never runs that.
  ".lake/build/bin/editor demo",
  # The headless mode, on the fixture checked in under tests/headless: it
  # loads the config directory, runs the script, and must print exactly
  # `expected`. Every path is an argument.
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/config ../tests/headless/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/expected -",
  # The same, with a script that sends keys with their identity: each goes
  # through the library's window input, as a window's would, and must be
  # printed back with its logical key, physical key and modifiers
  # (`keys-expected`).
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/config ../tests/headless/keys-script) && printf '%s\\n' \"$out\" | diff ../tests/headless/keys-expected -",
  # The same, with a script that enters insert state, commits text as an
  # input method would and asks for the scene: the editor loop's frame is
  # made at the first window event, and the view's snapshot must hold the
  # text, read from the library (`scene-expected`). Its second half reloads and runs a job once the
  # frame exists, and each must be followed by a scene.
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/config ../tests/headless/scene-script) && printf '%s\\n' \"$out\" | diff ../tests/headless/scene-expected -",
  # Keys dispatched to commands, on a config of its own (tests/headless/
  # dispatch): a key sequence config binds runs its command, the interrupt
  # key stops one that loops over requests and rolls back its edit, the next
  # key's command runs to its end, and a key's command starts a job with an
  # argument, whose result the job's command says in the echo area
  # (`dispatch/expected`). A command that is not stopped loops for longer
  # than the time limit.
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/dispatch/config ../tests/headless/dispatch/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/dispatch/expected -",
  # The config fixture installed with the app (tests/headless/
  # finder-session), the one tools/prepare-finder-session.sh installs to
  # ~/.config/leanmacs: it loads, and its command, run by its key `C-c h`
  # and by its ex name `finder-hello`, says `finder-session: config loaded`
  # in the echo area each time (`finder-session/expected`).
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/finder-session/config ../tests/headless/finder-session/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/finder-session/expected -",
  # The file commands the editor ships, on a config of its own (tests/
  # headless/files): `save-buffer`, which no config registers, says the
  # scratch buffer has no file, and a command of config's opens a path that
  # is not absolute, which starts the compiled job `load-file` and is
  # refused by the library before it asks the file system, so the run
  # touches no file (`files/expected`).
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/files/config ../tests/headless/files/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/files/expected -",
  # A prompt, on a config of its own (tests/headless/prompt), under the
  # editor's input scheme: a command of config's asks for a prompt, a
  # key that prints is typed into the minibuffer, whose view the scene
  # shows with the prompt text as its status line; `<Enter>` accepts with
  # the compiled command `minibuffer-accept`, and config's command that
  # receives the answer says it in the echo area; `<Escape>` cancels with
  # `minibuffer-cancel`, and that command does not run; and the compiled
  # `open-file`, run with no path, asks for one and opens the answer, here
  # a committed text, a path that is not absolute, which the library
  # refuses before it asks the file system, so the run touches no file
  # (`prompt/expected`).
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/prompt/config ../tests/headless/prompt/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/prompt/expected -",
  # A prompt with candidates, on a config of its own (tests/headless/
  # candidates), under the editor's input scheme and with the library's
  # fuzzy matcher: a command of config's asks with three candidates, a key
  # is typed, and the scene lists the candidates the text matches after
  # the prompt's label, in the minibuffer's status line, the one that is
  # the text first; `<Tab>`, pressed twice, chooses the second with the
  # compiled command `minibuffer-next`, and the scene shows it in the
  # chosen face; `<Enter>` accepts, and config's command that receives the
  # answer says the chosen candidate in the echo area; and with a text no
  # candidate matches the scene lists none, and the command receives the
  # typed text (`candidates/expected`). It touches no file.
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/candidates/config ../tests/headless/candidates/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/candidates/expected -",
  # Named themes, on a config of its own (tests/headless/themes) that
  # defines two themes and names the first: the scene line names the theme
  # each scene was drawn in, the first after the reload, the second after
  # the compiled command `load-theme` is answered with its name, with no
  # reload between, and the shipped `solarized-dark` and `fairy-floss`
  # after it as each is answered with its name (`themes/expected`). It
  # touches no file.
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/themes/config ../tests/headless/themes/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/themes/expected -",
  # A shipped theme named by config, on a config of its own
  # (tests/headless/shipped-themes) that names `solarized-light`: the scene
  # after the reload is drawn in it, and the one after `load-theme` is
  # answered with `fairy-floss` in that (`shipped-themes/expected`). It
  # touches no file.
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/shipped-themes/config ../tests/headless/shipped-themes/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/shipped-themes/expected -",
  # The segmented mode line, on a config of its own (tests/headless/
  # mode-line) that defines a segment and lists the mode line for each side,
  # one name nobody registered among them: the reload says that name, on a
  # line of its own and in the echo area, and each scene's status line has
  # its left fields, ` | ` and its right ones, in the listing's order, with
  # their paddings, in insert state, in normal state and with the ex prompt
  # open (`mode-line/expected`). It touches no file.
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/mode-line/config ../tests/headless/mode-line/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/mode-line/expected -",
  # The frame padding (tests/headless/padding): a config that sets it to 12
  # points; each scene prints the window's view padded 12 across and down,
  # the echo padded 12, and with the ex prompt open the minibuffer's view
  # padded 12 across and none down (`padding/expected`). It touches no file.
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/padding/config ../tests/headless/padding/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/padding/expected -",
  # Evil, with no config: the script has no `reload`, so nothing of the
  # config directory is loaded, and every command its keys run is one the
  # editor ships. `i` begins an insert and the keys that print are typed
  # text, `<Escape>` returns to normal state, and `0` moves to the line's
  # start: the scenes show the text, the cursor and the state's name in the
  # status line (`evil-expected`).
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/config ../tests/headless/evil-script) && printf '%s\\n' \"$out\" | diff ../tests/headless/evil-expected -",
  # The ex command line, with no config (tests/headless/ex): the script has
  # no `reload`, so the ex command and every ex name are the ones the
  # editor ships. Two of its lines are opened with the `:` key, as a user
  # opens them. A name nobody bound is said in the echo area, `w` in the
  # scratch buffer says it has no file, and `q` quits the editor: the loop
  # ends, the `scene` line after it is not run, and the status is 0
  # (`ex/expected`). It touches no file.
  "out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/config ../tests/headless/ex/script) && printf '%s\\n' \"$out\" | diff ../tests/headless/ex/expected -",
  # `e`, an edit, `w` and `q` on a real file, as a process. Lean spawns no
  # child (docs/design/overview.md), so the check is here: this entry is one
  # shell, which makes a temporary directory and removes it by a trap when
  # the shell ends, whether the check passed or failed. It copies the
  # fixture file `ex/note.txt` there, and writes the script there from the
  # template `ex/save-quit-script`, with the copy's absolute path in place
  # of `@FILE@`: the file port takes absolute paths only. The editor must
  # exit with status 0, the copy must hold the bytes of `ex/note-expected`,
  # and no line of the output may start with `commands:`, which the `show`
  # line after the quit would print. Nothing outside the temporary
  # directory is written, and the task's time limit ends a run that hangs.
  "dir=$(mktemp -d) && trap 'rm -rf \"$dir\"' EXIT && cp ../tests/headless/ex/note.txt \"$dir/note.txt\" && sed \"s|@FILE@|$dir/note.txt|\" ../tests/headless/ex/save-quit-script > \"$dir/script\" && out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/config \"$dir/script\") && printf '%s\\n' \"$out\" && cmp \"$dir/note.txt\" ../tests/headless/ex/note-expected && ! printf '%s\\n' \"$out\" | grep -q '^commands:'",
  # The same with `wq` in place of `w` and `q` (`ex/wq-script`): the quit
  # waits for the save, so the script has a `join` after the `wq` line,
  # which ends when the save's result has ended the loop.
  "dir=$(mktemp -d) && trap 'rm -rf \"$dir\"' EXIT && cp ../tests/headless/ex/note.txt \"$dir/note.txt\" && sed \"s|@FILE@|$dir/note.txt|\" ../tests/headless/ex/wq-script > \"$dir/script\" && out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/config \"$dir/script\") && printf '%s\\n' \"$out\" && cmp \"$dir/note.txt\" ../tests/headless/ex/note-expected && ! printf '%s\\n' \"$out\" | grep -q '^commands:'",
  # An evil session on a real file, as a process, with no config
  # (tests/headless/session): `:e`, a count and an operator (`2dw`), a dot
  # repeat, an undo, a change with typed text and its dot repeat, a visual
  # yank, a put, an undo and a redo, and `:w`, with a scene printed after
  # each step. This entry is one shell, as the two above are: it makes a
  # temporary directory and removes it by a trap, copies `session/verse.txt`
  # there, and writes the script there from the template `session/script`
  # with the copy's absolute path in place of `@FILE@`. The editor must exit
  # with status 0, its output, with the temporary directory's path written
  # `@DIR@`, must be exactly `session/expected` (the text, the cursor, the
  # selection, the state and the echo of every scene), and the copy must
  # hold the bytes of `session/verse-expected`.
  "dir=$(mktemp -d) && trap 'rm -rf \"$dir\"' EXIT && cp ../tests/headless/session/verse.txt \"$dir/verse.txt\" && sed \"s|@FILE@|$dir/verse.txt|\" ../tests/headless/session/script > \"$dir/script\" && out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/config \"$dir/script\") && printf '%s\\n' \"$out\" | sed \"s|$dir|@DIR@|g\" | diff ../tests/headless/session/expected - && cmp \"$dir/verse.txt\" ../tests/headless/session/verse-expected",
  # A view that follows its cursor, as a process, with no config
  # (tests/headless/view): the script sizes the frame, opens a file of 120
  # lines with `:e`, and moves the cursor 100 lines down, with a scene
  # printed after each step: the second scene's view has its scroll anchor
  # moved so that the cursor's line is among the rows it shows. Then `C-u`,
  # `C-f` twice, the second at the text's end, `zt` and `zb` scroll the
  # view, and a resize to a third of the height is followed. The display
  # is the recorder, the display model's rule over the library's snapshots,
  # in cells of 8 by 16. This entry is one shell, as the three above are: it
  # makes a temporary directory and removes it by a trap, copies
  # `view/lines.txt` there, and writes the script there from the template
  # `view/script` with the copy's absolute path in place of `@FILE@`. The
  # editor must exit with status 0, and its output, with the temporary
  # directory's path written `@DIR@`, must be exactly `view/expected`. The
  # file is not written.
  "dir=$(mktemp -d) && trap 'rm -rf \"$dir\"' EXIT && cp ../tests/headless/view/lines.txt \"$dir/lines.txt\" && sed \"s|@FILE@|$dir/lines.txt|\" ../tests/headless/view/script > \"$dir/script\" && out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/config \"$dir/script\") && printf '%s\\n' \"$out\" | sed \"s|$dir|@DIR@|g\" | diff ../tests/headless/view/expected - && cmp \"$dir/lines.txt\" ../tests/headless/view/lines.txt",
  # `j` and `k` aiming for a display column, as a process, with no config
  # (tests/headless/column): the script opens a file of three lines, one
  # with a tab and one with a wide character, with `:e`, and moves the
  # cursor down from after the tab and up from after the wide character,
  # with a scene printed after each step: the cursor lands at the display
  # column it started in, the tab stop's and two past the wide character's.
  # There is no `resize`, so the frame is 0 by 0: the column does not need
  # the view's rectangle. The display is the recorder, the display model's
  # rule over the library's snapshots. This entry is one shell, as the four
  # above are: it makes a temporary directory and removes it by a trap,
  # copies `column/lines.txt` there, and writes the script there from the
  # template `column/script` with the copy's absolute path in place of
  # `@FILE@`. The editor must exit with status 0, and its output, with the
  # temporary directory's path written `@DIR@`, must be exactly
  # `column/expected`. The file is not written.
  "dir=$(mktemp -d) && trap 'rm -rf \"$dir\"' EXIT && cp ../tests/headless/column/lines.txt \"$dir/lines.txt\" && sed \"s|@FILE@|$dir/lines.txt|\" ../tests/headless/column/script > \"$dir/script\" && out=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/config \"$dir/script\") && printf '%s\\n' \"$out\" | sed \"s|$dir|@DIR@|g\" | diff ../tests/headless/column/expected - && cmp \"$dir/lines.txt\" ../tests/headless/column/lines.txt",
  # Milestone 1 over the whole program, with no config
  # (tests/headless/milestone): the headless mode with `--render`, whose
  # display is the real binding over the library's layout in cells of 8 by
  # 16, bound to the library's headless render session, which draws every
  # frame on the CPU renderer. The script opens a source file of 60 lines
  # with `:e`, runs an evil session on it (`2dw`, `.`, `u`, `j`, `cw` with a
  # committed text, `<Escape>`, `$ p`, `u`, `C-r`), scrolls with `C-f`,
  # saves with `:w`, and checks twice with `agree` that the last rows query
  # about the view gave the rows of the frame drawn of it; then `idle 1000`
  # waits for the render loop to be at rest and counts what it draws and is
  # handed over one second, which must be nothing. That second is the one
  # real-time wait of the gate's checks of the render loop
  # (docs/design/text-and-display.md). This entry is one shell, as the five
  # above are: it makes a temporary directory and removes it by a trap,
  # copies `milestone/source.txt` there, and writes the script there from
  # the template `milestone/script` with the copy's absolute path in place
  # of `@FILE@`. The editor must exit with status 0, its output, with the
  # temporary directory's path written `@DIR@`, must be exactly
  # `milestone/expected`, and the copy must hold the bytes of
  # `milestone/source-expected`.
  "dir=$(mktemp -d) && trap 'rm -rf \"$dir\"' EXIT && cp ../tests/headless/milestone/source.txt \"$dir/source.txt\" && sed \"s|@FILE@|$dir/source.txt|\" ../tests/headless/milestone/script > \"$dir/script\" && out=$(.lake/build/bin/editor headless --render \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/config \"$dir/script\") && printf '%s\\n' \"$out\" | sed \"s|$dir|@DIR@|g\" | diff ../tests/headless/milestone/expected - && cmp \"$dir/source.txt\" ../tests/headless/milestone/source-expected",
  # The display fixture: the scene `editor-layout`'s own test lays out
  # (crates/editor-layout/tests/frame_fixture.rs), published from Lean
  # through the display's real binding, must give the frame checked in at
  # tests/display/frame.expected; the scene must come back as sent; and a
  # move asked through the binding must land on the frame's next row.
  ".lake/build/bin/ffi-test display ../tests/display/frame.expected",
  # The shipped themes' pictures: the fixture file tests/render/themes/
  # source.lean, published from Lean through the display's real binding in
  # `solarized-dark`, `solarized-light` and `fairy-floss`, over a display
  # of the one fixture font given here, and drawn by the CPU renderer, must
  # match
  # `tests/render/themes/<name>.png` within 2 of 255 a channel; in each,
  # the paper, the cursor and the text must carry the palette's colours;
  # and the light picture must not match the dark reference
  # (tests/render/themes/README.md). It reads only checked-in files and
  # writes nothing. `mise run theme-references` makes the images again.
  ".lake/build/bin/ffi-test theme-pictures ../tests/render/themes ../tests/fonts/NotoSansMono-Regular.subset.ttf",
  # The window mode's wiring, `editor <file>` (lean/Editor/Window/Real.lean),
  # on the library's scripted platform, as a process of its own, so that its
  # render session is the only one the process starts: a cells display bound
  # to the presenter, the host opening a copy of `ex/note.txt`, the scripted
  # sample window opening, sending its fixed input and asking to close. The
  # scenario must exit 0, which it does only once the window has run and
  # closed and the render session's counters show a frame drawn, and the
  # copy must be unchanged. It opens no window and touches no clipboard of
  # the desktop's.
  "dir=$(mktemp -d) && trap 'rm -rf \"$dir\"' EXIT && cp ../tests/headless/ex/note.txt \"$dir/note.txt\" && .lake/build/bin/ffi-test window-host \"$dir/note.txt\" && cmp \"$dir/note.txt\" ../tests/headless/ex/note.txt",
  # The same wiring with no file, as Finder starts the app: the host posts
  # no open, and the window runs on the editor's one empty buffer. It must
  # exit 0 as the scenario with a file does. It touches no file.
  ".lake/build/bin/ffi-test window-host",
  # The same wiring with no file and config loaded at start, on the fixture
  # tests/window/title-bar/config, whose `setup` keeps the standard title
  # bar: the host waits for the start-up reload, with no bound so that the
  # result does not race the clock (this task's time limit ends a run that
  # hangs), and the scripted window must be opened with the standard title
  # bar. The toolchain's directory and the `.olean` directory are passed in,
  # as for config-test. It touches no file.
  ".lake/build/bin/ffi-test window-host-config \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/window/title-bar/config",
  # The same wiring on the library's scripted platform whose renderer cannot
  # be made, as a machine with no usable GPU gives: the window runs with
  # nothing drawing in it. The scenario must exit 0, which it does only when
  # the window mode ended with status 1 and no render session was started;
  # stderr must hold the window mode's line saying why nothing drew, with
  # the platform's reason whole (`SCRIPTED_NO_RENDERER` in
  # crates/editor-ffi/src/window.rs); and the copy must be unchanged.
  "dir=$(mktemp -d) && trap 'rm -rf \"$dir\"' EXIT && cp ../tests/headless/ex/note.txt \"$dir/note.txt\" && err=$(.lake/build/bin/ffi-test window-host-undrawn \"$dir/note.txt\" 2>&1 >/dev/null) && printf '%s\\n' \"$err\" | grep -qxF \"editor: nothing could draw in the window: the scripted platform's window has no renderer: pas de GPU\" && cmp \"$dir/note.txt\" ../tests/headless/ex/note.txt",
  # The editor's failure statuses. A command line it does not understand is
  # status 2, with the usage on stderr: an option it does not know, and two
  # files, `demo x` among them. (A word that is no mode is a file to open,
  # and `demo` is a mode only on its own.)
  "status=0; .lake/build/bin/editor --bogus || status=$?; test \"$status\" -eq 2",
  "status=0; .lake/build/bin/editor a b || status=$?; test \"$status\" -eq 2",
  "status=0; .lake/build/bin/editor demo x || status=$?; test \"$status\" -eq 2",
  # The headless mode with only a config directory and a script, from the
  # build tree, outside a bundle: there is no toolchain to use, so it is
  # status 2 with a line on stderr saying so, before the usage
  # (lean/Editor/Headless/CommandLine.lean). `bundle-test` runs the same
  # command line from a bundle.
  "status=0; err=$(.lake/build/bin/editor headless ../tests/headless/config ../tests/headless/script 2>&1 >/dev/null) || status=$?; printf '%s\\n' \"$err\"; test \"$status\" -eq 2 && test \"${err#editor: no Lean toolchain}\" != \"$err\"",
  # A script that cannot be read is status 1, with nothing on stdout and a
  # line on stderr that starts `editor: ` and says why. No file of that name
  # is checked in.
  "status=0; err=$(.lake/build/bin/editor headless \"$(lean --print-prefix)\" .lake/build/lib/lean ../tests/headless/config ../tests/headless/no-such-script 2>&1 >/dev/null) || status=$?; printf '%s\\n' \"$err\"; test \"$status\" -eq 1 && test \"${err#editor: }\" != \"$err\"",
]

# The headless mode run from a bundle, as the installed editor will be
# (docs/dev-practices/headless-mode.md, "From an app bundle"). It runs the
# built executables only, so it needs just `lean` before it, and has a time
# limit of its own: copying the 180 MB executable and the module files must
# not eat `ffi-test`'s.
#
# One shell, which makes a temporary directory and removes it by a trap when
# the shell ends, whether the check passed or failed. In it,
# tools/stage-bundle.sh lays out `Leanmacs.app` as the bundle will be: a
# copy of `editor` (not a link) in `Contents/MacOS`, and the `.olean`,
# `.olean.server` and `.olean.private` files of the modules `Editor`
# imports, which `config-test bench-modules` lists, under
# `Contents/Resources/lean/toolchain/lib/lean` and
# `Contents/Resources/lean/editor`. Those three kinds and that closure are
# what `mise run module-bench` measured the import to need
# (docs/design/lean-runtime.md, "What config may import, measured").
# `lean --print-prefix` runs on the staging side only. The fixture's config
# and script (tests/headless/bundle) are copied into the temporary
# directory, and the copy of the editor runs its headless mode on them from
# a working directory outside the bundle, with no directory argument and an
# empty environment (no `HOME`, `PATH`, `LEAN_PATH` or `XDG_*`): it must
# exit 0 and print exactly `expected`. It passes only if the executable
# found its modules from its own path: outside a bundle it would find no
# toolchain and be refused, and the build tree's `.olean` directory is not
# beside the copy. The fixture's commands only make texts, so nothing is
# written outside the temporary directory.
[tasks.bundle-test]
description = "Stage the app bundle's layout in a temporary directory and run the headless mode of a copy of the editor there, with no directory argument, an empty environment and a working directory outside it (tools/stage-bundle.sh, tests/headless/bundle)"
depends = ["lean"]
dir = "lean"
timeout = "120s"
run = '''dir=$(mktemp -d) && trap 'rm -rf "$dir"' EXIT && sysroot=$(lean --print-prefix) && fixtures=$PWD/../tests/headless/bundle && .lake/build/bin/config-test bench-modules "$sysroot" .lake/build/lib/lean Editor >"$dir/closure" && ../tools/stage-bundle.sh --closure "$dir/closure" "$dir/Leanmacs.app" .lake/build/bin/editor "$sysroot" .lake/build/lib/lean olean olean.server olean.private && cp -R "$fixtures/config" "$dir/config" && cp "$fixtures/script" "$dir/script" && mkdir "$dir/elsewhere" && cd "$dir/elsewhere" && out=$(env -i "$dir/Leanmacs.app/Contents/MacOS/editor" headless "$dir/config" "$dir/script") && printf '%s\n' "$out" | diff "$fixtures/expected" -'''

# Opt-in: run it by hand, on macOS on arm64, and do not add it to `ci` or to
# hk.pkl. The bundle is about 600 MB and signing hashes all of it, and the
# gate runs on Linux too, where the target is refused with the reason.
#
# It builds `lean/.lake/build/Leanmacs.app` with Lake (`editorApp` in
# lean/lakefile.lean): the editor executable, the `.olean` files of the
# modules `Editor` imports, Info.plist with the version from
# lean/app/version, and the icon made from lean/app/Leanmacs.png with sips
# and iconutil, ad-hoc signed as a whole, last. Lake rebuilds it only when an input changed, so a
# second run with nothing changed copies and signs nothing, and prints no
# `Built editorApp` line. It waits for `lean` so that the Lake builds in
# lean/ run in one chain, and sets LEAN_CC as `lean` does, since the
# executables it fetches must be linked by the system compiler.
[tasks.app]
description = "Opt-in, never part of ci; macOS on arm64 only: build lean/.lake/build/Leanmacs.app with Lake (`editorApp` in lean/lakefile.lean), ad-hoc signed"
depends = ["lean"]
dir = "lean"
env = { LEAN_CC = "/usr/bin/cc" }
run = "lake build --wfail editorApp"

# Opt-in: run it by hand, on macOS on arm64, and do not add it to `ci` or to
# hk.pkl: the gate does not build the bundle, and runs on Linux too. It is
# the check for any change to `editorApp`, tools/stage-bundle.sh or module
# lookup (lean/Editor/ModuleLookup.lean).
#
# tools/app-check.sh copies the built bundle into a temporary directory
# removed by a trap, verifies its signature with `codesign --verify
# --strict --deep`, reads its Info.plist (its document types and its
# version keys, which must be the line of lean/app/version, among its keys)
# and icon (the ten standard sizes, 16 to 1024 pixels) as the system does,
# runs its headless mode on tests/headless/bundle with no directory
# argument, an empty environment and / as the working directory, which must
# print exactly `expected`, and builds `editorApp` again to show that copies
# and signs nothing. In a clone of lean/ it shows that a failed rebuild
# leaves the old bundle, that changing the version or the artwork rebuilds
# it, that a malformed version or artwork other than a 1024x1024 PNG fails
# the build, and that the build and the check both take a version file
# with no final newline. It ends `app-check: ok`.
# It opens no window and needs no person.
[tasks.app-check]
description = "Opt-in, never part of ci; macOS on arm64 only: verify the built Leanmacs.app's signature and run its headless mode from a copy in a temporary directory, with no directory argument, an empty environment and / as the working directory (tools/app-check.sh, tests/headless/bundle)"
depends = ["app"]
timeout = "300s"
run = "tools/app-check.sh lean"

# Opt-in: run it by hand, on macOS on arm64, and do not add it to `ci` or to
# hk.pkl: it writes outside the checkout. It installs the app to use: after
# `app-check`, on a
# clean checkout, tools/prepare-finder-session.sh moves any existing
# /Applications/Leanmacs.app and ~/.config/leanmacs aside to timestamped
# backups, installs the built bundle and the config fixture
# tests/headless/finder-session/config in their place, and prints how to
# restore them. It removes nothing and opens, registers or runs nothing.
[tasks.finder-session-prepare]
description = "Opt-in, never part of ci; macOS on arm64 only: build and check Leanmacs.app, install it to /Applications and the Finder-session config fixture to ~/.config/leanmacs, moving any existing ones aside to timestamped backups (tools/prepare-finder-session.sh)"
depends = ["app-check"]
run = "tools/prepare-finder-session.sh lean"

# Opt-in: run it by hand, and do not add it to `ci` or to hk.pkl. It ends in
# an abort, and on macOS every abort makes the system write a crash report
# under ~/Library/Logs/DiagnosticReports, so in the gate it would leave a file
# on the developer's machine on every run. The `overflow` scenario itself and
# its fixture are still built by `lean`, inside the gate.
#
# A stack overflow in interpreted code is not caught: the process must die of
# SIGABRT, which the shell reports as status 134. The interpreter overflows
# only once its thread's stack is full. The entry point gives every thread
# Lean creates a 64 MiB stack (`editor_entry` in lean/ffi/glue.c; the
# `ffi-test` task checks the size), so the overflow takes milliseconds, and
# the scenario runs under that size: LEAN_STACK_SIZE_KB would override it, so
# it is removed from the scenario's environment. The runtime's own message
# has one line per interpreter frame (635 KB when the stack was 16 MiB, and
# more now), so stderr is dropped.
# `ulimit -c 0`: no core file. The sysroot and the directory of
# `InterpretedFixture.olean` are passed in, so the scenario reads nothing
# from the environment.
#
# The status alone is not enough: an abort before the recursion would give it
# too. The scenario prints one marker line once interpreted code has run and
# just before it recurses, so the marker must be the last line of stdout as
# well.
[tasks.ffi-overflow]
description = "Opt-in, never part of ci: check that a stack overflow in interpreted Lean code aborts the process (lean/FfiTest.lean). Each run makes macOS write a crash report under ~/Library/Logs/DiagnosticReports"
depends = ["lean"]
dir = "lean"
timeout = "60s"
run = '''status=0; out=$( (ulimit -c 0; exec env -u LEAN_STACK_SIZE_KB .lake/build/bin/ffi-test overflow "$(lean --print-prefix)" .lake/build/lib/lean 2>/dev/null) ) || status=$?; printf '%s\n' "$out" "ffi-test overflow: exit status $status"; test "$status" -eq 134 && test "$(printf '%s\n' "$out" | tail -n 1)" = "ffi-test overflow: entering the recursion"'''

# Opt-in: run it by hand on a quiet machine, and do not add it to `ci` or to
# hk.pkl. It measures and asserts nothing: its numbers depend on the machine,
# so none of them is a pass or a fail. The gate still builds the subcommands,
# under every linter (`lean`).
#
# Each line is a fresh process under `/usr/bin/time -l`, which prints the
# process's real time and its maximum resident set size (in bytes) on stderr
# after the subcommand's own line on stdout:
#
# - `bench-start` with each import set: how long the base takes to import and
#   the first config to load, and what the process then weighs;
# - `bench-reload`: the median and the maximum of 20 reloads of a one-line
#   chunk, of a 20-line config, and of 50 definitions with a `simp` proof;
# - `bench-soak` with 100 and with 500 reloads: the mean time of a reload,
#   and, from the two resident set sizes, whether replaced configs are freed.
#
# The config is held in memory, so nothing is read but the `.olean` files,
# whose directories are passed in. LEAN_STACK_SIZE_KB is removed from the
# environment, so the threads have the stack the editor gives them.
[tasks.config-bench]
description = "Opt-in, never part of ci: measure start-up, reload time and memory across reloads of the config session (lean/ConfigTest.lean). It asserts nothing"
depends = ["lean"]
dir = "lean"
run = [
  "/usr/bin/time -l env -u LEAN_STACK_SIZE_KB .lake/build/bin/config-test bench-start \"$(lean --print-prefix)\" .lake/build/lib/lean Editor",
  "/usr/bin/time -l env -u LEAN_STACK_SIZE_KB .lake/build/bin/config-test bench-start \"$(lean --print-prefix)\" .lake/build/lib/lean Editor Std",
  "/usr/bin/time -l env -u LEAN_STACK_SIZE_KB .lake/build/bin/config-test bench-start \"$(lean --print-prefix)\" .lake/build/lib/lean Editor Lean",
  "/usr/bin/time -l env -u LEAN_STACK_SIZE_KB .lake/build/bin/config-test bench-reload \"$(lean --print-prefix)\" .lake/build/lib/lean",
  "/usr/bin/time -l env -u LEAN_STACK_SIZE_KB .lake/build/bin/config-test bench-soak \"$(lean --print-prefix)\" .lake/build/lib/lean 100",
  "/usr/bin/time -l env -u LEAN_STACK_SIZE_KB .lake/build/bin/config-test bench-soak \"$(lean --print-prefix)\" .lake/build/lib/lean 500",
]

# Opt-in: run it by hand on a quiet machine, on macOS, and do not add it to
# `ci` or to hk.pkl. It measures and asserts nothing: its numbers depend on
# the machine, so none of them is a pass or a fail. The gate still builds
# `config-test bench-modules`, under every linter (`lean`), and runs it in
# `bundle-test`.
#
# What config may import, measured, for the import sets `Editor` and
# `Editor` with `Lean` (tools/module-bench.sh): the modules each import
# reads and the bytes of each file kind, of whole top-level directories and
# of those modules alone; which file kinds the import needs, found by
# staging the directories with tools/stage-bundle.sh in a temporary
# directory with each kind set in turn and importing from them; and, staged
# with the kinds it needs, the start-up time and resident memory of
# `bench-start`, and of the staged bundle's headless mode for `Editor`. The
# figures are in docs/design/lean-runtime.md, "What config may import,
# measured". It takes a minute or two and needs a few GB of temporary disk.
[tasks.module-bench]
description = "Opt-in, never part of ci; macOS only: measure what each import set config may use needs to ship (file kinds, bytes) and costs at start-up (time, memory), from a staged bundle (tools/module-bench.sh). It asserts nothing"
depends = ["lean"]
run = "tools/module-bench.sh lean"

# Opt-in: run it by hand on a quiet machine, and do not add it to `ci` or to
# hk.pkl. It measures and asserts nothing: its numbers depend on the machine
# and on what else the machine is doing, so none of them is a pass or a fail.
# The gate still builds the subcommand, under every linter (`lean`).
#
# `bench-jobs` measures the latency of the editor loop, from posting
# `run noop` to the editor thread having run it, over 10,000 samples a row:
# with nothing running; with 64 jobs each sleeping a millisecond in a loop;
# with one interpreted job computing on each pool thread; with two for each;
# and with nothing running again. It then times a million `now` requests in
# one compiled job. It says which loaded rows are within bound: a row whose
# median is at most twice the larger of the two idle medians and whose 99th
# percentile is under 100 µs. The maximum is printed and not judged.
#
# Each row is a headless host on the real elaborator, the real queue and the
# library's timer service, with a config held in memory, so nothing is read
# but the `.olean` files, whose directories are passed in. LEAN_NUM_THREADS
# and LEAN_STACK_SIZE_KB are removed from the environment, so the pool has
# Lean's size and the threads the stack the editor gives them.
[tasks.job-bench]
description = "Opt-in, never part of ci: measure the latency of the editor loop while background jobs run (lean/ConfigTest.lean). It asserts nothing"
depends = ["lean"]
dir = "lean"
run = "env -u LEAN_NUM_THREADS -u LEAN_STACK_SIZE_KB .lake/build/bin/config-test bench-jobs \"$(lean --print-prefix)\" .lake/build/lib/lean 10000"

# Opt-in: do not add it to `ci` or to hk.pkl. It opens a window on this
# desktop.
#
# `editor window-check` opens the real window and counts what of the keyboard
# reaches a Lean loop that pulls the editor queue: keys, the text they
# typed, the latency of each from its arrival in Rust to its handling in
# Lean, dead keys and an input method's composition. When the window closes
# the report is eight lines on stdout (lean/Editor/WindowCheck.lean gives
# their form).
#
# `mise run window-check -- --no-ime` runs the window with composition not
# allowed, so a dead key arrives as a key; `-- --seconds <n>` sets how long
# the window stays open if nobody closes it (120 by default).
#
# The gate runs the same loop on the library's scripted platform, which opens
# nothing (`ffi-test`), and on a fake (`lean-test`).
[tasks.window-check]
description = "Opt-in, never part of ci: open a window and report what of the keyboard reaches the Lean loop, with the latency of each key (lean/Editor/WindowCheck.lean). Needs a display"
depends = ["lean"]
dir = "lean"
run = ".lake/build/bin/editor window-check"

# Opt-in: the editor on a file, in a window (lean/Editor/Window/Real.lean).
# Do not add it to `ci` or to hk.pkl: it opens a window and stays until it
# is closed. `mise run edit -- <file>` opens the file, resolved
# against the directory the task was run from (mise hands that directory
# over as MISE_ORIGINAL_CWD), and `mise run edit` with no file opens the
# editor on its one empty buffer; the options go before the file, as
# `mise run edit -- --report --config <dir> <file>`. The task always gives
# the toolchain `lean/lean-toolchain` pins (`--sysroot`), so config is
# loaded at start: from `--config`, or from `leanmacs` under
# `$XDG_CONFIG_HOME` (or `$HOME/.config`) when that directory exists, and
# again on `:reload`. It runs in lean/, so mise picks that toolchain, and
# hands the editor the build tree's `.olean` files.
[tasks.edit]
description = "Opt-in, never part of ci: open a file, or an empty buffer, in the editor's window (lean/Editor/Window/Real.lean); `mise run edit -- [options] [<file>]`. Needs a display"
depends = ["lean"]
dir = "lean"
run = 'lean_dir=$PWD && sysroot=$(lean --print-prefix) && cd "$MISE_ORIGINAL_CWD" && "$lean_dir/.lake/build/bin/editor" --sysroot "$sysroot" --oleans "$lean_dir/.lake/build/lib/lean"'

# Opt-in: milestone 1's figures with no window, for the phase body
# (docs/dev-practices/on-demand-checks.md, "Milestone 1, measured"). Run it
# on a quiet machine, and do not add it to `ci` or to hk.pkl: it takes about
# a minute, half of it an idle period, and asserts nothing. It runs five
# scripts of `editor headless --render` under `/usr/bin/time` in a
# temporary directory (tools/milestone-bench.sh): start, open a generated
# 10 MiB file, scroll it, type, and idle. Every figure it prints is labelled
# "headless: cell shaper, CPU renderer, no glyphs", with the machine.
[tasks.milestone-bench]
description = "Opt-in, never part of ci: measure milestone 1 headless (start, a 10 MiB file, scrolling, typing, idle) under /usr/bin/time (tools/milestone-bench.sh)"
depends = ["lean"]
run = "tools/milestone-bench.sh lean"

# Opt-in: do not add it to `ci` or to hk.pkl. It opens two windows on this
# desktop, one after the other, so it needs a display.
#
# First it runs the winit adapter's example (`crates/editor-platform-winit/
# examples/contract/main.rs`): the real window held to the window port's
# contract (`editor_platform::contract`). The window opens, is asked to
# close from another thread, and the run must return. On macOS it is also
# asked to quit as the system asks (`terminate:` and the quit Apple Event,
# examples/contract/terminate.rs), and must report each ask once, keep
# handling requests while AppKit waits, and keep running when it is told
# to; then, in a second process and a second window
# (examples/contract/pending.rs), a close with a terminate pending must let
# AppKit end the process, with status 0, only after the verdict. It needs
# no key or pointer input. It prints its verdict, then each resize the
# window reported on a line of its own, and its exit status is the result.
#
# Then it runs `editor-ffi`'s example (`crates/editor-ffi/examples/
# window.rs`): the window that draws. The wgpu renderer draws a fixture
# frame in the real window, on this machine's GPU; the example checks that
# each frame is laid out at the scale the window said, that a frame was
# presented, that its picture is the frame's, that nothing is drawn that
# nothing asked for, that input arrives on the queue, and that the window,
# whenever it is left alone for a second, shows what was laid out for the
# size and scale it last said. Each input is printed, and the run fails if
# no key or pointer input arrives. It stays 20 seconds or until it is
# closed (`-- --seconds <n>` does not reach it: run the example with
# `cargo run` for another time). Its exit status is the result.
#
# It is run here without `--require-picture`. A picture that could not be
# read back fails it, but a surface that says it does not let its texture
# be copied from does not: the example says so for each frame, and the
# picture was then not checked on this machine.
#
# The gate builds both examples and runs neither, though it does run the
# second's unit tests, which open no window; `linux-window` runs both
# under Xvfb, with no desktop, gives the second its input with xdotool,
# and requires its picture.
[tasks.window-contract]
description = "Opt-in, never part of ci: hold the winit window to the window port's contract, then draw a fixture frame in a window and check the picture, that nothing is drawn while idle, and that input arrives. Opens two windows on this desktop (three on macOS); the last fails without a key or pointer input"
run = [
  "cargo run --locked --package editor-platform-winit --example contract",
  "cargo run --locked --package editor-ffi --example window",
]

# Opt-in: do not add it to `ci` or to hk.pkl. It opens the window that
# draws (`crates/editor-ffi/examples/window.rs`) with `--until-closed
# --no-picture` and leaves it open until it is closed, for trying the
# window out (`docs/dev-practices/on-demand-checks.md`, "The window to
# try, on demand").
[tasks.window-by-hand]
description = "Opt-in, never part of ci: open the window that draws and leave it open until it is closed, to try it out. Reads no picture back. Needs a display"
run = "cargo run --locked --package editor-ffi --example window -- --until-closed --no-picture"

# Opt-in: run it by hand, and do not add it to `ci` or to hk.pkl. What it
# finds depends on the fonts this machine has, so it is no part of a gate
# that must give the same answer everywhere.
#
# It runs the Parley adapter's example (`crates/editor-shape-parley/
# examples/system.rs`): the real shaper over the system's fonts
# (`FontSet::system`), held to the shaper port's contract
# (`editor_layout::shaper::contract`). It prints the family the default
# font is shaped in and how many families the machine has, then the
# properties that fail, by name, or that all hold; its exit status is the
# result. The gate builds the example and never runs it: every test of the
# adapter runs on the fixture fonts under `tests/fonts`, and the crate's
# `clippy.toml` forbids the system's fonts to them.
#
# Run it when the pin of Parley or fontique moves, and when
# `FontSet::system` changes.
[tasks.shaper-system]
description = "Opt-in, never part of ci: hold the Parley shaper over this machine's fonts to the shaper port's contract. Its result depends on the fonts installed"
run = "cargo run --locked --package editor-shape-parley --example system"

# Opt-in: run it by hand, and do not add it to `ci` or to hk.pkl. It writes
# a file of the repository, which no gate may do.
#
# It runs the renderer's example (`crates/editor-render-wgpu/examples/
# reference.rs`): the fixture frame of real text, drawn by the headless
# adapter at scale 1 with subpixel antialiasing, written to
# `tests/render/frame.png`. That file is the reference image the gate's
# test compares the same frame with (`crates/editor-render-wgpu/tests/
# reference.rs`). The gate builds the example and never runs it.
#
# Run it when the picture is meant to change: the fixture frame, the
# painter, the blend, or the pin of Parley or of swash. Then look at the
# file before committing it: a reference nobody looked at pins whatever
# was drawn. `tests/render/README.md` says what it should show.
[tasks.render-reference]
description = "Opt-in, never part of ci: draw the renderer's fixture frame with the headless adapter and write it to tests/render/frame.png, the reference image. Look at the file before committing it"
run = "cargo run --locked --package editor-render-wgpu --example reference -- tests/render/frame.png"

# Opt-in: run it by hand, and do not add it to `ci` or to hk.pkl. It
# writes files of the repository, which no gate may do.
#
# It draws the shipped themes' pictures of the fixture file
# `tests/render/themes/source.lean`, as `ffi-test theme-pictures` in the
# `ffi-test` task does, and writes them to
# `tests/render/themes/solarized-dark.png`, `solarized-light.png` and
# `fairy-floss.png`. Run it when a shipped theme's definition, the fixture, the font, the
# painter, the blend or the rasteriser's pins change. Then look at the
# files enlarged before committing them, and update the table in
# `tests/render/themes/README.md`.
[tasks.theme-references]
description = "Opt-in, never part of ci: draw the shipped themes' pictures (Solarized dark and light, Fairy Floss) of the fixture file and write them to tests/render/themes, their reference images. Look at the files before committing them"
depends = ["lean"]
dir = "lean"
run = ".lake/build/bin/ffi-test theme-pictures ../tests/render/themes ../tests/fonts/NotoSansMono-Regular.subset.ttf --write"

# Opt-in: run it by hand, on macOS, and do not add it to `ci` or to hk.pkl.
# It needs the system's `swift`, and it writes a file of the repository,
# which no gate may do.
#
# It runs `tools/coretext/capture.swift`: Core Text draws the sentence "the
# window draws this" from the fixture font at 14 pt on a bitmap of scale 2,
# black on white, with font smoothing on, and the drawing is written to
# `tests/coretext/sentence.png`. That file is the macOS weight's target: the
# renderer's test draws the same sentence through its CPU path and holds its
# weight to the file's (`crates/editor-render-wgpu/src/weight_tests.rs`).
#
# Run it on a new major version of macOS, or when the fixture font changes.
# Then look at the file, enlarged, before committing it, and record the
# capture in `tests/coretext/README.md`.
[tasks.coretext-reference]
description = "Opt-in, never part of ci; macOS only: draw the weight sentence with Core Text from the fixture font and write it to tests/coretext/sentence.png, the macOS weight's target. Look at the file before committing it"
run = "swift tools/coretext/capture.swift tests/fonts/NotoSansMono-Regular.subset.ttf tests/coretext/sentence.png"

# Opt-in: run it by hand, and do not add it to `ci` or to hk.pkl. What it
# finds depends on this machine's GPU and its driver, so it is no part of
# a gate that must give the same answer everywhere, and a machine with no
# GPU has nothing to run it on. It opens no window.
#
# It runs the renderer's example (`crates/editor-render-wgpu/examples/
# gpu.rs`): the wgpu adapter on this machine's adapter, held to the
# renderer port's contract; then the fixture frame drawn on the GPU, read
# back, and compared with the reference image (within 3 of 255 a channel);
# then how long a first frame, an edited frame and a cursor-only frame
# took, which nothing is asserted of. Its exit status is whether the
# contract and the comparison held.
#
# The gate runs the wgpu adapter on wgpu's no-op back end only, which
# checks its calls and draws nothing. This is where its picture is
# checked. Run it after a change to the shader, the device, the painter or
# `blend`, and when the pin of wgpu moves; `linux-render` runs the same in
# the container, on Mesa's software Vulkan.
[tasks.render-gpu]
description = "Opt-in, never part of ci: hold the wgpu renderer on this machine's GPU to the renderer port's contract, and compare the frame it draws with the reference image. Opens no window; needs a GPU"
run = "cargo run --locked --package editor-render-wgpu --example gpu"

# Opt-in: run it by hand, and do not add it to `ci` or to hk.pkl. It needs
# Docker and, the first time, the network.
#
# The script builds the image `tools/linux/Dockerfile` describes (Debian with
# the system compiler, mise and elan), copies the checkout into a work
# directory, and runs `mise run ci` there: the tracked files and the
# untracked files git does not ignore, so uncommitted work is tested and this
# machine's own build output is not touched. Its exit status is the gate's.
#
# The toolchains and the copy live in `.linux-ci/` at the root of the checkout
# (set EDITOR_LINUX_CACHE to put them elsewhere); Cargo's home and `target/`
# live on the Docker volume `editor-linux-ci-cargo`. The script's header says
# why they differ.
#
# `mise run linux-ci -- --clean` empties the copy's build output first and
# keeps the toolchains and Cargo's registry: a clean build with no download.
[tasks.linux-ci]
description = "Opt-in, never part of ci: run the gate on Linux, in a container (tools/linux/run.sh). Needs Docker"
run = "tools/linux/run.sh ci"

# Opt-in: run it by hand, and do not add it to `ci` or to hk.pkl. It needs
# Docker, like `linux-ci`, whose image, cache and volume it shares.
#
# This is where the winit adapter is held to the window port's contract
# without a desktop, the window draws, and the arboard adapter is held to
# the clipboard port's: run it after a change to
# `crates/editor-platform-winit`, to `crates/editor-platform-arboard`, to a
# contract in `crates/editor-platform`, to the surface code of
# `crates/editor-render-wgpu`, or to `crates/editor-ffi`'s `render`. In the
# container, under Xvfb, it runs the window adapter's example; then
# `editor window-check` with xdotool giving the window the focus and typing
# into it, then the same with `--no-ime`; then the window that draws
# (`editor-ffi`'s example `window`) on Mesa's software Vulkan driver, with
# `--require-picture`, so that a frame whose picture was not read back and
# compared fails it, and with xdotool giving it a key, a named key, a key
# with modifiers, a press, a drag, a release, a turn of the wheel and a
# resize, once at the display's scale of 1, ending with a change of the
# display's scale to 2 under the open window, and once with winit told a
# scale of 2, which is what shows the window's scale reaching layout; then
# the clipboard
# adapter's example on that display's clipboard, and a text written to it
# by one process and read by another; then the editor on a copy of
# `tests/window/session.txt`, `editor --report <copy>`, with xdotool typing
# `ihello <Escape>:w<Return>:q<Return>`: it must exit 0, the copy must equal
# `tests/window/session-expected`, and its report must count a frame. It
# fails if any of the seven fails.
# The input is synthetic: this is not the check a person makes at the
# keyboard (`window-check`). The clipboard is the container's own.
#
# It is the confirmation of what the gate cannot hold: a change that
# touches a window, a surface or the clipboard is not done until this exits
# 0, every part (docs/dev-practices/on-demand-checks.md).
[tasks.linux-window]
description = "Opt-in, never part of ci: in the Linux container, under Xvfb, hold the winit window to the window port's contract, run the keyboard check on keys typed by xdotool, draw a fixture frame in the window and give it input, and hold that display's clipboard to the clipboard port's contract (tools/linux/run.sh). Needs Docker"
run = "tools/linux/run.sh window"

# Opt-in: run it by hand, and do not add it to `ci` or to hk.pkl. It reads
# and WRITES THE CLIPBOARD OF THIS DESKTOP.
#
# It runs the arboard adapter's example (`crates/editor-platform-arboard/
# examples/clipboard.rs`) with `contract`: the system clipboard held to the
# clipboard port's contract (`editor_platform::clipboard::contract`). It
# keeps the text it finds on the clipboard, writes texts of its own, and
# puts the text it found back. Only text is put back: an image or a file
# that was on the clipboard is lost, and a clipboard that held no text is
# left holding the contract's last text. Copy something disposable first.
# It prints each property with whether it holds; its exit status is the
# result. The gate builds the example and never runs it; `linux-window`
# runs the same in the container, on a clipboard that is nobody's.
[tasks.clipboard-contract]
description = "Opt-in, never part of ci: hold the system clipboard to the clipboard port's contract. WRITES THIS DESKTOP'S CLIPBOARD, and puts back only the text it found there"
run = "cargo run --locked --package editor-platform-arboard --example clipboard -- contract"

# Opt-in: run it by hand, and do not add it to `ci` or to hk.pkl. It needs
# Docker, like `linux-ci`, whose image, cache and volume it shares.
#
# This is where the wgpu renderer draws on Linux without a GPU: in the
# container it runs the renderer's example (`render-gpu`'s) on Mesa's
# software Vulkan driver, llvmpipe, which the image installs for this task
# alone. The gate in that image asks for no adapter and is not changed by
# the driver being there.
[tasks.linux-render]
description = "Opt-in, never part of ci: in the Linux container, on Mesa's software Vulkan, hold the wgpu renderer to the renderer port's contract and compare the frame it draws with the reference image (tools/linux/run.sh). Needs Docker"
run = "tools/linux/run.sh render"

[tasks.ci]
description = "The whole gate; `hk check` runs this, and it gates review and landing (rdm's dispatch.verify)"
depends = ["fmt", "lint", "deny", "doc", "test", "lean-test", "lean", "lean-fmt", "ffi-test", "bundle-test", "c-fmt"]
