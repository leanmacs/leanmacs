#
# It runs the Parley adapter's example (`crates/editor-shape-parley/
# examples/system.rs`): the real shaper over the system's fonts
# (`FontSet::system`), held to the shaper port's contract
# (`editor_layout::shaper::contract`). It prints the family the default
# font is shaped in and how many families the machine has, then the
# properties that fail, by name, or that all hold; its exit status is the
# result. The gate builds the example and never runs it: every test of the
