run = "cargo run --release --locked -p editor-syntax-treesitter --example round -- \"$(find lean tests -name '*.lean' -not -path '*/.lake/*' | xargs ls -S | head -1)\" lean"

# Opt-in: run it by hand, and do not add it to `ci` or to hk.pkl. It writes
