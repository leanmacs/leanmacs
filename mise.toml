# `clippy.toml` forbids the system's fonts to them.
#
# Run it when the pin of Parley or fontique moves, and when
# `FontSet::system` changes.
[tasks.shaper-system]
description = "Opt-in, never part of ci: hold the Parley shaper over this machine's fonts to the shaper port's contract. Its result depends on the fonts installed"
run = "cargo run --locked --package editor-shape-parley --example system"

# Opt-in: run it by hand, and do not add it to `ci` or to hk.pkl. It times
