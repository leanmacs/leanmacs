# The CI profile of mise.toml, read only where `MISE_ENV=ci` is set: the
# `ci` job of .github/workflows/ci.yml sets it, and nothing else does
# (tools/linux/run.sh never sets it, and Linux ignores the one value here).
#
# The gate runs what it builds (the `cargo test` binaries, `ffi-test`, the
# headless runs, `bundle-test`), and dyld refuses to start a Mach-O whose
# `minos` is newer than the running macOS. mise.toml's
# MACOSX_DEPLOYMENT_TARGET (27.2) would make every binary the `macos-26`
# runner builds unstartable there, and a value exported in the job's env
# does not help, because mise's [env] overrides the process environment. So
# the CI profile lowers it to the runner's macOS.
#
# The shipped minimum is unchanged: it stays in mise.toml's [env] and in
# `appMinimumSystemVersion` (lean/lakefile.lean), and `mise run app-check`,
# outside the gate, still checks it. Which host builds the shipped app is an
# open point for the release builds (docs/dev-practices/ci.md).
[env]
MACOSX_DEPLOYMENT_TARGET = "26.0"
