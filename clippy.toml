# What no line of the workspace may name outside a site that says why:
#
# - a raw timed wait, or a readout a test waits on (AGENTS.md,
#   "Deterministic concurrency in tests"). Every time bound of a Rust test
#   is a typed value that says which kind it is, `editor_wait::HangGuard`
#   (a guard against a hang, or one run out on purpose) or
#   `editor_wait::RealTime` (real time under test), and the waits that take
#   one are `editor-wait`'s: `editor_wait::recv` for a channel,
#   `editor_wait::wait_while` for a Condvar, `HangGuard::start` and
#   `deadline` for a deadline, `RealTime::sleep` for a sleep and
#   `editor_wait::Stopwatch` for real time measured. So std's timed
#   primitives, and the polls (`is_finished`, `try_wait`, `yield_now`), are
#   banned here, and each readout a test waits on is banned outside the
#   places that are its to call;
# - the outside world, which a core crate reaches only through the ports it
#   defines, its tests on the ports' published fakes (AGENTS.md, "Ports and
#   adapters" and "Hermetic tests"): the free functions of `std::fs` and its
#   types, the methods of `Path` that ask the disk, the machine's
#   directories, environment and command line, starting or ending a
#   process, the wall clock, each adapter's real constructor, and the
#   third-party entry points that reach the machine's fonts or clipboard.
#
# This is the workspace's one `clippy.toml`, and no crate has one of its
# own (.agents/rules/structure.md, "Clippy's bans"). Clippy reads the first
# `clippy.toml` it finds from a package's manifest directory upwards, so
# every crate reads this file, and so does the fixture `tests/wait-lints`.
# Clippy has no list per crate: every ban holds in every crate, adapters
# and examples included, and a site that is right to make the call opts
# out where it makes it. The lint levels are the root `Cargo.toml`'s
# `[workspace.lints.clippy]`, which every member's manifest takes
# (`[lints] workspace = true`): `disallowed_methods` and `disallowed_types`
# are denied, and so are `allow_attributes` and
# `allow_attributes_without_reason`, so an opt-out is an `#[expect]` with a
# reason, and a bare `#[allow]` or a mark without a reason fails the lint.
# Clippy takes the path the compiler resolved, not the text: `use std::fs
# as f; f::read(..)` is caught too.
#
# How a site opts out: `#[expect(clippy::disallowed_methods, reason =
# "...")]` (or `disallowed_types`), whose reason says why the real thing is
# right there. `expect`, not `allow`, so a mark that no longer covers a
# banned call fails the lint, and so does a path below that resolves to
# nothing. Its scope:
#
# - An opt-out from `disallowed_methods` sits at its site: on the
#   statement or `let` that makes the banned call, or on the `fn` or `impl`
#   block whose call it is; never on a module or a crate, a test module and
#   a test file included: the wait bans are the same lint, and a module's or
#   crate's mark would silence them there. A test module that waits on its
#   readout again and again calls it through one helper `fn` of its own,
#   whose statement carries the mark; that helper is the site.
# - An item's mark never covers a wait. A banned wait inside an `fn` or an
#   `impl` that carries a `disallowed_methods` mark for the outside world has
#   a statement-level `#[expect]` of its own, whose reason is the wait's.
# - An opt-out from `disallowed_types`, which bans no wait, may sit on a
#   crate only in a crate whose job is the real file system (the `-std`
#   adapters, `editor-watch-notify`, `editor-grep-ripgrep`).
#
# Where the marks are:
#
# - the waits: `editor-wait`'s wrappers, the one place a test's bound meets
#   the clock; production code on the real clock (the timer threads of
#   `editor-ffi`, the watch service and the syntax worker, the render loop's
#   park, the job clock and the window's input clock, `editor-launch-std`'s
#   clock, its exit poll where no exit event can be had, and its probe's
#   `--sleep`; and the echo service's reap of its ended workers, which never
#   waits); the test hooks that tell a join will wait (`Worker`, the watch
#   service), which ask `is_finished` only to say so; each readout's own
#   tests, at the helper each module calls it through or at each call
#   (`queue`, `service`, `scripted`, the process service's `streaming`,
#   `handled` and the winit adapter's, `render_loop`, `session`, grep's
#   `service/tests.rs`, `editor-ffi`'s `events`, `live` and `syntax`, and
#   `editor-package`'s `stream::fake`), and a readout that forwards to
#   another (`probe::await_requests_handled`, `Syntaxes::settle` and
#   `settle_exact`); the adapters' contract checks (the window contract's
#   measurements, the process contract's streaming properties, the winit
#   contract example's and settings check's reads after
#   `await_requests_handled`, the process adapter's ground, which reads
#   a file until a line is whole, and the package wrapper's stream
#   contract grounds over `ScriptedSource`, its own and
#   `editor-package`'s `runtime/tests.rs`'s; its ground over the real
#   runtime, `editor-package-check`'s `tests/load.rs`, waits at a gate of
#   its own, `Observed`, through `editor_wait::wait_while`, which no ban
#   names: row W94); the Rust checks of the C functions Lean
#   calls to wait, each at a mark whose reason names its row of
#   `docs/dev-practices/inferred-waits.md` (W71 and W80 to W84: `c_api.rs`,
#   `snapshot.rs`, `window.rs`, `common/open.rs`, `syntax.rs`), with its
#   `bound_ms` made by `HangGuard::as_millis`; and the tests outside a
#   readout's module that wait on it for their subject (the syntax
#   session's own integration tests, `editor-ffi`'s highlight, syntax and
#   headless render tests, its window example, the window session's test
#   of a run left going, and the echo package's tests on the fake
#   completer);
# - the outside world: the real adapters, whose job it is (`editor-fs-std`,
#   `editor-process-std`, `editor-watch-notify`, `editor-grep-ripgrep`,
#   `editor-launch-std`, `editor-release-std`, the fuzzy adapters, the
#   system font set, the clipboard, the GPU and the machine's defaults),
#   and their contract checks on real files and processes in a temporary
#   directory each test owns; the one place `editor-ffi` makes each real
#   adapter for the process (its file, process, watch, grep, fuzzy,
#   clipboard, font and window services) and its wiring test on real files;
#   and each binary's and example's entry, which reads its own command line
#   and exits with its outcome.
#
# `tests/wait-lints/` shows each wait ban bites: it calls each banned wait
# that a crate other than its owner can call, each call under an
# `#[expect]` of its own, so clippy over it passes only while every one of
# them is refused (its `Cargo.toml` says how `mise run lint` runs it). The
# readouts no crate but their owner can call (`Handled::wait_all`,
# `Live::await_at_most`, `Feeds::join`) are not in it; an `#[expect]` at
# each of their sites fails the lint if their entry goes. An
# `allow-invalid` ban, which clippy does not refuse when its path resolves
# to nothing, bites only while an `#[expect]` covers a call of it: each one
# has a site in the workspace, but for the entry points no crate calls
# (`parley::FontContext::new`, `fontique::Collection::load_system_fonts`
# and `load_fonts_from_paths`), which `tests/wait-lints/` calls in
# `unreached`, each under an `#[expect]` of its own. Seen to bite on
# 2026-11-25: with `load_system_fonts` misspelled here, clippy over the
# fixture fails with "this lint expectation is unfulfilled" at its call.
#
# Seen to bite once by hand, on 2026-11-23: with the `#[expect]` on the job
# clock's read in `crates/editor-ffi/src/timers.rs` (`Monotonic::now_ms`)
# taken out, `mise run lint` fails with "use of a disallowed method
# `std::time::Instant::now`" at that line. With the mark put back it passes.
# And for the C functions Lean calls to wait, on the same day: with their
# entries in the block and no `#[expect]` yet at the C API checks, clippy
# failed at each of the twelve calls there, with "use of a disallowed
# method `editor_ffi::live::editor_ffi_live_await`" and the like.
#
# What this does not hold: it is a list of names, so a function `std` gains
# later is not in it, and neither are `std::net`, the free functions of
# `std::os::unix::fs`, `include_bytes!`, or a call through `libc`. Those
# are a reviewer's to look for. `deny.toml` closes the other route: which
# crate may depend on which adapter or library.

disallowed-methods = [
