# The types of `std::fs`, which `disallowed-methods` cannot reach through
# their methods (`File::open`, `OpenOptions::new`). A crate whose job is the
# real file system marks itself once, at its root.
disallowed-types = [
  { path = "std::fs::File", reason = "files are reached through the files port; the real file system is an adapter's, which says so at an `#[expect]`" },
  { path = "std::fs::OpenOptions", reason = "files are reached through the files port; the real file system is an adapter's, which says so at an `#[expect]`" },
  { path = "std::fs::DirBuilder", reason = "files are reached through the files port; the real file system is an adapter's, which says so at an `#[expect]`" },
  { path = "std::fs::ReadDir", reason = "files are reached through the files port; the real file system is an adapter's, which says so at an `#[expect]`" },
  { path = "std::fs::DirEntry", reason = "files are reached through the files port; the real file system is an adapter's, which says so at an `#[expect]`" },
]
