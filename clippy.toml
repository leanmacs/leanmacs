# What no line of the workspace may name outside its named sites: a raw
# timed wait, or a readout a test waits on (AGENTS.md, "Deterministic
# concurrency in tests"). Every time bound of a Rust test is a typed value
# that says which kind it is, `editor_wait::HangGuard` (a guard against a
# hang, or one run out on purpose) or `editor_wait::RealTime` (real time
# under test), and the waits that take one are `editor-wait`'s:
# `editor_wait::recv` for a channel, `editor_wait::wait_while` for a
# Condvar, `HangGuard::start` and `deadline` for a deadline,
# `RealTime::sleep` for a sleep and `editor_wait::Stopwatch` for real time
# measured. So std's timed primitives, and the polls (`is_finished`,
# `try_wait`, `yield_now`), are banned here, and each readout a test waits
# on is banned outside the places that are its to call.
#
# Clippy reads the first `clippy.toml` it finds from a package's manifest
# directory upwards. This file governs every crate that has none of its own
# (`editor-service`, `editor-platform`, `editor-platform-winit`,
# `editor-syntax`, `editor-wait`, the adapters, `echo-service`, ...); a
# crate with its own does not read it, so each of `crates/*/clippy.toml`
# holds a copy of this file's block, the lines from `# BEGIN wait-bans` to
# `# END wait-bans`, byte for byte. This file owns it: edit the block here
# and write the copies with `sh tools/wait-bans.sh write clippy.toml
# crates/*/clippy.toml`; `mise run lint` fails while a copy differs
# (`tools/wait-bans.sh check`). A crate's copy is the first thing of its
# list. Where a crate bans a path of the block for its own reason
# (`Instant::now` or `thread::sleep`), its entry comes after the copy, and
# clippy takes the last entry for a path, so the reason it prints is the
# crate's (seen on clippy 1.98). `disallowed_methods` is on by default at
# `warn`, and `mise run lint` denies warnings.
#
# Where the `#[expect(clippy::disallowed_methods, reason = "...")]` marks
# are (`expect`, not `allow`, so a mark that no longer covers a banned call
# fails the gate, and so does a readout's path that resolves to nothing):
# - `editor-wait`'s wrappers, the one place a test's bound meets the clock;
# - production code on the real clock: the timer threads of `editor-ffi`,
#   the watch service and the syntax worker, the render loop's park, the
#   job clock and the window's input clock, `editor-launch-std`'s clock,
#   its exit poll where no exit event can be had, and its probe's
#   `--sleep`; and the echo service's reap of its ended workers, which
#   never waits;
# - the test hooks that tell a join will wait (`Worker`, the watch
#   service), which ask `is_finished` only to say so;
# - each readout's own tests, the subject (`queue`, `service`, `scripted`,
#   the process service's `streaming`, `handled` and the winit adapter's,
#   `render_loop`, `session`, grep's `service/tests.rs`, and
#   `editor-ffi`'s `events`, `live` and `syntax`), and a readout that
#   forwards to another (`probe::await_requests_handled`,
#   `Syntaxes::settle` and `settle_exact`);
# - the adapters' contract checks: the window contract's measurements, the
#   process contract's streaming properties, the winit contract example's
#   and settings check's reads after `await_requests_handled`, and the
#   process adapter's ground, which reads a file until a line is whole;
# - the C functions Lean calls, which make the guard from `bound_ms`
#   (`editor_ffi_events_await_waiting`, `_events_script_join`,
#   `_live_await`, `_processes_await_held`, `_render_await_rest` through
#   `await_rest`, `_window_await_parked`, `_syntax_settle`). Each is
#   banned in its turn, since in Rust its number would stand for a guard:
#   it is called only by its own module's tests (`events`, `live`) and by
#   the Rust checks of the C API, each at an `#[expect]` whose reason
#   names its row of `docs/dev-practices/inferred-waits.md` (W71 and W80
#   to W84: `c_api.rs`, `snapshot.rs`, `window.rs`, `common/open.rs`,
#   `syntax.rs`), with its `bound_ms` made by `HangGuard::as_millis`;
# - the tests outside a readout's module that wait on it for their
#   subject: the syntax session's own integration tests, `editor-ffi`'s
#   highlight, syntax and headless render tests, its window example, the
#   window session's test of a run left going, and the echo package's
#   tests on the fake completer.
#
# `tests/wait-lints/` shows the bans bite under this file and under each
# crate's: it calls every path of the block once, and `mise run lint`
# requires clippy to refuse there, under every config, each path the block
# bans, read from this file (`tools/wait-bans.sh paths`; mise.toml,
# `[tasks.lint]`). So a path added to the block that the fixture does not
# call fails the gate. The readouts no crate but their owner can call are
# not in the block, since the fixture cannot call them and only the
# owner's config needs them: `Handled::wait_all` (`pub(crate)`) below the
# block here, for `editor-platform-winit`, and `Live::await_at_most` and
# `Feeds::join` in `crates/editor-ffi/clippy.toml`. An `#[expect]` at each
# of their sites fails the lint if their entry goes.
#
# Seen to bite once by hand, on 2026-11-23: with the `#[expect]` on the job
# clock's read in `crates/editor-ffi/src/timers.rs` (`Monotonic::now_ms`)
# taken out, `mise run lint` fails with "use of a disallowed method
# `std::time::Instant::now`" at that line. With the mark put back it passes.
# And for the C functions Lean calls to wait, on the same day: with their
# entries in the block and no `#[expect]` yet at the C API checks, clippy
# failed at each of the twelve calls there, with "use of a disallowed
# method `editor_ffi::live::editor_ffi_live_await`" and the like.

disallowed-methods = [
  # BEGIN wait-bans: the root `clippy.toml` owns this block and says why;
  # each `crates/*/clippy.toml` holds a copy that `tools/wait-bans.sh`
  # writes from it. Edit it in the root only.
  #
  # The timed waits: a test's bound is an `editor_wait::HangGuard` or
  # `editor_wait::RealTime`, and its wait goes through `editor-wait`.
  { path = "std::thread::sleep", reason = "a test's sleep is `editor_wait::RealTime::sleep`, which names the timing under test; real-clock code says why at an `#[expect]`" },
  { path = "std::thread::sleep_ms", reason = "a test's sleep is `editor_wait::RealTime::sleep`, which names the timing under test" },
  { path = "std::thread::park_timeout", reason = "wait on the event itself, bounded by an `editor_wait::HangGuard`, not on a timed park" },
  { path = "std::thread::park_timeout_ms", reason = "wait on the event itself, bounded by an `editor_wait::HangGuard`, not on a timed park" },
  { path = "std::thread::yield_now", reason = "a yield hopes for a schedule: wait on the event itself (`editor_wait`)" },
  { path = "std::sync::mpsc::Receiver::recv_timeout", reason = "a bounded receive is `editor_wait::recv`, whose bound is an `editor_wait::HangGuard` naming the event" },
  { path = "std::sync::Condvar::wait_timeout", reason = "a bounded Condvar wait is `editor_wait::wait_while`, whose bound is an `editor_wait::HangGuard` naming the event" },
  { path = "std::sync::Condvar::wait_timeout_ms", reason = "a bounded Condvar wait is `editor_wait::wait_while`, whose bound is an `editor_wait::HangGuard` naming the event" },
  { path = "std::sync::Condvar::wait_timeout_while", reason = "a bounded Condvar wait is `editor_wait::wait_while`, whose bound is an `editor_wait::HangGuard` naming the event" },
  { path = "std::thread::JoinHandle::is_finished", reason = "asking whether a thread has ended is a poll: join it, or wait on a channel it drops with `editor_wait::recv`" },
  { path = "std::process::Child::try_wait", reason = "asking whether a child has exited is a poll: wait on its exit, bounded by an `editor_wait::HangGuard`" },
  { path = "std::time::Instant::now", reason = "a deadline is `editor_wait::HangGuard::start` or `deadline`, and a timing measured is an `editor_wait::Stopwatch`; real-clock code says why at an `#[expect]`" },
  # The readouts a test waits on, each a `HangGuard` wait of its owner's
  # that a crate other than its owner can call. `allow-invalid`: a crate
  # that does not reach the owner cannot resolve the path; a wrong one
  # leaves an `#[expect]` at its sites unfulfilled, and the fixture's call
  # unrefused.
  { path = "editor_service::queue::Queue::await_waiting", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_service::service::RecordingCompleter::wait_for", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_platform::scripted::ScriptedPlatform::wait_parked", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_process::service::Service::wait_held", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_platform_winit::probe::await_requests_handled", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_render::render_loop::RenderHandle::wait_resting", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_syntax::session::Session::wait_for", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_syntax::session::Session::wait_exact", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_grep::service::Service::until_held_back", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_ffi::syntax::Syntaxes::settle", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  { path = "editor_ffi::syntax::Syntaxes::settle_exact", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
  # The C functions Lean calls to wait, each a readout's or a join's with
  # its guard made from a `bound_ms`: in Rust a number would stand for the
  # guard, so only a check that names its inventory row calls one.
  { path = "editor_ffi::events::editor_ffi_events_await_waiting", allow-invalid = true, reason = "a C function Lean calls to wait, bounded by `bound_ms`: a Rust check calls it only at an `#[expect]` that names its row of `docs/dev-practices/inferred-waits.md`, with the number made by `editor_wait::HangGuard::as_millis`" },
  { path = "editor_ffi::events::editor_ffi_events_script_join", allow-invalid = true, reason = "a C function Lean calls to wait, bounded by `bound_ms`: a Rust check calls it only at an `#[expect]` that names its row of `docs/dev-practices/inferred-waits.md`, with the number made by `editor_wait::HangGuard::as_millis`" },
  { path = "editor_ffi::live::editor_ffi_live_await", allow-invalid = true, reason = "a C function Lean calls to wait, bounded by `bound_ms`: a Rust check calls it only at an `#[expect]` that names its row of `docs/dev-practices/inferred-waits.md`, with the number made by `editor_wait::HangGuard::as_millis`" },
  { path = "editor_ffi::processes::editor_ffi_processes_await_held", allow-invalid = true, reason = "a C function Lean calls to wait, bounded by `bound_ms`: a Rust check calls it only at an `#[expect]` that names its row of `docs/dev-practices/inferred-waits.md`, with the number made by `editor_wait::HangGuard::as_millis`" },
  { path = "editor_ffi::window::editor_ffi_window_await_parked", allow-invalid = true, reason = "a C function Lean calls to wait, bounded by `bound_ms`: a Rust check calls it only at an `#[expect]` that names its row of `docs/dev-practices/inferred-waits.md`, with the number made by `editor_wait::HangGuard::as_millis`" },
  { path = "editor_ffi::syntax::editor_ffi_syntax_settle", allow-invalid = true, reason = "a C function Lean calls to wait, bounded by `bound_ms`: a Rust check calls it only at an `#[expect]` that names its row of `docs/dev-practices/inferred-waits.md`, with the number made by `editor_wait::HangGuard::as_millis`" },
  { path = "editor_ffi::render::editor_ffi_render_await_rest", allow-invalid = true, reason = "a C function Lean calls to wait, bounded by `bound_ms`: a Rust check calls it only at an `#[expect]` that names its row of `docs/dev-practices/inferred-waits.md`, with the number made by `editor_wait::HangGuard::as_millis`" },
  # END wait-bans
  # The readout only its own crate can call: `editor-platform-winit`, which
  # has no `clippy.toml` of its own, reads this one.
  { path = "editor_platform_winit::handled::Handled::wait_all", allow-invalid = true, reason = "a readout for tests: only its own tests, a contract check and the C function Lean calls call it, each at an `#[expect]`" },
]
