# A fixture of tools/workflow-lint-probe.sh, never run by GitHub (it is not
# under .github/workflows/): a workflow whose one action is pinned by a tag,
# which zizmor, with .github/zizmor.yml, must reject as `unpinned-uses`.
name: tag-pinned
on: push
permissions:
  contents: read
jobs:
  checkout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
