# A crate that breaks the rule on purpose (../../lakefile.toml): it depends on
# another package's crate, `bans-ffi`. It is no member of the root workspace
# and is never compiled.
[package]
name = "bans-peer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bans-ffi = { path = "../../bans-ffi/rust" }
