# A bite fixture of the Rust bans check (docs/dev-practices/the-gate.md,
# "The Rust bans check"): a package set whose one package's crate breaks
# the rule a package's crate keeps, that it depends on `editor-service` and
# on nothing else of the editor's. `bans-ffi`'s crate depends on
# `editor-ffi`.
#
# `mise run ffi-test` runs cargo-deny's bans over the crate the package-set
# build generates from this set, with the `deny.toml` written beside it
# (`rustDenyConfig` in lean/lakefile.lean), and requires cargo-deny's exit
# status for a failed bans check, 2. It holds the `editor-ffi` entry of
# that config alone: drop it, or make it a no-op, and cargo-deny exits 0
# here. Its sibling, tests/rust-bans/peer, holds the package crates'
# entries.
#
# The crate is no member of the root Cargo workspace (its globs do not
# reach tests/rust-bans/), so the bad edge never enters the root graph, and
# nothing compiles it: cargo-deny reads metadata alone. The package holds
# no Lean.
#
# After changing a `require`, run in lean/:
#   lake -d ../tests/rust-bans/ffi update --keep-toolchain
# and commit lake-manifest.json.
name = "rust-bans-ffi"

[[require]]
name = "bans-ffi"
path = "bans-ffi"

# The core, which defines the facet the check asks (`editorRustCrate`) and
# holds `editor-ffi`, which the generated crate depends on.
[[require]]
name = "editor-core"
path = "../../../lean"
