# The bite fixture of the Rust bans check (tools/rust-bans-check.sh;
# docs/dev-practices/the-gate.md, "The Rust bans check"): a package set whose
# two packages' crates break the rule a package's crate keeps, that it
# depends on `editor-service` and on nothing else of the editor's.
#
# - `bans-ffi`'s crate depends on `editor-ffi`;
# - `bans-peer`'s crate depends on `bans-ffi`'s crate, another package's.
#
# `mise run ffi-test` requires the check to fail on this set, with both
# crates "explicitly banned". Neither crate is a member of the root Cargo
# workspace (its globs do not reach tests/rust-bans/), so the bad edges never
# enter the root graph, and nothing compiles either crate: cargo-deny reads
# metadata alone. Neither package holds Lean.
#
# After changing a `require`, run in lean/:
#   lake -d ../tests/rust-bans update --keep-toolchain
# and commit lake-manifest.json.
name = "rust-bans"

[[require]]
name = "bans-peer"
path = "bans-peer"

[[require]]
name = "bans-ffi"
path = "bans-ffi"

# The core, which defines the facet the check asks (`editorRustCrate`) and
# holds `editor-ffi`, which the generated crate depends on.
[[require]]
name = "editor-core"
path = "../../lean"
