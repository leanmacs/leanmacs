# A fixture interface package (docs/design/extension-points.md, "Three
# layers"), used by tests alone: the contract between the fixture packages
# `greeting`, which implements it, and `greeting-loud`, which reaches a
# name it declares. It declares the name of a command another package
# reaches (`GreetingApi.replyName`), as an interface package declares
# every name another package may reach ("Reaches by name"), and registers
# no behaviour.
#
# It is an interface package: it declares the keyword `editor-interface`
# below, so another package may import its modules, and the layer imports
# check reads that keyword from Lake (tools/layer-imports-check.sh).
#
# - `GreetingApi` is the package's library: `GreetingApi.lean`, the names.
# - `GreetingApiTest` holds what it publishes for other packages' tests,
#   as the owner of a port publishes its fake and its contract check
#   (AGENTS.md, "Testing with hand-written mocks"):
#   `GreetingApiTest/Fake.lean`, a package that registers every declared
#   name, which a consumer's tests use in place of any implementation; and
#   `GreetingApiTest/Contract.lean`, the check every implementation runs.
#   Its own tests are `GreetingApiTest/GreetingApi.lean`.
# - `greeting-api-test` is its test driver (`lake test`), rooted at
#   `GreetingApiTest/Model.lean`. It is no default target, as the core's
#   `model-test` is not: `mise run lean` links with the system compiler,
#   which this executable has no flags for.
#
# Every Lean linter is on and a warning fails the build, as in the core.
#
# After changing a `require`, run in lean/:
#   lake -d ../tests/packages/greeting-api update --keep-toolchain
# then the same for every package and set that reaches this package
# (tests/packages/greeting, tests/packages/greeting-loud, tests/packages,
# tests/layer-imports), and commit each lake-manifest.json.
name = "greeting-api"
keywords = ["editor-interface"]
testDriver = "«greeting-api-test»"
defaultTargets = ["GreetingApi", "GreetingApiTest"]
leanOptions = { linter.all = true, warningAsError = true }

[[require]]
name = "editor-core"
path = "../../../lean"

[[lean_lib]]
name = "GreetingApi"

[[lean_lib]]
name = "GreetingApiTest"
globs = ["GreetingApiTest.+"]

[[lean_exe]]
name = "greeting-api-test"
root = "GreetingApiTest.Model"
