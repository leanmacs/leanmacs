# The fixture package set (docs/design/packages.md, "The package set and its
# build"): a Lake package whose `require`s are the set. It declares no
# target and holds no Lean source. The core defines the build
# (lean/lakefile.lean): in lean/, `lake -d ../tests/packages build :editor`
# writes a root module from the entry modules of the packages below, each
# after the packages it requires, and links
# tests/packages/.lake/build/bin/editor.
#
# The gate gives this set to every package step (tools/package-set.sh), so
# what is required here is built, tested, linted and run headless there. It
# is used by tests alone.
#
# After changing a `require`, run in lean/:
#   lake -d ../tests/packages update --keep-toolchain
# and commit lake-manifest.json: a build fetches nothing and fails on a
# dependency the manifest does not hold.
name = "fixture-set"

# `greeting-loud` requires `greeting`, which is in the set through it alone
# and on purpose: Lake lists a package reached only through another after
# the package that requires it, so that order would register `greeting`
# last, and the fixture `greeting-loud/tests/headless/reply` shows the
# build does not.
[[require]]
name = "greeting-loud"
path = "greeting-loud"

# `echo` holds Rust: a crate of its own and the glue that binds it, which
# the package-set build links into this set's editor through the one Rust
# archive it generates from the set (docs/design/packages.md, "Rust in a
# package").
[[require]]
name = "echo"
path = "echo"

# The default set, and through it the core and the default packages
# (packages/shipped-themes/, packages/compile/): the gate's package steps
# reach those through this set.
[[require]]
name = "default-set"
path = "../../packages"
