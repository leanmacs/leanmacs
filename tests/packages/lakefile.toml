# The fixture package set (docs/design/packages.md, "The package set and its
# build"): a Lake package whose `require`s are the set. It declares no
# target and holds no Lean source. The core defines the build
# (lean/lakefile.lean): in lean/, `lake -d ../tests/packages build :editor`
# writes a root module from the entry modules of the packages below, each
# after the packages it requires, and links
# tests/packages/.lake/build/bin/editor.
#
# The gate gives this set to every package step (tools/package-set.sh), so
# what is required here is built, tested, linted and run headless there. It
# is used by tests alone.
#
# After changing a `require`, run in lean/:
#   lake -d ../tests/packages update --keep-toolchain
# and commit lake-manifest.json: a build fetches nothing and fails on a
# dependency the manifest does not hold.
name = "fixture-set"

# `greeting-loud` requires `greeting`, which is in the set through it alone
# and on purpose: Lake lists a package reached only through another after
# the package that requires it, so that order would register `greeting`
# last, and the fixture `greeting-loud/tests/headless/reply` shows the
# build does not.
[[require]]
name = "greeting-loud"
path = "greeting-loud"

# `greeting-api` is an interface package (docs/design/extension-points.md,
# "Three layers"): `greeting` implements it and `greeting-loud` reaches a
# name it declares. Both require it, so it is in the set through them too;
# it is named here so the gate's steps list it as a package of the set
# whatever those two require.
[[require]]
name = "greeting-api"
path = "greeting-api"

# `echo` holds Rust: a crate of its own, built as a library of its own that
# the core loads when the editor starts, and the glue that loads it and
# binds it (docs/design/packages.md, "A library loaded when the editor
# runs, as built"). It is not folded into the Rust archive the package-set
# build generates from the set.
[[require]]
name = "echo"
path = "echo"

# The default set, and through it the core and the default packages
# (packages/shipped-themes/, packages/compile/): the gate's package steps
# reach those through this set.
[[require]]
name = "default-set"
path = "../../packages"

# `agents-api` is the interface package of agents (packages/agents-api/), and
# `acp` its implementation over the Agent Client Protocol's Rust SDK
# (packages/acp/), whose crate the package-set build links into this set's
# editor through the one Rust archive it generates from the set, the only
# crate in it. Both are
# opt-in first-party packages, which the default set leaves out because
# `acp`'s crate needs the user's own Cargo (packages/lakefile.toml's
# header): this set requires them so that every package step covers them.
# They come after the default set, so they register after the default
# packages: `acp` binds ex names, and the default packages' fixtures, which
# this set's harness runs too, list the ex names in registration order as
# the default set's editor does.
[[require]]
name = "agents-api"
path = "../../packages/agents-api"

[[require]]
name = "acp"
path = "../../packages/acp"

# The example package of the guide to writing a package
# (docs/packages/writing-a-package.md), kept beside the guide that quotes it:
# required here so that every package step covers it.
[[require]]
name = "word-count"
path = "../../docs/packages/word-count"
