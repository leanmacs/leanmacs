[package]
name = "echo-service"
version = "0.1.0"
description = "The fixture package echo's service: it answers each request with its text, on a thread of its own, and completes it through the package runtime the core hands its library"
edition.workspace = true
license.workspace = true
publish = false

[lib]
# A library of its own, loaded by the core when the editor starts
# (docs/design/packages.md, "A library loaded when the editor runs, as
# built"): the package's lakefile builds the `cdylib` and compiles its path
# into the glue, which asks the core to load it. `rlib` is what this
# crate's own integration test links.
crate-type = ["cdylib", "rlib"]

# The package runtime's C definitions alone (`editor-package-runtime`):
# the struct the core hands the library at its init, its handle and
# records, its tags and `runtime_has!`. That crate has no dependency, no
# build script and no static, so the library still carries no copy of any
# of the core's statics, and its own Rust standard library. Nothing else of
# the editor's, `editor-service` included: `deny.toml`'s entry for
# `editor-service` leaves this crate out of its wrappers, so it cannot
# depend on it again, even for its tests.
[dependencies]
editor-package-runtime = { path = "../../../../crates/editor-package-runtime" }

# The typed time bounds its tests' waits take (`HangGuard`, `recv`,
# `wait_while`), under the root `clippy.toml`'s wait bans. `editor-wait`
# depends on nothing, and is no part of the library.
[dev-dependencies]
editor-wait = { path = "../../../../crates/editor-wait" }

[lints]
workspace = true
