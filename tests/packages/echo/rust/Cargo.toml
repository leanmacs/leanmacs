[package]
name = "echo-service"
version = "0.1.0"
description = "The fixture package echo's service: it answers each request with its text, on a thread of its own, and completes it through the package runtime the core hands its library"
edition.workspace = true
license.workspace = true
publish = false

[lib]
# A library of its own, loaded by the core when the editor starts
# (docs/design/packages.md, "A library loaded when the editor runs, as
# built"): the package's lakefile builds the `cdylib` and compiles its path
# into the glue, which asks the core to load it. `rlib` is what this
# crate's own integration test links.
crate-type = ["cdylib", "rlib"]

# The package wrapper alone (`editor-package`): the runtime the core hands
# the library at its init, as safe types that mirror `editor-service`'s
# (`Runtime`, `Service`, `Completer`, `stream`, `frame`), the FFI-safe types
# of its table (`buffer`), the macro that declares its init and table
# (`package!`), the runtime's fake its tests run on, and the typed time
# bounds (`editor_package::wait`). The wrapper depends on the runtime's
# definitions and `editor-wait` alone, which have no static, so the library
# carries no copy of any of the core's statics, and its own Rust standard
# library. Nothing else of the editor's, for the library or its tests, and
# `mise run deny` holds it twice: the root `deny.toml` names this crate a
# wrapper of `editor-package` and of no other crate of the editor's, and
# this crate's own `deny.toml`, over its graph alone, allows the crates it
# names and refuses every other, so an edge to any other, a dev-dependency
# included, fails. No dev-dependency.
[dependencies]
editor-package = { path = "../../../../crates/editor-package" }
# The CRC-32 of a reply's text, behind echo's own seam (`src/crc32.rs`),
# the one module that names it: CRC-32 in Rust, so the crate has no
# `unsafe` and links no system library. Pinned exactly to the version the
# root lock already holds for PNG's `flate2`, so it adds none. Not std's:
# `hash` needs no allocation. The root `deny.toml` and this crate's own
# allow it.
crc32fast = { version = "=1.5.5", default-features = false }

[lints]
workspace = true
