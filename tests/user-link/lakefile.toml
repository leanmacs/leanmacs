# The package set of the user-side link check (`mise run user-link-check`,
# tools/user-link-check.sh; docs/design/lean-runtime.md, "A link on the
# user's machine, measured"): the default set and one package of the
# user's, the fixture package in `package/`. It is the set a user's
# machine would link an editor from.
#
# Nothing links an editor from it here. The check asks the package-set
# build for this set's root module alone (in lean/, `lake -d
# ../tests/user-link query :editorRoot`, a facet the core defines in
# lean/lakefile.lean), and stages that root with the package's sources and
# prebuilt pieces of the core, where the Lean toolchain's own linker links
# them. So the root of the relinked editor is generated, by the generator
# the editor's own build uses (docs/design/packages.md, "The package set
# and its build").
#
# After changing a `require`, run in lean/:
#   lake -d ../tests/user-link update --keep-toolchain
# and commit lake-manifest.json.
name = "user-link-set"

[[require]]
name = "default-set"
path = "../../packages"

[[require]]
name = "user-link"
path = "package"
