# A package set with no package (docs/design/packages.md, "The package set
# and its build"), used by tests alone: it requires the core and nothing
# else, and it stays that way. It is the default set (packages/) with its
# packages dropped.
#
# - `mise run lean-test` hands it to a package step (tools/package-set.sh),
#   and `mise run ffi-test` to the package imports check
#   (tools/package-imports-check.sh); each must refuse it with exit 2: a
#   check cannot pass by running over nothing.
# - `mise run lean` links an editor from it
#   (`lake -d ../tests/empty-set build :editor`, in lean/), and `mise run
#   ffi-test` runs that editor: it refuses to start. No package of this
#   set supplies an input scheme, since the Vim scheme is the default
#   package evil's (packages/evil/, features-as-packages phase 7), so the
#   headless mode and `--probe` each print `editor: no input scheme is
#   installed: no package of this editor's package set supplies one` on
#   stderr and exit 1 (tests/headless/no-input-scheme; docs/design/packages.md,
#   "Input schemes"). While the core supplied the scheme, two fixtures ran
#   on this editor, tests/headless/core-themes and
#   tests/headless/core-ex-names; they are retired, and what they showed
#   of an editor without the default packages is held by the core's
#   checks of its own list (docs/design/packages.md, "Dropping evil or
#   themes leaves…"). Its config base is `Editor` alone.
name = "empty-set"

[[require]]
name = "editor-core"
path = "../../lean"
