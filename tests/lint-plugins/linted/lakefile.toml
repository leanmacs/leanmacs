# A fixture package of the lint plugins check's fixture (../lakefile.toml),
# used by that check alone: it names the build's linters as a plugin for
# the whole package, as every package of the repository does, so the check
# refuses nothing of its library. It is never built.
name = "linted"
leanOptions = { linter.all = true, warningAsError = true }
plugins = ["@editor-core/Lint:shared"]

[[require]]
name = "editor-core"
path = "../../../lean"

[[lean_lib]]
name = "Linted"
