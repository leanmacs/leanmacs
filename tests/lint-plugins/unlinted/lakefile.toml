# A fixture package of the lint plugins check's fixture (../lakefile.toml),
# used by that check alone: its library `Unlinted` and its executable
# `unlinted-exe` name no plugin, so the build's linters would not run on
# them, and the check refuses both; its library `UnlintedLint` imports the
# linters' own module, as the core's `LintTests` does, so it has the
# linters by import and loading them too would register them twice, and
# the check refuses nothing of it. It is never built: `lake query` reads
# configuration and headers alone, so its modules hold the imports and a
# doc comment and nothing else.
name = "unlinted"
leanOptions = { linter.all = true, warningAsError = true }

[[require]]
name = "editor-core"
path = "../../../lean"

[[lean_lib]]
name = "Unlinted"

[[lean_lib]]
name = "UnlintedLint"

[[lean_exe]]
name = "unlinted-exe"
root = "UnlintedMain"
