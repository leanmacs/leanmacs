# A fixture package of the layer imports check's real-graph fixture
# (../lakefile.toml), used by that check alone: an implementation package
# whose one module imports the interface package `greeting-api`, which the
# rule allows, and the implementation package `greeting`, which it refuses.
# It is never built: `lake query` reads headers alone, so its module holds
# the imports and a doc comment and nothing else.
name = "greeting-reach"

[[require]]
name = "greeting"
path = "../../packages/greeting"

[[require]]
name = "greeting-api"
path = "../../packages/greeting-api"

[[require]]
name = "editor-core"
path = "../../../lean"

[[lean_lib]]
name = "GreetingReach"
